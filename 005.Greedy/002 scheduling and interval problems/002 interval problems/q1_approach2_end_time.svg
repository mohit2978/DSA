<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 650" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #c084fc; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f1f5f9; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .code-inline { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #f5d0fe; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
      .bar-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
    </style>

    <linearGradient id="grad-active2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="grad-candidate2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="grad-merged2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="grad-sealed2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <filter id="shadow2" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <marker id="arrow-left" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-dir" viewBox="0 0 10 10" refX="2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 8 1 L 0 5 L 8 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="650" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header Section -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#7c3aed" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.5" />
    <text x="17" y="23" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#c084fc">2</text>
    <text x="46" y="20" class="title">Approach 2: Sort by End Time (Ascending) &amp; Scan Right ← Left</text>
    <text x="46" y="38" class="subtitle">Invariant: Right boundary is permanently locked. Merged intervals only expand leftwards.</text>
  </g>

  <!-- Global Timeline Axis (Right Column: x = 440 to 910) -->
  <g transform="translate(0, 75)">
    <text x="40" y="15" class="step-num" fill="#94a3b8">LOGIC &amp; DECISION FLOW</text>
    
    <!-- Traversal banner on right -->
    <path d="M 720 10 L 685 10" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow-dir)" />
    <text x="730" y="14" font-size="11" font-weight="bold" fill="#c084fc" font-family="sans-serif">SCAN DIRECTION: RIGHT TO LEFT (i = n-1 down to 0)</text>

    <!-- Axis line -->
    <line x1="440" y1="30" x2="910" y2="30" stroke="#334155" stroke-width="2" />

    <!-- Vertical Grid Reference Lines -->
    <line x1="440" y1="30" x2="440" y2="480" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="465" y1="30" x2="465" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="491" y1="30" x2="491" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="516" y1="30" x2="516" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="593" y1="30" x2="593" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="644" y1="30" x2="644" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="695" y1="30" x2="695" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="823" y1="30" x2="823" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="899" y1="30" x2="899" y2="480" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Ticks and labels -->
    <line x1="440" y1="26" x2="440" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="465" y1="26" x2="465" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="491" y1="26" x2="491" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="516" y1="26" x2="516" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="593" y1="26" x2="593" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="644" y1="26" x2="644" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="695" y1="26" x2="695" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="823" y1="26" x2="823" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="899" y1="26" x2="899" y2="34" stroke="#64748b" stroke-width="1.5" />

    <text x="440" y="44" text-anchor="middle" class="axis-text">0</text>
    <text x="465" y="44" text-anchor="middle" class="axis-text">1</text>
    <text x="491" y="44" text-anchor="middle" class="axis-text">2</text>
    <text x="516" y="44" text-anchor="middle" class="axis-text">3</text>
    <text x="593" y="44" text-anchor="middle" class="axis-text">6</text>
    <text x="644" y="44" text-anchor="middle" class="axis-text">8</text>
    <text x="695" y="44" text-anchor="middle" class="axis-text">10</text>
    <text x="823" y="44" text-anchor="middle" class="axis-text">15</text>
    <text x="899" y="44" text-anchor="middle" class="axis-text">18</text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(30, 130)">
    <rect x="0" y="0" width="900" height="90" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <line x1="380" y1="0" x2="380" y2="90" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Left Column -->
    <text x="20" y="24" class="step-title"><tspan fill="#c084fc">Step 1:</tspan> Start at rightmost (i = n - 1)</text>
    <text x="20" y="48" class="desc-text">• Initialize <tspan class="code-inline">start = 15, end = 18</tspan>.</text>
    <text x="20" y="68" class="desc-text">• <tspan fill="#c084fc">Right boundary 18 is locked</tspan> as the absolute maximum.</text>

    <!-- Right Column: Visual Bar [15, 18]: x(15)-30=793, width=76 -->
    <rect x="793" y="30" width="76" height="30" rx="6" fill="url(#grad-active2)" filter="url(#shadow2)" />
    <text x="831" y="49" text-anchor="middle" class="bar-label">[15, 18]</text>
    <circle cx="869" cy="45" r="4" fill="#ffffff" />
    <text x="869" y="73" text-anchor="middle" font-size="10" fill="#c084fc" font-family="sans-serif">end = 18</text>
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="900" height="115" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <line x1="380" y1="0" x2="380" y2="115" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Left Column -->
    <text x="20" y="24" class="step-title"><tspan fill="#c084fc">Step 2:</tspan> Move left to i = n - 2 ([8, 10])</text>
    
    <!-- Pill Check -->
    <rect x="20" y="35" width="310" height="22" rx="11" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
    <text x="30" y="50" class="code-inline" fill="#fca5a5">Overlap? curr_start (15) ≤ intervals[i][1] (10) → FALSE</text>

    <text x="20" y="76" class="desc-text">• <tspan fill="#ef4444" font-weight="600">Disjoint Gap!</tspan> Prior intervals have <tspan class="code-inline">end ≤ 10 &lt; 15</tspan>.</text>
    <text x="20" y="94" class="desc-text">• None can reach 15. <tspan fill="#60a5fa" font-weight="600">SEAL [15, 18] into list!</tspan></text>
    <text x="20" y="109" class="desc-text">• Reset active: <tspan class="code-inline">start = 8, end = 10</tspan>.</text>

    <!-- Right Column: Visual Bars -->
    <!-- New active [8, 10]: x(8)-30 = 614, width = 51 -->
    <rect x="614" y="38" width="51" height="28" rx="6" fill="url(#grad-active2)" filter="url(#shadow2)" />
    <text x="639" y="56" text-anchor="middle" class="bar-label">[8, 10]</text>

    <!-- Gap bracket between 10 (665) and 15 (793) -->
    <line x1="670" y1="52" x2="788" y2="52" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="729" y="44" text-anchor="middle" font-size="10" fill="#f87171" font-family="sans-serif">GAP (10 &lt; 15)</text>

    <!-- Sealed [15, 18]: x=793, width=76 -->
    <rect x="793" y="38" width="76" height="28" rx="6" fill="url(#grad-sealed2)" />
    <text x="831" y="56" text-anchor="middle" class="bar-label">✓ [15, 18]</text>
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(30, 355)">
    <rect x="0" y="0" width="900" height="120" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <line x1="380" y1="0" x2="380" y2="120" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Left Column -->
    <text x="20" y="24" class="step-title"><tspan fill="#c084fc">Step 3:</tspan> Active [2, 6] meets earlier [1, 3]</text>

    <!-- Pill Check -->
    <rect x="20" y="35" width="310" height="22" rx="11" fill="#065f46" fill-opacity="0.3" stroke="#10b981" stroke-width="1" />
    <text x="30" y="50" class="code-inline" fill="#6ee7b7">Overlap? curr_start (2) ≤ intervals[0][1] (3) → TRUE</text>

    <text x="20" y="78" class="desc-text">• <tspan fill="#34d399" font-weight="600">Overlap detected (3 ≥ 2)!</tspan> Right end (6) is safe.</text>
    <text x="20" y="96" class="desc-text">• Expand left: <tspan class="code-inline">start = min(2, 1) = 1</tspan>.</text>
    <text x="20" y="112" class="desc-text">• Merged block becomes <tspan class="code-inline" font-weight="bold">[1, 6]</tspan>.</text>

    <!-- Right Column: Visual Bars -->
    <!-- Candidate [1, 3]: x(1)-30 = 435, width = x(3)-x(1) = 516-465 = 51 -->
    <text x="395" y="25" font-size="10" fill="#fb923c" font-family="sans-serif">Candidate:</text>
    <rect x="435" y="12" width="51" height="20" rx="4" fill="url(#grad-candidate2)" />
    <text x="460" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">[1, 3]</text>

    <!-- Active [2, 6]: x(2)-30 = 461, width = x(6)-x(2) = 593-491 = 102 -->
    <text x="395" y="70" font-size="10" fill="#34d399" font-family="sans-serif">Merged:</text>
    <rect x="435" y="55" width="128" height="30" rx="6" fill="url(#grad-merged2)" filter="url(#shadow2)" />
    <text x="499" y="74" text-anchor="middle" class="bar-label">[1, 6]</text>

    <!-- Leftward expansion arrow from 2 (461) to 1 (435) -->
    <path d="M 461 70 L 442 70" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow-left)" />
    <text x="499" y="102" text-anchor="middle" font-size="10" fill="#a7f3d0" font-family="sans-serif">Expands LEFT to 1</text>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY & COUNTEREXAMPLE ==================== -->
  <g transform="translate(30, 485)">
    <rect x="0" y="0" width="900" height="145" rx="8" fill="#7f1d1d" fill-opacity="0.12" stroke="#dc2626" stroke-width="1.5" />
    <text x="20" y="24" class="step-title" fill="#fca5a5">⚠️ Why Forward Scan (Left → Right) FAILS with End-Time Sorting</text>
    
    <text x="20" y="48" class="desc-text">• <tspan font-weight="600" fill="#f1f5f9">Counterexample:</tspan> Consider intervals <tspan class="code-inline">[2, 3]</tspan> and <tspan class="code-inline">[1, 10]</tspan>. Sorted by end time: 1st is <tspan class="code-inline">[2, 3]</tspan>, 2nd is <tspan class="code-inline">[1, 10]</tspan>.</text>
    
    <text x="20" y="70" class="desc-text">• <tspan fill="#f87171" font-weight="600">The Problem with Forward Scanning:</tspan> You start with [2, 3]. Then [1, 10] arrives. Its start is 1, which is &lt; 2! A later interval reaches backwards into the past. In a forward scan, it would have to retroactively swallow already-committed intervals.</text>
    
    <line x1="20" y1="86" x2="880" y2="86" stroke="#dc2626" stroke-opacity="0.3" stroke-width="1" />

    <text x="20" y="108" class="desc-text">• <tspan fill="#34d399" font-weight="600">Why Backward Scanning Succeeds:</tspan> By starting at <tspan class="code-inline">[1, 10]</tspan>, the maximum end (10) is anchored first. Looking backwards at <tspan class="code-inline">[2, 3]</tspan>, its end (3) is ≤ 10.</text>
    <text x="20" y="128" class="desc-text">• The condition <tspan class="code-inline">curr_start (1) ≤ intervals[0][1] (3)</tspan> matches cleanly, expanding left to <tspan class="code-inline">min(1, 2) = 1</tspan> without backtracking!</text>
  </g>
</svg>
