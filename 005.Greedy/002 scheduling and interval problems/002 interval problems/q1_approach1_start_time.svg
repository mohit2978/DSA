<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 630" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 19px; fill: #f8fafc; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; font-size: 13px; fill: #94a3b8; }
      .step-num { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #f1f5f9; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .code-inline { font-family: 'Consolas', 'Courier New', monospace; font-size: 11px; fill: #7dd3fc; }
      .axis-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #64748b; font-weight: 500; }
      .bar-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 600; fill: #ffffff; }
      .bar-sublabel { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 9px; fill: #e2e8f0; }
    </style>

    <linearGradient id="grad-active" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="grad-candidate" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <linearGradient id="grad-merged" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="grad-sealed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338ca" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="630" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="2" />

  <!-- Top Header Section -->
  <g transform="translate(30, 20)">
    <rect x="0" y="0" width="34" height="34" rx="8" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5" />
    <text x="17" y="23" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="16" fill="#38bdf8">1</text>
    <text x="46" y="20" class="title">Approach 1: Sort by Start Time (Ascending) &amp; Scan Left → Right</text>
    <text x="46" y="38" class="subtitle">Invariant: Left boundary is permanently locked. Merged intervals only expand rightwards.</text>
  </g>

  <!-- Global Timeline Axis (Right Column: x = 440 to 910, scale: x(t) = 440 + t * 25.5) -->
  <!-- Coordinates: 0:440, 1:465, 2:491, 4:542, 6:593, 8:644, 10:695, 15:823, 18:899 -->
  <g transform="translate(0, 75)">
    <!-- Column separation header labels -->
    <text x="40" y="15" class="step-num" fill="#94a3b8">LOGIC &amp; DECISION FLOW</text>
    <text x="440" y="15" class="step-num" fill="#94a3b8">TIMELINE AXIS &amp; INTERVAL STATE</text>

    <!-- Axis line -->
    <line x1="440" y1="30" x2="910" y2="30" stroke="#334155" stroke-width="2" />

    <!-- Vertical Grid Reference Lines extending through cards -->
    <line x1="440" y1="30" x2="440" y2="475" stroke="#1e293b" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="465" y1="30" x2="465" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="491" y1="30" x2="491" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="542" y1="30" x2="542" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="593" y1="30" x2="593" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="644" y1="30" x2="644" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="695" y1="30" x2="695" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="823" y1="30" x2="823" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <line x1="899" y1="30" x2="899" y2="475" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />

    <!-- Ticks and labels -->
    <line x1="440" y1="26" x2="440" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="465" y1="26" x2="465" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="491" y1="26" x2="491" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="542" y1="26" x2="542" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="593" y1="26" x2="593" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="644" y1="26" x2="644" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="695" y1="26" x2="695" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="823" y1="26" x2="823" y2="34" stroke="#64748b" stroke-width="1.5" />
    <line x1="899" y1="26" x2="899" y2="34" stroke="#64748b" stroke-width="1.5" />

    <text x="440" y="44" text-anchor="middle" class="axis-text">0</text>
    <text x="465" y="44" text-anchor="middle" class="axis-text">1</text>
    <text x="491" y="44" text-anchor="middle" class="axis-text">2</text>
    <text x="542" y="44" text-anchor="middle" class="axis-text">4</text>
    <text x="593" y="44" text-anchor="middle" class="axis-text">6</text>
    <text x="644" y="44" text-anchor="middle" class="axis-text">8</text>
    <text x="695" y="44" text-anchor="middle" class="axis-text">10</text>
    <text x="823" y="44" text-anchor="middle" class="axis-text">15</text>
    <text x="899" y="44" text-anchor="middle" class="axis-text">18</text>
  </g>

  <!-- ==================== STEP 1 ==================== -->
  <g transform="translate(30, 130)">
    <!-- Card Background -->
    <rect x="0" y="0" width="900" height="90" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    
    <!-- Vertical Column Divider inside Card -->
    <line x1="380" y1="0" x2="380" y2="90" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Left Column: Explanatory Content (x = 20 to 360) -->
    <text x="20" y="24" class="step-title"><tspan fill="#38bdf8">Step 1:</tspan> Initialize with intervals[0]</text>
    <text x="20" y="48" class="desc-text">• Push <tspan class="code-inline">[1, 4]</tspan> as first <tspan class="code-inline">last_merged</tspan>.</text>
    <text x="20" y="68" class="desc-text">• <tspan fill="#38bdf8">Start is locked at 1</tspan>. Future starts cannot be &lt; 1.</text>

    <!-- Right Column: Visual Timeline Bar (x(1)=465 to x(4)=542, width=77) -->
    <!-- Card is shifted by x=30, so inside card: x = target - 30 -> 465 - 30 = 435 -->
    <rect x="435" y="30" width="77" height="30" rx="6" fill="url(#grad-active)" filter="url(#shadow)" />
    <text x="473" y="49" text-anchor="middle" class="bar-label">[1, 4]</text>
    <circle cx="435" cy="45" r="4" fill="#ffffff" />
    <text x="435" y="73" text-anchor="middle" font-size="10" fill="#38bdf8" font-family="sans-serif">start = 1</text>
  </g>

  <!-- ==================== STEP 2 ==================== -->
  <g transform="translate(30, 230)">
    <rect x="0" y="0" width="900" height="120" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <line x1="380" y1="0" x2="380" y2="120" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Left Column: Explanatory Content -->
    <text x="20" y="24" class="step-title"><tspan fill="#38bdf8">Step 2:</tspan> Process intervals[1] = [2, 6]</text>
    
    <!-- Pill Check -->
    <rect x="20" y="35" width="310" height="22" rx="11" fill="#0369a1" fill-opacity="0.3" stroke="#0284c7" stroke-width="1" />
    <text x="30" y="50" class="code-inline" fill="#bae6fd">Overlap? current_start (2) ≤ last_end (4) → TRUE</text>

    <text x="20" y="78" class="desc-text">• <tspan fill="#34d399" font-weight="600">Overlap detected!</tspan> Intervals merge together.</text>
    <text x="20" y="96" class="desc-text">• Expand right: <tspan class="code-inline">last_end = max(4, 6) = 6</tspan>.</text>
    <text x="20" y="112" class="desc-text">• Result: <tspan class="code-inline" font-weight="bold">[1, 6]</tspan> (left boundary 1 remains unchanged).</text>

    <!-- Right Column: Visual Timeline Bars -->
    <!-- Incoming Candidate [2, 6]: x(2)-30 = 461, width = x(6)-x(2) = 593-491 = 102 -->
    <text x="410" y="25" font-size="10" fill="#fbbf24" font-family="sans-serif">Candidate:</text>
    <rect x="461" y="12" width="102" height="20" rx="4" fill="url(#grad-candidate)" />
    <text x="512" y="26" text-anchor="middle" font-size="10" font-weight="bold" fill="#0f172a">[2, 6]</text>

    <!-- Merged Result [1, 6]: x(1)-30 = 435, width = x(6)-x(1) = 593-465 = 128 -->
    <text x="410" y="70" font-size="10" fill="#34d399" font-family="sans-serif">Merged:</text>
    <rect x="435" y="55" width="128" height="30" rx="6" fill="url(#grad-merged)" filter="url(#shadow)" />
    <text x="499" y="74" text-anchor="middle" class="bar-label">[1, 6]</text>

    <!-- Rightward expansion arrow from 4 (512) to 6 (563) -->
    <path d="M 512 70 L 555 70" stroke="#ffffff" stroke-width="2" marker-end="url(#arrow-green)" />
    <text x="499" y="102" text-anchor="middle" font-size="10" fill="#a7f3d0" font-family="sans-serif">Expands RIGHT to 6</text>
  </g>

  <!-- ==================== STEP 3 ==================== -->
  <g transform="translate(30, 360)">
    <rect x="0" y="0" width="900" height="115" rx="8" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1" />
    <line x1="380" y1="0" x2="380" y2="115" stroke="#334155" stroke-dasharray="4,4" />

    <!-- Left Column: Explanatory Content -->
    <text x="20" y="24" class="step-title"><tspan fill="#38bdf8">Step 3:</tspan> Process intervals[2] = [8, 10]</text>
    
    <!-- Pill Check -->
    <rect x="20" y="35" width="310" height="22" rx="11" fill="#7f1d1d" fill-opacity="0.3" stroke="#ef4444" stroke-width="1" />
    <text x="30" y="50" class="code-inline" fill="#fca5a5">Overlap? current_start (8) ≤ last_end (6) → FALSE</text>

    <text x="20" y="76" class="desc-text">• <tspan fill="#ef4444" font-weight="600">Disjoint Gap (6 to 8)!</tspan> Future starts are ≥ 8.</text>
    <text x="20" y="94" class="desc-text">• No future interval can touch [1, 6]. <tspan fill="#818cf8" font-weight="600">LOCK [1, 6]!</tspan></text>
    <text x="20" y="109" class="desc-text">• Push <tspan class="code-inline">[8, 10]</tspan> as the new active block.</text>

    <!-- Right Column: Visual Timeline Bars -->
    <!-- Sealed [1, 6]: x=435, width=128 -->
    <rect x="435" y="38" width="128" height="28" rx="6" fill="url(#grad-sealed)" />
    <text x="499" y="56" text-anchor="middle" class="bar-label">✓ [1, 6] (SEALED)</text>

    <!-- Gap bracket between 6 (563) and 8 (614) -->
    <line x1="568" y1="52" x2="609" y2="52" stroke="#ef4444" stroke-width="2" stroke-dasharray="3,3" />
    <text x="588" y="44" text-anchor="middle" font-size="10" fill="#f87171" font-family="sans-serif">GAP</text>

    <!-- New active block [8, 10]: x(8)-30 = 614, width = x(10)-x(8) = 695-644 = 51 -->
    <rect x="614" y="38" width="51" height="28" rx="6" fill="url(#grad-active)" filter="url(#shadow)" />
    <text x="639" y="56" text-anchor="middle" class="bar-label">[8, 10]</text>

    <!-- Next block [15, 18]: x(15)-30 = 793, width = 76 -->
    <rect x="793" y="38" width="76" height="28" rx="6" fill="#334155" stroke="#475569" stroke-width="1" />
    <text x="831" y="55" text-anchor="middle" font-size="10" fill="#94a3b8" font-family="sans-serif">[15, 18] (Next)</text>
  </g>

  <!-- ==================== BOTTOM TAKEAWAY ==================== -->
  <g transform="translate(30, 485)">
    <rect x="0" y="0" width="900" height="125" rx="8" fill="#0284c7" fill-opacity="0.1" stroke="#0284c7" stroke-width="1.5" />
    <text x="20" y="25" class="step-title" fill="#38bdf8">💡 Summary Invariant: Why Sorting by Start Works</text>
    <text x="20" y="50" class="desc-text">1. <tspan font-weight="600" fill="#f1f5f9">Anchored Left Boundary:</tspan> Because intervals arrive in order of start time, <tspan class="code-inline">intervals[i][0] ≥ intervals[0][0]</tspan>. The left boundary never moves backward.</text>
    <text x="20" y="72" class="desc-text">2. <tspan font-weight="600" fill="#f1f5f9">Unidirectional Growth:</tspan> Overlapping intervals can only push the right boundary further right via <tspan class="code-inline">max(last_end, current_end)</tspan>.</text>
    <text x="20" y="94" class="desc-text">3. <tspan font-weight="600" fill="#f1f5f9">Permanent Sealing:</tspan> The moment a gap appears (<tspan class="code-inline">current_start &gt; last_end</tspan>), it is mathematically impossible for any future interval to ever bridge back, so <tspan class="code-inline">last_merged</tspan> is locked forever.</text>
  </g>
</svg>
