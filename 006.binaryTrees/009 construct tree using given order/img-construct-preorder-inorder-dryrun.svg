<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="460" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Preorder = [a,b,d,e,f,g,c,h,j,k,i]   Inorder = [d,b,f,e,g,a,j,h,k,c,i]</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g stroke="#5b9bd5" stroke-width="2">
    <line x1="230" y1="70" x2="120" y2="140"/>
    <line x1="230" y1="70" x2="340" y2="140"/>
    <line x1="120" y1="140" x2="70"  y2="210"/>
    <line x1="120" y1="140" x2="170" y2="210"/>
    <line x1="170" y1="210" x2="140" y2="280"/>
    <line x1="170" y1="210" x2="200" y2="280"/>
    <line x1="340" y1="140" x2="290" y2="210"/>
    <line x1="340" y1="140" x2="390" y2="210"/>
    <line x1="290" y1="210" x2="260" y2="280"/>
    <line x1="290" y1="210" x2="320" y2="280"/>
  </g>

  <g>
    <circle cx="230" cy="60" r="18" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="120" cy="140" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="340" cy="140" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="70"  cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="170" cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="140" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="200" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="290" cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="390" cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="260" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="320" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="230" y="65">a</text>
    <text x="120" y="145">b</text>
    <text x="340" y="145">c</text>
    <text x="70"  y="215">d</text>
    <text x="170" y="215">e</text>
    <text x="140" y="285">f</text>
    <text x="200" y="285">g</text>
    <text x="290" y="215">h</text>
    <text x="390" y="215">i</text>
    <text x="260" y="285">j</text>
    <text x="320" y="285">k</text>
  </g>

  <rect x="25" y="330" width="750" height="55" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="354" fill="#f2c14e" font-size="13.5" font-weight="bold">Reconstructed tree</text>
  <text x="40" y="376" fill="#56c98d" font-size="13.5" font-family="monospace">a(b(d, e(f,g)), c(h(j,k), i))</text>

  <rect x="25" y="400" width="750" height="50" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="424" fill="#d4d4d4" font-size="12.5">Root of every subtree = next unused element of Preorder; its index in Inorder splits that range into Left / Right.</text>
</svg>
