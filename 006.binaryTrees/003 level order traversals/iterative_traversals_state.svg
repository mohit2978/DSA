<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="preGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="inGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="postGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="1100" height="680" fill="url(#bgGrad5)" rx="16"/>

  <text x="550" y="42" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Iterative Preorder, Inorder &amp; Postorder — The State Pair Method</text>
  <text x="550" y="68" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">A unified 1-Stack technique simulating Euler traversal via state transitions (1 → 2 → 3)</text>

  <!-- 3 State Cards -->
  <!-- State 1: Pre-order -->
  <g transform="translate(40, 95)" filter="url(#shadow5)">
    <rect width="320" height="340" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="42" rx="12" fill="url(#preGrad)"/>
    <text x="160" y="27" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">State = 1 : Pre-order</text>

    <g transform="translate(15, 60)" font-family="sans-serif" font-size="13">
      <circle cx="10" cy="10" r="10" fill="#3b82f6"/>
      <text x="10" y="14" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">A</text>
      <text x="28" y="15" fill="#93c5fd" font-weight="bold">Action:</text>
      <text x="28" y="38" fill="#e2e8f0" font-family="monospace">pre.append(pair.node.data)</text>

      <circle cx="10" cy="70" r="10" fill="#3b82f6"/>
      <text x="10" y="74" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">B</text>
      <text x="28" y="75" fill="#93c5fd" font-weight="bold">Increment State:</text>
      <text x="28" y="98" fill="#e2e8f0" font-family="monospace">pair.state++ (now 2)</text>

      <circle cx="10" cy="130" r="10" fill="#3b82f6"/>
      <text x="10" y="134" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">C</text>
      <text x="28" y="135" fill="#93c5fd" font-weight="bold">Push Left Child:</text>
      <text x="28" y="158" fill="#e2e8f0" font-family="monospace">if (node.left != null)</text>
      <text x="40" y="178" fill="#a5f3fc" font-family="monospace">st.push(new Pair(left, 1))</text>
    </g>

    <rect x="15" y="260" width="290" height="60" rx="8" fill="#172554" stroke="#3b82f6" stroke-width="1"/>
    <text x="25" y="282" fill="#93c5fd" font-size="12" font-weight="bold" font-family="sans-serif">Euler Correspondence:</text>
    <text x="25" y="302" fill="#bfdbfe" font-size="11" font-family="sans-serif">First time visiting node (going down left)</text>
  </g>

  <!-- State 2: In-order -->
  <g transform="translate(390, 95)" filter="url(#shadow5)">
    <rect width="320" height="340" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="42" rx="12" fill="url(#inGrad)"/>
    <text x="160" y="27" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">State = 2 : In-order</text>

    <g transform="translate(15, 60)" font-family="sans-serif" font-size="13">
      <circle cx="10" cy="10" r="10" fill="#10b981"/>
      <text x="10" y="14" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">A</text>
      <text x="28" y="15" fill="#6ee7b7" font-weight="bold">Action:</text>
      <text x="28" y="38" fill="#e2e8f0" font-family="monospace">in.append(pair.node.data)</text>

      <circle cx="10" cy="70" r="10" fill="#10b981"/>
      <text x="10" y="74" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">B</text>
      <text x="28" y="75" fill="#6ee7b7" font-weight="bold">Increment State:</text>
      <text x="28" y="98" fill="#e2e8f0" font-family="monospace">pair.state++ (now 3)</text>

      <circle cx="10" cy="130" r="10" fill="#10b981"/>
      <text x="10" y="134" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">C</text>
      <text x="28" y="135" fill="#6ee7b7" font-weight="bold">Push Right Child:</text>
      <text x="28" y="158" fill="#e2e8f0" font-family="monospace">if (node.right != null)</text>
      <text x="40" y="178" fill="#a7f3d0" font-family="monospace">st.push(new Pair(right, 1))</text>
    </g>

    <rect x="15" y="260" width="290" height="60" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="25" y="282" fill="#6ee7b7" font-size="12" font-weight="bold" font-family="sans-serif">Euler Correspondence:</text>
    <text x="25" y="302" fill="#a7f3d0" font-size="11" font-family="sans-serif">Returned from left subtree (between L &amp; R)</text>
  </g>

  <!-- State 3: Post-order -->
  <g transform="translate(740, 95)" filter="url(#shadow5)">
    <rect width="320" height="340" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
    <rect x="0" y="0" width="320" height="42" rx="12" fill="url(#postGrad)"/>
    <text x="160" y="27" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle" font-family="sans-serif">State = 3 : Post-order</text>

    <g transform="translate(15, 60)" font-family="sans-serif" font-size="13">
      <circle cx="10" cy="10" r="10" fill="#f59e0b"/>
      <text x="10" y="14" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">A</text>
      <text x="28" y="15" fill="#fcd34d" font-weight="bold">Action:</text>
      <text x="28" y="38" fill="#e2e8f0" font-family="monospace">post.append(pair.node.data)</text>

      <circle cx="10" cy="70" r="10" fill="#f59e0b"/>
      <text x="10" y="74" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">B</text>
      <text x="28" y="75" fill="#fcd34d" font-weight="bold">Stack Pop:</text>
      <text x="28" y="98" fill="#e2e8f0" font-family="monospace">st.pop()</text>

      <circle cx="10" cy="130" r="10" fill="#f59e0b"/>
      <text x="10" y="134" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">C</text>
      <text x="28" y="135" fill="#fcd34d" font-weight="bold">No Children to Push:</text>
      <text x="28" y="158" fill="#94a3b8" font-family="sans-serif">Node processing completed!</text>
    </g>

    <rect x="15" y="260" width="290" height="60" rx="8" fill="#78350f" stroke="#f59e0b" stroke-width="1"/>
    <text x="25" y="282" fill="#fcd34d" font-size="12" font-weight="bold" font-family="sans-serif">Euler Correspondence:</text>
    <text x="25" y="302" fill="#fde68a" font-size="11" font-family="sans-serif">Returned from right subtree (moving up)</text>
  </g>

  <!-- Bottom Code Architecture Container -->
  <g transform="translate(40, 460)">
    <rect width="1020" height="190" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="30" fill="#38bdf8" font-size="15" font-weight="bold" font-family="sans-serif">Unified Loop Algorithm Structure:</text>

    <text x="30" y="60" fill="#e2e8f0" font-size="12" font-family="monospace">Stack&lt;Pair&gt; st = new Stack&lt;&gt;(); st.push(new Pair(root, 1));</text>
    <text x="30" y="80" fill="#e2e8f0" font-size="12" font-family="monospace">while (!st.isEmpty()) {</text>
    <text x="50" y="100" fill="#93c5fd" font-size="12" font-family="monospace">Pair top = st.peek();</text>
    <text x="50" y="120" fill="#93c5fd" font-size="12" font-family="monospace">if (top.state == 1) { pre += top.node.data; top.state++; if (top.node.left != null) st.push(new Pair(top.node.left, 1)); }</text>
    <text x="50" y="140" fill="#6ee7b7" font-size="12" font-family="monospace">else if (top.state == 2) { in += top.node.data; top.state++; if (top.node.right != null) st.push(new Pair(top.node.right, 1)); }</text>
    <text x="50" y="160" fill="#fcd34d" font-size="12" font-family="monospace">else { post += top.node.data; st.pop(); }</text>
    <text x="30" y="180" fill="#e2e8f0" font-size="12" font-family="monospace">}</text>
  </g>
</svg>
