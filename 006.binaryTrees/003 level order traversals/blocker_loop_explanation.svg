<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradLoop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ancestorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="blockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="exploreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#10b981"/>
    </marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#c084fc"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="820" fill="url(#bgGradLoop)" rx="16"/>

  <!-- Title Header -->
  <text x="600" y="38" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Step-by-Step Anatomy of the Blocker Loop</text>
  <text x="600" y="62" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Detailed visual trace of how <tspan fill="#38bdf8" font-family="monospace">for (int i = 0; i &lt; path.size(); i++)</tspan> traverses radial branches without overlapping</text>

  <!-- Left Column: The 3 Core Formula Concepts -->
  <g transform="translate(30, 85)">
    <!-- Code Box -->
    <rect width="450" height="200" rx="12" fill="#030712" stroke="#3b82f6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="450" height="34" rx="12" fill="#1e3a8a" fill-opacity="0.4"/>
    <text x="16" y="22" fill="#60a5fa" font-size="13" font-weight="bold" font-family="sans-serif">💻 The Loop Code</text>

    <text x="18" y="58" fill="#e2e8f0" font-size="13" font-family="monospace">for (int <tspan fill="#38bdf8" font-weight="bold">i = 0</tspan>; i &lt; path.size(); i++) {</text>
    <text x="36" y="85" fill="#e2e8f0" font-size="13" font-family="monospace">  TreeNode* <tspan fill="#c084fc" font-weight="bold">curr</tspan> = path[i];</text>
    <text x="36" y="112" fill="#e2e8f0" font-size="13" font-family="monospace">  TreeNode* <tspan fill="#f87171" font-weight="bold">blocker</tspan> = (i == 0) ? nullptr</text>
    <text x="210" y="132" fill="#f87171" font-size="13" font-family="monospace">: path[i - 1];</text>
    <text x="36" y="160" fill="#e2e8f0" font-size="13" font-family="monospace">  printKLevelsDown(<tspan fill="#c084fc">curr</tspan>, <tspan fill="#fbbf24">k - i</tspan>, <tspan fill="#f87171">blocker</tspan>);</text>
    <text x="18" y="185" fill="#e2e8f0" font-size="13" font-family="monospace">}</text>

    <!-- Formula 1: Why k - i -->
    <g transform="translate(0, 215)">
      <rect width="450" height="110" rx="10" fill="url(#cardGrad)" stroke="#fbbf24" stroke-width="1.2"/>
      <text x="16" y="24" fill="#fbbf24" font-size="14" font-weight="bold" font-family="sans-serif">1. Why Depth is (k - i) ?</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="12" font-family="sans-serif">• Climbing from Target to ancestor <tspan fill="#c084fc" font-weight="bold">path[i]</tspan> uses <tspan fill="#fbbf24" font-weight="bold">i edges</tspan>.</text>
      <text x="16" y="70" fill="#e2e8f0" font-size="12" font-family="sans-serif">• Total required distance is <tspan fill="#38bdf8" font-weight="bold">k</tspan>.</text>
      <text x="16" y="92" fill="#a7f3d0" font-size="12" font-weight="bold" font-family="sans-serif">➜ Remaining downward search depth = k - i</text>
    </g>

    <!-- Formula 2: Why blocker = path[i - 1] -->
    <g transform="translate(0, 335)">
      <rect width="450" height="150" rx="10" fill="url(#cardGrad)" stroke="#ef4444" stroke-width="1.2"/>
      <text x="16" y="24" fill="#f87171" font-size="14" font-weight="bold" font-family="sans-serif">2. Why Blocker is path[i - 1] ?</text>
      <text x="16" y="48" fill="#e2e8f0" font-size="12" font-family="sans-serif">• At index <tspan fill="#38bdf8">i</tspan>, the subtree under <tspan fill="#f87171" font-weight="bold">path[i - 1]</tspan> was <tspan fill="#fca5a5" font-weight="bold">ALREADY</tspan></text>
      <text x="16" y="68" fill="#e2e8f0" font-size="12" font-family="sans-serif">  fully explored in the previous iteration <tspan fill="#38bdf8">(i - 1)</tspan>!</text>
      <text x="16" y="90" fill="#e2e8f0" font-size="12" font-family="sans-serif">• If we re-enter <tspan fill="#f87171">path[i-1]</tspan>, we get <tspan fill="#ef4444" font-weight="bold">infinite loops / duplicates</tspan></text>
      <text x="16" y="110" fill="#e2e8f0" font-size="12" font-family="sans-serif">  and wrong distance calculations!</text>
      <text x="16" y="132" fill="#fca5a5" font-size="12" font-weight="bold" font-family="sans-serif">➜ Blocker shuts the door on the already visited branch ⛔</text>
    </g>

    <!-- Ancestor Path Array Display -->
    <g transform="translate(0, 495)">
      <rect width="450" height="210" rx="10" fill="#111827" stroke="#4f46e5" stroke-width="1.2"/>
      <text x="16" y="24" fill="#a5b4fc" font-size="14" font-weight="bold" font-family="sans-serif">Example: Target = 12, k = 3</text>
      <text x="16" y="46" fill="#94a3b8" font-size="12" font-family="monospace">path = [ 12 (Target), 25 (Parent), 50 (Root) ]</text>
      
      <!-- Array Boxes -->
      <g transform="translate(20, 60)">
        <!-- Box 0 -->
        <rect x="0" y="0" width="120" height="60" rx="6" fill="#1e3a8a" stroke="#3b82f6" stroke-width="1.5"/>
        <text x="60" y="22" fill="#93c5fd" font-size="11" font-weight="bold" text-anchor="middle">i = 0</text>
        <text x="60" y="46" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">12 (Target)</text>
        
        <!-- Box 1 -->
        <rect x="135" y="0" width="120" height="60" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
        <text x="195" y="22" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">i = 1</text>
        <text x="195" y="46" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">25 (Parent)</text>

        <!-- Box 2 -->
        <rect x="270" y="0" width="120" height="60" rx="6" fill="#312e81" stroke="#818cf8" stroke-width="1.5"/>
        <text x="330" y="22" fill="#c7d2fe" font-size="11" font-weight="bold" text-anchor="middle">i = 2</text>
        <text x="330" y="46" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle">50 (Root)</text>
      </g>

      <text x="16" y="150" fill="#38bdf8" font-size="12" font-family="sans-serif">• At i = 0: curr = 12, blocker = null, depth = 3</text>
      <text x="16" y="172" fill="#a78bfa" font-size="12" font-family="sans-serif">• At i = 1: curr = 25, blocker = 12, depth = 2 (searches 37 branch)</text>
      <text x="16" y="194" fill="#34d399" font-size="12" font-family="sans-serif">• At i = 2: curr = 50, blocker = 25, depth = 1 (searches 75 branch)</text>
    </g>
  </g>

  <!-- Right Column: Step-by-Step Visual Tree Dry Run -->
  <g transform="translate(505, 85)">
    <!-- Container Card -->
    <rect width="665" height="715" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    
    <!-- Tab 1: i = 0 Trace -->
    <g transform="translate(15, 15)">
      <rect width="635" height="215" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
      <rect x="0" y="0" width="635" height="30" rx="10" fill="#1d4ed8" fill-opacity="0.3"/>
      <text x="15" y="20" fill="#60a5fa" font-size="13" font-weight="bold" font-family="sans-serif">STEP 1 (i = 0) ➜ curr = 12, blocker = nullptr, search depth = k - 0 = 3</text>

      <!-- Subtree Diagram -->
      <g transform="translate(30, 45)">
        <!-- Edges -->
        <line x1="120" y1="20" x2="60" y2="70" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
        <line x1="120" y1="20" x2="180" y2="70" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>
        <!-- Node 12 -->
        <circle cx="120" cy="20" r="18" fill="url(#targetGrad)" stroke="#60a5fa" stroke-width="2"/>
        <text x="120" y="25" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">12</text>
        <rect x="90" y="-8" width="60" height="14" rx="3" fill="#1d4ed8"/>
        <text x="120" y="2" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">TARGET</text>
        
        <!-- Left & Right branches -->
        <circle cx="60" cy="70" r="14" fill="url(#exploreGrad)" stroke="#34d399" stroke-width="1.5"/>
        <text x="60" y="74" fill="#ffffff" font-size="10" text-anchor="middle">left</text>
        <circle cx="180" cy="70" r="14" fill="url(#exploreGrad)" stroke="#34d399" stroke-width="1.5"/>
        <text x="180" y="74" fill="#ffffff" font-size="10" text-anchor="middle">right</text>

        <!-- Downward wave -->
        <path d="M 30,110 Q 120,130 210,110" fill="none" stroke="#34d399" stroke-dasharray="4" stroke-width="1.5"/>
        <text x="120" y="125" fill="#34d399" font-size="11" text-anchor="middle">depth = 3 down from 12</text>
      </g>

      <!-- Explanation text -->
      <g transform="translate(280, 45)">
        <text x="0" y="16" fill="#38bdf8" font-size="12" font-weight="bold">• No blocker needed (blocker = null)</text>
        <text x="0" y="38" fill="#e2e8f0" font-size="12">• Normal downward search inside Target's own</text>
        <text x="0" y="58" fill="#e2e8f0" font-size="12">  subtree at full distance <tspan fill="#fbbf24" font-weight="bold">k = 3</tspan>.</text>
        <rect x="0" y="75" width="330" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="10" y="99" fill="#a7f3d0" font-size="11" font-weight="bold">✔ Explores all descendants at depth 3</text>
      </g>
    </g>

    <!-- Tab 2: i = 1 Trace -->
    <g transform="translate(15, 245)">
      <rect width="635" height="235" rx="10" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5"/>
      <rect x="0" y="0" width="635" height="30" rx="10" fill="#6d28d9" fill-opacity="0.3"/>
      <text x="15" y="20" fill="#c084fc" font-size="13" font-weight="bold" font-family="sans-serif">STEP 2 (i = 1) ➜ curr = 25 (Parent), blocker = 12 (path[0]), depth = k - 1 = 2</text>

      <!-- Subtree Diagram -->
      <g transform="translate(30, 45)">
        <!-- Edges -->
        <line x1="120" y1="20" x2="60" y2="75" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3"/>
        <line x1="120" y1="20" x2="180" y2="75" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
        
        <!-- Node 25 -->
        <circle cx="120" cy="20" r="18" fill="url(#ancestorGrad)" stroke="#a78bfa" stroke-width="2"/>
        <text x="120" y="25" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">25</text>
        <rect x="90" y="-8" width="60" height="14" rx="3" fill="#6d28d9"/>
        <text x="120" y="2" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">PARENT</text>

        <!-- Blocked Node 12 (Left Child) -->
        <circle cx="60" cy="75" r="16" fill="url(#blockerGrad)" stroke="#f87171" stroke-width="2"/>
        <text x="60" y="80" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">12</text>
        <!-- Red Barrier Cross -->
        <line x1="35" y1="102" x2="85" y2="102" stroke="#ef4444" stroke-width="3"/>
        <text x="60" y="118" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">⛔ BLOCKED</text>

        <!-- Free Node 37 (Right Child) -->
        <circle cx="180" cy="75" r="16" fill="url(#exploreGrad)" stroke="#34d399" stroke-width="2"/>
        <text x="180" y="80" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">37</text>
        <!-- Children of 37 -->
        <line x1="180" y1="75" x2="150" y2="125" stroke="#10b981" stroke-width="1.5"/>
        <line x1="180" y1="75" x2="210" y2="125" stroke="#10b981" stroke-width="1.5"/>
        <circle cx="150" cy="125" r="10" fill="#047857" stroke="#34d399" stroke-width="1"/>
        <circle cx="210" cy="125" r="10" fill="#047857" stroke="#34d399" stroke-width="1"/>
        <text x="180" y="146" fill="#34d399" font-size="10" text-anchor="middle">depth = 2 reached!</text>
      </g>

      <!-- Explanation text -->
      <g transform="translate(280, 45)">
        <text x="0" y="16" fill="#c084fc" font-size="12" font-weight="bold">• 1 edge used to climb from 12 ➜ 25.</text>
        <text x="0" y="38" fill="#e2e8f0" font-size="12">• Search depth from 25 is <tspan fill="#fbbf24" font-weight="bold">3 - 1 = 2</tspan>.</text>
        <text x="0" y="58" fill="#f87171" font-size="12">• Left branch (12) is <tspan font-weight="bold">BLOCKED</tspan> so we don't</text>
        <text x="0" y="78" fill="#f87171" font-size="12">  re-enter 12's subtree!</text>
        <rect x="0" y="95" width="330" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="10" y="119" fill="#a7f3d0" font-size="11" font-weight="bold">✔ Explores ONLY right subtree (37) safely</text>
      </g>
    </g>

    <!-- Tab 3: i = 2 Trace -->
    <g transform="translate(15, 495)">
      <rect width="635" height="205" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
      <rect x="0" y="0" width="635" height="30" rx="10" fill="#047857" fill-opacity="0.3"/>
      <text x="15" y="20" fill="#34d399" font-size="13" font-weight="bold" font-family="sans-serif">STEP 3 (i = 2) ➜ curr = 50 (Root), blocker = 25 (path[1]), depth = k - 2 = 1</text>

      <!-- Subtree Diagram -->
      <g transform="translate(30, 45)">
        <!-- Edges -->
        <line x1="120" y1="20" x2="60" y2="75" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="3"/>
        <line x1="120" y1="20" x2="180" y2="75" stroke="#10b981" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
        
        <!-- Node 50 -->
        <circle cx="120" cy="20" r="18" fill="url(#ancestorGrad)" stroke="#a78bfa" stroke-width="2"/>
        <text x="120" y="25" fill="#ffffff" font-size="13" font-weight="bold" text-anchor="middle">50</text>
        <rect x="90" y="-8" width="60" height="14" rx="3" fill="#6d28d9"/>
        <text x="120" y="2" fill="#ffffff" font-size="9" font-weight="bold" text-anchor="middle">ROOT</text>

        <!-- Blocked Node 25 (Left Child) -->
        <circle cx="60" cy="75" r="16" fill="url(#blockerGrad)" stroke="#f87171" stroke-width="2"/>
        <text x="60" y="80" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">25</text>
        <line x1="35" y1="102" x2="85" y2="102" stroke="#ef4444" stroke-width="3"/>
        <text x="60" y="118" fill="#f87171" font-size="11" font-weight="bold" text-anchor="middle">⛔ BLOCKED</text>

        <!-- Free Node 75 (Right Child) -->
        <circle cx="180" cy="75" r="16" fill="url(#exploreGrad)" stroke="#34d399" stroke-width="2"/>
        <text x="180" y="80" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">75</text>
        <text x="180" y="115" fill="#34d399" font-size="11" font-weight="bold" text-anchor="middle">depth = 1 (K=3 match!)</text>
      </g>

      <!-- Explanation text -->
      <g transform="translate(280, 45)">
        <text x="0" y="16" fill="#34d399" font-size="12" font-weight="bold">• 2 edges used to climb from 12 ➜ 25 ➜ 50.</text>
        <text x="0" y="38" fill="#e2e8f0" font-size="12">• Search depth from 50 is <tspan fill="#fbbf24" font-weight="bold">3 - 2 = 1</tspan>.</text>
        <text x="0" y="58" fill="#f87171" font-size="12">• Left branch (25) is <tspan font-weight="bold">BLOCKED</tspan> (all its nodes</text>
        <text x="0" y="78" fill="#f87171" font-size="12">  were already checked in steps 1 &amp; 2!).</text>
        <rect x="0" y="95" width="330" height="35" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
        <text x="10" y="117" fill="#a7f3d0" font-size="11" font-weight="bold">✔ Prints 75 as answer node at distance 3</text>
      </g>
    </g>
  </g>
</svg>
