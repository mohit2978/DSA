<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="targetGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="blockerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="validGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="700" fill="url(#bgGrad4)" rx="16"/>

  <text x="550" y="42" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Print Nodes K Distance Away — The Blocker Technique</text>
  <text x="550" y="68" fill="#c7d2fe" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Why we need a blocker node to prevent duplicate traversals &amp; invalid distances</text>

  <!-- Left Side: Conceptual Tree -->
  <g transform="translate(40, 95)">
    <!-- Tree edges -->
    <line x1="240" y1="30" x2="240" y2="100" stroke="#818cf8" stroke-width="3"/>
    <line x1="240" y1="100" x2="160" y2="180" stroke="#818cf8" stroke-width="3"/>
    <line x1="240" y1="100" x2="330" y2="180" stroke="#10b981" stroke-width="2.5"/>

    <line x1="160" y1="180" x2="100" y2="260" stroke="#818cf8" stroke-width="3"/>
    <line x1="160" y1="180" x2="220" y2="260" stroke="#10b981" stroke-width="2.5"/>

    <!-- 50 to its children -->
    <line x1="100" y1="260" x2="60" y2="340" stroke="#3b82f6" stroke-width="2.5"/>
    <line x1="100" y1="260" x2="140" y2="340" stroke="#3b82f6" stroke-width="2.5"/>

    <!-- Nodes -->
    <!-- h (Root ancestor) -->
    <circle cx="240" cy="30" r="22" fill="#312e81" stroke="#818cf8" stroke-width="2" filter="url(#glow4)"/>
    <text x="240" y="36" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">h'</text>

    <!-- a -->
    <circle cx="240" cy="100" r="22" fill="#312e81" stroke="#818cf8" stroke-width="2" filter="url(#glow4)"/>
    <text x="240" y="106" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">a</text>

    <!-- b -->
    <circle cx="160" cy="180" r="22" fill="#312e81" stroke="#818cf8" stroke-width="2" filter="url(#glow4)"/>
    <text x="160" y="186" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">b</text>

    <!-- e -->
    <circle cx="100" cy="260" r="22" fill="#312e81" stroke="#818cf8" stroke-width="2" filter="url(#glow4)"/>
    <text x="100" y="266" fill="#ffffff" font-size="15" font-weight="bold" text-anchor="middle">e</text>

    <!-- Target Node 50 -->
    <circle cx="100" cy="260" r="24" fill="url(#targetGrad4)" stroke="#60a5fa" stroke-width="2.5" filter="url(#glow4)"/>
    <text x="100" y="266" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">50</text>
    <rect x="25" y="295" width="80" height="22" rx="4" fill="#1d4ed8"/>
    <text x="65" y="310" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">TARGET</text>

    <!-- Valid Subtree nodes (green) -->
    <circle cx="220" cy="260" r="18" fill="url(#validGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="220" y="265" fill="#ffffff" font-size="12" text-anchor="middle">other</text>

    <circle cx="330" cy="180" r="18" fill="url(#validGrad)" stroke="#34d399" stroke-width="2"/>
    <text x="330" y="185" fill="#ffffff" font-size="12" text-anchor="middle">other</text>

    <!-- Target subtree nodes -->
    <circle cx="60" cy="340" r="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="140" cy="340" r="16" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>

    <!-- Blocked indicator -->
    <g transform="translate(30, 420)">
      <rect width="380" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="15" y="24" fill="#f87171" font-size="13" font-weight="bold" font-family="sans-serif">🚫 Why Blocker is Essential:</text>
      <text x="15" y="48" fill="#e2e8f0" font-size="12" font-family="sans-serif">When moving up from <tspan fill="#60a5fa" font-weight="bold">50</tspan> to ancestor <tspan fill="#818cf8" font-weight="bold">e</tspan>:</text>
      <text x="15" y="68" fill="#e2e8f0" font-size="12" font-family="sans-serif">• <tspan fill="#818cf8" font-weight="bold">e</tspan> is at distance 1 from 50.</text>
      <text x="15" y="88" fill="#e2e8f0" font-size="12" font-family="sans-serif">• To find nodes at distance k from 50, we look for nodes</text>
      <text x="15" y="108" fill="#e2e8f0" font-size="12" font-family="sans-serif">  at distance <tspan fill="#fbbf24" font-weight="bold">(k - 1)</tspan> down from <tspan fill="#818cf8" font-weight="bold">e</tspan>.</text>
      <text x="15" y="130" fill="#fca5a5" font-size="12" font-family="sans-serif">• <tspan font-weight="bold">BUT</tspan> 50 is a child of e! Without blocker, e would re-enter 50!</text>
    </g>
  </g>

  <!-- Right Side: Ancestor Array & Dispatch Table -->
  <g transform="translate(480, 95)">
    <!-- Ancestor Table Card -->
    <rect width="580" height="565" rx="12" fill="#111827" stroke="#4f46e5" stroke-width="1.5"/>
    <rect x="0" y="0" width="580" height="42" rx="12" fill="#4f46e5" fill-opacity="0.2"/>
    <text x="20" y="27" fill="#a5b4fc" font-size="15" font-weight="bold" font-family="sans-serif">Node-to-Root Path &amp; Downward Dispatch Loop</text>

    <!-- Path Array visual -->
    <g transform="translate(20, 55)">
      <text x="0" y="16" fill="#e2e8f0" font-size="13" font-weight="bold" font-family="monospace">ArrayList&lt;Node&gt; path = [ 50, e, b, a, h' ]</text>
      
      <!-- Table Headers -->
      <g transform="translate(0, 30)">
        <rect width="540" height="30" fill="#1f2937" rx="4"/>
        <text x="15" y="20" fill="#9ca3af" font-size="11" font-weight="bold">INDEX (i)</text>
        <text x="80" y="20" fill="#9ca3af" font-size="11" font-weight="bold">NODE</text>
        <text x="145" y="20" fill="#9ca3af" font-size="11" font-weight="bold">DIST NEEDED</text>
        <text x="240" y="20" fill="#9ca3af" font-size="11" font-weight="bold">BLOCKER NODE</text>
        <text x="375" y="20" fill="#9ca3af" font-size="11" font-weight="bold">ACTION / EXPLORATION</text>
      </g>

      <!-- Row 0 -->
      <g transform="translate(0, 65)">
        <rect width="540" height="38" fill="#1e293b" rx="4"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-family="monospace">i = 0</text>
        <text x="80" y="24" fill="#60a5fa" font-size="13" font-weight="bold" font-family="monospace">50</text>
        <text x="145" y="24" fill="#fbbf24" font-size="13" font-family="monospace">k - 0 = k</text>
        <text x="240" y="24" fill="#94a3b8" font-size="12" font-family="monospace">null</text>
        <text x="375" y="24" fill="#34d399" font-size="12">Search entire 50 subtree</text>
      </g>

      <!-- Row 1 -->
      <g transform="translate(0, 108)">
        <rect width="540" height="38" fill="#1e293b" rx="4"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-family="monospace">i = 1</text>
        <text x="80" y="24" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="monospace">e</text>
        <text x="145" y="24" fill="#fbbf24" font-size="13" font-family="monospace">k - 1</text>
        <text x="240" y="24" fill="#f87171" font-size="13" font-weight="bold" font-family="monospace">50 (path[0])</text>
        <text x="375" y="24" fill="#34d399" font-size="12">Search e, block 50</text>
      </g>

      <!-- Row 2 -->
      <g transform="translate(0, 151)">
        <rect width="540" height="38" fill="#1e293b" rx="4"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-family="monospace">i = 2</text>
        <text x="80" y="24" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="monospace">b</text>
        <text x="145" y="24" fill="#fbbf24" font-size="13" font-family="monospace">k - 2</text>
        <text x="240" y="24" fill="#f87171" font-size="13" font-weight="bold" font-family="monospace">e  (path[1])</text>
        <text x="375" y="24" fill="#34d399" font-size="12">Search b, block e</text>
      </g>

      <!-- Row 3 -->
      <g transform="translate(0, 194)">
        <rect width="540" height="38" fill="#1e293b" rx="4"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-family="monospace">i = 3</text>
        <text x="80" y="24" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="monospace">a</text>
        <text x="145" y="24" fill="#fbbf24" font-size="13" font-family="monospace">k - 3</text>
        <text x="240" y="24" fill="#f87171" font-size="13" font-weight="bold" font-family="monospace">b  (path[2])</text>
        <text x="375" y="24" fill="#34d399" font-size="12">Search a, block b</text>
      </g>

      <!-- Row 4 -->
      <g transform="translate(0, 237)">
        <rect width="540" height="38" fill="#1e293b" rx="4"/>
        <text x="15" y="24" fill="#38bdf8" font-size="12" font-family="monospace">i = 4</text>
        <text x="80" y="24" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="monospace">h'</text>
        <text x="145" y="24" fill="#fbbf24" font-size="13" font-family="monospace">k - 4</text>
        <text x="240" y="24" fill="#f87171" font-size="13" font-weight="bold" font-family="monospace">a  (path[3])</text>
        <text x="375" y="24" fill="#34d399" font-size="12">Search h', block a</text>
      </g>
    </g>

    <!-- Code Formula Snippet -->
    <g transform="translate(20, 360)">
      <rect width="540" height="130" rx="8" fill="#030712" stroke="#374151" stroke-width="1"/>
      <text x="15" y="25" fill="#38bdf8" font-size="13" font-family="monospace">for (int i = 0; i &lt; path.size(); i++) {</text>
      <text x="35" y="50" fill="#fcd34d" font-size="13" font-family="monospace">Node blocker = (i == 0) ? null : path.get(i - 1);</text>
      <text x="35" y="75" fill="#6ee7b7" font-size="13" font-family="monospace">printKLevelsDown(path.get(i), k - i, blocker);</text>
      <text x="15" y="100" fill="#38bdf8" font-size="13" font-family="monospace">}</text>
    </g>
  </g>
</svg>
