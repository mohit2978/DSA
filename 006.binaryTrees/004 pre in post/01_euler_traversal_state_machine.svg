<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 850" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #181825; }
      .card { fill: #1e1e2e; stroke: #313244; stroke-width: 1.5; rx: 12px; }
      .header-title { font-family: system-ui, -apple-system, sans-serif; font-size: 22px; font-weight: 700; fill: #cdd6f4; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-size: 14px; fill: #a6adc8; }
      .section-title { font-family: system-ui, -apple-system, sans-serif; font-size: 16px; font-weight: 600; fill: #89b4fa; }
      .text-main { font-family: system-ui, -apple-system, sans-serif; font-size: 13px; fill: #cdd6f4; }
      .text-sub { font-family: system-ui, -apple-system, sans-serif; font-size: 12px; fill: #bac2de; }
      .text-code { font-family: 'Consolas', 'Courier New', monospace; font-size: 12.5px; fill: #f5e0dc; }
      .badge-pre { fill: #f38ba8; }
      .badge-in { fill: #fab387; }
      .badge-post { fill: #a6e3a1; }
      .node-circle { fill: #313244; stroke: #89b4fa; stroke-width: 2.5; }
      .node-text { font-family: system-ui, -apple-system, sans-serif; font-size: 15px; font-weight: 700; fill: #cdd6f4; text-anchor: middle; dominant-baseline: central; }
      .tree-edge { stroke: #45475a; stroke-width: 2.5; stroke-linecap: round; }
      .euler-path { stroke: #cba6f7; stroke-width: 2; stroke-dasharray: 4 3; fill: none; opacity: 0.85; }
      .stack-box { fill: #252538; stroke: #45475a; stroke-width: 1.5; rx: 6px; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cba6f7" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="850" class="bg" rx="16" />

  <!-- Header -->
  <g transform="translate(40, 40)">
    <text class="header-title" x="0" y="0">Euler Tour &amp; Universal Traversal State Machine</text>
    <text class="subtitle" x="0" y="24">Unified iterative Preorder, Inorder, and Postorder traversal using a single Stack with State (1, 2, 3)</text>
  </g>

  <!-- Left Card: Euler Tour & 3-Visit Rule -->
  <g transform="translate(40, 90)">
    <rect width="480" height="420" class="card" />
    <text class="section-title" x="24" y="32">1. Euler Tour Concept (3 Visits Per Node)</text>
    
    <!-- Tree Drawing -->
    <g transform="translate(240, 160)">
      <!-- Edges -->
      <line x1="0" y1="0" x2="-100" y2="80" class="tree-edge" />
      <line x1="0" y1="0" x2="100" y2="80" class="tree-edge" />
      <line x1="-100" y1="80" x2="-140" y2="160" class="tree-edge" />
      <line x1="-100" y1="80" x2="-60" y2="160" class="tree-edge" />
      <line x1="100" y1="80" x2="60" y2="160" class="tree-edge" />
      <line x1="100" y1="80" x2="140" y2="160" class="tree-edge" />

      <!-- Euler Tour Path Around Root 1 -->
      <path d="M -28 -15 C -35 -30, 35 -30, 28 -15 
               C 38 10, 80 40, 115 65
               C 155 95, 175 160, 155 185
               C 135 200, 115 165, 100 135
               C 85 105, 55 145, 45 185
               C 30 195, 15 150, 45 105
               C 65 75, 20 40, 0 35
               C -20 40, -65 75, -45 105
               C -15 150, -30 195, -45 185
               C -55 145, -85 105, -100 135
               C -115 165, -135 200, -155 185
               C -175 160, -155 95, -115 65
               C -80 40, -38 10, -28 -15" class="euler-path" marker-mid="url(#arrow)" />

      <!-- Nodes -->
      <!-- Node 1 -->
      <circle cx="0" cy="0" r="22" class="node-circle" />
      <text x="0" y="0" class="node-text">1</text>
      <!-- Annotations for Node 1 -->
      <circle cx="-30" cy="-4" r="5" class="badge-pre" />
      <text x="-52" y="-4" class="text-sub" font-weight="700" fill="#f38ba8">Pre (1)</text>

      <circle cx="0" cy="30" r="5" class="badge-in" />
      <text x="0" y="44" class="text-sub" font-weight="700" fill="#fab387" text-anchor="middle">In (2)</text>

      <circle cx="30" cy="-4" r="5" class="badge-post" />
      <text x="56" y="-4" class="text-sub" font-weight="700" fill="#a6e3a1">Post (3)</text>

      <!-- Node 2 -->
      <circle cx="-100" cy="80" r="20" class="node-circle" />
      <text x="-100" y="80" class="node-text">2</text>

      <!-- Node 3 -->
      <circle cx="100" cy="80" r="20" class="node-circle" />
      <text x="100" y="80" class="node-text">3</text>

      <!-- Leaf Nodes 4, 5, 6, 7 -->
      <circle cx="-140" cy="160" r="17" class="node-circle" />
      <text x="-140" y="160" class="node-text">4</text>

      <circle cx="-60" cy="160" r="17" class="node-circle" />
      <text x="-60" y="160" class="node-text">5</text>

      <circle cx="60" cy="160" r="17" class="node-circle" />
      <text x="60" y="160" class="node-text">6</text>

      <circle cx="140" cy="160" r="17" class="node-circle" />
      <text x="140" y="160" class="node-text">7</text>
    </g>

    <!-- Legend & Rules -->
    <g transform="translate(24, 345)">
      <rect width="432" height="55" fill="#181825" rx="8" stroke="#313244" />
      <circle cx="20" cy="27" r="6" class="badge-pre" />
      <text x="32" y="31" class="text-sub"><tspan font-weight="700" fill="#f38ba8">Left / First Visit (State 1):</tspan> Preorder</text>

      <circle cx="170" cy="27" r="6" class="badge-in" />
      <text x="182" y="31" class="text-sub"><tspan font-weight="700" fill="#fab387">Bottom (State 2):</tspan> Inorder</text>

      <circle cx="310" cy="27" r="6" class="badge-post" />
      <text x="322" y="31" class="text-sub"><tspan font-weight="700" fill="#a6e3a1">Right (State 3):</tspan> Postorder</text>
    </g>
  </g>

  <!-- Right Card: State Transition Logic -->
  <g transform="translate(540, 90)">
    <rect width="520" height="420" class="card" />
    <text class="section-title" x="24" y="32">2. Stack State Transitions &amp; Actions</text>

    <!-- State 1 Box -->
    <g transform="translate(24, 55)">
      <rect width="472" height="100" class="stack-box" stroke="#f38ba8" />
      <rect width="80" height="22" fill="#f38ba8" rx="4" x="12" y="10" />
      <text x="52" y="24" font-family="system-ui" font-size="11px" font-weight="bold" fill="#181825" text-anchor="middle">STATE == 1</text>
      <text x="105" y="25" class="text-main" font-weight="bold" fill="#f38ba8">PREORDER TIME (Entering Node)</text>
      
      <text x="16" y="52" class="text-code">1. pre.push_back(node-&gt;val);</text>
      <text x="16" y="70" class="text-code">2. state++;  // increment state to 2</text>
      <text x="16" y="88" class="text-code">3. if (node-&gt;left != null) stk.push({node-&gt;left, 1});</text>
    </g>

    <!-- State 2 Box -->
    <g transform="translate(24, 168)">
      <rect width="472" height="100" class="stack-box" stroke="#fab387" />
      <rect width="80" height="22" fill="#fab387" rx="4" x="12" y="10" />
      <text x="52" y="24" font-family="system-ui" font-size="11px" font-weight="bold" fill="#181825" text-anchor="middle">STATE == 2</text>
      <text x="105" y="25" class="text-main" font-weight="bold" fill="#fab387">INORDER TIME (Returned from Left Subtree)</text>
      
      <text x="16" y="52" class="text-code">1. inO.push_back(node-&gt;val);</text>
      <text x="16" y="70" class="text-code">2. state++;  // increment state to 3</text>
      <text x="16" y="88" class="text-code">3. if (node-&gt;right != null) stk.push({node-&gt;right, 1});</text>
    </g>

    <!-- State 3 Box -->
    <g transform="translate(24, 281)">
      <rect width="472" height="90" class="stack-box" stroke="#a6e3a1" />
      <rect width="80" height="22" fill="#a6e3a1" rx="4" x="12" y="10" />
      <text x="52" y="24" font-family="system-ui" font-size="11px" font-weight="bold" fill="#181825" text-anchor="middle">STATE == 3</text>
      <text x="105" y="25" class="text-main" font-weight="bold" fill="#a6e3a1">POSTORDER TIME (Returned from Right Subtree)</text>
      
      <text x="16" y="52" class="text-code">1. post.push_back(node-&gt;val);</text>
      <text x="16" y="72" class="text-code">2. stk.pop();  // finished processing node completely</text>
    </g>
  </g>

  <!-- Bottom Card: Step-by-Step Stack Simulation & Tracing -->
  <g transform="translate(40, 530)">
    <rect width="1020" height="290" class="card" />
    <text class="section-title" x="24" y="32">3. Stack Execution Trace on Tree [1, Left: 2, Right: 3]</text>

    <!-- Stack Frames Progression -->
    <g transform="translate(24, 55)">
      <!-- Step 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="150" fill="#181825" stroke="#313244" rx="8" />
        <text x="72" y="22" class="text-sub" font-weight="bold" text-anchor="middle" fill="#89b4fa">Step 1: Init</text>
        <rect x="15" y="105" width="115" height="32" fill="#313244" stroke="#f38ba8" rx="4" stroke-width="1.5" />
        <text x="72" y="125" class="text-code" text-anchor="middle" fill="#f38ba8">(1, state: 1)</text>
        <text x="72" y="172" class="text-sub" text-anchor="middle" fill="#a6adc8">Pre: [1]</text>
      </g>

      <!-- Step 2 -->
      <g transform="translate(165, 0)">
        <rect width="145" height="150" fill="#181825" stroke="#313244" rx="8" />
        <text x="72" y="22" class="text-sub" font-weight="bold" text-anchor="middle" fill="#89b4fa">Step 2: Push Left</text>
        <rect x="15" y="65" width="115" height="32" fill="#313244" stroke="#f38ba8" rx="4" stroke-width="1.5" />
        <text x="72" y="85" class="text-code" text-anchor="middle" fill="#f38ba8">(2, state: 1)</text>
        <rect x="15" y="105" width="115" height="32" fill="#313244" stroke="#fab387" rx="4" />
        <text x="72" y="125" class="text-code" text-anchor="middle" fill="#fab387">(1, state: 2)</text>
        <text x="72" y="172" class="text-sub" text-anchor="middle" fill="#a6adc8">Pre: [1, 2]</text>
      </g>

      <!-- Step 3 -->
      <g transform="translate(330, 0)">
        <rect width="145" height="150" fill="#181825" stroke="#313244" rx="8" />
        <text x="72" y="22" class="text-sub" font-weight="bold" text-anchor="middle" fill="#89b4fa">Step 3: Pop Node 2</text>
        <rect x="15" y="65" width="115" height="32" fill="#313244" stroke="#a6e3a1" rx="4" stroke-dasharray="3 3" />
        <text x="72" y="85" class="text-code" text-anchor="middle" fill="#a6e3a1">2 popped (state 3)</text>
        <rect x="15" y="105" width="115" height="32" fill="#313244" stroke="#fab387" rx="4" />
        <text x="72" y="125" class="text-code" text-anchor="middle" fill="#fab387">(1, state: 2)</text>
        <text x="72" y="172" class="text-sub" text-anchor="middle" fill="#a6adc8">In: [2], Post: [2]</text>
      </g>

      <!-- Step 4 -->
      <g transform="translate(495, 0)">
        <rect width="145" height="150" fill="#181825" stroke="#313244" rx="8" />
        <text x="72" y="22" class="text-sub" font-weight="bold" text-anchor="middle" fill="#89b4fa">Step 4: Push Right</text>
        <rect x="15" y="65" width="115" height="32" fill="#313244" stroke="#f38ba8" rx="4" stroke-width="1.5" />
        <text x="72" y="85" class="text-code" text-anchor="middle" fill="#f38ba8">(3, state: 1)</text>
        <rect x="15" y="105" width="115" height="32" fill="#313244" stroke="#a6e3a1" rx="4" />
        <text x="72" y="125" class="text-code" text-anchor="middle" fill="#a6e3a1">(1, state: 3)</text>
        <text x="72" y="172" class="text-sub" text-anchor="middle" fill="#a6adc8">In: [2, 1], Pre: [1, 2, 3]</text>
      </g>

      <!-- Step 5 -->
      <g transform="translate(660, 0)">
        <rect width="145" height="150" fill="#181825" stroke="#313244" rx="8" />
        <text x="72" y="22" class="text-sub" font-weight="bold" text-anchor="middle" fill="#89b4fa">Step 5: Pop 3 &amp; 1</text>
        <rect x="15" y="65" width="115" height="32" fill="#313244" stroke="#a6e3a1" rx="4" stroke-dasharray="3 3" />
        <text x="72" y="85" class="text-code" text-anchor="middle" fill="#a6e3a1">3 popped (state 3)</text>
        <rect x="15" y="105" width="115" height="32" fill="#313244" stroke="#a6e3a1" rx="4" stroke-dasharray="3 3" />
        <text x="72" y="125" class="text-code" text-anchor="middle" fill="#a6e3a1">1 popped (state 3)</text>
        <text x="72" y="172" class="text-sub" text-anchor="middle" fill="#a6adc8">In: [2, 1, 3], Post: [2, 3, 1]</text>
      </g>

      <!-- Final Output Box -->
      <g transform="translate(825, 0)">
        <rect width="150" height="150" fill="#181825" stroke="#89b4fa" rx="8" stroke-width="1.5" />
        <text x="75" y="25" class="text-sub" font-weight="bold" text-anchor="middle" fill="#89b4fa">Final Results</text>
        
        <text x="14" y="55" class="text-sub" fill="#f38ba8" font-weight="bold">PREORDER:</text>
        <text x="14" y="72" class="text-code">[1, 2, 3]</text>

        <text x="14" y="95" class="text-sub" fill="#fab387" font-weight="bold">INORDER:</text>
        <text x="14" y="112" class="text-code">[2, 1, 3]</text>

        <text x="14" y="133" class="text-sub" fill="#a6e3a1" font-weight="bold">POSTORDER:</text>
        <text x="14" y="148" class="text-code">[2, 3, 1]</text>
      </g>
    </g>

    <!-- Summary footer -->
    <text x="24" y="260" class="text-main" fill="#a6adc8"><tspan font-weight="bold" fill="#89b4fa">Key Insight:</tspan> One single stack pass simulates the recursion stack perfectly. Time Complexity: <tspan fill="#a6e3a1" font-family="monospace">O(N)</tspan>, Space Complexity: <tspan fill="#a6e3a1" font-family="monospace">O(H)</tspan> where H is tree height.</text>
  </g>
</svg>
