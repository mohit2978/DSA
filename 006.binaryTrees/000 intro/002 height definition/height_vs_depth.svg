<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 860 360" xmlns="http://www.w3.org/2000/svg" style="background:#1e1e2e; border-radius:12px; font-family:'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="3" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 5 0 L 10 9 L 0 9 z" fill="#a6e3a1"/>
    </marker>
    <marker id="arrowDown" viewBox="0 0 10 10" refX="5" refY="7" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 0 L 5 9 z" fill="#89b4fa"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="430" y="32" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">Height vs Depth Analogy &amp; Tree Definition</text>

  <!-- Hill Analogy Panel (Left) -->
  <g transform="translate(30, 50)">
    <rect width="360" height="280" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    <text x="180" y="28" text-anchor="middle" fill="#f9e2af" font-size="15" font-weight="bold">The Mountain / Hill Analogy</text>
    
    <!-- Ground line -->
    <line x1="30" y1="230" x2="330" y2="230" stroke="#6c7086" stroke-width="3"/>
    
    <!-- Mountain Triangle -->
    <polygon points="180,85 80,230 280,230" fill="#313244" stroke="#cba6f7" stroke-width="3"/>
    <text x="180" y="175" text-anchor="middle" fill="#a6adc8" font-size="14" font-weight="bold">Hill / Tree</text>

    <!-- Person at Ground (Looking up -> Height) -->
    <circle cx="55" cy="205" r="7" fill="#a6e3a1"/>
    <line x1="55" y1="212" x2="55" y2="225" stroke="#a6e3a1" stroke-width="2"/>
    <line x1="48" y1="218" x2="62" y2="218" stroke="#a6e3a1" stroke-width="2"/>
    <line x1="55" y1="225" x2="48" y2="230" stroke="#a6e3a1" stroke-width="2"/>
    <line x1="55" y1="225" x2="62" y2="230" stroke="#a6e3a1" stroke-width="2"/>

    <line x1="40" y1="225" x2="40" y2="90" stroke="#a6e3a1" stroke-width="2.5" marker-end="url(#arrowUp)"/>
    <text x="40" y="75" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="bold">Height</text>
    <text x="40" y="90" text-anchor="middle" fill="#a6adc8" font-size="10">(From bottom)</text>

    <!-- Person at Peak (Looking down -> Depth) -->
    <circle cx="180" cy="65" r="7" fill="#89b4fa"/>
    <line x1="180" y1="72" x2="180" y2="82" stroke="#89b4fa" stroke-width="2"/>
    <line x1="173" y1="76" x2="187" y2="76" stroke="#89b4fa" stroke-width="2"/>

    <line x1="320" y1="90" x2="320" y2="225" stroke="#89b4fa" stroke-width="2.5" marker-end="url(#arrowDown)"/>
    <text x="320" y="75" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="bold">Depth</text>
    <text x="320" y="90" text-anchor="middle" fill="#a6adc8" font-size="10">(From top)</text>

    <text x="180" y="260" text-anchor="middle" fill="#cdd6f4" font-size="13" font-weight="bold">|Height of Tree| = |Depth of Deepest Leaf|</text>
  </g>

  <!-- Binary Tree Height & Depth (Right) -->
  <g transform="translate(420, 50)">
    <rect width="410" height="280" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    <text x="205" y="28" text-anchor="middle" fill="#f9e2af" font-size="15" font-weight="bold">In Binary Tree Context</text>

    <!-- Tree Lines -->
    <line x1="160" y1="75" x2="100" y2="130" stroke="#6c7086" stroke-width="2"/>
    <line x1="160" y1="75" x2="220" y2="130" stroke="#89b4fa" stroke-width="3"/>
    <line x1="220" y1="130" x2="260" y2="185" stroke="#89b4fa" stroke-width="3"/>
    <line x1="260" y1="185" x2="300" y2="240" stroke="#89b4fa" stroke-width="3"/>

    <!-- Nodes -->
    <circle cx="160" cy="75" r="16" fill="#cba6f7"/>
    <text x="160" y="80" text-anchor="middle" fill="#11111b" font-size="12" font-weight="bold">Root</text>

    <circle cx="100" cy="130" r="14" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="100" y="134" text-anchor="middle" fill="#cdd6f4" font-size="11">L</text>

    <circle cx="220" cy="130" r="14" fill="#89b4fa"/>
    <text x="220" y="134" text-anchor="middle" fill="#11111b" font-size="11" font-weight="bold">R</text>

    <circle cx="260" cy="185" r="14" fill="#fab387"/>
    <text x="260" y="189" text-anchor="middle" fill="#11111b" font-size="11" font-weight="bold">N</text>

    <circle cx="300" cy="240" r="15" fill="#a6e3a1"/>
    <text x="300" y="244" text-anchor="middle" fill="#11111b" font-size="11" font-weight="bold">Leaf</text>

    <!-- Edge Labels (1, 2, 3) -->
    <text x="200" y="98" fill="#f38ba8" font-size="12" font-weight="bold">Edge 1</text>
    <text x="250" y="152" fill="#f38ba8" font-size="12" font-weight="bold">Edge 2</text>
    <text x="290" y="208" fill="#f38ba8" font-size="12" font-weight="bold">Edge 3</text>

    <!-- Side Explanation -->
    <g transform="translate(20, 160)">
      <text x="0" y="0" fill="#a6e3a1" font-size="12" font-weight="bold">• Height (Node → Deepest Leaf):</text>
      <text x="10" y="18" fill="#a6adc8" font-size="11">Bottom-up (Path down to leaf)</text>
      <text x="0" y="42" fill="#89b4fa" font-size="12" font-weight="bold">• Depth (Root → Node):</text>
      <text x="10" y="60" fill="#a6adc8" font-size="11">Top-down (Path from root)</text>
      <text x="0" y="86" fill="#f9e2af" font-size="12" font-weight="bold">Height of Tree = 3 Edges</text>
    </g>
  </g>
</svg>
