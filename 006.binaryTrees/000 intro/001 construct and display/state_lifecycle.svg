<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 760 210" xmlns="http://www.w3.org/2000/svg" style="background:#181825; border-radius:10px; font-family:'Segoe UI', sans-serif;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa" />
    </marker>
  </defs>

  <!-- State 1 Box -->
  <rect x="30" y="40" width="200" height="120" rx="10" fill="#313244" stroke="#f38ba8" stroke-width="2"/>
  <text x="130" y="70" text-anchor="middle" fill="#f38ba8" font-size="16" font-weight="bold">State == 1</text>
  <text x="130" y="98" text-anchor="middle" fill="#cdd6f4" font-size="13">Attach Left Child</text>
  <text x="130" y="120" text-anchor="middle" fill="#a6adc8" font-size="11">top.state++ (becomes 2)</text>
  <text x="130" y="140" text-anchor="middle" fill="#a6adc8" font-size="11">if (val != null) push(left, 1)</text>

  <!-- Arrow 1 to 2 -->
  <line x1="230" y1="100" x2="275" y2="100" stroke="#89b4fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- State 2 Box -->
  <rect x="280" y="40" width="200" height="120" rx="10" fill="#313244" stroke="#fab387" stroke-width="2"/>
  <text x="380" y="70" text-anchor="middle" fill="#fab387" font-size="16" font-weight="bold">State == 2</text>
  <text x="380" y="98" text-anchor="middle" fill="#cdd6f4" font-size="13">Attach Right Child</text>
  <text x="380" y="120" text-anchor="middle" fill="#a6adc8" font-size="11">top.state++ (becomes 3)</text>
  <text x="380" y="140" text-anchor="middle" fill="#a6adc8" font-size="11">if (val != null) push(right, 1)</text>

  <!-- Arrow 2 to 3 -->
  <line x1="480" y1="100" x2="525" y2="100" stroke="#89b4fa" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- State 3 Box -->
  <rect x="530" y="40" width="200" height="120" rx="10" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
  <text x="630" y="70" text-anchor="middle" fill="#a6e3a1" font-size="16" font-weight="bold">State == 3</text>
  <text x="630" y="98" text-anchor="middle" fill="#cdd6f4" font-size="13">Subtree Complete</text>
  <text x="630" y="125" text-anchor="middle" fill="#a6e3a1" font-size="13" font-weight="bold">st.pop()</text>
</svg>
