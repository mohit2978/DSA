<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="targetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1100" height="680" fill="url(#bgGrad2)" rx="16"/>

  <!-- Title -->
  <text x="550" y="42" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Euler Path &amp; Early-Exit Search in Binary Trees</text>
  <text x="550" y="68" fill="#94a3b8" font-size="14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">Searching for Target = 30 &amp; Constructing Node-to-Root Path</text>

  <!-- Left Side: Tree Diagram with Euler Path & Pruning -->
  <g transform="translate(40, 90)">
    <!-- Tree Edges -->
    <line x1="280" y1="40" x2="160" y2="120" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="280" y1="40" x2="400" y2="120" stroke="#475569" stroke-width="2" stroke-dasharray="5"/>
    
    <line x1="160" y1="120" x2="90" y2="200" stroke="#64748b" stroke-width="2"/>
    <line x1="160" y1="120" x2="230" y2="200" stroke="#f59e0b" stroke-width="3.5"/>
    
    <line x1="230" y1="200" x2="190" y2="280" stroke="#f59e0b" stroke-width="3.5"/>
    
    <line x1="400" y1="120" x2="350" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="400" y1="120" x2="450" y2="200" stroke="#334155" stroke-width="1.5" stroke-dasharray="4"/>
    <line x1="350" y1="200" x2="380" y2="280" stroke="#334155" stroke-width="1.5" stroke-dasharray="4"/>

    <!-- Nodes -->
    <!-- 50 Root -->
    <circle cx="280" cy="40" r="24" fill="url(#pathGrad)" stroke="#fef08a" stroke-width="2.5" filter="url(#glow)"/>
    <text x="280" y="47" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">50</text>

    <!-- 25 -->
    <circle cx="160" cy="120" r="24" fill="url(#pathGrad)" stroke="#fef08a" stroke-width="2.5" filter="url(#glow)"/>
    <text x="160" y="127" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">25</text>

    <!-- 75 (Pruned) -->
    <circle cx="400" cy="120" r="22" fill="#1e293b" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="400" y="126" fill="#94a3b8" font-size="14" font-weight="bold" text-anchor="middle" font-family="monospace">75</text>
    <rect x="428" y="110" width="95" height="22" rx="4" fill="#ef4444" fill-opacity="0.2"/>
    <text x="475" y="125" fill="#f87171" font-size="10" font-weight="bold" text-anchor="middle" font-family="sans-serif">PRUNED (Never visited!)</text>

    <!-- 12 -->
    <circle cx="90" cy="200" r="22" fill="url(#nodeGrad)" stroke="#64748b" stroke-width="2"/>
    <text x="90" y="206" fill="#94a3b8" font-size="15" font-weight="bold" text-anchor="middle" font-family="monospace">12</text>
    <!-- Cross on 12 returns false -->
    <text x="45" y="205" fill="#ef4444" font-size="11" font-family="sans-serif">returns false</text>

    <!-- 37 -->
    <circle cx="230" cy="200" r="24" fill="url(#pathGrad)" stroke="#fef08a" stroke-width="2.5" filter="url(#glow)"/>
    <text x="230" y="207" fill="#ffffff" font-size="16" font-weight="bold" text-anchor="middle" font-family="monospace">37</text>

    <!-- 30 Target Found -->
    <circle cx="190" cy="280" r="26" fill="url(#targetGrad)" stroke="#6ee7b7" stroke-width="3" filter="url(#glow)"/>
    <text x="190" y="287" fill="#ffffff" font-size="17" font-weight="bold" text-anchor="middle" font-family="monospace">30</text>
    <rect x="135" y="315" width="110" height="24" rx="6" fill="#059669"/>
    <text x="190" y="331" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle" font-family="sans-serif">TARGET FOUND!</text>

    <!-- Pruned subtrees -->
    <circle cx="350" cy="200" r="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="350" y="205" fill="#64748b" font-size="13" text-anchor="middle" font-family="monospace">62</text>
    <circle cx="450" cy="200" r="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="450" y="205" fill="#64748b" font-size="13" text-anchor="middle" font-family="monospace">87</text>
    <circle cx="380" cy="280" r="18" fill="#1e293b" stroke="#475569" stroke-width="1.5" stroke-dasharray="3"/>
    <text x="380" y="285" fill="#64748b" font-size="13" text-anchor="middle" font-family="monospace">70</text>

    <!-- Return Path Annotations -->
    <g transform="translate(10, 370)">
      <rect width="520" height="175" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="15" y="25" fill="#38bdf8" font-size="14" font-weight="bold" font-family="sans-serif">Node-to-Root Path Construction (Backtracking Step):</text>
      
      <text x="20" y="55" fill="#6ee7b7" font-size="12" font-family="monospace">1. At 30: Target matches! list.add(30) -&gt; [30]</text>
      <text x="20" y="80" fill="#fcd34d" font-size="12" font-family="monospace">2. At 37: Left child returned list [30] -&gt; add(37) -&gt; [30, 37]</text>
      <text x="20" y="105" fill="#fcd34d" font-size="12" font-family="monospace">3. At 25: Right child returned list -&gt; add(25) -&gt; [30, 37, 25]</text>
      <text x="20" y="130" fill="#fcd34d" font-size="12" font-family="monospace">4. At 50: Left child returned list -&gt; add(50) -&gt; [30, 37, 25, 50]</text>
      <text x="20" y="155" fill="#38bdf8" font-size="12" font-weight="bold" font-family="sans-serif">Output Path: [ 30 -&gt; 37 -&gt; 25 -&gt; 50 ] (Leaf/Target to Root)</text>
    </g>
  </g>

  <!-- Right Side: Code Anatomy & Rules -->
  <g transform="translate(590, 90)">
    <rect width="470" height="545" rx="12" fill="#111827" stroke="#374151" stroke-width="1.5"/>
    <rect x="0" y="0" width="470" height="42" rx="12" fill="#374151" fill-opacity="0.3"/>
    <text x="20" y="27" fill="#38bdf8" font-size="16" font-weight="bold" font-family="sans-serif">The 5-Step Anatomy of Tree Search</text>

    <!-- Step 1 -->
    <g transform="translate(20, 60)">
      <circle cx="12" cy="12" r="12" fill="#ef4444"/>
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">1</text>
      <text x="35" y="16" fill="#f87171" font-size="13" font-family="monospace" font-weight="bold">if (node == null) return false;</text>
      <text x="35" y="32" fill="#9ca3af" font-size="11" font-family="sans-serif">Base Case 1: Reached empty branch without finding target.</text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 115)">
      <circle cx="12" cy="12" r="12" fill="#10b981"/>
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">2</text>
      <text x="35" y="16" fill="#34d399" font-size="13" font-family="monospace" font-weight="bold">if (node.data == data) return true;</text>
      <text x="35" y="32" fill="#9ca3af" font-size="11" font-family="sans-serif">Base Case 2: Current node matches target value.</text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 170)">
      <circle cx="12" cy="12" r="12" fill="#3b82f6"/>
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">3</text>
      <text x="35" y="16" fill="#60a5fa" font-size="13" font-family="monospace" font-weight="bold">boolean fil = find(node.left, data);</text>
      <text x="35" y="34" fill="#60a5fa" font-size="13" font-family="monospace" font-weight="bold">if (fil) return true; // Early Exit</text>
      <text x="35" y="52" fill="#9ca3af" font-size="11" font-family="sans-serif">Search left. If found, prune entire right tree immediately!</text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(20, 245)">
      <circle cx="12" cy="12" r="12" fill="#8b5cf6"/>
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">4</text>
      <text x="35" y="16" fill="#a78bfa" font-size="13" font-family="monospace" font-weight="bold">boolean fir = find(node.right, data);</text>
      <text x="35" y="34" fill="#a78bfa" font-size="13" font-family="monospace" font-weight="bold">if (fir) return true;</text>
      <text x="35" y="52" fill="#9ca3af" font-size="11" font-family="sans-serif">Search right only if left did NOT find the target.</text>
    </g>

    <!-- Step 5 -->
    <g transform="translate(20, 320)">
      <circle cx="12" cy="12" r="12" fill="#64748b"/>
      <text x="12" y="16" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">5</text>
      <text x="35" y="16" fill="#cbd5e1" font-size="13" font-family="monospace" font-weight="bold">return false;</text>
      <text x="35" y="32" fill="#9ca3af" font-size="11" font-family="sans-serif">Neither left nor right contains data.</text>
    </g>

    <!-- Key Takeaway Box -->
    <g transform="translate(20, 385)">
      <rect width="430" height="135" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="15" y="24" fill="#a5b4fc" font-size="13" font-weight="bold" font-family="sans-serif">★ Crucial Optimization Insight:</text>
      <text x="15" y="48" fill="#e0e7ff" font-size="12" font-family="sans-serif">• Returning early on left child success avoids O(N) wasteful</text>
      <text x="15" y="66" fill="#e0e7ff" font-size="12" font-family="sans-serif">  traversal of the right subtree.</text>
      <text x="15" y="90" fill="#e0e7ff" font-size="12" font-family="sans-serif">• Same logic powers <tspan fill="#f59e0b" font-weight="bold">nodeToRootPath</tspan>: if (leftList.size() &gt; 0)</text>
      <text x="15" y="110" fill="#e0e7ff" font-size="12" font-family="sans-serif">  append self to list and return without touching right!</text>
    </g>
  </g>
</svg>
