<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#24273a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)" stroke="#313244" stroke-width="1.5" />

  <!-- Title & Header -->
  <text x="450" y="42" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Tilt of a Binary Tree (LeetCode 563)</text>
  <text x="450" y="68" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">Tilt of Node = | Left Subtree Sum - Right Subtree Sum |  •  Total Tilt = Sum of all Node Tilts</text>

  <!-- Left Container: Tree Diagram -->
  <rect x="30" y="95" width="410" height="395" rx="12" fill="url(#cardGrad)" stroke="#313244" stroke-width="1" />
  <text x="50" y="125" fill="#fab387" font-family="sans-serif" font-size="14" font-weight="700">TREE WALKTHROUGH &amp; TILT COMPUTATION</text>

  <!-- Tree Edges -->
  <line x1="235" y1="180" x2="135" y2="260" stroke="#45475a" stroke-width="2.5" />
  <line x1="235" y1="180" x2="335" y2="260" stroke="#45475a" stroke-width="2.5" />
  <line x1="335" y1="260" x2="285" y2="350" stroke="#45475a" stroke-width="2.5" />
  <line x1="335" y1="260" x2="385" y2="350" stroke="#45475a" stroke-width="2.5" />

  <!-- Root Node (50) -->
  <circle cx="235" cy="180" r="24" fill="url(#nodeGrad)" filter="url(#shadow)" />
  <text x="235" y="186" fill="#11111b" font-family="sans-serif" font-size="15" font-weight="700" text-anchor="middle">50</text>
  <!-- Root Details badge -->
  <rect x="155" y="130" width="160" height="24" rx="6" fill="#313244" stroke="#89b4fa" stroke-width="1" />
  <text x="235" y="146" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tilt: |20 - 135| = 115</text>

  <!-- Left Child (20) -->
  <circle cx="135" cy="260" r="22" fill="url(#leafGrad)" filter="url(#shadow)" />
  <text x="135" y="266" fill="#11111b" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">20</text>
  <rect x="65" y="290" width="140" height="22" rx="5" fill="#313244" stroke="#a6e3a1" stroke-width="1" />
  <text x="135" y="305" fill="#a6e3a1" font-family="sans-serif" font-size="11" text-anchor="middle">Tilt: |0 - 0| = 0 (Leaf)</text>

  <!-- Right Child (70) -->
  <circle cx="335" cy="260" r="22" fill="url(#nodeGrad)" filter="url(#shadow)" />
  <text x="335" y="266" fill="#11111b" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">70</text>
  <rect x="260" y="215" width="150" height="22" rx="5" fill="#313244" stroke="#89b4fa" stroke-width="1" />
  <text x="335" y="230" fill="#89b4fa" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tilt: |25 - 40| = 15</text>

  <!-- Right's Left Child (25) -->
  <circle cx="285" cy="350" r="20" fill="url(#leafGrad)" filter="url(#shadow)" />
  <text x="285" y="355" fill="#11111b" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">25</text>
  <rect x="235" y="380" width="100" height="20" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1" />
  <text x="285" y="394" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">Tilt: 0 (Leaf)</text>

  <!-- Right's Right Child (40) -->
  <circle cx="385" cy="350" r="20" fill="url(#leafGrad)" filter="url(#shadow)" />
  <text x="385" y="355" fill="#11111b" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">40</text>
  <rect x="340" y="380" width="100" height="20" rx="4" fill="#313244" stroke="#a6e3a1" stroke-width="1" />
  <text x="390" y="394" fill="#a6e3a1" font-family="sans-serif" font-size="10" text-anchor="middle">Tilt: 0 (Leaf)</text>

  <!-- Bottom Calculation Banner -->
  <rect x="50" y="420" width="370" height="55" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.5" />
  <text x="235" y="442" fill="#f38ba8" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle">Total Tree Tilt = 115 + 0 + 15 + 0 + 0 = 130</text>
  <text x="235" y="462" fill="#bac2de" font-family="sans-serif" font-size="11" text-anchor="middle">Sum of node tilts over entire tree</text>

  <!-- Right Container: Concept & Strategy -->
  <rect x="460" y="95" width="410" height="395" rx="12" fill="url(#cardGrad)" stroke="#313244" stroke-width="1" />
  <text x="480" y="125" fill="#89b4fa" font-family="sans-serif" font-size="14" font-weight="700">POSTORDER PATTERN: TRAVEL &amp; TWEAK</text>

  <!-- Box 1: Return vs Update -->
  <rect x="480" y="145" width="370" height="100" rx="8" fill="#181825" stroke="#45475a" stroke-width="1" />
  <text x="495" y="170" fill="#a6e3a1" font-family="sans-serif" font-size="13" font-weight="700">1. What each node returns to parent:</text>
  <text x="510" y="192" fill="#cdd6f4" font-family="monospace" font-size="12">return ls + rs + node.val;</text>
  <text x="495" y="215" fill="#fab387" font-family="sans-serif" font-size="13" font-weight="700">2. What each node tweaks on the way:</text>
  <text x="510" y="235" fill="#cdd6f4" font-family="monospace" font-size="12">totalTilt += Math.abs(ls - rs);</text>

  <!-- Box 2: Approach Comparison -->
  <rect x="480" y="260" width="370" height="215" rx="8" fill="#181825" stroke="#45475a" stroke-width="1" />
  <text x="495" y="285" fill="#f9e2af" font-family="sans-serif" font-size="13" font-weight="700">Two Implementation Paradigms:</text>
  
  <text x="495" y="310" fill="#89b4fa" font-family="sans-serif" font-size="12" font-weight="600">A. Static / Reference Variable (Travel &amp; Tweak):</text>
  <text x="510" y="328" fill="#bac2de" font-family="sans-serif" font-size="11">• Recursion returns subtree sum</text>
  <text x="510" y="344" fill="#bac2de" font-family="sans-serif" font-size="11">• Updates static accumulator at postorder point</text>
  <text x="510" y="360" fill="#a6e3a1" font-family="sans-serif" font-size="11">• Time: O(N) | Space: O(H)</text>

  <text x="495" y="390" fill="#cba6f7" font-family="sans-serif" font-size="12" font-weight="600">B. Pair Return (Pure Functional DP on Tree):</text>
  <text x="510" y="408" fill="#bac2de" font-family="sans-serif" font-size="11">• Return struct/class { int sum; int ttilt; }</text>
  <text x="510" y="424" fill="#bac2de" font-family="sans-serif" font-size="11">• myTilt = lp.ttilt + rp.ttilt + |lp.sum - rp.sum|</text>
  <text x="510" y="440" fill="#bac2de" font-family="sans-serif" font-size="11">• mySum = lp.sum + rp.sum + node.val</text>
  <text x="510" y="458" fill="#a6e3a1" font-family="sans-serif" font-size="11">• Thread-safe, No global/static side-effects</text>
</svg>
