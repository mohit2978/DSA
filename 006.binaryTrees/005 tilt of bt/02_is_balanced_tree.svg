<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11111b" />
      <stop offset="100%" stop-color="#181825" />
    </linearGradient>
    <linearGradient id="balNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1" />
      <stop offset="100%" stop-color="#94e2d5" />
    </linearGradient>
    <linearGradient id="unbalNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f38ba8" />
      <stop offset="100%" stop-color="#eba0ac" />
    </linearGradient>
    <linearGradient id="neuNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e" />
      <stop offset="100%" stop-color="#24273a" />
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="540" rx="16" fill="url(#bgGrad2)" stroke="#313244" stroke-width="1.5" />

  <!-- Header -->
  <text x="460" y="42" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Is Balanced Binary Tree (LeetCode 110)</text>
  <text x="460" y="68" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" text-anchor="middle">AVL Height-Balance Property: For every node, | Left Height - Right Height | &lt;= 1</text>

  <!-- Left: Visual Comparisons -->
  <rect x="30" y="95" width="425" height="415" rx="12" fill="url(#cardGrad2)" stroke="#313244" stroke-width="1" />
  
  <!-- Example 1: Balanced Tree -->
  <rect x="45" y="110" width="395" height="180" rx="8" fill="#181825" stroke="#a6e3a1" stroke-width="1.2" />
  <text x="60" y="132" fill="#a6e3a1" font-family="sans-serif" font-size="13" font-weight="700">BALANCED TREE (Height Difference &lt;= 1)</text>

  <!-- Balanced Edges -->
  <line x1="240" y1="170" x2="180" y2="220" stroke="#45475a" stroke-width="2" />
  <line x1="240" y1="170" x2="300" y2="220" stroke="#45475a" stroke-width="2" />
  <line x1="180" y1="220" x2="140" y2="260" stroke="#45475a" stroke-width="2" />

  <!-- Balanced Nodes -->
  <circle cx="240" cy="170" r="16" fill="url(#balNodeGrad)" />
  <text x="240" y="175" fill="#11111b" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">50</text>
  <text x="270" y="165" fill="#a6e3a1" font-family="monospace" font-size="10">lh=2, rh=1 (diff=1)</text>

  <circle cx="180" cy="220" r="15" fill="url(#balNodeGrad)" />
  <text x="180" y="225" fill="#11111b" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">25</text>
  <text x="120" y="215" fill="#a6e3a1" font-family="monospace" font-size="10">lh=1, rh=0</text>

  <circle cx="300" cy="220" r="15" fill="url(#balNodeGrad)" />
  <text x="300" y="225" fill="#11111b" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">75</text>

  <circle cx="140" cy="260" r="14" fill="url(#balNodeGrad)" />
  <text x="140" y="264" fill="#11111b" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">12</text>

  <!-- Example 2: Unbalanced Tree -->
  <rect x="45" y="305" width="395" height="190" rx="8" fill="#181825" stroke="#f38ba8" stroke-width="1.2" />
  <text x="60" y="328" fill="#f38ba8" font-family="sans-serif" font-size="13" font-weight="700">UNBALANCED TREE (Height Difference &gt; 1)</text>

  <!-- Unbalanced Edges -->
  <line x1="240" y1="365" x2="180" y2="415" stroke="#45475a" stroke-width="2" />
  <line x1="180" y1="415" x2="130" y2="465" stroke="#45475a" stroke-width="2" />

  <!-- Unbalanced Nodes -->
  <circle cx="240" cy="365" r="16" fill="url(#unbalNodeGrad)" />
  <text x="240" y="370" fill="#11111b" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle">50</text>
  <text x="270" y="365" fill="#f38ba8" font-family="monospace" font-size="11" font-weight="700">|lh(2) - rh(0)| = 2 &gt; 1 !</text>

  <circle cx="180" cy="415" r="15" fill="url(#neuNodeGrad)" />
  <text x="180" y="420" fill="#11111b" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">25</text>

  <circle cx="130" cy="465" r="14" fill="url(#neuNodeGrad)" />
  <text x="130" y="469" fill="#11111b" font-family="sans-serif" font-size="10" font-weight="700" text-anchor="middle">12</text>

  <!-- Right: Strategy & Code Logic -->
  <rect x="470" y="95" width="420" height="415" rx="12" fill="url(#cardGrad2)" stroke="#313244" stroke-width="1" />
  <text x="490" y="125" fill="#89b4fa" font-family="sans-serif" font-size="14" font-weight="700">RETURN PAIR / POSTORDER LOGIC</text>

  <!-- Rule formula box -->
  <rect x="490" y="145" width="380" height="110" rx="8" fill="#181825" stroke="#45475a" stroke-width="1" />
  <text x="505" y="170" fill="#f9e2af" font-family="sans-serif" font-size="12" font-weight="700">Three Requirements for Node to be Balanced:</text>
  <text x="520" y="192" fill="#bac2de" font-family="monospace" font-size="12">1. leftPair.isBal == true</text>
  <text x="520" y="212" fill="#bac2de" font-family="monospace" font-size="12">2. rightPair.isBal == true</text>
  <text x="520" y="232" fill="#bac2de" font-family="monospace" font-size="12">3. Math.abs(leftPair.ht - rightPair.ht) &lt;= 1</text>

  <!-- Implementations Box -->
  <rect x="490" y="270" width="380" height="225" rx="8" fill="#181825" stroke="#45475a" stroke-width="1" />
  <text x="505" y="295" fill="#cba6f7" font-family="sans-serif" font-size="13" font-weight="700">Solution Architectures:</text>

  <text x="505" y="320" fill="#89b4fa" font-family="sans-serif" font-size="12" font-weight="600">1. Pair Return (Clean DP on Tree):</text>
  <text x="520" y="338" fill="#bac2de" font-family="sans-serif" font-size="11">• Base case: null -&gt; { ht: 0, isBal: true }</text>
  <text x="520" y="354" fill="#bac2de" font-family="sans-serif" font-size="11">• Node ht = max(lh, rh) + 1</text>

  <text x="505" y="380" fill="#fab387" font-family="sans-serif" font-size="12" font-weight="600">2. Travel &amp; Tweak (Static Flag):</text>
  <text x="520" y="398" fill="#bac2de" font-family="sans-serif" font-size="11">• Recursion returns normal height</text>
  <text x="520" y="414" fill="#bac2de" font-family="sans-serif" font-size="11">• If abs(lh - rh) &gt; 1 -&gt; static boolean isBal = false</text>

  <text x="505" y="440" fill="#a6e3a1" font-family="sans-serif" font-size="12" font-weight="600">3. Short-Circuiting DFS (-1 Error Code):</text>
  <text x="520" y="458" fill="#bac2de" font-family="sans-serif" font-size="11">• If left/right subtree returns -1 or abs diff &gt; 1, return -1</text>
  <text x="520" y="474" fill="#a6e3a1" font-family="sans-serif" font-size="11">• Short-circuits immediately without traversing remaining nodes</text>
</svg>
