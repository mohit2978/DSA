<svg viewBox="0 0 800 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="460" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Morris Preorder Traversal &#8212; only ONE line changes vs Inorder</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g stroke="#5b9bd5" stroke-width="2">
    <line x1="300" y1="70" x2="150" y2="140"/>
    <line x1="300" y1="70" x2="480" y2="140"/>
    <line x1="150" y1="140" x2="90"  y2="210"/>
    <line x1="150" y1="140" x2="210" y2="210"/>
    <line x1="210" y1="210" x2="170" y2="280"/>
    <line x1="210" y1="210" x2="250" y2="280"/>
    <line x1="480" y1="140" x2="420" y2="210"/>
    <line x1="480" y1="140" x2="540" y2="210"/>
    <line x1="540" y1="210" x2="500" y2="280"/>
    <line x1="540" y1="210" x2="580" y2="280"/>
  </g>

  <g>
    <circle cx="300" cy="60" r="18" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="150" cy="140" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="480" cy="140" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="90"  cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="210" cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="170" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="250" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="420" cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="540" cy="210" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="500" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="580" cy="280" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="13.5">
    <text x="300" y="65">1</text>
    <text x="150" y="145">2</text>
    <text x="480" y="145">7</text>
    <text x="90"  y="215">3</text>
    <text x="210" y="215">4</text>
    <text x="170" y="285">8</text>
    <text x="250" y="285">6</text>
    <text x="420" y="215">8</text>
    <text x="540" y="215">5</text>
    <text x="500" y="285">10</text>
    <text x="580" y="285">11</text>
  </g>

  <rect x="25" y="330" width="750" height="55" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="354" fill="#f2c14e" font-size="13.5" font-weight="bold">Preorder output</text>
  <text x="40" y="376" fill="#56c98d" font-size="15" font-weight="bold" font-family="monospace">1, 2, 3, 4, 8, 6, 7, 8, 5, 10, 11</text>

  <rect x="25" y="400" width="750" height="50" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="424" fill="#d4d4d4" font-size="12.5">Same threading mechanics as Inorder &#8212; the only difference is a node is printed the moment its thread is <tspan fill="#f2c14e">created</tspan> (1st visit), not when the thread is removed (2nd visit).</text>
</svg>
