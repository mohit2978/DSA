<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="480" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Morris Inorder Traversal dry run &#8212; tree a(b(c,d(e,f)), g(h(i,j)))</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g stroke="#5b9bd5" stroke-width="2">
    <line x1="230" y1="75" x2="120" y2="150"/>
    <line x1="230" y1="75" x2="340" y2="150"/>
    <line x1="120" y1="150" x2="70" y2="230"/>
    <line x1="120" y1="150" x2="180" y2="230"/>
    <line x1="180" y1="230" x2="140" y2="310"/>
    <line x1="180" y1="230" x2="220" y2="310"/>
    <line x1="340" y1="150" x2="340" y2="230"/>
    <line x1="340" y1="230" x2="300" y2="310"/>
    <line x1="340" y1="230" x2="380" y2="310"/>
  </g>

  <g>
    <circle cx="230" cy="65" r="19" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="120" cy="150" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="340" cy="150" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="70"  cy="230" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="180" cy="230" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="140" cy="310" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="220" cy="310" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="340" cy="230" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="300" cy="310" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="380" cy="310" r="19" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="230" y="70">a</text>
    <text x="120" y="155">b</text>
    <text x="340" y="155">g</text>
    <text x="70"  y="235">c</text>
    <text x="180" y="235">d</text>
    <text x="140" y="315">e</text>
    <text x="220" y="315">f</text>
    <text x="340" y="235">h</text>
    <text x="300" y="315">i</text>
    <text x="380" y="315">j</text>
  </g>

  <rect x="460" y="55" width="315" height="240" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="475" y="78" fill="#f2c14e" font-size="13" font-weight="bold">Threads created (1st visit) then removed (2nd visit)</text>
  <g font-family="monospace" font-size="12.5" fill="#d4d4d4">
    <text x="475" y="102">f.right = a  (f is rightmost of a's left)</text>
    <text x="475" y="124">c.right = b  (c is rightmost of b's left)</text>
    <text x="475" y="146">e.right = d  (e is rightmost of d's left)</text>
    <text x="475" y="168">i.right = h  (i is rightmost of h's left)</text>
    <text x="475" y="190">j.right = g  (j is rightmost of g's left,</text>
    <text x="475" y="208">              since h has no right child)</text>
  </g>
  <text x="475" y="245" fill="#9aa0a6" font-size="12">Every one of these threads is used once to climb</text>
  <text x="475" y="265" fill="#9aa0a6" font-size="12">back up, then reset to null and never seen again.</text>

  <rect x="25" y="330" width="750" height="70" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="354" fill="#f2c14e" font-size="13.5" font-weight="bold">Inorder output</text>
  <text x="40" y="380" fill="#56c98d" font-size="15" font-weight="bold" font-family="monospace">c, b, e, d, f, a, i, h, j, g</text>

  <rect x="25" y="410" width="750" height="55" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="434" fill="#d4d4d4" font-size="12.5">Every node is visited at most twice (once to lay the thread, once to remove it and print) &#8594; O(n) time, O(1) space.</text>
</svg>
