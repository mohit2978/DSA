      <text x="60" y="95" text-anchor="middle" fill="#11111b" font-size="12" font-weight="bold">50, state: 1</text>
    </g>
  </g>

  <!-- Step 1 Card -->
  <g transform="translate(255, 50)">
    <rect width="215" height="310" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    <rect width="215" height="36" rx="10" fill="#313244"/>
    <text x="107" y="24" text-anchor="middle" fill="#f9e2af" font-size="13" font-weight="bold">Step 1: arr[1] = 25</text>
    <text x="107" y="55" text-anchor="middle" fill="#a6adc8" font-size="11">50.left = 25; 50 st:2; Push(25,1)</text>

    <!-- Mini Tree -->
    <line x1="107" y1="95" x2="65" y2="135" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="107" cy="95" r="16" fill="#cba6f7"/>
    <text x="107" y="100" text-anchor="middle" fill="#11111b" font-size="12" font-weight="bold">50</text>
