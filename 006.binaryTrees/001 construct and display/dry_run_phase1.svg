<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 380" xmlns="http://www.w3.org/2000/svg" style="background:#1e1e2e; border-radius:12px; font-family:'Segoe UI', sans-serif;">
  <!-- Title -->
  <text x="480" y="32" text-anchor="middle" fill="#cdd6f4" font-size="17" font-weight="bold">Construction Dry Run — Phase 1: Left Spine (Root 50 → 25 → 12)</text>

  <!-- Step 0 Card -->
  <g transform="translate(20, 50)">
    <rect width="215" height="310" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    <rect width="215" height="36" rx="10" fill="#313244"/>
    <text x="107" y="24" text-anchor="middle" fill="#f9e2af" font-size="13" font-weight="bold">Step 0: arr[0] = 50</text>
    <text x="107" y="55" text-anchor="middle" fill="#a6adc8" font-size="11">Create Root, Push (50, 1)</text>
    
    <!-- Mini Tree -->
    <circle cx="107" cy="100" r="18" fill="#cba6f7"/>
    <text x="107" y="105" text-anchor="middle" fill="#11111b" font-size="13" font-weight="bold">50</text>
    
    <!-- Stack Box -->
    <g transform="translate(47, 160)">
      <rect width="120" height="120" fill="#11111b" stroke="#45475a" rx="6"/>
      <text x="60" y="20" text-anchor="middle" fill="#6c7086" font-size="11">Stack</text>
