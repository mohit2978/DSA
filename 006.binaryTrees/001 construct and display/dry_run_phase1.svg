  <!-- Steps 3,4,5 Card (12 completes and pops) -->
  <g transform="translate(725, 50)">
    <rect width="215" height="310" rx="10" fill="#181825" stroke="#313244" stroke-width="1.5"/>
    <rect width="215" height="36" rx="10" fill="#313244"/>
    <text x="107" y="24" text-anchor="middle" fill="#f9e2af" font-size="13" font-weight="bold">Steps 3-5: 12 pops</text>
    <text x="107" y="55" text-anchor="middle" fill="#a6adc8" font-size="11">null, null → 12 st:3 → pop()</text>

    <!-- Mini Tree -->
    <line x1="107" y1="85" x2="70" y2="115" stroke="#89b4fa" stroke-width="2"/>
    <line x1="70" y1="115" x2="40" y2="145" stroke="#89b4fa" stroke-width="2"/>
    <circle cx="107" cy="85" r="14" fill="#cba6f7"/>
    <text x="107" y="89" text-anchor="middle" fill="#11111b" font-size="11" font-weight="bold">50</text>
