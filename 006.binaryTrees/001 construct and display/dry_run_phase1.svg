    <g transform="translate(47, 160)">
      <rect width="120" height="120" fill="#11111b" stroke="#45475a" rx="6"/>
      <text x="60" y="20" text-anchor="middle" fill="#6c7086" font-size="11">Stack</text>
      <rect x="15" y="75" width="90" height="30" fill="#cba6f7" rx="4"/>
      <text x="60" y="95" text-anchor="middle" fill="#11111b" font-size="12" font-weight="bold">50, state: 2</text>
      <rect x="15" y="40" width="90" height="30" fill="#89b4fa" rx="4"/>
      <text x="60" y="60" text-anchor="middle" fill="#11111b" font-size="12" font-weight="bold">25, state: 1</text>
    </g>
