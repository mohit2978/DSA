<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 740 280" xmlns="http://www.w3.org/2000/svg" style="background:#1e1e2e; border-radius:12px; font-family:'Segoe UI', sans-serif;">
  <!-- Function Code Representation -->
  <rect x="30" y="25" width="310" height="230" rx="8" fill="#181825" stroke="#45475a"/>
  
  <text x="50" y="55" fill="#f38ba8" font-family="monospace" font-size="13">void f(Node node) {</text>
  <text x="70" y="85" fill="#a6e3a1" font-family="monospace" font-size="13" font-weight="bold">// Pre-order Area (Before Calls)</text>
  <text x="70" y="115" fill="#89b4fa" font-family="monospace" font-size="13">f(node.left);</text>
  <text x="70" y="145" fill="#fab387" font-family="monospace" font-size="13" font-weight="bold">// In-order Area (Between Calls)</text>
  <text x="70" y="175" fill="#89b4fa" font-family="monospace" font-size="13">f(node.right);</text>
  <text x="70" y="205" fill="#cba6f7" font-family="monospace" font-size="13" font-weight="bold">// Post-order Area (After Calls)</text>
  <text x="50" y="235" fill="#f38ba8" font-family="monospace" font-size="13">}</text>

  <!-- Euler Path Tree Representation -->
  <g transform="translate(420, 20)">
    <text x="140" y="25" text-anchor="middle" fill="#cdd6f4" font-size="15" font-weight="bold">Euler Traversal Areas</text>
    
    <!-- Tree Lines -->
    <line x1="140" y1="60" x2="80" y2="120" stroke="#6c7086" stroke-width="2"/>
    <line x1="140" y1="60" x2="200" y2="120" stroke="#6c7086" stroke-width="2"/>
    <line x1="80" y1="120" x2="40" y2="180" stroke="#6c7086" stroke-width="2"/>
    <line x1="80" y1="120" x2="110" y2="180" stroke="#6c7086" stroke-width="2"/>

    <!-- Euler Path Curve -->
    <path d="M 120 50 
             C 60 45, 55 100, 60 115 
             C 25 125, 15 170, 35 195 
             C 55 205, 55 170, 75 145 
             C 90 145, 95 170, 110 195 
             C 125 195, 130 160, 95 125 
             C 95 105, 135 105, 140 80
             C 145 105, 185 105, 185 125 
             C 170 160, 220 200, 225 150 
             C 220 95, 195 45, 160 50" 
          fill="none" stroke="#f9e2af" stroke-width="2.5" stroke-dasharray="5,3"/>

    <!-- Nodes -->
    <circle cx="140" cy="60" r="16" fill="#313244" stroke="#cba6f7" stroke-width="2"/>
    <text x="140" y="65" text-anchor="middle" fill="#cdd6f4" font-size="12">1</text>

    <circle cx="80" cy="120" r="14" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="80" y="124" text-anchor="middle" fill="#cdd6f4" font-size="11">2</text>

    <circle cx="200" cy="120" r="14" fill="#313244" stroke="#89b4fa" stroke-width="2"/>
    <text x="200" y="124" text-anchor="middle" fill="#cdd6f4" font-size="11">3</text>

    <circle cx="40" cy="180" r="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="40" y="184" text-anchor="middle" fill="#cdd6f4" font-size="10">4</text>

    <circle cx="110" cy="180" r="12" fill="#313244" stroke="#a6e3a1" stroke-width="2"/>
    <text x="110" y="184" text-anchor="middle" fill="#cdd6f4" font-size="10">5</text>

    <!-- Labels for Euler Areas -->
    <text x="65" y="45" fill="#a6e3a1" font-size="11" font-weight="bold">Pre (going down)</text>
    <text x="120" y="100" fill="#fab387" font-size="11" font-weight="bold">In (between)</text>
    <text x="195" y="45" fill="#cba6f7" font-size="11" font-weight="bold">Post (coming up)</text>
  </g>
</svg>
