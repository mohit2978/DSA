<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" style="background:#1e1e2e; border-radius:12px; font-family:'Segoe UI', sans-serif;">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="350" y="35" text-anchor="middle" fill="#cdd6f4" font-size="18" font-weight="bold">Constructed Binary Tree</text>

  <!-- Edges -->
  <!-- 50 to 25 and 75 -->
  <line x1="350" y1="80" x2="210" y2="150" stroke="#89b4fa" stroke-width="3"/>
  <line x1="350" y1="80" x2="490" y2="150" stroke="#89b4fa" stroke-width="3"/>

  <!-- 25 to 12 and 37 -->
  <line x1="210" y1="150" x2="130" y2="230" stroke="#89b4fa" stroke-width="3"/>
  <line x1="210" y1="150" x2="270" y2="230" stroke="#89b4fa" stroke-width="3"/>

  <!-- 37 to 30 (left child) -->
  <line x1="270" y1="230" x2="220" y2="310" stroke="#89b4fa" stroke-width="3"/>

  <!-- 75 to 62 and 87 -->
  <line x1="490" y1="150" x2="430" y2="230" stroke="#89b4fa" stroke-width="3"/>
  <line x1="490" y1="150" x2="570" y2="230" stroke="#89b4fa" stroke-width="3"/>

  <!-- 62 to 70 (right child) -->
  <line x1="430" y1="230" x2="480" y2="310" stroke="#89b4fa" stroke-width="3"/>

  <!-- Nodes -->
  <!-- 50 (Root) -->
  <circle cx="350" cy="80" r="24" fill="#cba6f7" filter="url(#shadow)"/>
  <text x="350" y="86" text-anchor="middle" fill="#11111b" font-size="16" font-weight="bold">50</text>

  <!-- Level 1 -->
  <circle cx="210" cy="150" r="22" fill="#89b4fa" filter="url(#shadow)"/>
  <text x="210" y="156" text-anchor="middle" fill="#11111b" font-size="15" font-weight="bold">25</text>

  <circle cx="490" cy="150" r="22" fill="#89b4fa" filter="url(#shadow)"/>
  <text x="490" y="156" text-anchor="middle" fill="#11111b" font-size="15" font-weight="bold">75</text>

  <!-- Level 2 -->
  <circle cx="130" cy="230" r="20" fill="#a6e3a1" filter="url(#shadow)"/>
  <text x="130" y="236" text-anchor="middle" fill="#11111b" font-size="14" font-weight="bold">12</text>

  <circle cx="270" cy="230" r="20" fill="#89b4fa" filter="url(#shadow)"/>
  <text x="270" y="236" text-anchor="middle" fill="#11111b" font-size="14" font-weight="bold">37</text>

  <circle cx="430" cy="230" r="20" fill="#89b4fa" filter="url(#shadow)"/>
  <text x="430" y="236" text-anchor="middle" fill="#11111b" font-size="14" font-weight="bold">62</text>

  <circle cx="570" cy="230" r="20" fill="#a6e3a1" filter="url(#shadow)"/>
  <text x="570" y="236" text-anchor="middle" fill="#11111b" font-size="14" font-weight="bold">87</text>

  <!-- Level 3 -->
  <circle cx="220" cy="310" r="18" fill="#a6e3a1" filter="url(#shadow)"/>
  <text x="220" y="315" text-anchor="middle" fill="#11111b" font-size="13" font-weight="bold">30</text>

  <circle cx="480" cy="310" r="18" fill="#a6e3a1" filter="url(#shadow)"/>
  <text x="480" y="315" text-anchor="middle" fill="#11111b" font-size="13" font-weight="bold">70</text>

  <!-- Legend -->
  <g transform="translate(180, 375)">
    <circle cx="0" cy="0" r="7" fill="#cba6f7"/>
    <text x="15" y="4" fill="#a6adc8" font-size="12">Root</text>
    <circle cx="100" cy="0" r="7" fill="#89b4fa"/>
    <text x="115" y="4" fill="#a6adc8" font-size="12">Internal Node</text>
    <circle cx="230" cy="0" r="7" fill="#a6e3a1"/>
    <text x="245" y="4" fill="#a6adc8" font-size="12">Leaf Node</text>
  </g>
</svg>
