<svg viewBox="0 0 800 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="380" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Construct from Inorder + LevelOrder &#8212; Inorder=[3,1,4,0,5,2,6], LevelOrder=[0,1,2,3,4,5,6]</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g stroke="#5b9bd5" stroke-width="2">
    <line x1="230" y1="70" x2="130" y2="150"/>
    <line x1="230" y1="70" x2="330" y2="150"/>
    <line x1="130" y1="150" x2="80"  y2="230"/>
    <line x1="130" y1="150" x2="180" y2="230"/>
    <line x1="330" y1="150" x2="280" y2="230"/>
    <line x1="330" y1="150" x2="380" y2="230"/>
  </g>
  <g>
    <circle cx="230" cy="60" r="18" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="130" cy="150" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="330" cy="150" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="80"  cy="230" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="180" cy="230" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="280" cy="230" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="380" cy="230" r="18" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="230" y="65">0</text>
    <text x="130" y="155">1</text>
    <text x="330" y="155">2</text>
    <text x="80"  y="235">3</text>
    <text x="180" y="235">4</text>
    <text x="280" y="235">5</text>
    <text x="380" y="235">6</text>
  </g>

  <rect x="25" y="270" width="750" height="95" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="294" fill="#f2c14e" font-size="13" font-weight="bold">Why this works</text>
  <text x="40" y="316" fill="#d4d4d4" font-size="12.5">In any inorder range, whichever element has the SMALLEST index in LevelOrder must be that range's root &#8212;</text>
  <text x="40" y="336" fill="#d4d4d4" font-size="12.5">because level order always visits a parent strictly before any of its descendants. Splitting on that root's</text>
  <text x="40" y="356" fill="#d4d4d4" font-size="12.5">inorder position (like Preorder+Inorder construction) then gives the Left/Right ranges to recurse into.</text>
</svg>
