<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="420" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Flatten via Reverse-Preorder (Right, Left, Node) &#8212; tree 1(2(4,5), 3(null,6(null,7)))</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <g stroke="#5b9bd5" stroke-width="2">
    <line x1="150" y1="70" x2="90"  y2="140"/>
    <line x1="150" y1="70" x2="230" y2="140"/>
    <line x1="90"  y1="140" x2="60"  y2="210"/>
    <line x1="90"  y1="140" x2="120" y2="210"/>
    <line x1="230" y1="140" x2="270" y2="210"/>
    <line x1="270" y1="210" x2="310" y2="280"/>
  </g>
  <g>
    <circle cx="150" cy="60" r="17" fill="#3a331f" stroke="#f2c14e" stroke-width="2.5"/>
    <circle cx="90"  cy="140" r="17" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="230" cy="140" r="17" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="60"  cy="210" r="17" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="120" cy="210" r="17" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="270" cy="210" r="17" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="310" cy="280" r="17" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="150" y="65">1</text>
    <text x="90"  y="145">2</text>
    <text x="230" y="145">3</text>
    <text x="60"  y="215">4</text>
    <text x="120" y="215">5</text>
    <text x="270" y="215">6</text>
    <text x="310" y="285">7</text>
  </g>

  <rect x="420" y="55" width="355" height="240" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="435" y="78" fill="#f2c14e" font-size="13" font-weight="bold">Call order (right subtree fully done before left)</text>
  <g font-family="monospace" font-size="12" fill="#d4d4d4">
    <text x="435" y="100">flatten(7): prev=null &#8594; 7.right=null; prev=7</text>
    <text x="435" y="120">flatten(6): 6.right=prev(7); prev=6</text>
    <text x="435" y="140">flatten(3): 3.right=prev(6); prev=3</text>
    <text x="435" y="160">flatten(5): 5.right=prev(3); prev=5</text>
    <text x="435" y="180">flatten(4): 4.right=prev(5); prev=4</text>
    <text x="435" y="200">flatten(2): 2.right=prev(4); prev=2</text>
    <text x="435" y="220">flatten(1): 1.right=prev(2); prev=1</text>
  </g>
  <text x="435" y="250" fill="#56c98d" font-size="12.5" font-weight="bold">Every node's .left is also set to null along the way.</text>

  <rect x="25" y="330" width="750" height="60" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="354" fill="#f2c14e" font-size="13.5" font-weight="bold">Final flattened list (via .right)</text>
  <text x="40" y="376" fill="#56c98d" font-size="14" font-weight="bold" font-family="monospace">1 &#8594; 2 &#8594; 4 &#8594; 5 &#8594; 3 &#8594; 6 &#8594; 7   (this is exactly the tree's Preorder)</text>
</svg>
