<svg viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" width="100%" height="170" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="insR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#10b981"/></marker>
    <marker id="insL" markerWidth="7" markerHeight="7" refX="2" refY="3.5" orient="auto"><polygon points="7 0, 0 3.5, 7 7" fill="#10b981"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#0f172a"/>
  <text x="20" y="24" fill="#10b981" font-size="13" font-weight="bold">insertBeforeHead: Linking new node before current head</text>

  <!-- New Node -->
  <g transform="translate(50, 45)">
    <rect width="130" height="65" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
    <text x="65" y="-8" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">NEW HEAD (val: 1)</text>
    <line x1="40" y1="0" x2="40" y2="65" stroke="#047857" stroke-width="1.5"/>
    <text x="20" y="38" fill="#a7f3d0" font-size="10" text-anchor="middle">null</text>
    <text x="85" y="40" fill="#ffffff" font-size="18" font-weight="bold" text-anchor="middle">1</text>
  </g>

  <!-- Linking Arrows -->
  <path d="M 185 65 L 290 65" stroke="#10b981" stroke-width="2" marker-end="url(#insR)"/>
  <path d="M 290 90 L 188 90" stroke="#10b981" stroke-width="2" marker-end="url(#insL)"/>
  <text x="240" y="58" fill="#10b981" font-size="10" text-anchor="middle">node->next = head</text>
  <text x="240" y="105" fill="#10b981" font-size="10" text-anchor="middle">head->prev = node</text>

  <!-- Current Head -->
  <g transform="translate(300, 45)">
    <rect width="120" height="65" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="60" y="-8" fill="#38bdf8" font-size="11" text-anchor="middle">OLD HEAD</text>
    <text x="60" y="40" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">val: 2</text>
  </g>
  <text x="380" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">If list is empty (head == nullptr), simply return the newly created node.</text>
</svg>
