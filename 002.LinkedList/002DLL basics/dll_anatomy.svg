<svg viewBox="0 0 820 210" xmlns="http://www.w3.org/2000/svg" width="100%" height="210" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="headGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#38bdf8" />
    </marker>
    <marker id="arrL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto">
      <path d="M7,1 L1,4 L7,7 Z" fill="#f472b6" />
    </marker>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#0f172a"/>
  
  <text x="25" y="30" fill="#f8fafc" font-size="14" font-weight="bold">Doubly Linked List Architecture</text>
  <circle cx="590" cy="25" r="5" fill="#38bdf8"/>
  <text x="602" y="29" fill="#cbd5e1" font-size="12">Next Link</text>
  <circle cx="695" cy="25" r="5" fill="#f472b6"/>
  <text x="707" y="29" fill="#cbd5e1" font-size="12">Prev Link</text>

  <!-- Left NULL -->
  <rect x="25" y="80" width="55" height="50" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="52" y="110" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">NULL</text>
  <path d="M 120 115 L 88 115" stroke="#f472b6" stroke-width="2" marker-end="url(#arrL)" stroke-dasharray="3,3"/>

  <!-- NODE 1 (HEAD) -->
  <g transform="translate(120, 60)" filter="url(#shadow)">
    <rect width="130" height="90" rx="10" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <rect x="0" y="-12" width="50" height="20" rx="5" fill="url(#headGrad)"/>
    <text x="25" y="2" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">HEAD</text>
    <line x1="40" y1="0" x2="40" y2="90" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="40" fill="#f472b6" font-size="11" text-anchor="middle">prev</text>
    <text x="65" y="52" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">2</text>
    <text x="65" y="72" fill="#94a3b8" font-size="10" text-anchor="middle">val</text>
    <text x="110" y="40" fill="#38bdf8" font-size="11" text-anchor="middle">next</text>
  </g>

  <!-- Links 1 <-> 2 -->
  <path d="M 235 90 L 320 90" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrR)"/>
  <path d="M 330 120 L 245 120" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrL)"/>

  <!-- NODE 2 -->
  <g transform="translate(330, 60)" filter="url(#shadow)">
    <rect width="130" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <line x1="40" y1="0" x2="40" y2="90" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="40" fill="#f472b6" font-size="11" text-anchor="middle">prev</text>
    <text x="65" y="52" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">3</text>
    <text x="65" y="72" fill="#94a3b8" font-size="10" text-anchor="middle">val</text>
    <text x="110" y="40" fill="#38bdf8" font-size="11" text-anchor="middle">next</text>
  </g>

  <!-- Links 2 <-> 3 -->
  <path d="M 445 90 L 530 90" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrR)"/>
  <path d="M 540 120 L 455 120" stroke="#f472b6" stroke-width="2.5" marker-end="url(#arrL)"/>

  <!-- NODE 3 (TAIL) -->
  <g transform="translate(540, 60)" filter="url(#shadow)">
    <rect width="130" height="90" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <rect x="80" y="-12" width="50" height="20" rx="5" fill="#e11d48"/>
    <text x="105" y="2" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">TAIL</text>
    <line x1="40" y1="0" x2="40" y2="90" stroke="#334155" stroke-width="1.5"/>
    <line x1="90" y1="0" x2="90" y2="90" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="40" fill="#f472b6" font-size="11" text-anchor="middle">prev</text>
    <text x="65" y="52" fill="#f8fafc" font-size="20" font-weight="bold" text-anchor="middle">4</text>
    <text x="65" y="72" fill="#94a3b8" font-size="10" text-anchor="middle">val</text>
    <text x="110" y="40" fill="#38bdf8" font-size="11" text-anchor="middle">next</text>
  </g>

  <!-- Right NULL -->
  <path d="M 655 90 L 710 90" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrR)" stroke-dasharray="3,3"/>
  <rect x="720" y="80" width="55" height="50" rx="8" fill="#1e293b" stroke="#64748b" stroke-width="1.5"/>
  <text x="747" y="110" fill="#94a3b8" font-size="12" font-weight="bold" text-anchor="middle">NULL</text>

  <text x="410" y="185" fill="#94a3b8" font-size="12" text-anchor="middle">Bidirectional traversal: Move forward using node->next, move backward using node->prev.</text>
</svg>
