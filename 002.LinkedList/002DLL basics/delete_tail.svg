<svg viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" width="100%" height="170" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <rect width="100%" height="100%" rx="10" fill="#0f172a"/>
  <text x="20" y="24" fill="#ef4444" font-size="13" font-weight="bold">deleteTail: Traversing to tail &amp; updating new tail next to NULL</text>

  <!-- Node N-1 -->
  <g transform="translate(180, 45)">
    <rect width="140" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="70" y="-8" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">NEW TAIL (next=null)</text>
    <line x1="95" y1="0" x2="95" y2="65" stroke="#334155" stroke-width="1.5"/>
    <text x="45" y="40" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">val: 4</text>
    <text x="117" y="38" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">NULL</text>
  </g>

  <!-- Broken Link to deleted tail -->
  <line x1="325" y1="70" x2="435" y2="70" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
  <line x1="435" y1="90" x2="325" y2="90" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>

  <!-- Old Tail (Deleted) -->
  <g transform="translate(440, 45)">
    <rect width="130" height="65" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="65" y="-8" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">OLD TAIL (delete)</text>
    <text x="65" y="40" fill="#fca5a5" font-size="18" font-weight="bold" text-anchor="middle">val: 5</text>
    <line x1="20" y1="15" x2="110" y2="50" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="110" y1="15" x2="20" y2="50" stroke="#ef4444" stroke-width="2.5"/>
  </g>
  <text x="380" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">Time: O(N) traversal to reach end | Space: O(1).</text>
</svg>
