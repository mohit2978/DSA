<svg viewBox="0 0 760 190" xmlns="http://www.w3.org/2000/svg" width="100%" height="190" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="bypR" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><polygon points="0 1, 7 4, 0 7" fill="#10b981"/></marker>
    <marker id="bypL" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto"><polygon points="7 1, 1 4, 7 7" fill="#10b981"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#0f172a"/>
  <text x="20" y="24" fill="#f59e0b" font-size="13" font-weight="bold">deleteGivenNode / deleteKthElement: Bypassing the deleted node in O(1) time</text>

  <!-- Previous Node -->
  <g transform="translate(40, 60)">
    <rect width="120" height="65" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="60" y="-6" fill="#94a3b8" font-size="11" text-anchor="middle">node->prev</text>
    <text x="60" y="40" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">val: 2</text>
  </g>

  <!-- Target Node -->
  <g transform="translate(310, 60)">
    <rect width="140" height="65" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="70" y="-6" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">TARGET (val: 3)</text>
    <text x="70" y="40" fill="#fca5a5" font-size="18" font-weight="bold" text-anchor="middle">val: 3</text>
    <line x1="25" y1="12" x2="115" y2="52" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="115" y1="12" x2="25" y2="52" stroke="#ef4444" stroke-width="2.5"/>
  </g>

  <!-- Next Node -->
  <g transform="translate(590, 60)">
    <rect width="120" height="65" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="60" y="-6" fill="#94a3b8" font-size="11" text-anchor="middle">node->next</text>
    <text x="60" y="40" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">val: 4</text>
  </g>

  <!-- Bypass Forward -->
  <path d="M 160 70 C 240 25, 510 25, 585 70" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#bypR)"/>
  <text x="375" y="24" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">previous->next = after</text>

  <!-- Bypass Backward -->
  <path d="M 590 115 C 510 160, 240 160, 165 115" fill="none" stroke="#10b981" stroke-width="2.5" marker-end="url(#bypL)"/>
  <text x="375" y="172" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">after->prev = previous</text>
</svg>
