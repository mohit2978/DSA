<svg viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" width="100%" height="170" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="delR" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><polygon points="0 0, 7 3.5, 0 7" fill="#38bdf8"/></marker>
  </defs>
  <rect width="100%" height="100%" rx="10" fill="#0f172a"/>
  <text x="20" y="24" fill="#ef4444" font-size="13" font-weight="bold">deleteHead: Deleting first node &amp; updating prev pointer</text>

  <!-- Old Head (Deleted) -->
  <g transform="translate(50, 45)">
    <rect width="120" height="65" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="60" y="-8" fill="#ef4444" font-size="11" font-weight="bold" text-anchor="middle">OLD HEAD (delete)</text>
    <text x="60" y="40" fill="#fca5a5" font-size="18" font-weight="bold" text-anchor="middle">val: 1</text>
    <line x1="20" y1="15" x2="100" y2="50" stroke="#ef4444" stroke-width="2.5"/>
    <line x1="100" y1="15" x2="20" y2="50" stroke="#ef4444" stroke-width="2.5"/>
  </g>

  <!-- Broken Links -->
  <line x1="180" y1="70" x2="280" y2="70" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>
  <line x1="280" y1="90" x2="180" y2="90" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- New Head -->
  <g transform="translate(290, 45)">
    <rect width="130" height="65" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="65" y="-8" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">NEW HEAD (prev=null)</text>
    <line x1="40" y1="0" x2="40" y2="65" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="38" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">NULL</text>
    <text x="85" y="40" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">val: 2</text>
  </g>

  <!-- Next node -->
  <path d="M 425 75 L 515 75" stroke="#38bdf8" stroke-width="2" marker-end="url(#delR)"/>
  <g transform="translate(520, 45)">
    <rect width="120" height="65" rx="8" fill="#1e293b" stroke="#475569"/>
    <text x="60" y="40" fill="#f8fafc" font-size="18" font-weight="bold" text-anchor="middle">val: 3</text>
  </g>
  <text x="380" y="145" fill="#94a3b8" font-size="11" text-anchor="middle">Time: O(1) | Space: O(1) — Remember to set newHead->prev = nullptr before deleting old head.</text>
</svg>
