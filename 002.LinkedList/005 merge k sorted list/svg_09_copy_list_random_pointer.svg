<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow9" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowNext9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowRandom9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowCopyRandom9" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="950" height="580" rx="16" fill="url(#bgGrad9)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad9)" filter="url(#shadow9)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Question 11: Copy List with Random Pointer (O(1) Auxiliary Space)</text>
  <rect x="760" y="35" width="140" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="830" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">LeetCode 138 [Medium]</text>

  <!-- Pass 1: Interweave Nodes -->
  <g transform="translate(30, 95)">
    <rect width="890" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Pass 1: Interweave Cloned Nodes (curr.next = copyNode)</text>

    <g transform="translate(40, 50)">
      <!-- Node A -->
      <rect x="0" y="0" width="45" height="38" rx="8" fill="url(#blueGrad9)"/>
      <text x="22" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7</text>
      <text x="22" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">orig A</text>

      <line x1="50" y1="19" x2="80" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <!-- Node A' (Copy) -->
      <rect x="90" y="0" width="45" height="38" rx="8" fill="url(#emeraldGrad9)"/>
      <text x="112" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">7'</text>
      <text x="112" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">copy A'</text>

      <line x1="140" y1="19" x2="170" y2="19" stroke="#34d399" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <!-- Node B -->
      <rect x="180" y="0" width="45" height="38" rx="8" fill="url(#blueGrad9)"/>
      <text x="202" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">13</text>
      <text x="202" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">orig B</text>

      <line x1="230" y1="19" x2="260" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <!-- Node B' -->
      <rect x="270" y="0" width="45" height="38" rx="8" fill="url(#emeraldGrad9)"/>
      <text x="292" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">13'</text>
      <text x="292" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">copy B'</text>

      <line x1="320" y1="19" x2="350" y2="19" stroke="#34d399" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <!-- Node C -->
      <rect x="360" y="0" width="45" height="38" rx="8" fill="url(#blueGrad9)"/>
      <text x="382" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">11</text>
      <text x="382" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">orig C</text>

      <line x1="410" y1="19" x2="440" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <!-- Node C' -->
      <rect x="450" y="0" width="45" height="38" rx="8" fill="url(#emeraldGrad9)"/>
      <text x="472" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">11'</text>
      <text x="472" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">copy C'</text>
    </g>

    <rect x="580" y="45" width="280" height="65" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="595" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Interweaving Loop:</text>
    <text x="595" y="86" font-family="Consolas, monospace" font-size="11" fill="#34d399">copy.next = curr.next;</text>
    <text x="595" y="100" font-family="Consolas, monospace" font-size="11" fill="#34d399">curr.next = copy;</text>
  </g>

  <!-- Pass 2: Set Random Pointers -->
  <g transform="translate(30, 240)">
    <rect width="890" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Pass 2: Point Copy's Random: copy.random = curr.random.next</text>
    <text x="20" y="45" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">If orig B.random points to orig A (7), then copy B'.random directly points to A.next which is copy A' (7')!</text>

    <!-- Curved Random Arrow visualization -->
    <g transform="translate(40, 60)">
      <!-- Orig A (7) and Copy A' (7') -->
      <rect x="0" y="20" width="45" height="35" rx="6" fill="url(#blueGrad9)"/>
      <text x="22" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7</text>

      <rect x="70" y="20" width="45" height="35" rx="6" fill="url(#emeraldGrad9)"/>
      <text x="92" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">7'</text>

      <!-- Orig B (13) and Copy B' (13') -->
      <rect x="180" y="20" width="45" height="35" rx="6" fill="url(#blueGrad9)"/>
      <text x="202" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">13</text>

      <rect x="250" y="20" width="45" height="35" rx="6" fill="url(#emeraldGrad9)"/>
      <text x="272" y="42" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">13'</text>

      <!-- Orig random: 13 -> 7 -->
      <path d="M 202 20 C 150 -15, 60 -15, 22 15" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="3" marker-end="url(#arrowRandom9)"/>
      <text x="110" y="5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fbbf24">orig.random</text>

      <!-- Cloned random: 13' -> 7' -->
      <path d="M 272 55 C 220 85, 130 85, 92 60" fill="none" stroke="#34d399" stroke-width="2.5" marker-end="url(#arrowCopyRandom9)"/>
      <text x="180" y="80" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399">copy.random = curr.random.next</text>
    </g>
  </g>

  <!-- Pass 3: Separate Lists -->
  <g transform="translate(30, 405)">
    <rect width="890" height="150" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">Pass 3: Unweave &amp; Restore Original List (curr.next = curr.next.next)</text>

    <g transform="translate(40, 50)">
      <!-- Restored Original -->
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Original Restored: </text>
      <rect x="130" y="5" width="35" height="28" rx="6" fill="url(#blueGrad9)"/>
      <text x="147" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
      <line x1="168" y1="19" x2="202" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <rect x="205" y="5" width="35" height="28" rx="6" fill="url(#blueGrad9)"/>
      <text x="222" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">13</text>
      <line x1="243" y1="19" x2="277" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext9)"/>

      <rect x="280" y="5" width="35" height="28" rx="6" fill="url(#blueGrad9)"/>
      <text x="297" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11</text>

      <!-- Deep Copied Result -->
      <g transform="translate(0, 45)">
        <text x="0" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Deep Copy Cloned: </text>
        <rect x="130" y="5" width="35" height="28" rx="6" fill="url(#emeraldGrad9)"/>
        <text x="147" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7'</text>
        <line x1="168" y1="19" x2="202" y2="19" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCopyRandom9)"/>

        <rect x="205" y="5" width="35" height="28" rx="6" fill="url(#emeraldGrad9)"/>
        <text x="222" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">13'</text>
        <line x1="243" y1="19" x2="277" y2="19" stroke="#34d399" stroke-width="2" marker-end="url(#arrowCopyRandom9)"/>

        <rect x="280" y="5" width="35" height="28" rx="6" fill="url(#emeraldGrad9)"/>
        <text x="297" y="23" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">11'</text>
      </g>
    </g>

    <text x="580" y="115" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1"><tspan font-weight="700" fill="#34d399">Optimal Complexity:</tspan> O(N) Time | O(1) Extra Space</text>
  </g>
</svg>
