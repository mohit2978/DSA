<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow5" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowPurple5" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc"/>
    </marker>
  </defs>

  <rect width="950" height="560" rx="16" fill="url(#bgGrad5)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad5)" filter="url(#shadow5)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Question 5: Reverse Linked List II (Between Left and Right)</text>
  <rect x="760" y="35" width="140" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="830" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">LeetCode 92 [Medium]</text>

  <!-- Section 1: Initial Setup with Dummy Sentinel -->
  <g transform="translate(30, 95)">
    <rect width="890" height="130" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Step 1: Setup Dummy Node &amp; Walk 'prev' to (left - 1)</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Example: List = [1, 2, 3, 4, 5], left = 2, right = 4 (reverse subsegment [2, 3, 4])</text>

    <!-- Nodes -->
    <g transform="translate(30, 65)">
      <!-- Dummy -->
      <rect x="0" y="0" width="45" height="38" rx="8" fill="#475569"/>
      <text x="22" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">-1</text>
      <text x="22" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">dummy</text>

      <line x1="50" y1="19" x2="85" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow5)"/>

      <!-- Node 1 (prev) -->
      <rect x="95" y="0" width="45" height="38" rx="8" fill="url(#blueGrad5)"/>
      <text x="117" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="117" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">prev</text>

      <line x1="145" y1="19" x2="180" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow5)"/>

      <!-- Subsegment [2, 3, 4] highlighted -->
      <rect x="180" y="-8" width="220" height="54" rx="8" fill="#c084fc" fill-opacity="0.1" stroke="#c084fc" stroke-dasharray="4"/>

      <!-- Node 2 -->
      <rect x="190" y="0" width="45" height="38" rx="8" fill="url(#purpleGrad5)"/>
      <text x="212" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="212" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">curr (left)</text>

      <line x1="240" y1="19" x2="275" y2="19" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple5)"/>

      <!-- Node 3 -->
      <rect x="285" y="0" width="45" height="38" rx="8" fill="url(#purpleGrad5)"/>
      <text x="307" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>

      <line x1="335" y1="19" x2="370" y2="19" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple5)"/>

      <!-- Node 4 -->
      <rect x="380" y="0" width="45" height="38" rx="8" fill="url(#purpleGrad5)"/>
      <text x="402" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="402" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">right</text>

      <line x1="430" y1="19" x2="465" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow5)"/>

      <!-- Node 5 -->
      <rect x="475" y="0" width="45" height="38" rx="8" fill="url(#blueGrad5)"/>
      <text x="497" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="497" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">forward</text>
    </g>

    <!-- Rationale callout -->
    <rect x="590" y="45" width="280" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="605" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Why Dummy Node is Essential:</text>
    <text x="605" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">If left = 1, the head itself is reversed.</text>
    <text x="605" y="102" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Dummy ensures prev is always non-null!</text>
  </g>

  <!-- Section 2: Reversing Subsegment & Stitching -->
  <g transform="translate(30, 240)">
    <rect width="890" height="155" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Step 2: Reverse Subsegment &amp; Reattach Pointers</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Sublist [2, 3, 4] reversed to [4, 3, 2] (th = 4, tt = 2). Connect: prev.next = th; tt.next = curr;</text>

    <g transform="translate(30, 70)">
      <!-- prev (1) -->
      <rect x="0" y="0" width="45" height="38" rx="8" fill="url(#blueGrad5)"/>
      <text x="22" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <text x="22" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">prev</text>

      <!-- Stitch 1: prev.next = th -->
      <line x1="50" y1="19" x2="110" y2="19" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen5)"/>
      <text x="80" y="10" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">prev.next</text>

      <!-- Reversed: 4 -> 3 -> 2 -->
      <rect x="120" y="0" width="45" height="38" rx="8" fill="url(#purpleGrad5)"/>
      <text x="142" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <text x="142" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">th (new sub-head)</text>

      <line x1="170" y1="19" x2="205" y2="19" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple5)"/>

      <rect x="215" y="0" width="45" height="38" rx="8" fill="url(#purpleGrad5)"/>
      <text x="237" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>

      <line x1="265" y1="19" x2="300" y2="19" stroke="#c084fc" stroke-width="2" marker-end="url(#arrowPurple5)"/>

      <rect x="310" y="0" width="45" height="38" rx="8" fill="url(#purpleGrad5)"/>
      <text x="332" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="332" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc" text-anchor="middle">tt (new sub-tail)</text>

      <!-- Stitch 2: tt.next = curr -->
      <line x1="360" y1="19" x2="420" y2="19" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen5)"/>
      <text x="390" y="10" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">tt.next</text>

      <!-- Node 5 -->
      <rect x="430" y="0" width="45" height="38" rx="8" fill="url(#blueGrad5)"/>
      <text x="452" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <text x="452" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">curr</text>

      <line x1="480" y1="19" x2="515" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow5)"/>

      <rect x="525" y="0" width="55" height="38" rx="8" fill="#334155"/>
      <text x="552" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">NULL</text>
    </g>
  </g>

  <!-- Section 3: Final Output -->
  <g transform="translate(30, 410)">
    <rect width="890" height="125" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">Final Output: return dummy.next</text>
    
    <g transform="translate(40, 50)">
      <text x="0" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#cbd5e1">Result List: </text>
      
      <rect x="90" y="0" width="40" height="35" rx="6" fill="url(#emeraldGrad5)"/>
      <text x="110" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1</text>
      <line x1="135" y1="18" x2="165" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen5)"/>

      <rect x="175" y="0" width="40" height="35" rx="6" fill="url(#emeraldGrad5)"/>
      <text x="195" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4</text>
      <line x1="220" y1="18" x2="250" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen5)"/>

      <rect x="260" y="0" width="40" height="35" rx="6" fill="url(#emeraldGrad5)"/>
      <text x="280" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
      <line x1="305" y1="18" x2="335" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen5)"/>

      <rect x="345" y="0" width="40" height="35" rx="6" fill="url(#emeraldGrad5)"/>
      <text x="365" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <line x1="390" y1="18" x2="420" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen5)"/>

      <rect x="430" y="0" width="40" height="35" rx="6" fill="url(#emeraldGrad5)"/>
      <text x="450" y="22" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <line x1="475" y1="18" x2="505" y2="18" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen5)"/>

      <rect x="515" y="0" width="55" height="35" rx="6" fill="#334155"/>
      <text x="542" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">NULL</text>
    </g>

    <text x="20" y="108" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Complexity: Single pass O(N) Time | O(1) Auxiliary Space</text>
  </g>
</svg>
