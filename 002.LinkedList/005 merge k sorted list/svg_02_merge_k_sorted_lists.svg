<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 580" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow2" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowAmber2" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="950" height="580" rx="16" fill="url(#bgGrad2)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad2)" filter="url(#shadow2)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Question 2: Merge K Sorted Lists (Divide &amp; Conquer vs Priority Queue)</text>
  <rect x="760" y="35" width="140" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="830" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">LeetCode 23 [Hard]</text>

  <!-- Left Column: Approach 1 (Linear) vs Approach 2 (Divide & Conquer) -->
  <g transform="translate(30, 95)">
    <!-- Divide and Conquer Box -->
    <rect width="520" height="455" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">Approach: Divide &amp; Conquer Tournament Tree</text>
    <text x="20" y="52" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Pairwise merge reduces height to log(K) levels, total time O(N * log K)</text>

    <!-- Level 0 (K lists) -->
    <g transform="translate(25, 75)">
      <rect x="0" y="0" width="95" height="35" rx="6" fill="url(#blueGrad2)"/>
      <text x="47" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">List 0 [1,4,5]</text>

      <rect x="125" y="0" width="95" height="35" rx="6" fill="url(#blueGrad2)"/>
      <text x="172" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">List 1 [1,3,4]</text>

      <rect x="250" y="0" width="95" height="35" rx="6" fill="url(#blueGrad2)"/>
      <text x="297" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">List 2 [2,6]</text>

      <rect x="375" y="0" width="95" height="35" rx="6" fill="url(#blueGrad2)"/>
      <text x="422" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">List 3 [0,8]</text>
    </g>

    <!-- Arrows to Level 1 -->
    <line x1="72" y1="115" x2="135" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="197" y1="115" x2="135" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>

    <line x1="322" y1="115" x2="385" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="447" y1="115" x2="385" y2="155" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- Level 1 (K/2 merged lists) -->
    <g transform="translate(25, 160)">
      <rect x="40" y="0" width="180" height="40" rx="8" fill="url(#purpleGrad2)"/>
      <text x="130" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Merged (L0 + L1)</text>

      <rect x="290" y="0" width="180" height="40" rx="8" fill="url(#purpleGrad2)"/>
      <text x="380" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Merged (L2 + L3)</text>
    </g>

    <!-- Arrows to Level 2 (Final) -->
    <line x1="155" y1="205" x2="260" y2="250" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow2)"/>
    <line x1="405" y1="205" x2="260" y2="250" stroke="#c084fc" stroke-width="2" marker-end="url(#arrow2)"/>

    <!-- Final Level -->
    <g transform="translate(25, 255)">
      <rect x="110" y="0" width="250" height="45" rx="8" fill="url(#emeraldGrad2)"/>
      <text x="235" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Final Combined Sorted List</text>
    </g>

    <!-- Recurrence Formula Callout -->
    <rect x="25" y="325" width="470" height="110" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="40" y="352" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fbbf24">Recurrence Relation Analysis:</text>
    <text x="40" y="375" font-family="Consolas, monospace" font-size="12" fill="#38bdf8">T(K) = 2 * T(K / 2) + (Total Nodes N)</text>
    <text x="40" y="398" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">Levels = log2(K) | Work per level = O(N)</text>
    <text x="40" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Total Time Complexity = O(N * log K) vs Brute Force O(N * K)</text>
  </g>

  <!-- Right Column: Priority Queue Approach & Comparison -->
  <g transform="translate(570, 95)">
    <rect width="350" height="455" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="32" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">Alternative: Min-Heap (PQ)</text>

    <!-- Min Heap Illustration -->
    <g transform="translate(20, 50)">
      <rect width="310" height="140" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">PriorityQueue (size &lt;= K)</text>
      
      <!-- Heap nodes -->
      <circle cx="155" cy="55" r="18" fill="url(#amberGrad2)"/>
      <text x="155" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text>

      <circle cx="95" cy="100" r="16" fill="url(#blueGrad2)"/>
      <text x="95" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>

      <circle cx="215" cy="100" r="16" fill="url(#blueGrad2)"/>
      <text x="215" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>

      <text x="155" y="130" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">Extract Min -&gt; attach to result -&gt; push node.next</text>
    </g>

    <!-- Comparison Table -->
    <g transform="translate(20, 205)">
      <text x="5" y="18" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Approach Comparison Table</text>
      
      <rect x="0" y="30" width="310" height="195" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      
      <!-- Header -->
      <rect x="0" y="30" width="310" height="30" rx="8" fill="#334155"/>
      <text x="10" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Approach</text>
      <text x="140" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Time</text>
      <text x="230" y="50" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Space</text>

      <!-- Row 1 -->
      <text x="10" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">1. Linear Merge</text>
      <text x="140" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">O(N * K)</text>
      <text x="230" y="85" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">O(1)</text>

      <!-- Row 2 -->
      <text x="10" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">2. Divide &amp; Conquer</text>
      <text x="140" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">O(N log K)</text>
      <text x="230" y="125" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">O(log K)</text>

      <!-- Row 3 -->
      <text x="10" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">3. Min-Heap (PQ)</text>
      <text x="140" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">O(N log K)</text>
      <text x="230" y="165" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">O(K)</text>

      <!-- Row 4 -->
      <text x="10" y="205" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">Verdict: D&amp;C / PQ</text>
      <text x="140" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Optimal</text>
      <text x="230" y="205" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Scalable</text>
    </g>
  </g>
</svg>
