<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrowNext" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowChild" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowFlat" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="950" height="560" rx="16" fill="url(#bgGrad3)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad3)" filter="url(#shadow3)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Question 3: Flattening a Multilevel Linked List</text>
  <rect x="740" y="35" width="160" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="820" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">GFG / LC 430 Variant</text>

  <!-- Left Side: 2D Grid Structure -->
  <g transform="translate(30, 95)">
    <rect width="420" height="440" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Original 2D Linked List (next + child pointers)</text>

    <!-- Legend -->
    <g transform="translate(20, 45)">
      <line x1="0" y1="10" x2="25" y2="10" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext)"/>
      <text x="32" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">next pointer</text>

      <line x1="120" y1="10" x2="145" y2="10" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
      <text x="152" y="14" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">child pointer (sorted)</text>
    </g>

    <!-- Column 1 (Head = 5) -->
    <rect x="30" y="80" width="45" height="40" rx="8" fill="url(#blueGrad3)"/>
    <text x="52" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">5</text>
    
    <line x1="52" y1="120" x2="52" y2="155" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="30" y="160" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="52" y="185" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">7</text>

    <line x1="52" y1="200" x2="52" y2="235" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="30" y="240" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="52" y="265" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">8</text>

    <line x1="52" y1="280" x2="52" y2="315" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="30" y="320" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="52" y="345" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">30</text>

    <!-- Next arrow from 5 to 10 -->
    <line x1="75" y1="100" x2="115" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext)"/>

    <!-- Column 2 (10) -->
    <rect x="125" y="80" width="45" height="40" rx="8" fill="url(#blueGrad3)"/>
    <text x="147" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">10</text>

    <line x1="147" y1="120" x2="147" y2="155" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="125" y="160" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="147" y="185" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">20</text>

    <!-- Next arrow from 10 to 19 -->
    <line x1="170" y1="100" x2="210" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext)"/>

    <!-- Column 3 (19) -->
    <rect x="220" y="80" width="45" height="40" rx="8" fill="url(#blueGrad3)"/>
    <text x="242" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">19</text>

    <line x1="242" y1="120" x2="242" y2="155" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="220" y="160" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="242" y="185" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">22</text>

    <line x1="242" y1="200" x2="242" y2="235" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="220" y="240" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="242" y="265" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">50</text>

    <!-- Next arrow from 19 to 28 -->
    <line x1="265" y1="100" x2="305" y2="100" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowNext)"/>

    <!-- Column 4 (28) -->
    <rect x="315" y="80" width="45" height="40" rx="8" fill="url(#blueGrad3)"/>
    <text x="337" y="105" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">28</text>

    <line x1="337" y1="120" x2="337" y2="155" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="315" y="160" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="337" y="185" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">35</text>

    <line x1="337" y1="200" x2="337" y2="235" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="315" y="240" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="337" y="265" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">40</text>

    <line x1="337" y1="280" x2="337" y2="315" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowChild)"/>
    <rect x="315" y="320" width="45" height="40" rx="8" fill="url(#amberGrad3)"/>
    <text x="337" y="345" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">45</text>

    <!-- Important note on setting next to null -->
    <rect x="20" y="380" width="380" height="45" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="35" y="400" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">CRITICAL RULE:</text>
    <text x="35" y="415" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">During merge, set res.next = null to remove horizontal ghost pointers!</text>
  </g>

  <!-- Right Side: Flattened Result & Strategy -->
  <g transform="translate(470, 95)">
    <!-- Result Box -->
    <rect width="450" height="190" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="30" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">Flattened Single Sorted List (via child pointers)</text>

    <!-- Horizontal depiction of flattened list -->
    <g transform="translate(20, 50)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="16" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <line x1="32" y1="15" x2="48" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="52" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="68" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">7</text>
      <line x1="84" y1="15" x2="100" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="104" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="120" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">8</text>
      <line x1="136" y1="15" x2="152" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="156" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="172" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text>
      <line x1="188" y1="15" x2="204" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="208" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="224" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">19</text>
      <line x1="240" y1="15" x2="256" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="260" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="276" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">20</text>
      <line x1="292" y1="15" x2="308" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="312" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="328" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">22</text>
      <line x1="344" y1="15" x2="360" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

      <rect x="364" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
      <text x="380" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">28</text>

      <!-- Row 2 -->
      <g transform="translate(0, 45)">
        <text x="0" y="20" font-family="system-ui, sans-serif" font-size="14" fill="#34d399">...</text>
        <line x1="20" y1="15" x2="36" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

        <rect x="40" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
        <text x="56" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">30</text>
        <line x1="72" y1="15" x2="88" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

        <rect x="92" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
        <text x="108" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">35</text>
        <line x1="124" y1="15" x2="140" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

        <rect x="144" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
        <text x="160" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">40</text>
        <line x1="176" y1="15" x2="192" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

        <rect x="196" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
        <text x="212" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">45</text>
        <line x1="228" y1="15" x2="244" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

        <rect x="248" y="0" width="32" height="30" rx="6" fill="url(#emeraldGrad3)"/>
        <text x="264" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">50</text>
        <line x1="280" y1="15" x2="296" y2="15" stroke="#34d399" stroke-width="2" marker-end="url(#arrowFlat)"/>

        <rect x="300" y="0" width="55" height="30" rx="6" fill="#334155"/>
        <text x="327" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8" text-anchor="middle">NULL</text>
      </g>
    </g>

    <!-- Strategy Comparison Box -->
    <rect x="0" y="205" width="450" height="235" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="232" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Two Implementations Explained</text>

    <g transform="translate(20, 248)">
      <rect width="410" height="70" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Linear Recursion (Right to Left):</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">head = merge(head, flattenLinkedList(head.next));</text>
      <text x="15" y="58" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">Time: O(N * K^2) | Space: O(K) recursion stack</text>
    </g>

    <g transform="translate(20, 328)">
      <rect width="410" height="70" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">2. Divide &amp; Conquer (Merge Sort Style):</text>
      <text x="15" y="42" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Collect column heads in vector -&gt; pairwise merge tree</text>
      <text x="15" y="58" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Time: O(N * K log K) | Space: O(log K) stack (Senior Interview Win!)</text>
    </g>
  </g>
</svg>
