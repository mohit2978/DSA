<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="redGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="emeraldGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow7" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowRed7" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171"/>
    </marker>
  </defs>

  <rect width="950" height="560" rx="16" fill="url(#bgGrad7)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad7)" filter="url(#shadow7)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Question 7: Sort Linked List Already Sorted by Absolute Values</text>
  <rect x="740" y="35" width="160" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="820" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">LeetCode 2046 [Medium]</text>

  <!-- Step 1: Input List & Property -->
  <g transform="translate(30, 95)">
    <rect width="890" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">Key Insight: Absolute Order Property</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Input: [0, 2, -5, 5, 10, -10]. As absolute values increase, earlier negatives (-5) are greater than later negatives (-10).</text>

    <!-- Node stream -->
    <g transform="translate(40, 68)">
      <rect x="0" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="22" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text>
      <line x1="50" y1="19" x2="80" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="90" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="112" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <line x1="140" y1="19" x2="170" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="180" y="0" width="45" height="38" rx="8" fill="url(#redGrad7)"/>
      <text x="202" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">-5</text>
      <line x1="230" y1="19" x2="260" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="270" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="292" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <line x1="320" y1="19" x2="350" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="360" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="382" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10</text>
      <line x1="410" y1="19" x2="440" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="450" y="0" width="45" height="38" rx="8" fill="url(#redGrad7)"/>
      <text x="472" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">-10</text>
    </g>

    <rect x="580" y="55" width="280" height="60" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="595" y="76" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">In-Place Insertion Trick:</text>
    <text x="595" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Detaching negative nodes and prepending (addFirst) naturally sorts them ascendingly!</text>
  </g>

  <!-- Step 2: Single Pass Pointer Rewiring -->
  <g transform="translate(30, 245)">
    <rect width="890" height="150" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">Step 2: Single Pass Move Negatives to Head</text>

    <!-- Visual of moving -10, -5 to front -->
    <g transform="translate(40, 60)">
      <!-- Negatives in front -->
      <rect x="0" y="0" width="45" height="38" rx="8" fill="url(#redGrad7)"/>
      <text x="22" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">-10</text>
      <text x="22" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">th (head)</text>

      <line x1="50" y1="19" x2="80" y2="19" stroke="#f87171" stroke-width="2" marker-end="url(#arrowRed7)"/>

      <rect x="90" y="0" width="45" height="38" rx="8" fill="url(#redGrad7)"/>
      <text x="112" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">-5</text>
      <text x="112" y="52" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">tt (tail of -ve)</text>

      <!-- Bridge link to non-negative list -->
      <line x1="140" y1="19" x2="200" y2="19" stroke="#34d399" stroke-width="3" marker-end="url(#arrowGreen7)"/>
      <text x="170" y="10" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">tt.next</text>

      <!-- Non-negatives -->
      <rect x="210" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="232" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text>
      <line x1="260" y1="19" x2="290" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="300" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="322" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <line x1="350" y1="19" x2="380" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="390" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="412" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
      <line x1="440" y1="19" x2="470" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>

      <rect x="480" y="0" width="45" height="38" rx="8" fill="url(#blueGrad7)"/>
      <text x="502" y="24" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">10</text>

      <line x1="530" y1="19" x2="560" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow7)"/>
      <rect x="570" y="0" width="55" height="38" rx="8" fill="#334155"/>
      <text x="597" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94a3b8" text-anchor="middle">NULL</text>
    </g>
  </g>

  <!-- Step 3: Final Comparison -->
  <g transform="translate(30, 410)">
    <rect width="890" height="125" rx="12" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">Final Sorted Output: [-10, -5, 0, 2, 5, 10]</text>
    <text x="20" y="55" font-family="system-ui, sans-serif" font-size="12" fill="#e2e8f0">&#x2714; Merge Sort Approach: O(N log N) Time | O(log N) Space</text>
    <text x="20" y="78" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">&#x2714; Absolute-Property In-Place Approach: O(N) Time | O(1) Extra Space (Optimal!)</text>
  </g>
</svg>
