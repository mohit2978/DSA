<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 10; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #58a6ff; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #f0883e; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; }
      .dummy-box { fill: #21262d; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 4,3; rx: 6; }
      .node-0 { fill: #1e3a8a; stroke: #3b82f6; stroke-width: 1.5; rx: 6; }
      .node-1 { fill: #065f46; stroke: #10b981; stroke-width: 1.5; rx: 6; }
      .node-2 { fill: #7c2d12; stroke: #f97316; stroke-width: 1.5; rx: 6; }
      .node-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .node-next { fill: #0d1117; stroke: #30363d; stroke-width: 1; }
      .ptr-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #c9d1d9; }
      .code-snippet { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #7ee787; }
    </style>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
    <marker id="arrow-connect" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#eab308" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="860" class="bg" />

  <!-- Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" class="header-title">Sort a Linked List of 0s, 1s, and 2s (Dutch National Flag for Linked List)</text>
    <text x="0" y="24" class="sub-title">Optimal Single-Pass O(N) In-Place Pointer Partitioning with 3 Dummy Sentinel Nodes</text>
  </g>

  <!-- Panel 1: Original List Distribution -->
  <g transform="translate(30, 75)">
    <rect width="1040" height="150" class="card" />
    <text x="25" y="30" class="step-title">1. Input Linked List: [ 1 ➔ 2 ➔ 0 ➔ 1 ➔ 2 ➔ 0 ➔ 1 ]</text>
    
    <g transform="translate(35, 60)">
      <!-- Node 1 -->
      <g transform="translate(0, 0)">
        <rect width="45" height="32" class="node-1"/><text x="22.5" y="21" class="node-val">1</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="105" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 2 -->
      <g transform="translate(110, 0)">
        <rect width="45" height="32" class="node-2"/><text x="22.5" y="21" class="node-val">2</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="105" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 0 -->
      <g transform="translate(220, 0)">
        <rect width="45" height="32" class="node-0"/><text x="22.5" y="21" class="node-val">0</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="105" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 1 -->
      <g transform="translate(330, 0)">
        <rect width="45" height="32" class="node-1"/><text x="22.5" y="21" class="node-val">1</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="105" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 2 -->
      <g transform="translate(440, 0)">
        <rect width="45" height="32" class="node-2"/><text x="22.5" y="21" class="node-val">2</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="105" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 0 -->
      <g transform="translate(550, 0)">
        <rect width="45" height="32" class="node-0"/><text x="22.5" y="21" class="node-val">0</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="105" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 1 -->
      <g transform="translate(660, 0)">
        <rect width="45" height="32" class="node-1"/><text x="22.5" y="21" class="node-val">1</text>
        <rect x="45" width="18" height="32" class="node-next"/><circle cx="54" cy="16" r="2.5" fill="#8b949e"/>
        <line x1="63" y1="16" x2="95" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <text x="105" y="20" class="desc-text" fill="#8b949e">null</text>
      </g>
    </g>
    <text x="25" y="125" class="desc-text">Traverse once: distribute each node into one of three buckets based on <tspan fill="#7ee787" font-family="monospace">curr.val</tspan>.</text>
  </g>

  <!-- Panel 2: 3-Bucket Dummy Segregation -->
  <g transform="translate(30, 245)">
    <rect width="1040" height="290" class="card" />
    <text x="25" y="30" class="step-title">2. Distribution into 3 Separate Chains (Using 3 Dummy Heads)</text>

    <!-- Bucket 0 -->
    <g transform="translate(35, 50)">
      <text x="0" y="22" class="ptr-text" fill="#3b82f6">0s Bucket:</text>
      <!-- Dummy 0 -->
      <g transform="translate(90, 0)">
        <rect width="65" height="30" class="dummy-box"/><text x="32.5" y="20" class="node-val" font-size="11" fill="#8b949e">dummy0</text>
        <line x1="65" y1="15" x2="95" y2="15" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 0 -->
      <g transform="translate(190, 0)">
        <rect width="45" height="30" class="node-0"/><text x="22.5" y="20" class="node-val">0</text>
        <line x1="45" y1="15" x2="75" y2="15" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- Node 0 -->
      <g transform="translate(270, 0)">
        <rect width="45" height="30" class="node-0"/><text x="22.5" y="20" class="node-val">0</text>
        <text x="22.5" y="44" class="ptr-text" fill="#3b82f6">zero (tail0)</text>
      </g>
    </g>

    <!-- Bucket 1 -->
    <g transform="translate(35, 120)">
      <text x="0" y="22" class="ptr-text" fill="#10b981">1s Bucket:</text>
      <!-- Dummy 1 -->
      <g transform="translate(90, 0)">
        <rect width="65" height="30" class="dummy-box"/><text x="32.5" y="20" class="node-val" font-size="11" fill="#8b949e">dummy1</text>
        <line x1="65" y1="15" x2="95" y2="15" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- Node 1 -->
      <g transform="translate(190, 0)">
        <rect width="45" height="30" class="node-1"/><text x="22.5" y="20" class="node-val">1</text>
        <line x1="45" y1="15" x2="75" y2="15" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- Node 1 -->
      <g transform="translate(270, 0)">
        <rect width="45" height="30" class="node-1"/><text x="22.5" y="20" class="node-val">1</text>
        <line x1="45" y1="15" x2="75" y2="15" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- Node 1 -->
      <g transform="translate(350, 0)">
        <rect width="45" height="30" class="node-1"/><text x="22.5" y="20" class="node-val">1</text>
        <text x="22.5" y="44" class="ptr-text" fill="#10b981">one (tail1)</text>
      </g>
    </g>

    <!-- Bucket 2 -->
    <g transform="translate(35, 190)">
      <text x="0" y="22" class="ptr-text" fill="#f97316">2s Bucket:</text>
      <!-- Dummy 2 -->
      <g transform="translate(90, 0)">
        <rect width="65" height="30" class="dummy-box"/><text x="32.5" y="20" class="node-val" font-size="11" fill="#8b949e">dummy2</text>
        <line x1="65" y1="15" x2="95" y2="15" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
      </g>
      <!-- Node 2 -->
      <g transform="translate(190, 0)">
        <rect width="45" height="30" class="node-2"/><text x="22.5" y="20" class="node-val">2</text>
        <line x1="45" y1="15" x2="75" y2="15" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
      </g>
      <!-- Node 2 -->
      <g transform="translate(270, 0)">
        <rect width="45" height="30" class="node-2"/><text x="22.5" y="20" class="node-val">2</text>
        <text x="22.5" y="44" class="ptr-text" fill="#f97316">two (tail2)</text>
      </g>
    </g>

    <g transform="translate(560, 50)">
      <rect width="440" height="190" fill="#0d1117" stroke="#30363d" rx="8"/>
      <text x="20" y="30" class="step-title" fill="#eab308">⚡ Critical Re-linking Logic</text>
      <text x="20" y="60" class="code-snippet">// 1. zero bucket connects to 1s or 2s:</text>
      <text x="20" y="82" class="code-snippet">zero.next = (oneHead.next != null) ?</text>
      <text x="120" y="102" class="code-snippet">oneHead.next : twoHead.next;</text>
      <text x="20" y="130" class="code-snippet">// 2. one bucket connects to 2s:</text>
      <text x="20" y="152" class="code-snippet">one.next = twoHead.next;</text>
      <text x="20" y="176" class="code-snippet">// 3. terminate two bucket:</text>
      <text x="20" y="196" class="code-snippet">two.next = null;</text>
    </g>
  </g>

  <!-- Panel 3: Final Merged Output -->
  <g transform="translate(30, 555)">
    <rect width="1040" height="270" class="card" />
    <text x="25" y="30" class="step-title">3. Final In-Place Sorted List: [ 0 ➔ 0 ➔ 1 ➔ 1 ➔ 1 ➔ 2 ➔ 2 ➔ null ]</text>

    <g transform="translate(35, 60)">
      <!-- 0 -->
      <g transform="translate(0, 0)">
        <rect width="45" height="32" class="node-0"/><text x="22.5" y="21" class="node-val">0</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
      </g>
      <!-- 0 -->
      <g transform="translate(90, 0)">
        <rect width="45" height="32" class="node-0"/><text x="22.5" y="21" class="node-val">0</text>
        <line x1="45" y1="16" x2="95" y2="16" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-connect)"/>
      </g>
      <!-- 1 -->
      <g transform="translate(190, 0)">
        <rect width="45" height="32" class="node-1"/><text x="22.5" y="21" class="node-val">1</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- 1 -->
      <g transform="translate(280, 0)">
        <rect width="45" height="32" class="node-1"/><text x="22.5" y="21" class="node-val">1</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- 1 -->
      <g transform="translate(370, 0)">
        <rect width="45" height="32" class="node-1"/><text x="22.5" y="21" class="node-val">1</text>
        <line x1="45" y1="16" x2="95" y2="16" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-connect)"/>
      </g>
      <!-- 2 -->
      <g transform="translate(470, 0)">
        <rect width="45" height="32" class="node-2"/><text x="22.5" y="21" class="node-val">2</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#f97316" stroke-width="1.5" marker-end="url(#arrow-orange)"/>
      </g>
      <!-- 2 -->
      <g transform="translate(560, 0)">
        <rect width="45" height="32" class="node-2"/><text x="22.5" y="21" class="node-val">2</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-blue)"/>
        <text x="95" y="20" class="desc-text" fill="#8b949e">null</text>
      </g>
    </g>

    <g transform="translate(25, 120)">
      <text x="0" y="15" class="header-title" fill="#38bdf8" font-size="15">💡 Why Pointer Manipulation Beats Value Overwriting (Brute Force):</text>
      <text x="0" y="40" class="desc-text">1. <tspan fill="#7ee787" font-weight="700">Single Pass:</tspan> Brute force requires 2 passes (1st pass counting frequencies, 2nd pass overwriting data). Pointer re-linking takes only 1 pass (O(N) time).</text>
      <text x="0" y="65" class="desc-text">2. <tspan fill="#7ee787" font-weight="700">Stability &amp; Object Integrity:</tspan> In real-world systems, nodes contain heavy payload objects. Overwriting integers is disallowed if node addresses or attached metadata must be preserved!</text>
      <text x="0" y="90" class="desc-text">3. <tspan fill="#7ee787" font-weight="700">O(1) Auxiliary Space:</tspan> Only uses 3 lightweight stack pointer pairs, avoiding any list copy or extra buffer.</text>
    </g>
  </g>
</svg>
