<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .card { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 10; }
      .header-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 20px; font-weight: 700; fill: #58a6ff; }
      .step-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 15px; font-weight: 700; fill: #38bdf8; }
      .sub-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 13px; font-weight: 600; fill: #8b949e; }
      .node-even { fill: #065f46; stroke: #34d399; stroke-width: 1.5; rx: 6; }
      .node-odd { fill: #831843; stroke: #f472b6; stroke-width: 1.5; rx: 6; }
      .dummy-node { fill: #21262d; stroke: #8b949e; stroke-width: 1.5; stroke-dasharray: 4,3; rx: 6; }
      .node-val { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 12px; fill: #c9d1d9; }
      .code-snippet { font-family: 'JetBrains Mono', monospace; font-size: 12px; fill: #7ee787; }
      .ptr-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399" />
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f472b6" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#eab308" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" class="bg" />

  <!-- Header -->
  <g transform="translate(30, 30)">
    <text x="0" y="0" class="header-title">Segregate Even &amp; Odd Value Nodes in Linked List (Stable Partition)</text>
    <text x="0" y="24" class="sub-title">Maintain relative order of even nodes followed by relative order of odd nodes using 2 Dummy Sentinels</text>
  </g>

  <!-- Panel 1: Original Input -->
  <g transform="translate(30, 75)">
    <rect width="1040" height="150" class="card" />
    <text x="25" y="30" class="step-title">1. Original List: [ 1 ➔ 7 ➔ 2 ➔ 6 ➔ 3 ➔ 5 ➔ 4 ➔ null ]</text>
    
    <g transform="translate(35, 60)">
      <!-- 1 -->
      <g transform="translate(0, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">1</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <!-- 7 -->
      <g transform="translate(90, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">7</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- 2 -->
      <g transform="translate(180, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">2</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- 6 -->
      <g transform="translate(270, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">6</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <!-- 3 -->
      <g transform="translate(360, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">3</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <!-- 5 -->
      <g transform="translate(450, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">5</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <!-- 4 -->
      <g transform="translate(540, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">4</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
        <text x="85" y="20" class="desc-text" fill="#8b949e">null</text>
      </g>
    </g>
    <text x="25" y="125" class="desc-text">Green = Even values (2, 6, 4), Pink = Odd values (1, 7, 3, 5). Single pass traversal.</text>
  </g>

  <!-- Panel 2: 2 Dummy Chains -->
  <g transform="translate(30, 245)">
    <rect width="1040" height="260" class="card" />
    <text x="25" y="30" class="step-title">2. In-Place Splitting into Even &amp; Odd Chains</text>

    <!-- Even Chain -->
    <g transform="translate(35, 55)">
      <text x="0" y="22" class="ptr-text" fill="#34d399">Even Chain:</text>
      <g transform="translate(90, 0)">
        <rect width="70" height="32" class="dummy-node"/><text x="35" y="21" class="node-val" font-size="11" fill="#8b949e">evenHead</text>
        <line x1="70" y1="16" x2="100" y2="16" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <g transform="translate(200, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">2</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <g transform="translate(285, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">6</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <g transform="translate(370, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">4</text>
        <text x="22.5" y="48" class="ptr-text" fill="#34d399">even (tail)</text>
      </g>
    </g>

    <!-- Odd Chain -->
    <g transform="translate(35, 145)">
      <text x="0" y="22" class="ptr-text" fill="#f472b6">Odd Chain:</text>
      <g transform="translate(90, 0)">
        <rect width="70" height="32" class="dummy-node"/><text x="35" y="21" class="node-val" font-size="11" fill="#8b949e">oddHead</text>
        <line x1="70" y1="16" x2="100" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(200, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">1</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(285, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">7</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(370, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">3</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(455, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">5</text>
        <text x="22.5" y="48" class="ptr-text" fill="#f472b6">odd (tail)</text>
      </g>
    </g>

    <g transform="translate(570, 55)">
      <rect width="430" height="160" fill="#0d1117" stroke="#30363d" rx="8"/>
      <text x="20" y="25" class="step-title" fill="#eab308">⚡ Invariant Rules</text>
      <text x="20" y="55" class="code-snippet">// Join even chain tail to odd chain head:</text>
      <text x="20" y="78" class="code-snippet">even.next = oddHead.next;</text>
      <text x="20" y="105" class="code-snippet">// CRITICAL: Terminate odd tail to avoid cycles:</text>
      <text x="20" y="128" class="code-snippet">odd.next = null;</text>
      <text x="20" y="150" class="code-snippet">return evenHead.next;</text>
    </g>
  </g>

  <!-- Panel 3: Merged Final Output -->
  <g transform="translate(30, 525)">
    <rect width="1040" height="265" class="card" />
    <text x="25" y="30" class="step-title">3. Final Segregated Output: [ 2 ➔ 6 ➔ 4 ➔ 1 ➔ 7 ➔ 3 ➔ 5 ➔ null ]</text>

    <g transform="translate(35, 60)">
      <!-- Even Group -->
      <g transform="translate(0, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">2</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <g transform="translate(85, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">6</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-green)"/>
      </g>
      <g transform="translate(170, 0)">
        <rect width="45" height="32" class="node-even"/><text x="22.5" y="21" class="node-val">4</text>
        <line x1="45" y1="16" x2="85" y2="16" stroke="#eab308" stroke-width="2" marker-end="url(#arrow-yellow)"/>
      </g>

      <!-- Odd Group -->
      <g transform="translate(265, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">1</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(350, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">7</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(435, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">3</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#f472b6" stroke-width="1.5" marker-end="url(#arrow-pink)"/>
      </g>
      <g transform="translate(520, 0)">
        <rect width="45" height="32" class="node-odd"/><text x="22.5" y="21" class="node-val">5</text>
        <line x1="45" y1="16" x2="75" y2="16" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow-green)"/>
        <text x="85" y="20" class="desc-text" fill="#8b949e">null</text>
      </g>
    </g>

    <g transform="translate(25, 120)">
      <text x="0" y="15" class="header-title" fill="#f59e0b" font-size="15">⚡ Complexity &amp; Important Distinctions:</text>
      <text x="0" y="40" class="desc-text">• <tspan fill="#34d399" font-weight="700">Time Complexity:</tspan> O(N) single pass through the linked list.</text>
      <text x="0" y="65" class="desc-text">• <tspan fill="#34d399" font-weight="700">Auxiliary Space:</tspan> O(1) in-place pointer relinking.</text>
      <text x="0" y="90" class="desc-text">• <tspan fill="#eab308" font-weight="700">Odd Even by Index vs by Value:</tspan> LeetCode 328 segregates nodes by 1-based index (1st node, 3rd node...). This problem segregates by node value (<tspan font-family="monospace">val % 2 == 0</tspan> vs <tspan font-family="monospace">val % 2 != 0</tspan>).</text>
    </g>
  </g>
</svg>
