<svg viewBox="0 0 840 500" xmlns="http://www.w3.org/2000/svg" width="100%" height="500" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrD" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="arrBack" markerWidth="6" markerHeight="6" refX="1" refY="3" orient="auto">
      <path d="M6,0 L0,3 L6,6 Z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#090d16"/>

  <text x="25" y="30" fill="#38bdf8" font-size="15" font-weight="bold">Full Step-by-Step Dry Run (Reversing 1 ➔ 2 ➔ 3 ➔ 4 ➔ 5)</text>
  <text x="25" y="48" fill="#94a3b8" font-size="12">Tracking prev, curr, and storage pointers through each iteration</text>

  <!-- Initial State -->
  <g transform="translate(25, 65)">
    <rect width="790" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#fbbf24" font-size="12" font-weight="bold">0. Initial State:</text>
    <text x="15" y="45" fill="#94a3b8" font-size="11">prev = NULL, curr = 1</text>

    <!-- Nodes 1..5 -->
    <g transform="translate(180, 15)">
      <rect x="0" y="5" width="45" height="28" rx="4" fill="#1e293b" stroke="#64748b"/><text x="22" y="24" fill="#94a3b8" font-size="11" text-anchor="middle">NULL</text>
      <text x="22" y="46" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">prev</text>

      <rect x="80" y="5" width="40" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="100" y="24" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <text x="100" y="46" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">curr</text>
      <line x1="120" y1="19" x2="155" y2="19" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrD)"/>

      <rect x="160" y="5" width="40" height="28" rx="4" fill="#064e3b" stroke="#10b981"/><text x="180" y="24" fill="#f8fafc" font-size="13" text-anchor="middle">2</text>
      <text x="180" y="46" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">storage</text>
      <line x1="200" y1="19" x2="235" y2="19" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrD)"/>

      <rect x="240" y="5" width="35" height="28" rx="4" fill="#0f172a" stroke="#475569"/><text x="257" y="24" fill="#94a3b8" font-size="12" text-anchor="middle">3</text>
      <line x1="275" y1="19" x2="305" y2="19" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrD)"/>

      <rect x="310" y="5" width="35" height="28" rx="4" fill="#0f172a" stroke="#475569"/><text x="327" y="24" fill="#94a3b8" font-size="12" text-anchor="middle">4</text>
      <line x1="345" y1="19" x2="375" y2="19" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrD)"/>

      <rect x="380" y="5" width="35" height="28" rx="4" fill="#0f172a" stroke="#475569"/><text x="397" y="24" fill="#94a3b8" font-size="12" text-anchor="middle">5</text>
    </g>
  </g>

  <!-- Iteration 1 -->
  <g transform="translate(25, 145)">
    <rect width="790" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="bold">1. After Iteration 1:</text>
    <text x="15" y="45" fill="#94a3b8" font-size="11">1-&gt;next = NULL | prev = 1 | curr = 2</text>

    <g transform="translate(180, 15)">
      <rect x="0" y="5" width="45" height="28" rx="4" fill="#1e293b" stroke="#64748b"/><text x="22" y="24" fill="#94a3b8" font-size="11" text-anchor="middle">NULL</text>
      
      <!-- Reversed link 1 -> NULL -->
      <line x1="75" y1="19" x2="50" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBack)"/>

      <rect x="80" y="5" width="40" height="28" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/><text x="100" y="24" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <text x="100" y="46" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">prev</text>

      <rect x="160" y="5" width="40" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="180" y="24" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <text x="180" y="46" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">curr</text>
      <line x1="200" y1="19" x2="235" y2="19" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrD)"/>

      <rect x="240" y="5" width="35" height="28" rx="4" fill="#064e3b" stroke="#10b981"/><text x="257" y="24" fill="#a7f3d0" font-size="12" text-anchor="middle">3</text>
      <text x="257" y="46" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">store</text>
    </g>
  </g>

  <!-- Iteration 2 -->
  <g transform="translate(25, 225)">
    <rect width="790" height="70" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#38bdf8" font-size="12" font-weight="bold">2. After Iteration 2:</text>
    <text x="15" y="45" fill="#94a3b8" font-size="11">2-&gt;next = 1 | prev = 2 | curr = 3</text>

    <g transform="translate(180, 15)">
      <rect x="80" y="5" width="40" height="28" rx="4" fill="#0f172a" stroke="#475569"/><text x="100" y="24" fill="#94a3b8" font-size="13" text-anchor="middle">1</text>
      
      <!-- Reversed link 2 -> 1 -->
      <line x1="155" y1="19" x2="125" y2="19" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrBack)"/>

      <rect x="160" y="5" width="40" height="28" rx="4" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/><text x="180" y="24" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <text x="180" y="46" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">prev</text>

      <rect x="240" y="5" width="40" height="28" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/><text x="260" y="24" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">3</text>
      <text x="260" y="46" fill="#f59e0b" font-size="10" font-weight="bold" text-anchor="middle">curr</text>
      <line x1="280" y1="19" x2="305" y2="19" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrD)"/>

      <rect x="310" y="5" width="35" height="28" rx="4" fill="#064e3b" stroke="#10b981"/><text x="327" y="24" fill="#a7f3d0" font-size="12" text-anchor="middle">4</text>
      <text x="327" y="46" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">store</text>
    </g>
  </g>

  <!-- Final State -->
  <g transform="translate(25, 305)">
    <rect width="790" height="85" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="24" fill="#a7f3d0" font-size="12" font-weight="bold">🎯 Final State (When curr == NULL):</text>
    <text x="15" y="48" fill="#ffffff" font-size="11">• curr stepped to NULL. Loop stops.</text>
    <text x="15" y="68" fill="#ffffff" font-size="11">• <tspan fill="#38bdf8" font-weight="bold">prev</tspan> points to node 5 ➔ <tspan font-weight="bold">NEW HEAD!</tspan></text>

    <!-- Reversed chain -->
    <g transform="translate(280, 20)">
      <rect x="0" y="5" width="45" height="30" rx="4" fill="#1e3a8a" stroke="#38bdf8" stroke-width="2.5"/><text x="22" y="25" fill="#ffffff" font-size="14" font-weight="bold" text-anchor="middle">5</text>
      <text x="22" y="48" fill="#38bdf8" font-size="10" font-weight="bold" text-anchor="middle">NEW HEAD (prev)</text>

      <line x1="50" y1="20" x2="75" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <rect x="80" y="5" width="40" height="30" rx="4" fill="#1e293b" stroke="#475569"/><text x="100" y="25" fill="#f8fafc" font-size="13" text-anchor="middle">4</text>
      <line x1="125" y1="20" x2="150" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <rect x="155" y="5" width="40" height="30" rx="4" fill="#1e293b" stroke="#475569"/><text x="175" y="25" fill="#f8fafc" font-size="13" text-anchor="middle">3</text>
      <line x1="200" y1="20" x2="225" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <rect x="230" y="5" width="40" height="30" rx="4" fill="#1e293b" stroke="#475569"/><text x="250" y="25" fill="#f8fafc" font-size="13" text-anchor="middle">2</text>
      <line x1="275" y1="20" x2="300" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <rect x="305" y="5" width="40" height="30" rx="4" fill="#1e293b" stroke="#475569"/><text x="325" y="25" fill="#f8fafc" font-size="13" text-anchor="middle">1</text>
      <line x1="350" y1="20" x2="375" y2="20" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <rect x="380" y="5" width="45" height="30" rx="4" fill="#1e293b" stroke="#64748b"/><text x="402" y="25" fill="#94a3b8" font-size="11" text-anchor="middle">NULL</text>
    </g>
  </g>

  <!-- Summary Footer -->
  <text x="420" y="475" fill="#94a3b8" font-size="12" text-anchor="middle">Time Complexity: O(N) single pass | Space Complexity: O(1) in-place pointer manipulation</text>
</svg>
