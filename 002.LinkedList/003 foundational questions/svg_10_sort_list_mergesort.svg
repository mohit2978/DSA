<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .node-val { font-family: 'Segoe UI', monospace, sans-serif; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #ffffff; }
      .label-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .code-badge { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #fbbf24; }
      .desc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Title -->
  <g transform="translate(30, 35)">
    <text class="title">LeetCode 148: Sort List (Merge Sort on Linked List)</text>
    <text y="24" class="subtitle">Divide &amp; Conquer Strategy: Mid-Break ➔ Recursion Tree ➔ Two-Pointer Merge</text>
  </g>

  <!-- Recursion Tree Diagram -->
  <g transform="translate(30, 80)">
    <rect width="940" height="420" class="card"/>
    <text x="20" y="25" class="section-title">Divide &amp; Conquer Tree Trace (Example: [4, 2, 1, 3])</text>

    <!-- Level 0: Root [4 -> 2 -> 1 -> 3] -->
    <g transform="translate(370, 45)">
      <rect width="200" height="38" rx="8" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
      <text x="100" y="24" class="node-val" fill="#c7d2fe">4 ➔ 2 ➔ 1 ➔ 3</text>
      
      <!-- Split arrows -->
      <path d="M 70 38 L -60 75" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-down)"/>
      <path d="M 130 38 L 260 75" stroke="#38bdf8" stroke-width="1.8" marker-end="url(#arrow-down)"/>
    </g>

    <!-- Level 1: [4 -> 2] and [1 -> 3] -->
    <g transform="translate(180, 140)">
      <rect width="140" height="34" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="70" y="22" class="node-val" fill="#7dd3fc">4 ➔ 2</text>
      <path d="M 40 34 L -20 65" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-down)"/>
      <path d="M 100 34 L 160 65" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-down)"/>
    </g>

    <g transform="translate(620, 140)">
      <rect width="140" height="34" rx="6" fill="#0f172a" stroke="#38bdf8"/>
      <text x="70" y="22" class="node-val" fill="#7dd3fc">1 ➔ 3</text>
      <path d="M 40 34 L -20 65" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-down)"/>
      <path d="M 100 34 L 160 65" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrow-down)"/>
    </g>

    <!-- Level 2: Base Cases (Single nodes) -->
    <g transform="translate(100, 220)">
      <rect width="60" height="30" rx="4" fill="#334155"/>
      <text x="30" y="20" class="node-val">[4]</text>
    </g>
    <g transform="translate(240, 220)">
      <rect width="60" height="30" rx="4" fill="#334155"/>
      <text x="30" y="20" class="node-val">[2]</text>
    </g>
    <g transform="translate(540, 220)">
      <rect width="60" height="30" rx="4" fill="#334155"/>
      <text x="30" y="20" class="node-val">[1]</text>
    </g>
    <g transform="translate(680, 220)">
      <rect width="60" height="30" rx="4" fill="#334155"/>
      <text x="30" y="20" class="node-val">[3]</text>
    </g>

    <!-- Level 1 Merge Back Up -->
    <g transform="translate(180, 290)">
      <path d="M -50 -40 L 40 -5" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-up)"/>
      <path d="M 90 -40 L 100 -5" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-up)"/>
      <rect width="140" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="70" y="22" class="node-val" fill="#a7f3d0">merge: 2 ➔ 4</text>
    </g>

    <g transform="translate(620, 290)">
      <path d="M -50 -40 L 40 -5" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-up)"/>
      <path d="M 90 -40 L 100 -5" stroke="#10b981" stroke-width="1.8" marker-end="url(#arrow-up)"/>
      <rect width="140" height="34" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="70" y="22" class="node-val" fill="#a7f3d0">merge: 1 ➔ 3</text>
    </g>

    <!-- Final Root Merge -->
    <g transform="translate(360, 360)">
      <path d="M -110 -35 L 50 -5" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-up)"/>
      <path d="M 330 -35 L 170 -5" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-up)"/>
      <rect width="220" height="42" rx="8" fill="#065f46" stroke="#34d399" stroke-width="2"/>
      <text x="110" y="27" class="node-val" fill="#ffffff">Final: 1 ➔ 2 ➔ 3 ➔ 4</text>
    </g>
  </g>

  <!-- Summary Box -->
  <g transform="translate(30, 520)">
    <rect width="940" height="135" class="card"/>
    <g transform="translate(25, 20)">
      <text x="0" y="15" class="section-title" fill="#f59e0b">⚡ Why Linked List Merge Sort is Optimal (O(N log N) Time, O(log N) Auxiliary Stack)</text>
      <text x="0" y="42" class="desc-text">1. <tspan fill="#38bdf8" font-weight="600">No Random Access Needed:</tspan> Unlike QuickSort or HeapSort (which require O(1) random array indexing), MergeSort only requires sequential next pointer access.</text>
      <text x="0" y="66" class="desc-text">2. <tspan fill="#38bdf8" font-weight="600">Zero Extra Allocation:</tspan> Merging two linked lists is done <tspan fill="#34d399">in-place</tspan> by relinking pointers in O(1) space, unlike arrays which require an O(N) temporary buffer.</text>
      <text x="0" y="90" class="desc-text">3. <tspan fill="#38bdf8" font-weight="600">1st Middle Rule:</tspan> Always use 1st mid (<tspan fill="#fbbf24" font-family="monospace">fast-&gt;next != null &amp;&amp; fast-&gt;next-&gt;next != null</tspan>) so that 2-node sublists [A, B] split into [A] and [B] without infinite recursion!</text>
    </g>
  </g>
</svg>
