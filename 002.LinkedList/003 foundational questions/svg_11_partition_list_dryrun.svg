<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .node-val { font-family: 'Segoe UI', monospace, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #ffffff; }
      .label-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .code-badge { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #fbbf24; }
      .desc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-rose" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Title -->
  <g transform="translate(30, 35)">
    <text class="title">LeetCode 86: Partition List (Values &lt; x before Values ≥ x)</text>
    <text y="24" class="subtitle">Two-Dummy Sentinel Strategy with Stable Order Preservation &amp; Tail Nullification</text>
  </g>

  <!-- Input List -->
  <g transform="translate(30, 80)">
    <rect width="940" height="120" class="card"/>
    <text x="20" y="25" class="section-title">Input Linked List (Target Pivot: x = 3)</text>
    
    <g transform="translate(40, 45)">
      <!-- 1 (< 3) -->
      <circle cx="40" cy="30" r="17" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="40" y="30" class="node-val">1</text>
      <text x="40" y="62" class="label-text" fill="#38bdf8">&lt; 3</text>
      <line x1="57" y1="30" x2="103" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 4 (>= 3) -->
      <circle cx="120" cy="30" r="17" fill="#be123c" stroke="#f43f5e" stroke-width="2"/>
      <text x="120" y="30" class="node-val">4</text>
      <text x="120" y="62" class="label-text" fill="#f43f5e">≥ 3</text>
      <line x1="137" y1="30" x2="183" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 3 (>= 3) -->
      <circle cx="200" cy="30" r="17" fill="#be123c" stroke="#f43f5e" stroke-width="2"/>
      <text x="200" y="30" class="node-val">3</text>
      <text x="200" y="62" class="label-text" fill="#f43f5e">≥ 3</text>
      <line x1="217" y1="30" x2="263" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 2 (< 3) -->
      <circle cx="280" cy="30" r="17" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="280" y="30" class="node-val">2</text>
      <text x="280" y="62" class="label-text" fill="#38bdf8">&lt; 3</text>
      <line x1="297" y1="30" x2="343" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 5 (>= 3) -->
      <circle cx="360" cy="30" r="17" fill="#be123c" stroke="#f43f5e" stroke-width="2"/>
      <text x="360" y="30" class="node-val">5</text>
      <text x="360" y="62" class="label-text" fill="#f43f5e">≥ 3</text>
      <line x1="377" y1="30" x2="423" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 2 (< 3) -->
      <circle cx="440" cy="30" r="17" fill="#0284c7" stroke="#38bdf8" stroke-width="2"/>
      <text x="440" y="30" class="node-val">2</text>
      <text x="440" y="62" class="label-text" fill="#38bdf8">&lt; 3</text>
      <line x1="457" y1="30" x2="495" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="515" y="34" class="node-val" fill="#64748b">null</text>
    </g>
  </g>

  <!-- Two Partition Buckets -->
  <g transform="translate(30, 215)">
    <rect width="940" height="230" class="card"/>
    <text x="20" y="25" class="section-title">Two Separate Dummy Chains (Preserves Relative Order)</text>

    <!-- Less Than Chain -->
    <g transform="translate(40, 45)">
      <circle cx="40" cy="30" r="16" fill="#334155"/>
      <text x="40" y="30" class="node-val">-101</text>
      <text x="40" y="60" class="label-text" fill="#94a3b8">dummy1 (h1)</text>
      <line x1="56" y1="30" x2="94" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="110" cy="30" r="16" fill="#0284c7"/>
      <text x="110" y="30" class="node-val">1</text>
      <line x1="126" y1="30" x2="164" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="180" cy="30" r="16" fill="#0284c7"/>
      <text x="180" y="30" class="node-val">2</text>
      <line x1="196" y1="30" x2="234" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="250" cy="30" r="16" fill="#0284c7"/>
      <text x="250" y="30" class="node-val">2</text>
      <text x="250" y="60" class="label-text" fill="#38bdf8">dummy1 tail</text>

      <text x="350" y="35" class="desc-text" fill="#7dd3fc" font-weight="600">Chain 1 (&lt; x): 1 ➔ 2 ➔ 2</text>
    </g>

    <!-- Greater or Equal Chain -->
    <g transform="translate(40, 130)">
      <circle cx="40" cy="30" r="16" fill="#334155"/>
      <text x="40" y="30" class="node-val">-102</text>
      <text x="40" y="60" class="label-text" fill="#94a3b8">dummy2 (h2)</text>
      <line x1="56" y1="30" x2="94" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)"/>

      <circle cx="110" cy="30" r="16" fill="#be123c"/>
      <text x="110" y="30" class="node-val">4</text>
      <line x1="126" y1="30" x2="164" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)"/>

      <circle cx="180" cy="30" r="16" fill="#be123c"/>
      <text x="180" y="30" class="node-val">3</text>
      <line x1="196" y1="30" x2="234" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)"/>

      <circle cx="250" cy="30" r="16" fill="#be123c"/>
      <text x="250" y="30" class="node-val">5</text>
      <text x="250" y="60" class="label-text" fill="#f43f5e">dummy2 tail</text>
      
      <line x1="266" y1="30" x2="300" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)"/>
      <text x="320" y="34" class="node-val" fill="#f43f5e">null</text>

      <text x="380" y="35" class="desc-text" fill="#fda4af" font-weight="600">Chain 2 (≥ x): 4 ➔ 3 ➔ 5 (dummy2.next = null to avoid cycle!)</text>
    </g>
  </g>

  <!-- Final Recombined List -->
  <g transform="translate(30, 460)">
    <rect width="940" height="195" class="card"/>
    <text x="20" y="25" class="section-title" fill="#10b981">Final Connection: dummy1.next = h2.next &amp; return h1.next</text>

    <g transform="translate(40, 45)">
      <circle cx="40" cy="30" r="16" fill="#0284c7"/>
      <text x="40" y="30" class="node-val">1</text>
      <text x="40" y="60" class="label-text" fill="#38bdf8">head</text>
      <line x1="56" y1="30" x2="94" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="110" cy="30" r="16" fill="#0284c7"/>
      <text x="110" y="30" class="node-val">2</text>
      <line x1="126" y1="30" x2="164" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="180" cy="30" r="16" fill="#0284c7"/>
      <text x="180" y="30" class="node-val">2</text>

      <!-- Bridge arrow between partitions -->
      <path d="M 196 30 L 244 30" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="220" y="18" class="label-text" fill="#fbbf24">bridge</text>

      <circle cx="260" cy="30" r="16" fill="#be123c"/>
      <text x="260" y="30" class="node-val">4</text>
      <line x1="276" y1="30" x2="314" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="330" cy="30" r="16" fill="#be123c"/>
      <text x="330" y="30" class="node-val">3</text>
      <line x1="346" y1="30" x2="384" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="400" cy="30" r="16" fill="#be123c"/>
      <text x="400" y="30" class="node-val">5</text>
      <line x1="416" y1="30" x2="450" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="470" y="34" class="node-val" fill="#64748b">null</text>
    </g>

    <g transform="translate(40, 125)">
      <rect width="860" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="30" class="desc-text"><tspan fill="#f59e0b" font-weight="700">⚠️ Critical Bug Trap:</tspan> Always set <tspan fill="#fbbf24" font-family="monospace">dummy2.next = null</tspan> before returning. If the original last node went to dummy1, dummy2's tail might still point to it, creating an <tspan fill="#f87171" font-weight="600">infinite cycle</tspan>!</text>
    </g>
  </g>
</svg>
