<svg viewBox="0 0 880 540" xmlns="http://www.w3.org/2000/svg" width="100%" height="540" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrG" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#10b981"/>
    </marker>
    <marker id="arrB" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="arrO" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
    <marker id="arrGray" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#090d16"/>

  <text x="25" y="30" fill="#38bdf8" font-size="16" font-weight="bold">Merge Two Sorted Linked Lists — Dummy Node Pattern &amp; Dry Run</text>
  <text x="25" y="50" fill="#94a3b8" font-size="12">Iterative O(N+M) Time and O(1) Space In-Place Splicing</text>

  <!-- Step 1: Concept & Setup -->
  <g transform="translate(25, 68)">
    <rect width="830" height="95" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="22" fill="#fbbf24" font-size="12" font-weight="bold">💡 Why Use a Dummy Node (-1)?</text>
    <text x="15" y="42" fill="#cbd5e1" font-size="11.5">• Eliminates the dilemma of <tspan fill="#38bdf8" font-weight="bold">which list provides the new Head</tspan> (avoids special if-else for the 1st node).</text>
    <text x="15" y="60" fill="#cbd5e1" font-size="11.5">• A moving pointer <tspan fill="#f59e0b" font-weight="bold">prev</tspan> stitches nodes one by one. At the end, simply return <tspan fill="#10b981" font-weight="bold">dummy-&gt;next</tspan>.</text>
    <text x="15" y="78" fill="#a7f3d0" font-size="11.5">⚡ Base Case: If either list is empty initially: <tspan fill="#34d399" font-family="monospace">return (l1 != null) ? l1 : l2;</tspan></text>
  </g>

  <!-- Step 2: Step-by-Step Stitching -->
  <g transform="translate(25, 175)">
    <rect width="830" height="245" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="24" fill="#38bdf8" font-size="13" font-weight="bold">🔍 Step-by-Step Dry Run (L1: [1, 5, 9], L2: [2, 3, 6, 10])</text>

    <!-- Dry run steps summary table/boxes -->
    <g transform="translate(15, 38)">
      <!-- Step 1 -->
      <rect x="0" y="0" width="190" height="85" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
      <text x="10" y="20" fill="#38bdf8" font-size="11" font-weight="bold">1. Compare 1 &amp; 2</text>
      <text x="10" y="38" fill="#cbd5e1" font-size="10.5">1 &lt; 2 ➔ <tspan fill="#10b981" font-weight="bold">prev-&gt;next = 1</tspan></text>
      <text x="10" y="55" fill="#94a3b8" font-size="10">c1 advances to 5</text>
      <text x="10" y="72" fill="#f59e0b" font-size="10">prev advances to 1</text>

      <!-- Step 2 -->
      <rect x="200" y="0" width="190" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="210" y="20" fill="#fbbf24" font-size="11" font-weight="bold">2. Compare 5 &amp; 2</text>
      <text x="210" y="38" fill="#cbd5e1" font-size="10.5">2 &lt; 5 ➔ <tspan fill="#10b981" font-weight="bold">prev-&gt;next = 2</tspan></text>
      <text x="210" y="55" fill="#94a3b8" font-size="10">c2 advances to 3</text>
      <text x="210" y="72" fill="#f59e0b" font-size="10">prev advances to 2</text>

      <!-- Step 3 -->
      <rect x="400" y="0" width="190" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="410" y="20" fill="#fbbf24" font-size="11" font-weight="bold">3. Compare 5 &amp; 3</text>
      <text x="410" y="38" fill="#cbd5e1" font-size="10.5">3 &lt; 5 ➔ <tspan fill="#10b981" font-weight="bold">prev-&gt;next = 3</tspan></text>
      <text x="410" y="55" fill="#94a3b8" font-size="10">c2 advances to 6</text>
      <text x="410" y="72" fill="#f59e0b" font-size="10">prev advances to 3</text>

      <!-- Step 4 -->
      <rect x="600" y="0" width="200" height="85" rx="6" fill="#0f172a" stroke="#475569"/>
      <text x="610" y="20" fill="#38bdf8" font-size="11" font-weight="bold">4. Compare 5 &amp; 6</text>
      <text x="610" y="38" fill="#cbd5e1" font-size="10.5">5 &lt; 6 ➔ <tspan fill="#10b981" font-weight="bold">prev-&gt;next = 5</tspan></text>
      <text x="610" y="55" fill="#94a3b8" font-size="10">c1 advances to 9</text>
      <text x="610" y="72" fill="#f59e0b" font-size="10">prev advances to 5</text>
    </g>

    <!-- Visual List Splicing -->
    <g transform="translate(15, 140)">
      <text x="0" y="16" fill="#34d399" font-size="11" font-weight="bold">Resulting Merged Chain:</text>

      <!-- Dummy node -->
      <rect x="0" y="28" width="48" height="28" rx="4" fill="#334155" stroke="#94a3b8"/>
      <text x="24" y="47" fill="#cbd5e1" font-size="11" font-weight="bold" text-anchor="middle">-1</text>
      <text x="24" y="70" fill="#94a3b8" font-size="9" text-anchor="middle">dummy</text>
      <line x1="48" y1="42" x2="72" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Node 1 -->
      <rect x="75" y="28" width="38" height="28" rx="4" fill="#1e3a8a" stroke="#38bdf8"/>
      <text x="94" y="47" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">1</text>
      <text x="94" y="70" fill="#38bdf8" font-size="9" font-weight="bold" text-anchor="middle">Head</text>
      <line x1="113" y1="42" x2="137" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Node 2 -->
      <rect x="140" y="28" width="38" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="159" y="47" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">2</text>
      <line x1="178" y1="42" x2="202" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Node 3 -->
      <rect x="205" y="28" width="38" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="224" y="47" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">3</text>
      <line x1="243" y1="42" x2="267" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Node 5 -->
      <rect x="270" y="28" width="38" height="28" rx="4" fill="#1e3a8a" stroke="#38bdf8"/>
      <text x="289" y="47" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
      <line x1="308" y1="42" x2="332" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Node 6 -->
      <rect x="335" y="28" width="38" height="28" rx="4" fill="#0f172a" stroke="#475569"/>
      <text x="354" y="47" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">6</text>
      <line x1="373" y1="42" x2="397" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Node 9 -->
      <rect x="400" y="28" width="38" height="28" rx="4" fill="#1e3a8a" stroke="#38bdf8"/>
      <text x="419" y="47" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">9</text>
      <line x1="438" y1="42" x2="462" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- Remaining Node 10 spliced directly -->
      <rect x="465" y="28" width="42" height="28" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <text x="486" y="47" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">10</text>
      <text x="486" y="70" fill="#34d399" font-size="9" font-weight="bold" text-anchor="middle">O(1) splice</text>
      <line x1="507" y1="42" x2="531" y2="42" stroke="#10b981" stroke-width="2" marker-end="url(#arrG)"/>

      <!-- NULL -->
      <rect x="535" y="28" width="48" height="28" rx="4" fill="#1e293b" stroke="#64748b"/>
      <text x="559" y="47" fill="#94a3b8" font-size="11" text-anchor="middle">NULL</text>
    </g>
  </g>

  <!-- Step 3: O(1) Remaining Attachment Banner -->
  <g transform="translate(25, 430)">
    <rect width="830" height="90" rx="8" fill="#0f291e" stroke="#10b981"/>
    <text x="15" y="24" fill="#34d399" font-size="12" font-weight="bold">⚡ One-Liner Remainder Splicing (No loop needed for leftovers!):</text>
    <text x="15" y="48" fill="#f8fafc" font-size="12" font-family="monospace">prev-&gt;next = (c1 != nullptr) ? c1 : c2;</text>
    <text x="15" y="70" fill="#94a3b8" font-size="11">Since both input lists were already sorted, when one list reaches NULL, the entire remaining part of the other list is attached in O(1) time.</text>
  </g>
</svg>
