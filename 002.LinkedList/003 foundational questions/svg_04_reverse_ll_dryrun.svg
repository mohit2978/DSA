<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" width="100%" height="460" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="pGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="revArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#10b981"/>
    </marker>
    <marker id="fwdArr" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto">
      <polygon points="0 0, 7 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#090d16"/>

  <text x="25" y="30" fill="#38bdf8" font-size="15" font-weight="bold">Iterative Reverse Linked List — 4-Step Loop Mechanics</text>
  <text x="25" y="48" fill="#94a3b8" font-size="12">Why 3 pointers (prev, curr, storage) are essential to prevent losing references</text>

  <!-- Step 1: Save Next -->
  <g transform="translate(25, 65)">
    <rect width="385" height="175" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="15" y="12" width="75" height="22" rx="4" fill="#047857"/>
    <text x="52" y="27" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">STEP 1</text>
    <text x="100" y="28" fill="#34d399" font-size="13" font-weight="bold" font-family="monospace">storage = curr-&gt;next;</text>
    
    <text x="15" y="60" fill="#cbd5e1" font-size="12">Save reference to next node <tspan fill="#f59e0b" font-weight="bold">before</tspan> breaking link.</text>
    
    <!-- Mini diagram -->
    <g transform="translate(20, 80)">
      <circle cx="30" cy="30" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="30" y="35" fill="#f8fafc" font-size="12" font-weight="bold" text-anchor="middle">curr</text>
      
      <line x1="48" y1="30" x2="110" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#revArr)"/>
      <text x="80" y="20" fill="#34d399" font-size="10" font-weight="bold" text-anchor="middle">save</text>

      <circle cx="130" cy="30" r="16" fill="#064e3b" stroke="#10b981" stroke-width="2"/>
      <text x="130" y="35" fill="#a7f3d0" font-size="11" font-weight="bold" text-anchor="middle">next</text>

      <circle cx="210" cy="30" r="14" fill="#0f172a" stroke="#475569"/>
      <text x="210" y="34" fill="#64748b" font-size="11" text-anchor="middle">3</text>
      <line x1="148" y1="30" x2="192" y2="30" stroke="#64748b" marker-end="url(#fwdArr)"/>
    </g>
    <text x="15" y="160" fill="#94a3b8" font-size="11">⚠️ Without this, rest of the list becomes unreachable!</text>
  </g>

  <!-- Step 2: Reverse Link -->
  <g transform="translate(430, 65)">
    <rect width="385" height="175" rx="8" fill="#1e293b" stroke="#334155"/>
    <rect x="15" y="12" width="75" height="22" rx="4" fill="#b45309"/>
    <text x="52" y="27" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">STEP 2</text>
    <text x="100" y="28" fill="#fbbf24" font-size="13" font-weight="bold" font-family="monospace">curr-&gt;next = prev;</text>

    <text x="15" y="60" fill="#cbd5e1" font-size="12">Point current node backwards towards <tspan fill="#38bdf8" font-weight="bold">prev</tspan>.</text>

    <!-- Mini diagram -->
    <g transform="translate(20, 80)">
      <circle cx="30" cy="30" r="16" fill="#1e3a8a" stroke="#3b82f6" stroke-width="2"/>
      <text x="30" y="35" fill="#bfdbfe" font-size="11" font-weight="bold" text-anchor="middle">prev</text>

      <!-- Reversed arrow -->
      <line x1="110" y1="30" x2="52" y2="30" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#revArr)"/>
      <text x="80" y="20" fill="#fbbf24" font-size="10" font-weight="bold" text-anchor="middle">reverse</text>

      <circle cx="130" cy="30" r="16" fill="#1e293b" stroke="#f59e0b" stroke-width="2"/>
      <text x="130" y="35" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">curr</text>

      <line x1="148" y1="30" x2="200" y2="30" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="175" y="20" fill="#ef4444" font-size="11" font-weight="bold">✕</text>

      <circle cx="220" cy="30" r="14" fill="#064e3b" stroke="#10b981"/>
      <text x="220" y="34" fill="#a7f3d0" font-size="10" text-anchor="middle">store</text>
    </g>
    <text x="15" y="160" fill="#94a3b8" font-size="11">Link to previous node established; forward link severed.</text>
  </g>

  <!-- Step 3 & 4: Advance Pointers -->
  <g transform="translate(25, 255)">
    <rect width="790" height="185" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="25" fill="#38bdf8" font-size="13" font-weight="bold">STEP 3 &amp; 4: Advance Pointers Forward for Next Iteration</text>

    <g transform="translate(20, 45)">
      <rect x="0" y="0" width="365" height="75" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1"/>
      <text x="15" y="24" fill="#60a5fa" font-size="12" font-weight="bold" font-family="monospace">prev = curr;</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="11">• Advance <tspan fill="#60a5fa" font-weight="bold">prev</tspan> to current node.</text>
      <text x="15" y="62" fill="#94a3b8" font-size="11">• It now marks the head of the reversed portion.</text>
    </g>

    <g transform="translate(405, 45)">
      <rect x="0" y="0" width="365" height="75" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
      <text x="15" y="24" fill="#fbbf24" font-size="12" font-weight="bold" font-family="monospace">curr = storage;</text>
      <text x="15" y="45" fill="#cbd5e1" font-size="11">• Advance <tspan fill="#fbbf24" font-weight="bold">curr</tspan> to the saved next node.</text>
      <text x="15" y="62" fill="#94a3b8" font-size="11">• Ready to process the remaining unreversed list.</text>
    </g>

    <!-- Loop termination banner -->
    <rect x="20" y="132" width="750" height="38" rx="6" fill="#064e3b" stroke="#10b981"/>
    <text x="395" y="156" fill="#ffffff" font-size="12" font-weight="bold" text-anchor="middle">🏁 Loop Terminates when curr == NULL. Return prev (which points to the new Head)!</text>
  </g>
</svg>
