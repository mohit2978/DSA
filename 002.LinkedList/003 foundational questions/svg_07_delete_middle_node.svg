<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 600; fill: #38bdf8; }
      .node-val { font-family: 'Segoe UI', monospace, sans-serif; font-size: 16px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #ffffff; }
      .label-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 600; text-anchor: middle; }
      .code-text { font-family: 'Fira Code', Consolas, monospace; font-size: 12px; fill: #e2e8f0; }
      .note-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
    <marker id="arrow-sky" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-bypass" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Header -->
  <g transform="translate(30, 35)">
    <text class="title">LeetCode 2095: Delete the Middle Node of a Linked List</text>
    <text y="24" class="subtitle">Slow &amp; Fast Pointer Technique with 'prev' tracking to bypass and free 2nd Middle Node</text>
  </g>

  <!-- Card 1: Odd Length Example (7 nodes -> delete index 3: node '4') -->
  <g transform="translate(30, 80)">
    <rect width="890" height="210" class="card"/>
    <text x="20" y="28" class="section-title">Case 1: Odd Length (n = 7, Middle = ⌊7/2⌋ = 3, Node '4')</text>

    <!-- Initial / Pointer Traversal State -->
    <g transform="translate(30, 45)">
      <!-- Node 1 -->
      <circle cx="40" cy="40" r="20" fill="#3b82f6"/>
      <text x="40" y="40" class="node-val">1</text>
      <text x="40" y="75" class="label-text" fill="#94a3b8">head</text>

      <line x1="60" y1="40" x2="110" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Node 2 -->
      <circle cx="130" cy="40" r="20" fill="#3b82f6"/>
      <text x="130" y="40" class="node-val">2</text>

      <line x1="150" y1="40" x2="200" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Node 3 (prev) -->
      <circle cx="220" cy="40" r="20" fill="#6366f1"/>
      <text x="220" y="40" class="node-val">3</text>
      <text x="220" y="75" class="label-text" fill="#818cf8">prev</text>

      <line x1="240" y1="40" x2="290" y2="40" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- Node 4 (slow to delete) -->
      <circle cx="310" cy="40" r="20" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
      <text x="310" y="40" class="node-val">4</text>
      <text x="310" y="75" class="label-text" fill="#ef4444">slow (Del)</text>
      <line x1="298" y1="28" x2="322" y2="52" stroke="#ffffff" stroke-width="2.5"/>
      <line x1="322" y1="28" x2="298" y2="52" stroke="#ffffff" stroke-width="2.5"/>

      <line x1="330" y1="40" x2="380" y2="40" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- Node 5 -->
      <circle cx="400" cy="40" r="20" fill="#3b82f6"/>
      <text x="400" y="40" class="node-val">5</text>

      <line x1="420" y1="40" x2="470" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Node 6 -->
      <circle cx="490" cy="40" r="20" fill="#3b82f6"/>
      <text x="490" y="40" class="node-val">6</text>

      <line x1="510" y1="40" x2="560" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Node 7 (fast) -->
      <circle cx="580" cy="40" r="20" fill="#10b981"/>
      <text x="580" y="40" class="node-val">7</text>
      <text x="580" y="75" class="label-text" fill="#10b981">fast (at end)</text>

      <line x1="600" y1="40" x2="650" y2="40" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="670" y="44" class="node-val" fill="#64748b">null</text>

      <!-- Bypass Curved Arrow from Node 3 to Node 5 -->
      <path d="M 225 20 Q 310 -25 395 20" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-bypass)"/>
      <rect x="265" y="-30" width="100" height="20" rx="4" fill="#0f172a" stroke="#f59e0b"/>
      <text x="315" y="-16" class="code-text" fill="#fbbf24" text-anchor="middle">prev-&gt;next = slow-&gt;next</text>
    </g>

    <g transform="translate(30, 150)">
      <rect width="830" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="26" class="note-text"><tspan fill="#38bdf8" font-weight="600">Action:</tspan> Fast reaches tail (<tspan fill="#10b981">fast-&gt;next == null</tspan>). 'slow' is on node 4, 'prev' is on node 3. Stitch <tspan fill="#fbbf24">prev-&gt;next = slow-&gt;next</tspan> and <tspan fill="#f87171">delete slow</tspan>.</text>
    </g>
  </g>

  <!-- Card 2: Even Length Example & Edge Case (n = 4 -> delete index 2: node '3') -->
  <g transform="translate(30, 310)">
    <rect width="890" height="225" class="card"/>
    <text x="20" y="28" class="section-title">Case 2: Even Length (n = 4, Middle = ⌊4/2⌋ = 2, Node '3') &amp; Edge Cases</text>

    <!-- Even Length Diagram -->
    <g transform="translate(30, 45)">
      <!-- Node 1 -->
      <circle cx="40" cy="35" r="18" fill="#3b82f6"/>
      <text x="40" y="35" class="node-val">1</text>
      <text x="40" y="68" class="label-text" fill="#94a3b8">head</text>

      <line x1="58" y1="35" x2="102" y2="35" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Node 2 (prev) -->
      <circle cx="120" cy="35" r="18" fill="#6366f1"/>
      <text x="120" y="35" class="node-val">2</text>
      <text x="120" y="68" class="label-text" fill="#818cf8">prev</text>

      <line x1="138" y1="35" x2="182" y2="35" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- Node 3 (slow to delete) -->
      <circle cx="200" cy="35" r="18" fill="#ef4444" stroke="#fca5a5" stroke-width="2"/>
      <text x="200" y="35" class="node-val">3</text>
      <text x="200" y="68" class="label-text" fill="#ef4444">slow (Del)</text>
      <line x1="190" y1="25" x2="210" y2="45" stroke="#ffffff" stroke-width="2"/>
      <line x1="210" y1="25" x2="190" y2="45" stroke="#ffffff" stroke-width="2"/>

      <line x1="218" y1="35" x2="262" y2="35" stroke="#64748b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow)"/>

      <!-- Node 4 -->
      <circle cx="280" cy="35" r="18" fill="#3b82f6"/>
      <text x="280" y="35" class="node-val">4</text>

      <line x1="298" y1="35" x2="342" y2="35" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Fast at null -->
      <rect x="350" y="23" width="70" height="24" rx="4" fill="#10b981" fill-opacity="0.2" stroke="#10b981"/>
      <text x="385" y="39" class="label-text" fill="#34d399">fast == null</text>

      <!-- Bypass curved arrow -->
      <path d="M 125 17 Q 200 -20 275 17" fill="none" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrow-bypass)"/>
    </g>

    <!-- Edge Cases Box -->
    <g transform="translate(480, 40)">
      <rect width="380" height="160" rx="8" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="24" class="section-title" fill="#f59e0b">⚠️ Critical Edge Cases</text>
      
      <text x="15" y="52" class="note-text"><tspan fill="#fca5a5" font-weight="600">1. Single Node (n = 1):</tspan> [1] -&gt; Middle is node 1.</text>
      <text x="30" y="70" class="code-text" fill="#94a3b8">if (head == null || head.next == null) return null;</text>

      <text x="15" y="100" class="note-text"><tspan fill="#fca5a5" font-weight="600">2. Two Nodes (n = 2):</tspan> [1, 2] -&gt; Middle is node 2 (index 1).</text>
      <text x="30" y="118" class="code-text" fill="#94a3b8">slow starts at head, fast at head -&gt; deletes 2 -&gt; returns [1]</text>

      <text x="15" y="146" class="note-text"><tspan fill="#38bdf8" font-weight="600">Complexity:</tspan> Time: <tspan fill="#34d399">O(N)</tspan> single-pass | Space: <tspan fill="#34d399">O(1)</tspan></text>
    </g>
  </g>
</svg>
