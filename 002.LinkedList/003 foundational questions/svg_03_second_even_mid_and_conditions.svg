<svg viewBox="0 0 840 480" xmlns="http://www.w3.org/2000/svg" width="100%" height="480" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrS3" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#090d16"/>

  <text x="25" y="30" fill="#38bdf8" font-size="15" font-weight="bold">Even Length LL (2nd Middle) &amp; Safe Loop Conditions</text>
  <text x="25" y="48" fill="#94a3b8" font-size="12">Standard LeetCode 876 implementation with Short-Circuit Null Safety</text>

  <!-- SECTION 1: 2nd MID SIMULATION (8 NODES) -->
  <g transform="translate(25, 65)">
    <rect width="790" height="180" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="22" fill="#a78bfa" font-size="13" font-weight="bold">Case 3: Even Length LL ➔ Finding 2nd Middle (Node 5) [LeetCode 876]</text>

    <g transform="translate(25, 45)">
      <!-- 8 Nodes -->
      <circle cx="20" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="20" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">1</text>
      <line x1="36" y1="30" x2="64" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <circle cx="80" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="80" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">2</text>
      <line x1="96" y1="30" x2="124" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <circle cx="140" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="140" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">3</text>
      <line x1="156" y1="30" x2="184" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <circle cx="200" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="200" y="34" fill="#94a3b8" font-size="11" text-anchor="middle">4</text>
      <text x="200" y="60" fill="#64748b" font-size="10" text-anchor="middle">1st mid</text>
      <line x1="216" y1="30" x2="244" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <!-- Node 5: 2nd MID (TARGET) -->
      <circle cx="260" cy="30" r="18" fill="#4c1d95" stroke="#a78bfa" stroke-width="2.5"/><text x="260" y="35" fill="#f5f3ff" font-size="12" font-weight="bold" text-anchor="middle">5</text>
      <text x="260" y="62" fill="#a78bfa" font-size="10" font-weight="bold" text-anchor="middle">2nd MID</text>
      <line x1="278" y1="30" x2="304" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <circle cx="320" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="320" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">6</text>
      <line x1="336" y1="30" x2="364" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <circle cx="380" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="380" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">7</text>
      <line x1="396" y1="30" x2="424" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <circle cx="440" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="440" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">8</text>
      <line x1="456" y1="30" x2="480" y2="30" stroke="#64748b" marker-end="url(#arrS3)"/>

      <!-- Fast lands on NULL -->
      <rect x="495" y="15" width="55" height="30" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="522" y="34" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">NULL</text>
      <text x="522" y="60" fill="#ef4444" font-size="10" font-weight="bold" text-anchor="middle">fast stops</text>
    </g>

    <!-- Condition summary -->
    <rect x="25" y="125" width="740" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="145" fill="#cbd5e1" font-size="12">🛑 <tspan font-weight="bold" fill="#a78bfa">2nd Middle Condition:</tspan> Stop when <tspan fill="#f43f5e" font-weight="bold" font-family="monospace">fast == nullptr</tspan> (for even list) or <tspan fill="#f43f5e" font-weight="bold" font-family="monospace">fast-&gt;next == nullptr</tspan> (for odd list).</text>
  </g>

  <!-- SECTION 2: NULL SAFETY & LOOP CONDITIONS COMPARISON -->
  <g transform="translate(25, 260)">
    <rect width="790" height="200" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="22" fill="#fbbf24" font-size="13" font-weight="bold">⚠️ Null Pointer Safety: Short-Circuit Order Rules</text>

    <!-- Code Comparison Boxes -->
    <g transform="translate(25, 38)">
      <!-- Correct Box -->
      <rect width="355" height="145" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
      <text x="15" y="22" fill="#a7f3d0" font-size="12" font-weight="bold">✅ CORRECT ORDER (Safe):</text>
      <rect x="15" y="32" width="325" height="32" rx="4" fill="#022c22"/>
      <text x="25" y="52" fill="#34d399" font-size="12" font-family="monospace">while (fast != NULL &amp;&amp; fast-&gt;next != NULL)</text>
      
      <text x="15" y="85" fill="#e2e8f0" font-size="11">1. Checks <tspan fill="#34d399">fast != NULL</tspan> first.</text>
      <text x="15" y="103" fill="#e2e8f0" font-size="11">2. If <tspan fill="#f87171">fast == NULL</tspan>, evaluation stops immediately!</text>
      <text x="15" y="121" fill="#a7f3d0" font-size="11">3. Prevents accessing memory of a null pointer.</text>
    </g>

    <g transform="translate(410, 38)">
      <!-- Incorrect Box -->
      <rect width="355" height="145" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
      <text x="15" y="22" fill="#fca5a5" font-size="12" font-weight="bold">❌ WRONG ORDER (Crashes / NPE):</text>
      <rect x="15" y="32" width="325" height="32" rx="4" fill="#2a0606"/>
      <text x="25" y="52" fill="#f87171" font-size="12" font-family="monospace">while (fast-&gt;next != NULL &amp;&amp; fast != NULL)</text>
      
      <text x="15" y="85" fill="#e2e8f0" font-size="11">1. Attempts to evaluate <tspan fill="#f87171">fast-&gt;next</tspan> first.</text>
      <text x="15" y="103" fill="#f87171" font-size="11">2. When fast reaches NULL ➔ NULL-&gt;next access!</text>
      <text x="15" y="121" fill="#fca5a5" font-weight="bold" font-size="11">💥 Causes Segmentation Fault / NullPointerException!</text>
    </g>
  </g>
</svg>
