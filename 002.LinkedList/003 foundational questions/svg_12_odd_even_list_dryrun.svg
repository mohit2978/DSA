<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .node-val { font-family: 'Segoe UI', monospace, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #ffffff; }
      .label-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .code-badge { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #fbbf24; }
      .desc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-odd" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-even" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#ec4899"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Title -->
  <g transform="translate(30, 35)">
    <text class="title">LeetCode 328: Odd Even Linked List (Index-Based Partitioning)</text>
    <text y="24" class="subtitle">Group nodes by index parity: 1st, 3rd, 5th... (Odd) followed by 2nd, 4th... (Even)</text>
  </g>

  <!-- Input List with Index Tags -->
  <g transform="translate(30, 80)">
    <rect width="940" height="125" class="card"/>
    <text x="20" y="25" class="section-title">Input Linked List (Indices 1 to 5)</text>

    <g transform="translate(40, 45)">
      <!-- Index 1: Node 1 -->
      <circle cx="40" cy="30" r="17" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <text x="40" y="30" class="node-val">1</text>
      <text x="40" y="62" class="label-text" fill="#60a5fa">Idx 1 (Odd)</text>
      <line x1="57" y1="30" x2="103" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Index 2: Node 2 -->
      <circle cx="120" cy="30" r="17" fill="#be185d" stroke="#f472b6" stroke-width="2"/>
      <text x="120" y="30" class="node-val">2</text>
      <text x="120" y="62" class="label-text" fill="#f472b6">Idx 2 (Even)</text>
      <line x1="137" y1="30" x2="183" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Index 3: Node 3 -->
      <circle cx="200" cy="30" r="17" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <text x="200" y="30" class="node-val">3</text>
      <text x="200" y="62" class="label-text" fill="#60a5fa">Idx 3 (Odd)</text>
      <line x1="217" y1="30" x2="263" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Index 4: Node 4 -->
      <circle cx="280" cy="30" r="17" fill="#be185d" stroke="#f472b6" stroke-width="2"/>
      <text x="280" y="30" class="node-val">4</text>
      <text x="280" y="62" class="label-text" fill="#f472b6">Idx 4 (Even)</text>
      <line x1="297" y1="30" x2="343" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Index 5: Node 5 -->
      <circle cx="360" cy="30" r="17" fill="#2563eb" stroke="#60a5fa" stroke-width="2"/>
      <text x="360" y="30" class="node-val">5</text>
      <text x="360" y="62" class="label-text" fill="#60a5fa">Idx 5 (Odd)</text>
      <line x1="377" y1="30" x2="415" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="435" y="34" class="node-val" fill="#64748b">null</text>
    </g>
  </g>

  <!-- Separation into Odd and Even Chains -->
  <g transform="translate(30, 220)">
    <rect width="940" height="225" class="card"/>
    <text x="20" y="25" class="section-title">Two Alternating Sentinel Chains (dummy1 for Odd, dummy2 for Even)</text>

    <!-- Odd Chain -->
    <g transform="translate(40, 45)">
      <circle cx="40" cy="30" r="16" fill="#334155"/>
      <text x="40" y="30" class="node-val">-101</text>
      <text x="40" y="60" class="label-text" fill="#94a3b8">dummy1 (h1)</text>
      <line x1="56" y1="30" x2="94" y2="30" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-odd)"/>

      <circle cx="110" cy="30" r="16" fill="#2563eb"/>
      <text x="110" y="30" class="node-val">1</text>
      <line x1="126" y1="30" x2="164" y2="30" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-odd)"/>

      <circle cx="180" cy="30" r="16" fill="#2563eb"/>
      <text x="180" y="30" class="node-val">3</text>
      <line x1="196" y1="30" x2="234" y2="30" stroke="#3b82f6" stroke-width="2" marker-end="url(#arrow-odd)"/>

      <circle cx="250" cy="30" r="16" fill="#2563eb"/>
      <text x="250" y="30" class="node-val">5</text>
      <text x="250" y="60" class="label-text" fill="#60a5fa">dummy1 tail</text>

      <text x="350" y="35" class="desc-text" fill="#93c5fd" font-weight="600">Odd Indices Chain: 1 ➔ 3 ➔ 5</text>
    </g>

    <!-- Even Chain -->
    <g transform="translate(40, 130)">
      <circle cx="40" cy="30" r="16" fill="#334155"/>
      <text x="40" y="30" class="node-val">-102</text>
      <text x="40" y="60" class="label-text" fill="#94a3b8">dummy2 (h2)</text>
      <line x1="56" y1="30" x2="94" y2="30" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-even)"/>

      <circle cx="110" cy="30" r="16" fill="#be185d"/>
      <text x="110" y="30" class="node-val">2</text>
      <line x1="126" y1="30" x2="164" y2="30" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-even)"/>

      <circle cx="180" cy="30" r="16" fill="#be185d"/>
      <text x="180" y="30" class="node-val">4</text>
      <text x="180" y="60" class="label-text" fill="#f472b6">dummy2 tail</text>
      <line x1="196" y1="30" x2="230" y2="30" stroke="#ec4899" stroke-width="2" marker-end="url(#arrow-even)"/>
      <text x="250" y="34" class="node-val" fill="#ec4899">null</text>

      <text x="350" y="35" class="desc-text" fill="#f472b6" font-weight="600">Even Indices Chain: 2 ➔ 4</text>
    </g>
  </g>

  <!-- Final Concatenation -->
  <g transform="translate(30, 460)">
    <rect width="940" height="195" class="card"/>
    <text x="20" y="25" class="section-title" fill="#10b981">Final Result: dummy1.next = h2.next &amp; return h1.next</text>

    <g transform="translate(40, 45)">
      <circle cx="40" cy="30" r="16" fill="#2563eb"/>
      <text x="40" y="30" class="node-val">1</text>
      <text x="40" y="60" class="label-text" fill="#60a5fa">head</text>
      <line x1="56" y1="30" x2="94" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="110" cy="30" r="16" fill="#2563eb"/>
      <text x="110" y="30" class="node-val">3</text>
      <line x1="126" y1="30" x2="164" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="180" cy="30" r="16" fill="#2563eb"/>
      <text x="180" y="30" class="node-val">5</text>

      <!-- Bridge arrow -->
      <path d="M 196 30 L 244 30" stroke="#fbbf24" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="220" y="18" class="label-text" fill="#fbbf24">join</text>

      <circle cx="260" cy="30" r="16" fill="#be185d"/>
      <text x="260" y="30" class="node-val">2</text>
      <line x1="276" y1="30" x2="314" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="330" cy="30" r="16" fill="#be185d"/>
      <text x="330" y="30" class="node-val">4</text>
      <line x1="346" y1="30" x2="380" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="400" y="34" class="node-val" fill="#64748b">null</text>
    </g>

    <g transform="translate(40, 125)">
      <rect width="860" height="50" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="30" class="desc-text"><tspan fill="#38bdf8" font-weight="600">Complexity &amp; Invariants:</tspan> Time: <tspan fill="#34d399">O(N)</tspan> single pass | Space: <tspan fill="#34d399">O(1)</tspan> | Relative order among odd group and even group strictly preserved.</text>
    </g>
  </g>
</svg>
