<svg viewBox="0 0 840 460" xmlns="http://www.w3.org/2000/svg" width="100%" height="460" style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#64748b"/>
    </marker>
    <marker id="sArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#38bdf8"/>
    </marker>
    <marker id="fArr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" rx="12" fill="#090d16"/>

  <text x="25" y="30" fill="#38bdf8" font-size="15" font-weight="bold">Odd Length LL vs Even Length LL (1st Middle)</text>
  <text x="25" y="48" fill="#94a3b8" font-size="12">Step-by-step pointer traces and exact stopping conditions</text>

  <!-- SECTION 1: ODD LENGTH (5 NODES) -->
  <g transform="translate(25, 65)">
    <rect width="790" height="175" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="22" fill="#10b981" font-size="13" font-weight="bold">Case 1: Odd Length Linked List (5 Nodes) ➔ Single Middle (Node 3)</text>

    <!-- Node Boxes -->
    <g transform="translate(30, 45)">
      <!-- 5 Nodes -->
      <!-- Node 1 -->
      <circle cx="20" cy="30" r="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <text x="20" y="35" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">1</text>
      <line x1="38" y1="30" x2="82" y2="30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Node 2 -->
      <circle cx="100" cy="30" r="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <text x="100" y="35" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">2</text>
      <line x1="118" y1="30" x2="162" y2="30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Node 3 (MID) -->
      <circle cx="180" cy="30" r="20" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/>
      <text x="180" y="35" fill="#a7f3d0" font-size="14" font-weight="bold" text-anchor="middle">3</text>
      <text x="180" y="65" fill="#10b981" font-size="11" font-weight="bold" text-anchor="middle">MID</text>
      <line x1="200" y1="30" x2="242" y2="30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Node 4 -->
      <circle cx="260" cy="30" r="18" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <text x="260" y="35" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">4</text>
      <line x1="278" y1="30" x2="322" y2="30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

      <!-- Node 5 (TAIL) -->
      <circle cx="340" cy="30" r="18" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
      <text x="340" y="35" fill="#fca5a5" font-size="13" font-weight="bold" text-anchor="middle">5</text>
      <line x1="358" y1="30" x2="395" y2="30" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="420" y="34" fill="#94a3b8" font-size="11">NULL</text>

      <!-- Step Traces on the Right -->
      <g transform="translate(480, 0)">
        <text x="0" y="15" fill="#cbd5e1" font-size="11" font-weight="bold">Step-by-Step Traversal:</text>
        <text x="0" y="35" fill="#94a3b8" font-size="11">• Start: <tspan fill="#38bdf8">slow = 1</tspan>, <tspan fill="#ef4444">fast = 1</tspan></text>
        <text x="0" y="55" fill="#94a3b8" font-size="11">• Step 1: <tspan fill="#38bdf8">slow = 2</tspan>, <tspan fill="#ef4444">fast = 3</tspan></text>
        <text x="0" y="75" fill="#94a3b8" font-size="11">• Step 2: <tspan fill="#10b981" font-weight="bold">slow = 3</tspan>, <tspan fill="#ef4444">fast = 5</tspan></text>
      </g>
    </g>

    <!-- Stop Condition Box -->
    <rect x="25" y="125" width="740" height="36" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="148" fill="#cbd5e1" font-size="12">🛑 <tspan font-weight="bold" fill="#fbbf24">Stop Condition for Odd LL:</tspan> Stop when <tspan fill="#ef4444" font-weight="bold" font-family="monospace">fast-&gt;next == nullptr</tspan>. Slow pointer is at exact middle (Node 3).</text>
  </g>

  <!-- SECTION 2: EVEN LENGTH (8 NODES) - FIRST MIDDLE -->
  <g transform="translate(25, 255)">
    <rect width="790" height="185" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="15" y="22" fill="#38bdf8" font-size="13" font-weight="bold">Case 2: Even Length LL (8 Nodes) ➔ Finding 1st Middle (Node 4)</text>

    <!-- 8 Nodes representation -->
    <g transform="translate(25, 45)">
      <!-- Loop over 8 nodes simplified -->
      <circle cx="20" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="20" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">1</text>
      <line x1="36" y1="30" x2="64" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <circle cx="80" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="80" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">2</text>
      <line x1="96" y1="30" x2="124" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <circle cx="140" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="140" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">3</text>
      <line x1="156" y1="30" x2="184" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <!-- Node 4: 1st MID -->
      <circle cx="200" cy="30" r="18" fill="#064e3b" stroke="#10b981" stroke-width="2.5"/><text x="200" y="35" fill="#a7f3d0" font-size="12" font-weight="bold" text-anchor="middle">4</text>
      <text x="200" y="62" fill="#10b981" font-size="10" font-weight="bold" text-anchor="middle">1st MID</text>
      <line x1="218" y1="30" x2="244" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <!-- Node 5: 2nd MID -->
      <circle cx="260" cy="30" r="16" fill="#1e1b4b" stroke="#6366f1"/><text x="260" y="34" fill="#c7d2fe" font-size="11" text-anchor="middle">5</text>
      <text x="260" y="62" fill="#818cf8" font-size="10" text-anchor="middle">2nd mid</text>
      <line x1="276" y1="30" x2="304" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <circle cx="320" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="320" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">6</text>
      <line x1="336" y1="30" x2="364" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <!-- Node 7: Fast stops here -->
      <circle cx="380" cy="30" r="16" fill="#450a0a" stroke="#ef4444" stroke-width="2"/><text x="380" y="34" fill="#fca5a5" font-size="11" font-weight="bold" text-anchor="middle">7</text>
      <line x1="396" y1="30" x2="424" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>

      <circle cx="440" cy="30" r="16" fill="#0f172a" stroke="#475569"/><text x="440" y="34" fill="#f8fafc" font-size="11" text-anchor="middle">8</text>
      <line x1="456" y1="30" x2="480" y2="30" stroke="#64748b" marker-end="url(#arrow)"/>
      <text x="500" y="34" fill="#94a3b8" font-size="11">NULL</text>

      <!-- Fast jump arc -->
      <path d="M 380 12 C 400 -8, 480 -8, 500 20" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
      <text x="450" y="0" fill="#fca5a5" font-size="10">fast->next->next is NULL</text>
    </g>

    <!-- Stop Condition Box -->
    <rect x="25" y="130" width="740" height="42" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="35" y="148" fill="#cbd5e1" font-size="12">🛑 <tspan font-weight="bold" fill="#38bdf8">1st Middle Condition (Even LL):</tspan> Stop when <tspan fill="#34d399" font-weight="bold" font-family="monospace">fast-&gt;next-&gt;next == nullptr</tspan>.</text>
    <text x="35" y="164" fill="#94a3b8" font-size="11">Used when splitting a list into equal halves (e.g., Merge Sort on LL, Palindrome Linked List).</text>
  </g>
</svg>
