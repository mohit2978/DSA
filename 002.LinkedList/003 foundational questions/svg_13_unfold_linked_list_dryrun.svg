<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 750" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0f172a; }
      .card { fill: #1e293b; stroke: #334155; stroke-width: 1.5; rx: 12; }
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: 700; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .section-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; }
      .node-val { font-family: 'Segoe UI', monospace, sans-serif; font-size: 15px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #ffffff; }
      .label-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 600; text-anchor: middle; }
      .code-badge { font-family: 'Fira Code', Consolas, monospace; font-size: 11px; fill: #fbbf24; }
      .desc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrow-pink" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#f43f5e"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" class="bg" rx="16"/>

  <!-- Title -->
  <g transform="translate(30, 35)">
    <text class="title">Unfold of Reorder Linked List (Inverse of Reorder List)</text>
    <text y="24" class="subtitle">Transform [1 ➔ 7 ➔ 2 ➔ 6 ➔ 3 ➔ 5 ➔ 4] back into [1 ➔ 2 ➔ 3 ➔ 4 ➔ 5 ➔ 6 ➔ 7]</text>
  </g>

  <!-- Step 1: Input & Alternating Extraction -->
  <g transform="translate(30, 80)">
    <rect width="940" height="135" class="card"/>
    <text x="20" y="25" class="section-title">Step 1: Input Folded List &amp; Parity Distribution</text>

    <g transform="translate(40, 45)">
      <!-- 1 -->
      <circle cx="35" cy="30" r="16" fill="#0284c7"/>
      <text x="35" y="30" class="node-val">1</text>
      <line x1="51" y1="30" x2="94" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 7 -->
      <circle cx="110" cy="30" r="16" fill="#be123c"/>
      <text x="110" y="30" class="node-val">7</text>
      <line x1="126" y1="30" x2="169" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 2 -->
      <circle cx="185" cy="30" r="16" fill="#0284c7"/>
      <text x="185" y="30" class="node-val">2</text>
      <line x1="201" y1="30" x2="244" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 6 -->
      <circle cx="260" cy="30" r="16" fill="#be123c"/>
      <text x="260" y="30" class="node-val">6</text>
      <line x1="276" y1="30" x2="319" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 3 -->
      <circle cx="335" cy="30" r="16" fill="#0284c7"/>
      <text x="335" y="30" class="node-val">3</text>
      <line x1="351" y1="30" x2="394" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 5 -->
      <circle cx="410" cy="30" r="16" fill="#be123c"/>
      <text x="410" y="30" class="node-val">5</text>
      <line x1="426" y1="30" x2="469" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- 4 -->
      <circle cx="485" cy="30" r="16" fill="#0284c7"/>
      <text x="485" y="30" class="node-val">4</text>
      <line x1="501" y1="30" x2="530" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="545" y="34" class="node-val" fill="#64748b">null</text>
    </g>
  </g>

  <!-- Step 2: Split into Two Lists -->
  <g transform="translate(30, 230)">
    <rect width="940" height="235" class="card"/>
    <text x="20" y="25" class="section-title">Step 2: Two Partitioned Lists (Odd Indices vs Even Indices)</text>

    <!-- First Half: 1 -> 2 -> 3 -> 4 -->
    <g transform="translate(40, 45)">
      <circle cx="35" cy="30" r="15" fill="#334155"/>
      <text x="35" y="30" class="node-val">-101</text>
      <text x="35" y="60" class="label-text" fill="#94a3b8">dummy1</text>
      <line x1="50" y1="30" x2="85" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="100" cy="30" r="15" fill="#0284c7"/>
      <text x="100" y="30" class="node-val">1</text>
      <line x1="115" y1="30" x2="150" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="165" cy="30" r="15" fill="#0284c7"/>
      <text x="165" y="30" class="node-val">2</text>
      <line x1="180" y1="30" x2="215" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="230" cy="30" r="15" fill="#0284c7"/>
      <text x="230" y="30" class="node-val">3</text>
      <line x1="245" y1="30" x2="280" y2="30" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow-blue)"/>

      <circle cx="295" cy="30" r="15" fill="#0284c7"/>
      <text x="295" y="30" class="node-val">4</text>
      <text x="295" y="60" class="label-text" fill="#38bdf8">d1 tail</text>

      <text x="380" y="35" class="desc-text" fill="#7dd3fc" font-weight="600">List 1 (Already Sorted): 1 ➔ 2 ➔ 3 ➔ 4</text>
    </g>

    <!-- Second Half (to be reversed): 7 -> 6 -> 5 -->
    <g transform="translate(40, 135)">
      <circle cx="35" cy="30" r="15" fill="#334155"/>
      <text x="35" y="30" class="node-val">-102</text>
      <text x="35" y="60" class="label-text" fill="#94a3b8">dummy2</text>
      <line x1="50" y1="30" x2="85" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-pink)"/>

      <circle cx="100" cy="30" r="15" fill="#be123c"/>
      <text x="100" y="30" class="node-val">7</text>
      <line x1="115" y1="30" x2="150" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-pink)"/>

      <circle cx="165" cy="30" r="15" fill="#be123c"/>
      <text x="165" y="30" class="node-val">6</text>
      <line x1="180" y1="30" x2="215" y2="30" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-pink)"/>

      <circle cx="230" cy="30" r="15" fill="#be123c"/>
      <text x="230" y="30" class="node-val">5</text>
      <line x1="245" y1="30" x2="275" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="295" y="34" class="node-val" fill="#64748b">null</text>

      <text x="380" y="35" class="desc-text" fill="#fda4af" font-weight="600">List 2 (Descending): 7 ➔ 6 ➔ 5  ➔  Needs Reversal!</text>
    </g>
  </g>

  <!-- Step 3: Reverse List 2 and Stitch -->
  <g transform="translate(30, 480)">
    <rect width="940" height="235" class="card"/>
    <text x="20" y="25" class="section-title" fill="#10b981">Step 3 &amp; 4: Reverse List 2 &amp; Attach to dummy1.next</text>

    <!-- Reversed List 2 -->
    <g transform="translate(40, 45)">
      <circle cx="35" cy="30" r="15" fill="#be123c"/>
      <text x="35" y="30" class="node-val">5</text>
      <line x1="50" y1="30" x2="85" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="100" cy="30" r="15" fill="#be123c"/>
      <text x="100" y="30" class="node-val">6</text>
      <line x1="115" y1="30" x2="150" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="165" cy="30" r="15" fill="#be123c"/>
      <text x="165" y="30" class="node-val">7</text>
      <line x1="180" y1="30" x2="210" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="230" y="34" class="node-val" fill="#64748b">null</text>

      <text x="300" y="35" class="desc-text" fill="#34d399" font-weight="600">Reversed: 5 ➔ 6 ➔ 7</text>
    </g>

    <!-- Full Final List -->
    <g transform="translate(40, 120)">
      <circle cx="35" cy="30" r="15" fill="#0284c7"/>
      <text x="35" y="30" class="node-val">1</text>
      <text x="35" y="60" class="label-text" fill="#38bdf8">head</text>
      <line x1="50" y1="30" x2="85" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="100" cy="30" r="15" fill="#0284c7"/>
      <text x="100" y="30" class="node-val">2</text>
      <line x1="115" y1="30" x2="150" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="165" cy="30" r="15" fill="#0284c7"/>
      <text x="165" y="30" class="node-val">3</text>
      <line x1="180" y1="30" x2="215" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="230" cy="30" r="15" fill="#0284c7"/>
      <text x="230" y="30" class="node-val">4</text>

      <!-- Connection Bridge -->
      <path d="M 245 30 L 290 30" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-green)"/>
      <text x="268" y="18" class="label-text" fill="#fbbf24">stitch</text>

      <circle cx="305" cy="30" r="15" fill="#be123c"/>
      <text x="305" y="30" class="node-val">5</text>
      <line x1="320" y1="30" x2="355" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="370" cy="30" r="15" fill="#be123c"/>
      <text x="370" y="30" class="node-val">6</text>
      <line x1="385" y1="30" x2="420" y2="30" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-green)"/>

      <circle cx="435" cy="30" r="15" fill="#be123c"/>
      <text x="435" y="30" class="node-val">7</text>
      <line x1="450" y1="30" x2="480" y2="30" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="500" y="34" class="node-val" fill="#64748b">null</text>
    </g>

    <g transform="translate(40, 185)">
      <rect width="860" height="35" rx="6" fill="#0f172a" stroke="#334155"/>
      <text x="15" y="22" class="desc-text"><tspan fill="#38bdf8" font-weight="600">Final Stitched Output:</tspan> 1 ➔ 2 ➔ 3 ➔ 4 ➔ 5 ➔ 6 ➔ 7 | <tspan fill="#34d399">O(N) Time, O(1) Space</tspan></text>
    </g>
  </g>
</svg>
