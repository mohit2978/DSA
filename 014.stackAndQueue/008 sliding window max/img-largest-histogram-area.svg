<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="420" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Largest Area of Histogram <tspan fill="#9aa0a6" font-weight="normal">— tell the area of the largest rectangle</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <rect x="25" y="48" width="500" height="300" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">heights = [2, 4, 5, 4, 6, 3], every bar has width 1</text>

  <!-- bars: baseline y=320, scale 36px per unit -->
  <g fill="#2b2b2b" stroke="#e06c75" stroke-width="2">
    <rect x="70"  y="248" width="66" height="72"/>
    <rect x="141" y="176" width="66" height="144"/>
    <rect x="212" y="140" width="66" height="180"/>
    <rect x="283" y="176" width="66" height="144"/>
    <rect x="354" y="104" width="66" height="216"/>
    <rect x="425" y="212" width="66" height="108"/>
  </g>
  <line x1="60" y1="320" x2="505" y2="320" stroke="#e06c75" stroke-width="2"/>
  <line x1="60" y1="80" x2="60" y2="320" stroke="#e06c75" stroke-width="2"/>

  <g fill="#d4d4d4" text-anchor="middle" font-size="14" font-weight="bold">
    <text x="103" y="242">2</text><text x="174" y="170">4</text><text x="245" y="134">5</text>
    <text x="316" y="170">4</text><text x="387" y="98">6</text><text x="458" y="206">3</text>
  </g>

  <!-- candidate rectangles -->
  <rect x="141" y="176" width="279" height="144" fill="none" stroke="#5b9bd5" stroke-width="3"/>
  <rect x="212" y="140" width="137" height="180" fill="none" stroke="#56c98d" stroke-width="3"/>
  <rect x="70"  y="212" width="421" height="108" fill="none" stroke="#f2c14e" stroke-width="3"/>

  <g fill="#9aa0a6" text-anchor="middle" font-size="11" font-family="monospace">
    <text x="103" y="338">0</text><text x="174" y="338">1</text><text x="245" y="338">2</text>
    <text x="316" y="338">3</text><text x="387" y="338">4</text><text x="458" y="338">5</text>
  </g>

  <!-- candidates panel -->
  <rect x="540" y="48" width="235" height="300" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="555" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Candidate rectangles</text>
  <line x1="555" y1="80" x2="760" y2="80" stroke="#333333" stroke-width="1"/>

  <rect x="555" y="98" width="18" height="14" fill="none" stroke="#5b9bd5" stroke-width="3"/>
  <text x="585" y="111" fill="#5b9bd5" font-family="monospace" font-size="14" font-weight="bold">4 x 4 = 16</text>
  <text x="555" y="132" fill="#9aa0a6" font-size="11.5">height 4, bars 1..4 (width 4)</text>

  <rect x="555" y="156" width="18" height="14" fill="none" stroke="#56c98d" stroke-width="3"/>
  <text x="585" y="169" fill="#56c98d" font-family="monospace" font-size="14" font-weight="bold">3 x 5 = 15</text>
  <text x="555" y="190" fill="#9aa0a6" font-size="11.5">height 5, bars 2..4 (width 3)</text>

  <rect x="555" y="214" width="18" height="14" fill="none" stroke="#f2c14e" stroke-width="3"/>
  <text x="585" y="227" fill="#f2c14e" font-family="monospace" font-size="14" font-weight="bold">6 x 2 = 12</text>
  <text x="555" y="248" fill="#9aa0a6" font-size="11.5">height 2, all 6 bars (width 6)</text>

  <line x1="555" y1="272" x2="760" y2="272" stroke="#333333" stroke-width="1"/>
  <text x="555" y="296" fill="#56c98d" font-size="15" font-weight="bold">Max &#8594; 16</text>
  <text x="555" y="322" fill="#9aa0a6" font-size="11.5">For every bar, extend as far left and</text>
  <text x="555" y="338" fill="#9aa0a6" font-size="11.5">right as its height allows.</text>

  <rect x="25" y="362" width="750" height="46" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="390" fill="#d4d4d4" font-size="13">The width of the rectangle through bar <tspan font-family="monospace">i</tspan> is bounded by the <tspan fill="#5b9bd5" font-weight="bold">next smaller element on the left</tspan> and the <tspan fill="#56c98d" font-weight="bold">next smaller element on the right</tspan>, which is why it reduces to the same stack pattern.</text>
</svg>
