<svg xmlns="http://www.w3.org/2000/svg" width="780" height="460" viewBox="0 0 780 460" role="img" aria-labelledby="title desc"><title id="title">Bitset examples</title><desc id="desc">Operation | Before | After / result. Construct from 7 | 8 bits | 00000111; Construct from 101010 | 8 bits | 00101010; Set index 1 | 0000 | 0010; Set indices 0 and 2 | 0000 | 0101; test(1), test(0) | 0101 | false, true; set all | 0101 | 1111; reset all | 1111 | 0000; flip all | 1010 | 0101</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Bitset examples</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Operation</text><text x="255" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Before</text><text x="365" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">After / result</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Construct from 7</text><text x="255" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8 bits</text><text x="365" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00000111</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Construct from 101010</text><text x="255" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8 bits</text><text x="365" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00101010</text><rect x="24" y="184" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Set index 1</text><text x="255" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0000</text><text x="365" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0010</text><rect x="24" y="224" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Set indices 0 and 2</text><text x="255" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0000</text><text x="365" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0101</text><rect x="24" y="264" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">test(1), test(0)</text><text x="255" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0101</text><text x="365" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">false, true</text><rect x="24" y="304" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">set all</text><text x="255" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0101</text><text x="365" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1111</text><rect x="24" y="344" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">reset all</text><text x="255" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1111</text><text x="365" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0000</text><rect x="24" y="384" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="410" font-family="Consolas,monospace" font-size="15" fill="#0f172a">flip all</text><text x="255" y="410" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1010</text><text x="365" y="410" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0101</text></svg>