<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc"><title id="title">XOR swap: a = 4, b = 6</title><desc id="desc">Operation | a | b. initial | 4 | 6; a = a XOR b | 2 | 6; b = b XOR a | 2 | 4; a = a XOR b | 6 | 4</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">XOR swap: a = 4, b = 6</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Operation</text><text x="165" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">a</text><text x="275" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">b</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">initial</text><text x="165" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4</text><text x="275" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">6</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">a = a XOR b</text><text x="165" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">2</text><text x="275" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">6</text><rect x="24" y="184" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">b = b XOR a</text><text x="165" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">2</text><text x="275" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4</text><rect x="24" y="224" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="250" font-family="Consolas,mo