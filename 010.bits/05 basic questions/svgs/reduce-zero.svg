<svg xmlns="http://www.w3.org/2000/svg" width="780" height="220" viewBox="0 0 780 220" role="img" aria-labelledby="title desc"><title id="title">Reduce to zero: 14 and 8</title><desc id="desc">Input | Path | Bit length / ones | Steps. 14 | 14 -&gt; 7 -&gt; 6 -&gt; 3 -&gt; 2 -&gt; 1 -&gt; 0 | 4 / 3 | 4+3-1 = 6; 8 | 8 -&gt; 4 -&gt; 2 -&gt; 1 -&gt; 0 | 4 / 1 | 4+1-1 = 4</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Reduce to zero: 14 and 8</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Input</text><text x="146" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Path</text><text x="464" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Bit length / ones</text><text x="647" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Steps</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">14</text><text x="146" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">14 -&gt; 7 -&gt; 6 -&gt; 3 -&gt; 2 -&gt; 1 -&gt; 0</text><text x="464" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4 / 3</text><text x="647" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4+3-1 = 6</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8</text><text x="146" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8 -&gt; 4 -&gt; 2 -&gt; 1 -&gt; 0</text><text x="464" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4 / 1</text><text x="647" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4+1-1 = 4</text></svg>