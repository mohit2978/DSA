<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc"><title id="title">All ordered pair sums for [a, b, c, d]</title><desc id="desc">First value | + a | + b | + c | + d. a | 2a remains | a+b cancels | a+c cancels | a+d cancels; b | b+a cancels | 2b remains | b+c cancels | b+d cancels; c | c+a cancels | c+b cancels | 2c remains | c+d cancels; d | d+a cancels | d+b cancels | d+c cancels | 2d remains</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">All ordered pair sums for [a, b, c, d]</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">First value</text><text x="165" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">+ a</text><text x="294" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">+ b</text><text x="423" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">+ c</text><text x="552" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">+ d</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">a</text><text x="165" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">2a remains</text><text x="294" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">a+b cancels</text><text x="423" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">a+c cancels</text><text x="552" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">a+d cancels</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">b</text><text x="165" y="170" font-family="Consolas,monosp