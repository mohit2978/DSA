<svg xmlns="http://www.w3.org/2000/svg" width="849" height="420" viewBox="0 0 849 420" role="img" aria-labelledby="title desc"><title id="title">Existing demonstration: n = 12 and swap (5, 9)</title><desc id="desc">Step | Calculation | Result. Decimal to binary | 12 / 2 = 6 r0; 6 / 2 = 3 r0 | 3 / 2 = 1 r1; 1 / 2 = 0 r1 -&gt; 1100; Test index 3 | 1100 &amp; 1000 | 1000: true; Set index 0 | 1100 | 0001 | 1101 = 13; Clear index 0 | 1101 &amp; ...1110 | 1100 = 12; Toggle index 0 | 1100 ^ 0001 | 1101 = 13; Remove rightmost 1 | 1100 &amp; 1011 | 1000 = 8; Swap x=5, y=9 | x ^= y; y ^= x; x ^= y | (12,9) -&gt; (12,5) -&gt; (9,5)</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Existing demonstration: n = 12 and swap (5, 9)</text><rect x="24" y="64" width="801" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Step</text><text x="228" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Calculation</text><text x="501" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Result</text><rect x="24" y="104" width="801" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Decimal to binary</text><text x="228" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">12 / 2 = 6 r0; 6 / 2 = 3 r0</text><text x="501" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">3 / 2 = 1 r1; 1 / 2 = 0 r1 -&gt; 1100</text><rect x="24" y="144" width="801" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Test index 3</text><text x="228" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1100 &amp; 1000</text><text x="501" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1000: true</text><rect x="24" y="184" width="801" height="40" rx="3" fill="#ffffff"/><text x="36" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Set index 0</text><text x="228" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1100 | 0001</text><text x="501" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1101 = 13</text><rect x="24" y="224" width="801" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Clear index 0</text><text x="228" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1101 &amp; ...1110</text><text x="501" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1100 = 12</text><rect x="24" y="264" width="801" height="40" rx="3" fill="#ffffff"/><text x="36" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Toggle index 0</text><text x="228" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1100 ^ 0001</text><text x="501" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1101 = 13</text><rect x="24" y="304" width="801" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Remove rightmost 1</text><text x="228" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1100 &amp; 1011</text><text x="501" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1000 = 8</text><rect x="24" y="344" width="801" height="40" rx="3" fill="#ffffff"/><text x="36" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Swap x=5, y=9</text><text x="228" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">x ^= y; y ^= x; x ^= y</text><text x="501" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">(12,9) -&gt; (12,5) -&gt; (9,5)</text></svg>