<svg xmlns="http://www.w3.org/2000/svg" width="780" height="500" viewBox="0 0 780 500" role="img" aria-labelledby="title desc"><title id="title">Binary representation and fixed-width shifts</title><desc id="desc">Operation | Before | After / value. 4-bit signed | 1000 | -8; 4-bit signed | 1101 | -3; 4-bit signed | 1001 | -7; Store 10 in 4 / 8 bits | 1010 | -6 / 00001010 = 10; Store 16 in 4 / 8 bits | 10000 | 0000 / 00010000; 8-bit left shift by 3 | 00011011 | 11011000; Shift left again by 3 | 11011000 | 11000000; 8-bit arithmetic right by 3 | 10101010 | 11110101; 8-bit logical right by 3 | 10101010 | 00010101</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Binary representation and fixed-width shifts</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Operation</text><text x="309" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Before</text><text x="419" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">After / value</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4-bit signed</text><text x="309" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1000</text><text x="419" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">-8</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4-bit signed</text><text x="309" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1101</text><text x="419" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">-3</text><rect x="24" y="184" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">4-bit signed</text><text x="309" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1001</text><text x="419" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">-7</text><rect x="24" y="224" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Store 10 in 4 / 8 bits</text><text x="309" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1010</text><text x="419" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">-6 / 00001010 = 10</text><rect x="24" y="264" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Store 16 in 4 / 8 bits</text><text x="309" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">10000</text><text x="419" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0000 / 00010000</text><rect x="24" y="304" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8-bit left shift by 3</text><text x="309" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00011011</text><text x="419" y="330" font-family="Consolas,monospace" font-size="15" fill="#0f172a">11011000</text><rect x="24" y="344" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Shift left again by 3</text><text x="309" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">11011000</text><text x="419" y="370" font-family="Consolas,monospace" font-size="15" fill="#0f172a">11000000</text><rect x="24" y="384" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="410" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8-bit arithmetic right by 3</text><text x="309" y="410" font-family="Consolas,monospace" font-size="15" fill="#0f172a">10101010</text><text x="419" y="410" font-family="Consolas,monospace" font-size="15" fill="#0f172a">11110101</text><rect x="24" y="424" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="450" font-family="Consolas,monospace" font-size="15" fill="#0f172a">8-bit logical right by 3</text><text x="309" y="450" font-family="Consolas,monospace" font-size="15" fill="#0f172a">10101010</text><text x="419" y="450" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00010101</text></svg>