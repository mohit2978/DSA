<svg xmlns="http://www.w3.org/2000/svg" width="780" height="340" viewBox="0 0 780 340" role="img" aria-labelledby="title desc"><title id="title">Highest set bit: 101010 (42)</title><desc id="desc">Step | Binary / value. n | 101010 = 42; n OR (n &gt;&gt; 1) | 111111 = 63; Further spreading | 111111 = 63; Add 1 | 1000000 = 64; Shift right once | 100000 = 32</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Highest set bit: 101010 (42)</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Step</text><text x="219" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Binary / value</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">n</text><text x="219" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">101010 = 42</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">n OR (n &gt;&gt; 1)</text><text x="219" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">111111 = 63</text><rect x="24" y="184" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Further spreading</text><text x="219" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">111111 = 63</text><rect x="24" y="224" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Add 1</text><text x="219" y="250" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1000000 = 64</text><rect x="24" y="264" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Shift right once</text><text x="219" y="290" font-family="Consolas,monospace" font-size="15" fill="#0f172a">100000 = 32</text></svg>