<svg xmlns="http://www.w3.org/2000/svg" width="780" height="220" viewBox="0 0 780 220" role="img" aria-labelledby="title desc"><title id="title">Minimum bit flips: the two complete examples</title><desc id="desc">Example | Step 0 | Step 1 | Step 2 | Step 3. 10 -&gt; 7 | 1010 | 1011 | 1111 | 0111; 3 -&gt; 4 | 011 | 010 | 000 | 100</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Minimum bit flips: the two complete examples</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Example</text><text x="146" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Step 0</text><text x="256" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Step 1</text><text x="366" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Step 2</text><text x="476" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Step 3</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">10 -&gt; 7</text><text x="146" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1010</text><text x="256" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1011</text><text x="366" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">1111</text><text x="476" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">0111</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">3 -&gt; 4</text><text x="146" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">011</text><text x="256" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">010</text