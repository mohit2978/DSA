<svg xmlns="http://www.w3.org/2000/svg" width="780" height="300" viewBox="0 0 780 300" role="img" aria-labelledby="title desc"><title id="title">Swap adjacent bits: 23 and 182</title><desc id="desc">Stage | N = 23 | N = 182. Input | 00010111 | 10110110; AND 10101010, then &gt;&gt; 1 | 00000001 | 01010001; AND 01010101, then &lt;&lt; 1 | 00101010 | 00101000; OR result | 00101011 = 43 | 01111001 = 121</desc><rect width="100%" height="100%" fill="#f8fafc"/><text x="24" y="36" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#0f172a">Swap adjacent bits: 23 and 182</text><rect x="24" y="64" width="732" height="40" rx="3" fill="#164e63"/><text x="36" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">Stage</text><text x="273" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">N = 23</text><text x="420" y="90" font-family="Consolas,monospace" font-size="15" fill="#ffffff">N = 182</text><rect x="24" y="104" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">Input</text><text x="273" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00010111</text><text x="420" y="130" font-family="Consolas,monospace" font-size="15" fill="#0f172a">10110110</text><rect x="24" y="144" width="732" height="40" rx="3" fill="#e2e8f0"/><text x="36" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">AND 10101010, then &gt;&gt; 1</text><text x="273" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00000001</text><text x="420" y="170" font-family="Consolas,monospace" font-size="15" fill="#0f172a">01010001</text><rect x="24" y="184" width="732" height="40" rx="3" fill="#ffffff"/><text x="36" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">AND 01010101, then &lt;&lt; 1</text><text x="273" y="210" font-family="Consolas,monospace" font-size="15" fill="#0f172a">00101010</text><text x=