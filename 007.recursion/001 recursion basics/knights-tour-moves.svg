<svg xmlns="http://www.w3.org/2000/svg" width="850" height="430" viewBox="0 0 850 430"><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7c3aed"/></marker></defs><rect width="850" height="430" fill="white"/><text x="30" y="40" font-family="Arial" font-size="26" font-weight="700">Knight’s Tour: eight recursive choices</text><g transform="translate(45 75)" stroke="#334155" stroke-width="1.5"><path fill="#f8fafc" d="M0 0H300V300H0Z M60 0V300 M120 0V300 M180 0V300 M240 0V300 M0 60H300 M0 120H300 M0 180H300 M0 240H300"/></g><circle cx="195" cy="225" r="12" fill="#111827"/><g stroke="#7c3aed" stroke-width="4" marker-end="url(#a)"><path d="M195 225L255 105"/><path d="M195 225L315 165"/><path d="M195 225L315 285"/><path d="M195 225L255 345"/><path d="M195 225L135 345"/><path d="M195 225L75 285"/><path d="M195 225L75 165"/><path d="M195 225L135 105"/></g><g font-family="Arial" font-size="19"><text x="390" y="100">Try the eight moves in the required order.</text><text x="390" y="140">Place the move number in the current cell.</text><text x="390" y="180">Recurse to every safe, unvisited destination.</text><text x="390" y="220">Reset the cell to 0 while backtracking.</text><text x="390" y="275">When move = n², print the completed board.</text></g></svg>
