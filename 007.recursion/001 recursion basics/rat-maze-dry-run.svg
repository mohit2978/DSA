  <g font-family="Arial" font-size="18"><text x="60" y="105">S</text><text x="370" y="425">E</text></g><g font-family="Arial" font-size="20" fill="#0f172a"><text x="455" y="105" font-weight="700">Valid paths in sorted order</text><text x="455" y="150" fill="#dc2626">DDRDRR</text><text x="455" y="190" fill="#2563eb">DRDDRR</text><text x="455" y="245">A 0 is blocked; a 1 is open.</text><text x="455" y="285">Mark an open cell as 0 while exploring it,</text><text x="455" y="320">then restore it to 1 during backtracking.</text></g></svg>
