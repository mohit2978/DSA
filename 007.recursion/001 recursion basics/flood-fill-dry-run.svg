<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430"><rect width="900" height="430" fill="white"/><text x="30" y="40" font-family="Arial" font-size="26" font-weight="700">Flood fill backtracking on a 3 × 3 grid</text>
  <g transform="translate(45 75)" stroke="#334155" stroke-width="2"><path fill="#f8fafc" d="M0 0H300V300H0Z M100 0V300 M200 0V300 M0 100H300 M0 200H300"/><rect x="100" y="100" width="100" height="100" fill="#cbd5e1"/></g>
  <g font-family="Arial" font-size="18"><text x="65" y="105">S</text><text x="320" y="365">E</text><text x="163" y="235">blocked</text></g>
  <path d="M85 125H285V325" fill="none" stroke="#16a34a" stroke-width="6"/>
  <g font-family="Arial" font-size="20" fill="#0f172a"><text x="405" y="100" font-weight="700">At each recursive call</text><text x="405" y="140">1. Mark the current cell visited.</text><text x="405" y="178">2. Explore every valid, unvisited neighbour.</text><text x="405" y="216">3. Unmark the cell while returning.</text><text x="405" y="270">Unmarking restores the grid for another path.</text><text x="405" y="310">Without the visited mark, opposite moves can loop.</text></g></svg>
