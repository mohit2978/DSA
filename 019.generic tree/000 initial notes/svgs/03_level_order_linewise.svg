<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" font-family="monospace" font-size="13">
  <rect width="700" height="500" fill="#1e1e2e" rx="10"/>
  <text x="20" y="30" fill="#cba6f7" font-size="17" font-weight="bold">Level Order Linewise — Generic Tree</text>

  <text x="20" y="60" fill="#f9e2af" font-size="13" font-weight="bold">Idea: Print nodes level by level, each level on a new line.</text>
  <text x="20" y="80" fill="#cdd6f4">Take snapshot of current queue size (sz) at start of each level,</text>
  <text x="20" y="97" fill="#cdd6f4">process exactly sz nodes, then print newline.</text>

  <!-- Algorithm -->
  <rect x="20" y="110" width="360" height="165" fill="#313244" rx="8" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="35" y="130" fill="#89dceb" font-weight="bold">Algorithm:</text>
  <text x="35" y="150" fill="#cdd6f4">queue.add(root);</text>
  <text x="35" y="167" fill="#cdd6f4">while (q.size() &gt; 0) {</text>
  <text x="55" y="184" fill="#a6e3a1">  int sz = q.size();  // snapshot level size</text>
  <text x="55" y="201" fill="#cdd6f4">  while (sz-- &gt; 0) {</text>
  <text x="75" y="218" fill="#cdd6f4">    Node temp = q.remove();</text>
  <text x="75" y="235" fill="#a6e3a1">    // process (print)</text>
  <text x="75" y="252" fill="#a6e3a1">    // add children</text>
  <text x="55" y="265" fill="#cdd6f4">  }</text>
  <text x="35" y="270" fill="#cdd6f4">}</text>

  <!-- Dry Run Table -->
  <text x="400" y="120" fill="#f9e2af" font-size="13" font-weight="bold">Dry Run (Tree: 10 → [20,30,40]):</text>
  <rect x="400" y="128" width="280" height="145" fill="#313244" rx="6" stroke="#6c7086"/>
  <text x="415" y="148" fill="#89b4fa" font-weight="bold">Queue State        Output</text>
  <line x1="400" y1="155" x2="680" y2="155" stroke="#6c7086" stroke-width="1"/>
  <text x="415" y="170" fill="#cdd6f4">[10]               —</text>
  <text x="415" y="187" fill="#cdd6f4">sz=1: rem 10       10</text>
  <text x="415" y="204" fill="#a6e3a1">add 20,30,40       ↵</text>
  <text x="415" y="221" fill="#cdd6f4">[20,30,40]         —</text>
  <text x="415" y="238" fill="#cdd6f4">sz=3: rem 20,30,40 20 30 40</text>
  <text x="415" y="255" fill="#a6e3a1">no children added  ↵</text>
  <text x="415" y="270" fill="#f38ba8">Queue empty → done</text>

  <!-- Output box -->
  <rect x="20" y="295" width="660" height="55" fill="#181825" rx="6" stroke="#a6e3a1" stroke-width="1"/>
  <text x="35" y="317" fill="#f9e2af" font-size="13" font-weight="bold">Output:</text>
  <text x="100" y="317" fill="#a6e3a1">10</text>
  <text x="35" y="340" fill="#a6e3a1">         20 30 40</text>

  <!-- Time/Space -->
  <rect x="20" y="365" width="660" height="120" fill="#313244" rx="8" stroke="#cba6f7" stroke-width="1"/>
  <text x="35" y="385" fill="#cba6f7" font-size="13" font-weight="bold">Complexity:</text>
  <text x="35" y="405" fill="#f9e2af">Time:  O(N)  — each node is enqueued and dequeued exactly once</text>
  <text x="35" y="425" fill="#f9e2af">Space: O(W)  — W = max width of tree (max nodes at any level)</text>
  <text x="55" y="445" fill="#6c7086">       Best case O(1) (skewed tree), Worst case O(N) (complete tree)</text>
  <text x="55" y="465" fill="#6c7086">       The extra sz variable costs O(1), newlines cost O(L) = O(N).</text>
</svg>
