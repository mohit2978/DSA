<svg xmlns="http://www.w3.org/2000/svg" width="700" height="500" font-family="monospace" font-size="13">
  <rect width="700" height="500" fill="#1e1e2e" rx="10"/>
  <text x="20" y="30" fill="#cba6f7" font-size="17" font-weight="bold">Level Order Traversal (BFS) — Generic Tree</text>

  <!-- Algorithm box -->
  <rect x="20" y="45" width="300" height="130" fill="#313244" rx="8" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="35" y="65" fill="#f9e2af" font-size="13" font-weight="bold">Algorithm:</text>
  <text x="35" y="85" fill="#cdd6f4">1. Add root to Queue</text>
  <text x="35" y="105" fill="#cdd6f4">2. while (queue not empty) {</text>
  <text x="55" y="122" fill="#a6e3a1">   remove()    // dequeue front</text>
  <text x="55" y="139" fill="#a6e3a1">   process()   // print data</text>
  <text x="55" y="156" fill="#a6e3a1">   add children to queue</text>
  <text x="35" y="170" fill="#cdd6f4">}</text>

  <!-- Sample Tree -->
  <text x="350" y="65" fill="#f9e2af" font-size="13" font-weight="bold">Sample Tree:</text>
  <!-- root 10 -->
  <circle cx="500" cy="100" r="20" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="494" y="105" fill="#cdd6f4" font-size="13">10</text>
  <!-- 20 -->
  <circle cx="420" cy="170" r="20" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="414" y="175" fill="#cdd6f4" font-size="13">20</text>
  <!-- 30 -->
  <circle cx="500" cy="170" r="20" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="494" y="175" fill="#cdd6f4" font-size="13">30</text>
  <!-- 40 -->
  <circle cx="580" cy="170" r="20" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="574" y="175" fill="#cdd6f4" font-size="13">40</text>
  <!-- edges from 10 -->
  <line x1="483" y1="113" x2="437" y2="152" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="500" y1="120" x2="500" y2="150" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="517" y1="113" x2="563" y2="152" stroke="#6c7086" stroke-width="1.5"/>

  <!-- Queue visualization -->
  <text x="20" y="215" fill="#f9e2af" font-size="13" font-weight="bold">Queue State (during BFS):</text>
  <rect x="20" y="225" width="660" height="38" fill="#313244" rx="6" stroke="#6c7086" stroke-width="1"/>
  <text x="35" y="248" fill="#89b4fa">Start: [10]  →  Remove 10, add children: [20, 30, 40]  →  Remove 20: [30, 40]  →  ...</text>

  <!-- Output -->
  <text x="20" y="290" fill="#f9e2af" font-size="13" font-weight="bold">Output: 10 20 30 40</text>

  <!-- Java Code -->
  <text x="20" y="320" fill="#cba6f7" font-size="13" font-weight="bold">Java Code:</text>
  <rect x="20" y="330" width="660" height="155" fill="#181825" rx="8" stroke="#313244" stroke-width="1"/>
  <text x="35" y="350" fill="#89dceb">public static void levelOrder(Node root) {</text>
  <text x="55" y="370" fill="#cdd6f4">  Queue&lt;Node&gt; queue = new ArrayDeque&lt;Node&gt;();</text>
  <text x="55" y="387" fill="#cdd6f4">  queue.add(root);</text>
  <text x="55" y="404" fill="#cdd6f4">  while (queue.size() &gt; 0) {</text>
  <text x="75" y="421" fill="#cdd6f4">    Node temp = queue.remove();</text>
  <text x="75" y="438" fill="#a6e3a1">    System.out.print(temp.data + " "); // process</text>
  <text x="75" y="455" fill="#cdd6f4">    for (Node child : temp.children) queue.add(child); // add children</text>
  <text x="55" y="472" fill="#cdd6f4">  }</text>
  <text x="35" y="488" fill="#89dceb">}</text>
</svg>
