<svg xmlns="http://www.w3.org/2000/svg" width="780" height="640" font-family="monospace" font-size="13">
  <rect width="780" height="640" fill="#1e1e2e" rx="10"/>
  <text x="20" y="30" fill="#cba6f7" font-size="17" font-weight="bold">Construct Generic Tree from Array</text>

  <text x="20" y="58" fill="#f9e2af" font-size="13" font-weight="bold">Input Array:</text>
  <text x="135" y="58" fill="#cdd6f4">[10, 20, 50, -1, 60, -1, -1, 30, 70, -1, 80, 110, -1, 120, -1, -1, 90, -1, -1, 40, 100, -1, -1, -1]</text>

  <!-- Algorithm -->
  <rect x="20" y="70" width="420" height="155" fill="#313244" rx="8" stroke="#89b4fa" stroke-width="1.5"/>
  <text x="35" y="90" fill="#f9e2af" font-weight="bold">Algorithm (Stack-based):</text>
  <text x="35" y="110" fill="#cdd6f4">for each val in arr:</text>
  <text x="55" y="127" fill="#a6e3a1">  if val != -1:</text>
  <text x="75" y="144" fill="#cdd6f4">    create node(val), push onto stack</text>
  <text x="55" y="161" fill="#a6e3a1">  else (-1 encountered):</text>
  <text x="75" y="178" fill="#cdd6f4">    pop node from stack</text>
  <text x="75" y="195" fill="#cdd6f4">    if stack not empty: peek().children.add(popped)</text>
  <text x="75" y="212" fill="#cdd6f4">    else: root = popped</text>

  <!-- Dry Run Step by Step -->
  <text x="20" y="248" fill="#f9e2af" font-size="13" font-weight="bold">Dry Run (first segment: 10, 20, 50, -1, 60, -1, -1):</text>

  <!-- Step table -->
  <rect x="20" y="258" width="740" height="220" fill="#181825" rx="8" stroke="#313244"/>

  <!-- Header -->
  <rect x="20" y="258" width="740" height="24" fill="#313244" rx="0"/>
  <text x="30" y="275" fill="#89b4fa" font-weight="bold">Val</text>
  <text x="100" y="275" fill="#89b4fa" font-weight="bold">Action</text>
  <text x="370" y="275" fill="#89b4fa" font-weight="bold">Stack (top→bottom)</text>
  <text x="560" y="275" fill="#89b4fa" font-weight="bold">Tree</text>

  <!-- Rows -->
  <text x="30" y="298" fill="#a6e3a1">10</text>
  <text x="100" y="298" fill="#cdd6f4">create node(10), push</text>
  <text x="370" y="298" fill="#cdd6f4">[10]</text>
  <text x="560" y="298" fill="#6c7086">—</text>

  <text x="30" y="318" fill="#a6e3a1">20</text>
  <text x="100" y="318" fill="#cdd6f4">create node(20), push</text>
  <text x="370" y="318" fill="#cdd6f4">[20, 10]</text>
  <text x="560" y="318" fill="#6c7086">—</text>

  <text x="30" y="338" fill="#a6e3a1">50</text>
  <text x="100" y="338" fill="#cdd6f4">create node(50), push</text>
  <text x="370" y="338" fill="#cdd6f4">[50, 20, 10]</text>
  <text x="560" y="338" fill="#6c7086">—</text>

  <text x="30" y="358" fill="#f38ba8">-1</text>
  <text x="100" y="358" fill="#cdd6f4">pop 50; peek=20 → 20.children.add(50)</text>
  <text x="370" y="358" fill="#cdd6f4">[20, 10]</text>
  <text x="560" y="358" fill="#cdd6f4">20→[50]</text>

  <text x="30" y="378" fill="#a6e3a1">60</text>
  <text x="100" y="378" fill="#cdd6f4">create node(60), push</text>
  <text x="370" y="378" fill="#cdd6f4">[60, 20, 10]</text>
  <text x="560" y="378" fill="#cdd6f4">20→[50]</text>

  <text x="30" y="398" fill="#f38ba8">-1</text>
  <text x="100" y="398" fill="#cdd6f4">pop 60; peek=20 → 20.children.add(60)</text>
  <text x="370" y="398" fill="#cdd6f4">[20, 10]</text>
  <text x="560" y="398" fill="#cdd6f4">20→[50,60]</text>

  <text x="30" y="418" fill="#f38ba8">-1</text>
  <text x="100" y="418" fill="#cdd6f4">pop 20; peek=10 → 10.children.add(20)</text>
  <text x="370" y="418" fill="#cdd6f4">[10]</text>
  <text x="560" y="418" fill="#cdd6f4">10→[20→[50,60]]</text>

  <text x="30" y="445" fill="#6c7086">... (continues similarly for 30,40 and their subtrees)</text>
  <text x="30" y="462" fill="#f38ba8">-1</text>
  <text x="100" y="462" fill="#cdd6f4">final pop; stack empty → root = popped node</text>
  <text x="370" y="462" fill="#cdd6f4">[]</text>
  <text x="560" y="462" fill="#a6e3a1">root = 10</text>

  <!-- Final tree -->
  <text x="20" y="502" fill="#f9e2af" font-size="13" font-weight="bold">Final Tree:</text>
  <!-- root 10 -->
  <circle cx="390" cy="530" r="18" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="384" y="535" fill="#cdd6f4">10</text>
  <!-- 20 -->
  <circle cx="200" cy="590" r="18" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="194" y="595" fill="#cdd6f4">20</text>
  <!-- 30 -->
  <circle cx="390" cy="590" r="18" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="384" y="595" fill="#cdd6f4">30</text>
  <!-- 40 -->
  <circle cx="580" cy="590" r="18" fill="#45475a" stroke="#89b4fa" stroke-width="2"/>
  <text x="574" y="595" fill="#cdd6f4">40</text>
  <!-- edges -->
  <line x1="375" y1="546" x2="215" y2="574" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="390" y1="548" x2="390" y2="572" stroke="#6c7086" stroke-width="1.5"/>
  <line x1="405" y1="546" x2="565" y2="574" stroke="#6c7086" stroke-width="1.5"/>
  <!-- 20 children: 50, 60 -->
  <text x="100" y="635" fill="#6c7086" font-size="12">20→[50,60]  30→[70→[],80→[110,120],90]  40→[100]</text>
</svg>
