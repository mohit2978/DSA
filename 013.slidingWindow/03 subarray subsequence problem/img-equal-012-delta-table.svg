<svg viewBox="0 0 800 480" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="480" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Equal 0, 1 and 2 &#8212; the two-delta trick <tspan fill="#9aa0a6" font-weight="normal">str = "0102010"</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <text x="40" y="58" fill="#d4d4d4" font-size="13">Track cumulative counts C0, C1, C2 of '0','1','2'. Define <tspan fill="#5b9bd5" font-weight="bold">&#916;1 = C1&#8722;C0</tspan> and <tspan fill="#56c98d" font-weight="bold">&#916;2 = C2&#8722;C1</tspan>.</text>
  <text x="40" y="78" fill="#d4d4d4" font-size="13">If BOTH &#916;1 and &#916;2 repeat between two positions, the counts of 0, 1 and 2 in between are all equal.</text>

  <!-- table -->
  <g font-family="monospace" font-size="13">
    <!-- header -->
    <text x="70"  y="108" fill="#9aa0a6" text-anchor="middle">idx</text>
    <text x="70"  y="128" fill="#d4d4d4" text-anchor="middle">char</text>
    <text x="70"  y="150" fill="#5b9bd5" text-anchor="middle">C0</text>
    <text x="70"  y="172" fill="#f2c14e" text-anchor="middle">C1</text>
    <text x="70"  y="194" fill="#56c98d" text-anchor="middle">C2</text>
    <text x="70"  y="216" fill="#5b9bd5" text-anchor="middle">&#916;1</text>
    <text x="70"  y="238" fill="#56c98d" text-anchor="middle">&#916;2</text>

    <g text-anchor="middle" fill="#d4d4d4">
      <text x="150" y="108">0</text><text x="230" y="108">1</text><text x="310" y="108">2</text><text x="390" y="108">3</text>
      <text x="470" y="108">4</text><text x="550" y="108">5</text><text x="630" y="108">6</text>

      <text x="150" y="128">'0'</text><text x="230" y="128">'1'</text><text x="310" y="128">'0'</text><text x="390" y="128">'2'</text>
      <text x="470" y="128">'0'</text><text x="550" y="128">'1'</text><text x="630" y="128">'0'</text>

      <text x="150" y="150">1</text><text x="230" y="150">1</text><text x="310" y="150">2</text><text x="390" y="150">2</text>
      <text x="470" y="150">3</text><text x="550" y="150">3</text><text x="630" y="150">4</text>

      <text x="150" y="172">0</text><text x="230" y="172">1</text><text x="310" y="172">1</text><text x="390" y="172">1</text>
      <text x="470" y="172">1</text><text x="550" y="172">2</text><text x="630" y="172">2</text>

      <text x="150" y="194">0</text><text x="230" y="194">0</text><text x="310" y="194">0</text><text x="390" y="194">1</text>
      <text x="470" y="194">1</text><text x="550" y="194">1</text><text x="630" y="194">1</text>
    </g>

    <g text-anchor="middle" fill="#f0f0f0" font-weight="bold">
      <rect x="126" y="200" width="48" height="22" fill="#1c3040"/>
      <rect x="286" y="200" width="48" height="22" fill="#3a2323"/>
      <rect x="366" y="200" width="48" height="22" fill="#1c3040"/>
      <rect x="446" y="200" width="48" height="22" fill="#1c3040"/>
      <rect x="526" y="200" width="48" height="22" fill="#3a2323"/>
      <text x="150" y="216">-1</text><text x="230" y="216">0</text><text x="310" y="216">-1</text><text x="390" y="216">-1</text>
      <text x="470" y="216">-2</text><text x="550" y="216">-1</text><text x="630" y="216">-2</text>

      <rect x="126" y="222" width="48" height="22" fill="#233a2c"/>
      <rect x="286" y="222" width="48" height="22" fill="#233a2c"/>
      <text x="150" y="238">0</text><text x="230" y="238">-1</text><text x="310" y="238">-1</text><text x="390" y="238">0</text>
      <text x="470" y="238">0</text><text x="550" y="238">-1</text><text x="630" y="238">-1</text>
    </g>
  </g>
  <line x1="40" y1="250" x2="760" y2="250" stroke="#333333" stroke-width="1"/>

  <!-- explanations -->
  <rect x="25" y="264" width="750" height="200" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="288" fill="#f2c14e" font-size="13" font-weight="bold">Two matching pairs of (&#916;1, &#916;2) are found:</text>

  <text x="42" y="314" fill="#5b9bd5" font-size="13">index 0 &#8594; (&#916;1,&#916;2) = (&#8722;1, 0)</text>
  <text x="42" y="334" fill="#5b9bd5" font-size="13">index 3 &#8594; (&#916;1,&#916;2) = (&#8722;1, 0)   &#8592; SAME pair</text>
  <text x="42" y="356" fill="#56c98d" font-size="13" font-weight="bold">&#8658; substring at positions 1..3 = "1 0 2" has equal 0s, 1s, 2s</text>

  <text x="42" y="390" fill="#e06c75" font-size="13">index 2 &#8594; (&#916;1,&#916;2) = (&#8722;1, &#8722;1)</text>
  <text x="42" y="410" fill="#e06c75" font-size="13">index 5 &#8594; (&#916;1,&#916;2) = (&#8722;1, &#8722;1)   &#8592; SAME pair</text>
  <text x="42" y="432" fill="#56c98d" font-size="13" font-weight="bold">&#8658; substring at positions 3..5 = "2 0 1" has equal 0s, 1s, 2s</text>

  <text x="42" y="456" fill="#9aa0a6" font-size="12">These are exactly the two substrings the problem expects. The code stores each (&#916;1,&#916;2) pair as a string key "&#916;1#&#916;2" in a HashMap, seeded once with the pair at the very start (before any character is read).</text>
</svg>
