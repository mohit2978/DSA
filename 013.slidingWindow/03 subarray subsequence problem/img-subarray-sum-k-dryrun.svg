<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="560" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Subarray Sum Equals K &#8212; prefix-sum + HashMap dry run <tspan fill="#9aa0a6" font-weight="normal">nums = [2,3,2,4,2,6,1,4,5], k = 9</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- array -->
  <rect x="25" y="48" width="750" height="90" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <g font-family="monospace" font-size="12" fill="#9aa0a6" text-anchor="middle">
    <text x="80"  y="70">0</text><text x="165" y="70">1</text><text x="250" y="70">2</text><text x="335" y="70">3</text>
    <text x="420" y="70">4</text><text x="505" y="70">5</text><text x="590" y="70">6</text><text x="675" y="70">7</text><text x="750" y="70">8</text>
  </g>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="55"  y="78" width="50" height="34"/><rect x="140" y="78" width="50" height="34"/>
    <rect x="225" y="78" width="50" height="34"/><rect x="310" y="78" width="50" height="34"/>
    <rect x="395" y="78" width="50" height="34"/><rect x="480" y="78" width="50" height="34"/>
    <rect x="565" y="78" width="50" height="34"/><rect x="650" y="78" width="50" height="34"/>
    <rect x="725" y="78" width="50" height="34"/>
  </g>
  <g font-family="monospace" font-size="16" fill="#d4d4d4" text-anchor="middle" font-weight="bold">
    <text x="80"  y="101">2</text><text x="165" y="101">3</text><text x="250" y="101">2</text><text x="335" y="101">4</text>
    <text x="420" y="101">2</text><text x="505" y="101">6</text><text x="590" y="101">1</text><text x="675" y="101">4</text><text x="760" y="101">5</text>
  </g>

  <!-- highlighted subarrays -->
  <rect x="140" y="140" width="220" height="26" fill="none" stroke="#56c98d" stroke-width="2" rx="4"/>
  <text x="250" y="182" fill="#56c98d" font-size="12.5" text-anchor="middle">[3,2,4] = 9</text>

  <rect x="395" y="140" width="220" height="26" fill="none" stroke="#f2c14e" stroke-width="2" rx="4"/>
  <text x="505" y="182" fill="#f2c14e" font-size="12.5" text-anchor="middle">[2,6,1] = 9</text>

  <rect x="650" y="140" width="135" height="26" fill="none" stroke="#e06c75" stroke-width="2" rx="4"/>
  <text x="718" y="182" fill="#e06c75" font-size="12.5" text-anchor="middle">[4,5] = 9</text>

  <!-- trace table -->
  <rect x="25" y="210" width="750" height="270" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="232" fill="#f2c14e" font-size="13" font-weight="bold">Running prefix sum, and the map lookup sum &#8722; k at every step</text>
  <line x1="40" y1="242" x2="760" y2="242" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" font-size="12.5" fill="#d4d4d4">
    <text x="42"  y="264">i=0  sum=2   check mp[2-9=-7]  not found          mp={2:1}</text>
    <text x="42"  y="286">i=1  sum=5   check mp[5-9=-4]  not found          mp={2:1, 5:1}</text>
    <text x="42"  y="308">i=2  sum=7   check mp[7-9=-2]  not found          mp={2:1, 5:1, 7:1}</text>
    <text x="42"  y="332" fill="#56c98d">i=3  sum=11  check mp[11-9=2]  FOUND (mp[2]=1)  cnt=1   mp={...,11:1}</text>
    <text x="42"  y="354">i=4  sum=13  check mp[13-9=4]  not found          mp={...,13:1}</text>
    <text x="42"  y="376">i=5  sum=19  check mp[19-9=10] not found          mp={...,19:1}</text>
    <text x="42"  y="400" fill="#f2c14e">i=6  sum=20  check mp[20-9=11] FOUND (mp[11]=1) cnt=2   mp={...,20:1}</text>
    <text x="42"  y="422">i=7  sum=24  check mp[24-9=15] not found          mp={...,24:1}</text>
    <text x="42"  y="446" fill="#e06c75">i=8  sum=29  check mp[29-9=20] FOUND (mp[20]=1) cnt=3   mp={...,29:1}</text>
  </g>
  <text x="42" y="472" fill="#56c98d" font-size="14" font-weight="bold">Final answer: cnt = 3</text>
</svg>
