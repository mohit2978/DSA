<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="400" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Why we add mp[sum &#8722; k] (a COUNT), not just check if it exists</text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <text x="40" y="66" fill="#d4d4d4" font-size="13">The whole prefix up to the current index has total <tspan fill="#f2c14e" font-weight="bold">Sum</tspan>. Any EARLIER prefix ending in value <tspan fill="#5b9bd5" font-weight="bold">x</tspan> leaves a</text>
  <text x="40" y="86" fill="#d4d4d4" font-size="13">trailing piece of size <tspan fill="#56c98d" font-weight="bold">Sum &#8722; x</tspan>. That trailing piece is exactly k when <tspan fill="#5b9bd5" font-weight="bold">x = Sum &#8722; k</tspan>.</text>

  <!-- diagram: multiple earlier prefixes with same value x, all give valid subarrays -->
  <rect x="40" y="110" width="720" height="30" fill="none" stroke="#9aa0a6" stroke-width="1.5"/>
  <text x="400" y="130" fill="#9aa0a6" font-size="11" text-anchor="middle">array, left to right, current position at the right end (value = Sum)</text>

  <rect x="40" y="160" width="150" height="26" fill="#1c3040" stroke="#5b9bd5" stroke-width="2"/>
  <text x="115" y="178" fill="#d4d4d4" font-size="12" text-anchor="middle">prefix = x (1st time)</text>
  <rect x="190" y="160" width="570" height="26" fill="#1f3a2a" stroke="#56c98d" stroke-width="2"/>
  <text x="475" y="178" fill="#d4d4d4" font-size="12" text-anchor="middle">this whole stretch sums to k &#8594; valid subarray #1</text>

  <rect x="40" y="200" width="350" height="26" fill="#1c3040" stroke="#5b9bd5" stroke-width="2"/>
  <text x="215" y="218" fill="#d4d4d4" font-size="12" text-anchor="middle">prefix = x (2nd time, later)</text>
  <rect x="390" y="200" width="370" height="26" fill="#3a331f" stroke="#f2c14e" stroke-width="2"/>
  <text x="575" y="218" fill="#d4d4d4" font-size="12" text-anchor="middle">this shorter stretch ALSO sums to k &#8594; valid subarray #2</text>

  <text x="40" y="252" fill="#e06c75" font-size="13" font-weight="bold">Every earlier index whose prefix sum equals x produces one MORE distinct subarray of sum k ending here.</text>
  <text x="40" y="276" fill="#d4d4d4" font-size="13">A simple presence check (<tspan font-family="monospace">mp.find(x) != mp.end()</tspan>) can only ever add 1, so it silently drops all the</text>
  <text x="40" y="296" fill="#d4d4d4" font-size="13">extra subarrays. That is exactly why the code does <tspan font-family="monospace" fill="#56c98d">cnt += mp[sum-k]</tspan> &#8212; the stored value is a <tspan fill="#56c98d" font-weight="bold">frequency</tspan>, not a flag.</text>

  <rect x="25" y="320" width="750" height="60" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="346" fill="#f2c14e" font-size="13" font-weight="bold">This same pattern &#8212; count the frequency of (running value &#8722; target) &#8212; reappears</text>
  <text x="40" y="366" fill="#f2c14e" font-size="13" font-weight="bold">in almost every prefix-sum question below. It is worth memorising once and for all.</text>
</svg>
