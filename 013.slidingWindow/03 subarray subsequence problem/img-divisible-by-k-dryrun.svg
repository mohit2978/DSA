<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="560" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Subarray Sum Divisible by K &#8212; remainder dry run <tspan fill="#9aa0a6" font-weight="normal">arr = [2,7,1,5,4,-22,6,4,3,8], k = 5</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <text x="40" y="60" fill="#d4d4d4" font-size="13">Key fact: if <tspan font-family="monospace">S1 % k == S2 % k</tspan>, then <tspan font-family="monospace" fill="#56c98d">(S1 &#8722; S2) % k == 0</tspan> &#8212; so the subarray between them is divisible by k.</text>
  <text x="40" y="80" fill="#d4d4d4" font-size="13">We map by the <tspan fill="#f2c14e" font-weight="bold">remainder</tspan> itself (not by the raw sum). An empty prefix has remainder 0, so a prefix that is itself divisible by k also counts.</text>

  <!-- array -->
  <rect x="25" y="96" width="750" height="60" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <g font-family="monospace" font-size="13" fill="#d4d4d4" text-anchor="middle">
    <text x="80"  y="132">2</text><text x="155" y="132">7</text><text x="230" y="132">1</text><text x="305" y="132">5</text>
    <text x="380" y="132">4</text><text x="455" y="132">-22</text><text x="530" y="132">6</text><text x="605" y="132">4</text>
    <text x="680" y="132">3</text><text x="750" y="132">8</text>
  </g>

  <!-- trace -->
  <rect x="25" y="166" width="750" height="340" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="188" fill="#f2c14e" font-size="13" font-weight="bold">map starts empty. Trace sum, remainder, and the "if rem==0 cnt++" plus map lookup:</text>
  <line x1="40" y1="198" x2="760" y2="198" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" font-size="12.5" fill="#d4d4d4">
    <text x="42" y="220">v=2    sum=2   rem=2                            map={2:1}                    cnt=0</text>
    <text x="42" y="242">v=7    sum=9   rem=4                            map={2:1,4:1}                cnt=0</text>
    <text x="42" y="264" fill="#56c98d">v=1    sum=10  rem=0  &#8594; rem==0, cnt++            map={2:1,4:1,0:1}            cnt=1</text>
    <text x="42" y="286" fill="#56c98d">v=5    sum=15  rem=0  &#8594; cnt++, then +mp[0]=1     map={2:1,4:1,0:2}            cnt=3</text>
    <text x="42" y="308" fill="#56c98d">v=4    sum=19  rem=4  &#8594; found mp[4]=1            map={2:1,4:2,0:2}            cnt=4</text>
    <text x="42" y="330" fill="#e06c75">v=-22  sum=-3  rem=-3%5=-3, +k &#8594; rem=2</text>
    <text x="60" y="350" fill="#e06c75">              found mp[2]=1                 map={2:2,4:2,0:2}            cnt=5</text>
    <text x="42" y="372">v=6    sum=3   rem=3                            map={2:2,4:2,0:2,3:1}        cnt=5</text>
    <text x="42" y="394" fill="#f2c14e">v=4    sum=7   rem=2  &#8594; found mp[2]=2            map={2:3,4:2,0:2,3:1}        cnt=7</text>
    <text x="42" y="416" fill="#f2c14e">v=3    sum=10  rem=0  &#8594; cnt++, then +mp[0]=2     map={2:3,4:2,0:3,3:1}        cnt=10</text>
    <text x="42" y="438" fill="#f2c14e">v=8    sum=18  rem=3  &#8594; found mp[3]=1            map={2:3,4:2,0:3,3:2}        cnt=11</text>
  </g>
  <line x1="40" y1="452" x2="760" y2="452" stroke="#333333" stroke-width="1"/>
  <text x="42" y="474" fill="#56c98d" font-size="14" font-weight="bold">Final answer: cnt = 11</text>
  <text x="42" y="496" fill="#9aa0a6" font-size="12">Whenever a language's <tspan font-family="monospace">%</tspan> can return a negative result (C++, Java) for a negative dividend, add k back to fix it.</text>
</svg>
