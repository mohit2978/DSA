<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="470" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Dynamic Programming <tspan fill="#9aa0a6" font-weight="normal">— what it is, and the order in which you build it</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- what is DP -->
  <rect x="25" y="48" width="365" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">What DP actually is</text>
  <text x="40" y="94" fill="#d4d4d4" font-size="13">Remember the previous state, so that when the</text>
  <text x="40" y="112" fill="#d4d4d4" font-size="13">same problem comes again you solve it instantly</text>
  <text x="40" y="130" fill="#d4d4d4" font-size="13">from what you already remembered.</text>
  <text x="40" y="158" fill="#56c98d" font-size="13">DP applies when <tspan font-weight="bold">the same problem reappears</tspan>.</text>
  <text x="40" y="182" fill="#9aa0a6" font-size="12.5">Same as in life: a person learns from past mistakes</text>
  <text x="40" y="198" fill="#9aa0a6" font-size="12.5">and remembers them.</text>
  <text x="40" y="220" fill="#e06c75" font-size="12.5" font-weight="bold">DP is mostly recursion based.</text>

  <!-- process -->
  <rect x="405" y="48" width="370" height="230" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="420" y="70" fill="#f2c14e" font-size="13" font-weight="bold">The process of DP</text>
  <line x1="420" y1="80" x2="760" y2="80" stroke="#333333" stroke-width="1"/>
  <g font-size="13" fill="#d4d4d4">
    <text x="422" y="104"><tspan fill="#56c98d" font-weight="bold">1.</tspan>  First think faith</text>
    <text x="422" y="128"><tspan fill="#56c98d" font-weight="bold">2.</tspan>  Recursive tree diagram</text>
    <text x="422" y="152"><tspan fill="#56c98d" font-weight="bold">3.</tspan>  Code</text>
    <text x="422" y="176"><tspan fill="#56c98d" font-weight="bold">4.</tspan>  Memoization</text>
    <text x="422" y="200"><tspan fill="#56c98d" font-weight="bold">5.</tspan>  Observation from the output</text>
    <text x="422" y="224"><tspan fill="#56c98d" font-weight="bold">6.</tspan>  Tabulation, on the basis of the previous observation</text>
    <text x="422" y="248"><tspan fill="#56c98d" font-weight="bold">7.</tspan>  Further optimization</text>
  </g>
  <text x="420" y="270" fill="#9aa0a6" font-size="12">Do these steps and a time will come when you write tabulation directly.</text>

  <!-- storage -->
  <rect x="25" y="242" width="365" height="120" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="264" fill="#f2c14e" font-size="13" font-weight="bold">Where do we store the previous state?</text>
  <text x="40" y="288" fill="#d4d4d4" font-size="13">We use a data structure with <tspan fill="#56c98d">fast retrieval</tspan>, so we</text>
  <text x="40" y="306" fill="#d4d4d4" font-size="13">use <tspan font-weight="bold">Arrays</tspan>. In about <tspan fill="#f2c14e" font-weight="bold">90% of DP problems we use arrays</tspan>.</text>
  <text x="40" y="332" fill="#9aa0a6" font-size="12.5">A HashMap can be used in some questions too, where the</text>
  <text x="40" y="350" fill="#9aa0a6" font-size="12.5">states are not small integers.</text>

  <!-- real life -->
  <rect x="25" y="376" width="750" height="84" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="398" fill="#f2c14e" font-size="13" font-weight="bold">Two real-life examples</text>
  <text x="40" y="422" fill="#d4d4d4" font-size="12.5"><tspan fill="#56c98d">1.</tspan> The first time you learn to cook something from YouTube it takes a long time. The second time you already remember some of it, so it is quick.</text>
  <text x="40" y="444" fill="#d4d4d4" font-size="12.5"><tspan fill="#56c98d">2.</tspan> The first time you go to Allahabad you do not know the routes, so the taxi charges 700. Once you learn it costs 150, and the next time you remember 150.</text>
</svg>
