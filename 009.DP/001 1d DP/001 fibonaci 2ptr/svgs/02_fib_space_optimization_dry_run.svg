<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="620" rx="16" fill="url(#bgGrad2)" stroke="#3a506b" stroke-width="2"/>

  <!-- Title -->
  <text x="490" y="40" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold">
    Fibonacci Space Optimization (2 Pointers) Dry Run for N = 4
  </text>
  <text x="490" y="65" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Tracking n1, n2, and sum across 4 iterations (i = 0 to 3). Returns n1 = fib(4) = 3.
  </text>

  <!-- Algorithm Rule Box -->
  <g transform="translate(60, 90)">
    <rect width="860" height="65" rx="8" fill="#1e293b" stroke="#0ea5e9" stroke-width="1.5"/>
    <text x="20" y="25" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">POINTER UPDATE ORDER MATTERS:</text>
    <text x="20" y="48" fill="#e2e8f0" font-family="monospace" font-size="13">
      1. int sum = n1 + n2;   &#8594;   2. n1 = n2;   &#8594;   3. n2 = sum;
    </text>
    <text x="480" y="48" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      &#9888; If n2 = sum is assigned first, old n2 is lost before n1 gets it!
    </text>
  </g>

  <!-- Step Cards Container -->
  <!-- Initial State -->
  <g transform="translate(60, 180)" filter="url(#cardShadow)">
    <rect width="155" height="290" rx="10" fill="#111827" stroke="#4b5563" stroke-width="1.5"/>
    <rect width="155" height="34" rx="10" fill="#374151"/>
    <text x="77" y="23" text-anchor="middle" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">Initial State</text>

    <text x="20" y="65" fill="#9ca3af" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Before Loop:</text>

    <!-- Array values -->
    <rect x="25" y="85" width="45" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="47" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">0</text>
    <text x="47" y="145" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="12" font-weight="bold">&#8593; n1</text>

    <rect x="85" y="85" width="45" height="40" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="107" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">1</text>
    <text x="107" y="145" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="12" font-weight="bold">&#8593; n2</text>

    <!-- Variables state -->
    <path d="M 15 165 L 140 165" stroke="#374151" stroke-width="1"/>
    <text x="20" y="195" fill="#cbd5e1" font-family="monospace" font-size="12">n1 = 0</text>
    <text x="20" y="220" fill="#cbd5e1" font-family="monospace" font-size="12">n2 = 1</text>
    <text x="20" y="245" fill="#94a3b8" font-family="monospace" font-size="12">sum = -</text>
  </g>

  <!-- Iteration i = 0 -->
  <g transform="translate(235, 180)" filter="url(#cardShadow)">
    <rect width="155" height="290" rx="10" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="155" height="34" rx="10" fill="#0369a1"/>
    <text x="77" y="23" text-anchor="middle" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">i = 0</text>

    <!-- Step detail -->
    <text x="15" y="65" fill="#38bdf8" font-family="monospace" font-size="12">sum = 0 + 1 = 1</text>

    <!-- Array values -->
    <rect x="15" y="85" width="38" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="34" y="110" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">0</text>

    <rect x="58" y="85" width="38" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="77" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">1</text>
    <text x="77" y="145" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">&#8593; n1</text>

    <rect x="101" y="85" width="38" height="40" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">1</text>
    <text x="120" y="145" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold">&#8593; n2</text>

    <!-- Variables state -->
    <path d="M 15 165 L 140 165" stroke="#374151" stroke-width="1"/>
    <text x="15" y="195" fill="#38bdf8" font-family="monospace" font-size="12">sum = 1</text>
    <text x="15" y="220" fill="#93c5fd" font-family="monospace" font-size="12">n1 = 1</text>
    <text x="15" y="245" fill="#86efac" font-family="monospace" font-size="12">n2 = 1</text>
  </g>

  <!-- Iteration i = 1 -->
  <g transform="translate(410, 180)" filter="url(#cardShadow)">
    <rect width="155" height="290" rx="10" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="155" height="34" rx="10" fill="#0369a1"/>
    <text x="77" y="23" text-anchor="middle" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">i = 1</text>

    <!-- Step detail -->
    <text x="15" y="65" fill="#38bdf8" font-family="monospace" font-size="12">sum = 1 + 1 = 2</text>

    <!-- Array values -->
    <rect x="15" y="85" width="38" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="34" y="110" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">1</text>

    <rect x="58" y="85" width="38" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="77" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">1</text>
    <text x="77" y="145" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">&#8593; n1</text>

    <rect x="101" y="85" width="38" height="40" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">2</text>
    <text x="120" y="145" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold">&#8593; n2</text>

    <!-- Variables state -->
    <path d="M 15 165 L 140 165" stroke="#374151" stroke-width="1"/>
    <text x="15" y="195" fill="#38bdf8" font-family="monospace" font-size="12">sum = 2</text>
    <text x="15" y="220" fill="#93c5fd" font-family="monospace" font-size="12">n1 = 1</text>
    <text x="15" y="245" fill="#86efac" font-family="monospace" font-size="12">n2 = 2</text>
  </g>

  <!-- Iteration i = 2 -->
  <g transform="translate(585, 180)" filter="url(#cardShadow)">
    <rect width="155" height="290" rx="10" fill="#111827" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="155" height="34" rx="10" fill="#0369a1"/>
    <text x="77" y="23" text-anchor="middle" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">i = 2</text>

    <!-- Step detail -->
    <text x="15" y="65" fill="#38bdf8" font-family="monospace" font-size="12">sum = 1 + 2 = 3</text>

    <!-- Array values -->
    <rect x="15" y="85" width="38" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="34" y="110" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">1</text>

    <rect x="58" y="85" width="38" height="40" rx="6" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="77" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">2</text>
    <text x="77" y="145" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">&#8593; n1</text>

    <rect x="101" y="85" width="38" height="40" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="1.5"/>
    <text x="120" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">3</text>
    <text x="120" y="145" text-anchor="middle" fill="#86efac" font-family="monospace" font-size="11" font-weight="bold">&#8593; n2</text>

    <!-- Variables state -->
    <path d="M 15 165 L 140 165" stroke="#374151" stroke-width="1"/>
    <text x="15" y="195" fill="#38bdf8" font-family="monospace" font-size="12">sum = 3</text>
    <text x="15" y="220" fill="#93c5fd" font-family="monospace" font-size="12">n1 = 2</text>
    <text x="15" y="245" fill="#86efac" font-family="monospace" font-size="12">n2 = 3</text>
  </g>

  <!-- Iteration i = 3 -->
  <g transform="translate(760, 180)" filter="url(#cardShadow)">
    <rect width="160" height="290" rx="10" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="160" height="34" rx="10" fill="#059669"/>
    <text x="80" y="23" text-anchor="middle" fill="#f9fafb" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">i = 3 (Final)</text>

    <!-- Step detail -->
    <text x="15" y="65" fill="#38bdf8" font-family="monospace" font-size="12">sum = 2 + 3 = 5</text>

    <!-- Array values -->
    <rect x="12" y="85" width="40" height="40" rx="6" fill="#1e293b" stroke="#475569"/>
    <text x="32" y="110" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="14">2</text>

    <rect x="58" y="85" width="42" height="40" rx="6" fill="#166534" stroke="#4ade80" stroke-width="2"/>
    <text x="79" y="110" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="15" font-weight="bold">3</text>
    <text x="79" y="145" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">&#8593; n1 &#9733;</text>

    <rect x="106" y="85" width="42" height="40" rx="6" fill="#1e293b" stroke="#64748b"/>
    <text x="127" y="110" text-anchor="middle" fill="#cbd5e1" font-family="monospace" font-size="14">5</text>
    <text x="127" y="145" text-anchor="middle" fill="#94a3b8" font-family="monospace" font-size="11">&#8593; n2</text>

    <!-- Variables state -->
    <path d="M 15 165 L 145 165" stroke="#374151" stroke-width="1"/>
    <text x="15" y="195" fill="#38bdf8" font-family="monospace" font-size="12">sum = 5</text>
    <text x="15" y="220" fill="#4ade80" font-family="monospace" font-size="13" font-weight="bold">n1 = 3 (Ans!)</text>
    <text x="15" y="245" fill="#94a3b8" font-family="monospace" font-size="12">n2 = 5</text>
  </g>

  <!-- Summary banner at bottom -->
  <g transform="translate(60, 495)">
    <rect width="860" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="25" y="32" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="bold">
      Loop Termination &amp; Return Value Insight:
    </text>
    <text x="25" y="56" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      &#8226; When looping <tspan font-family="monospace" fill="#38bdf8">0 &#8804; i &lt; N</tspan>, pointer <tspan font-family="monospace" fill="#4ade80">n1</tspan> always holds <tspan font-family="monospace" fill="#4ade80">fib(i)</tspan> at the start of iteration <tspan font-family="monospace">i</tspan>.
    </text>
    <text x="25" y="76" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">
      &#8226; After <tspan font-family="monospace">N = 4</tspan> iterations, <tspan font-family="monospace" fill="#4ade80">n1</tspan> has advanced exactly to index 4, giving <tspan font-family="monospace" font-weight="bold" fill="#4ade80">n1 = 3 = fib(4)</tspan>. Variable <tspan font-family="monospace">n2</tspan> holds <tspan font-family="monospace">fib(N + 1)</tspan>.
    </text>
  </g>
</svg>
