<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="950" height="560">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="redundantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="baseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="560" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>

  <!-- Title -->
  <text x="475" y="42" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold">
    Fibonacci Recursion Tree for fib(5)
  </text>
  <text x="475" y="68" text-anchor="middle" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Overlapping Subproblems: Red nodes highlight redundant re-evaluations (fib(2) evaluated 3 times, fib(3) evaluated 2 times)
  </text>

  <!-- Connecting Lines -->
  <!-- fib(5) to fib(4), fib(3) -->
  <line x1="475" y1="120" x2="280" y2="190" stroke="#64748b" stroke-width="2.5" />
  <line x1="475" y1="120" x2="670" y2="190" stroke="#64748b" stroke-width="2.5" />

  <!-- fib(4) children -->
  <line x1="280" y1="205" x2="180" y2="285" stroke="#64748b" stroke-width="2" />
  <line x1="280" y1="205" x2="380" y2="285" stroke="#64748b" stroke-width="2" />

  <!-- fib(3) right children -->
  <line x1="670" y1="205" x2="570" y2="285" stroke="#64748b" stroke-width="2" />
  <line x1="670" y1="205" x2="770" y2="285" stroke="#64748b" stroke-width="2" />

  <!-- fib(3) left children -->
  <line x1="180" y1="300" x2="110" y2="385" stroke="#64748b" stroke-width="1.8" />
  <line x1="180" y1="300" x2="230" y2="385" stroke="#64748b" stroke-width="1.8" />

  <!-- fib(2) left children -->
  <line x1="380" y1="300" x2="330" y2="385" stroke="#64748b" stroke-width="1.8" />
  <line x1="380" y1="300" x2="430" y2="385" stroke="#64748b" stroke-width="1.8" />

  <!-- fib(2) middle children -->
  <line x1="570" y1="300" x2="520" y2="385" stroke="#64748b" stroke-width="1.8" />
  <line x1="570" y1="300" x2="620" y2="385" stroke="#64748b" stroke-width="1.8" />

  <!-- fib(2) at (110, 385) children -->
  <line x1="110" y1="400" x2="75" y2="475" stroke="#64748b" stroke-width="1.5" />
  <line x1="110" y1="400" x2="145" y2="475" stroke="#64748b" stroke-width="1.5" />

  <!-- Nodes: Level 0 -->
  <g filter="url(#shadow)">
    <circle cx="475" cy="115" r="26" fill="url(#nodeGrad)"/>
    <text x="475" y="120" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="14" font-weight="bold">fib(5)</text>
  </g>

  <!-- Nodes: Level 1 -->
  <g filter="url(#shadow)">
    <circle cx="280" cy="200" r="25" fill="url(#nodeGrad)"/>
    <text x="280" y="205" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">fib(4)</text>

    <!-- Redundant fib(3) -->
    <circle cx="670" cy="200" r="25" fill="url(#redundantGrad)"/>
    <circle cx="670" cy="200" r="30" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="670" y="205" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">fib(3)</text>
  </g>

  <!-- Nodes: Level 2 -->
  <g filter="url(#shadow)">
    <!-- fib(3) under fib(4) -->
    <circle cx="180" cy="295" r="24" fill="url(#redundantGrad)"/>
    <circle cx="180" cy="295" r="29" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="180" y="300" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">fib(3)</text>

    <!-- fib(2) under fib(4) -->
    <circle cx="380" cy="295" r="24" fill="url(#redundantGrad)"/>
    <circle cx="380" cy="295" r="29" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="380" y="300" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">fib(2)</text>

    <!-- fib(2) under fib(3) -->
    <circle cx="570" cy="295" r="24" fill="url(#redundantGrad)"/>
    <circle cx="570" cy="295" r="29" fill="none" stroke="#ef4444" stroke-width="2.5" stroke-dasharray="4,3"/>
    <text x="570" y="300" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">fib(2)</text>

    <!-- fib(1) under fib(3) -->
    <circle cx="770" cy="295" r="22" fill="url(#baseGrad)"/>
    <text x="770" y="300" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">fib(1)</text>
  </g>

  <!-- Nodes: Level 3 -->
  <g filter="url(#shadow)">
    <!-- fib(2) under fib(3) left -->
    <circle cx="110" cy="390" r="22" fill="url(#redundantGrad)"/>
    <circle cx="110" cy="390" r="26" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="110" y="395" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">fib(2)</text>

    <!-- Base case fib(1) -->
    <circle cx="230" cy="390" r="20" fill="url(#baseGrad)"/>
    <text x="230" y="395" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">fib(1)</text>

    <!-- fib(2) children -->
    <circle cx="330" cy="390" r="20" fill="url(#baseGrad)"/>
    <text x="330" y="395" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">fib(1)</text>

    <circle cx="430" cy="390" r="20" fill="url(#baseGrad)"/>
    <text x="430" y="395" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">fib(0)</text>

    <circle cx="520" cy="390" r="20" fill="url(#baseGrad)"/>
    <text x="520" y="395" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">fib(1)</text>

    <circle cx="620" cy="390" r="20" fill="url(#baseGrad)"/>
    <text x="620" y="395" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">fib(0)</text>
  </g>

  <!-- Nodes: Level 4 -->
  <g filter="url(#shadow)">
    <circle cx="75" cy="475" r="18" fill="url(#baseGrad)"/>
    <text x="75" y="479" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">fib(1)</text>

    <circle cx="145" cy="475" r="18" fill="url(#baseGrad)"/>
    <text x="145" y="479" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">fib(0)</text>
  </g>

  <!-- Legend Box -->
  <g transform="translate(680, 430)">
    <rect width="240" height="105" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
    <text x="15" y="24" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">LEGEND</text>

    <circle cx="25" cy="45" r="8" fill="url(#nodeGrad)"/>
    <text x="45" y="49" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Unique Computation</text>

    <circle cx="25" cy="68" r="8" fill="url(#redundantGrad)"/>
    <text x="45" y="72" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Redundant Re-evaluation</text>

    <circle cx="25" cy="91" r="8" fill="url(#baseGrad)"/>
    <text x="45" y="95" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Base Case (n &#8804; 1)</text>
  </g>
</svg>
