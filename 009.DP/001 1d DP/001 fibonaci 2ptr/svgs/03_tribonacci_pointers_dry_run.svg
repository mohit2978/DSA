<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 580" width="980" height="580">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="580" rx="16" fill="url(#bgGrad3)" stroke="#4338ca" stroke-width="2"/>

  <!-- Title -->
  <text x="490" y="38" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold">
    Tribonacci Sequence &amp; 3-Pointer Space Optimization
  </text>
  <text x="490" y="62" text-anchor="middle" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">
    Dry run for N = 4: Array values [0, 1, 1, 2, 4, 7, 13, 24] with T(n) = T(n-1) + T(n-2) + T(n-3)
  </text>

  <!-- Array Visualization Card -->
  <g transform="translate(60, 85)" filter="url(#shadow3)">
    <rect width="860" height="110" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    <text x="25" y="28" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">
      ARRAY STATE FROM OBSERVATION (STDOUT FOR N = 7):
    </text>

    <!-- Cells: 0 to 7 -->
    <!-- Cell 0 -->
    <g transform="translate(25, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">0</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 0</text>
    </g>
    <!-- Cell 1 -->
    <g transform="translate(95, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">1</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 1</text>
    </g>
    <!-- Cell 2 -->
    <g transform="translate(165, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">1</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 2</text>
    </g>
    <!-- Cell 3 -->
    <g transform="translate(235, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">2</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 3</text>
    </g>
    <!-- Cell 4 -->
    <g transform="translate(305, 42)">
      <rect width="60" height="42" rx="6" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">4</text>
      <text x="30" y="58" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="11">idx 4</text>
    </g>
    <!-- Cell 5 -->
    <g transform="translate(375, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">7</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 5</text>
    </g>
    <!-- Cell 6 -->
    <g transform="translate(445, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">13</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 6</text>
    </g>
    <!-- Cell 7 -->
    <g transform="translate(515, 42)">
      <rect width="60" height="42" rx="6" fill="#0f172a" stroke="#64748b"/>
      <text x="30" y="26" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="16" font-weight="bold">24</text>
      <text x="30" y="58" text-anchor="middle" fill="#64748b" font-family="monospace" font-size="11">idx 7</text>
    </g>

    <!-- Dependency Annotation -->
    <path d="M 335 38 C 335 15, 545 15, 545 38" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,2"/>
    <text x="610" y="65" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">
      24 = 13 + 7 + 4
    </text>
    <text x="610" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      Each state depends only on previous 3 values
    </text>
  </g>

  <!-- Simulation Steps: 4 Cards -->
  <!-- Step 0: Initial -->
  <g transform="translate(60, 215)" filter="url(#shadow3)">
    <rect width="195" height="235" rx="8" fill="#111827" stroke="#475569"/>
    <rect width="195" height="28" rx="8" fill="#334155"/>
    <text x="97" y="19" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Initial Pointers</text>

    <text x="15" y="55" fill="#94a3b8" font-family="monospace" font-size="11">n1 = 0 (T0)</text>
    <text x="15" y="75" fill="#94a3b8" font-family="monospace" font-size="11">n2 = 1 (T1)</text>
    <text x="15" y="95" fill="#94a3b8" font-family="monospace" font-size="11">n3 = 1 (T2)</text>

    <!-- Pointer badges -->
    <g transform="translate(15, 120)">
      <rect x="0" y="0" width="45" height="32" rx="4" fill="#3b82f6"/>
      <text x="22" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">0</text>
      <text x="22" y="47" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10">n1</text>

      <rect x="55" y="0" width="45" height="32" rx="4" fill="#6366f1"/>
      <text x="77" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">1</text>
      <text x="77" y="47" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="10">n2</text>

      <rect x="110" y="0" width="45" height="32" rx="4" fill="#8b5cf6"/>
      <text x="132" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">1</text>
      <text x="132" y="47" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="10">n3</text>
    </g>

    <text x="15" y="200" fill="#64748b" font-family="monospace" font-size="11">Loop runs: 0 to N-1</text>
  </g>

  <!-- Step 1: n = 0 -->
  <g transform="translate(280, 215)" filter="url(#shadow3)">
    <rect width="195" height="235" rx="8" fill="#111827" stroke="#3b82f6"/>
    <rect width="195" height="28" rx="8" fill="#1d4ed8"/>
    <text x="97" y="19" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Loop n = 0</text>

    <text x="15" y="55" fill="#38bdf8" font-family="monospace" font-size="11">sum = 0 + 1 + 1 = 2</text>
    <text x="15" y="75" fill="#cbd5e1" font-family="monospace" font-size="11">n1 = n2 &#8594; 1</text>
    <text x="15" y="95" fill="#cbd5e1" font-family="monospace" font-size="11">n2 = n3 &#8594; 1</text>
    <text x="15" y="115" fill="#cbd5e1" font-family="monospace" font-size="11">n3 = sum &#8594; 2</text>

    <!-- Pointer badges -->
    <g transform="translate(15, 135)">
      <rect x="0" y="0" width="45" height="32" rx="4" fill="#1e3a8a" stroke="#3b82f6"/>
      <text x="22" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">1</text>
      <text x="22" y="47" text-anchor="middle" fill="#93c5fd" font-family="monospace" font-size="10">n1</text>

      <rect x="55" y="0" width="45" height="32" rx="4" fill="#312e81" stroke="#6366f1"/>
      <text x="77" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">1</text>
      <text x="77" y="47" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="10">n2</text>

      <rect x="110" y="0" width="45" height="32" rx="4" fill="#581c87" stroke="#8b5cf6"/>
      <text x="132" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">2</text>
      <text x="132" y="47" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="10">n3</text>
    </g>
  </g>

  <!-- Step 2: n = 1 & 2 summary -->
  <g transform="translate(500, 215)" filter="url(#shadow3)">
    <rect width="195" height="235" rx="8" fill="#111827" stroke="#3b82f6"/>
    <rect width="195" height="28" rx="8" fill="#1d4ed8"/>
    <text x="97" y="19" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Loop n = 1 &amp; n = 2</text>

    <text x="12" y="55" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">Iteration n = 1:</text>
    <text x="12" y="73" fill="#cbd5e1" font-family="monospace" font-size="10">sum = 1+1+2 = 4</text>
    <text x="12" y="90" fill="#94a3b8" font-family="monospace" font-size="10">n1=1, n2=2, n3=4</text>

    <path d="M 12 105 L 180 105" stroke="#374151" stroke-width="1"/>

    <text x="12" y="125" fill="#93c5fd" font-family="monospace" font-size="11" font-weight="bold">Iteration n = 2:</text>
    <text x="12" y="143" fill="#cbd5e1" font-family="monospace" font-size="10">sum = 1+2+4 = 7</text>
    <text x="12" y="160" fill="#94a3b8" font-family="monospace" font-size="10">n1=2, n2=4, n3=7</text>

    <path d="M 12 175 L 180 175" stroke="#374151" stroke-width="1"/>
    <text x="12" y="195" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">
      Next iteration n = 3 calculates T4!
    </text>
  </g>

  <!-- Step 3: n = 3 (Final for N=4) -->
  <g transform="translate(720, 215)" filter="url(#shadow3)">
    <rect width="200" height="235" rx="8" fill="#111827" stroke="#10b981" stroke-width="2"/>
    <rect width="200" height="28" rx="8" fill="#059669"/>
    <text x="100" y="19" text-anchor="middle" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="bold">Loop n = 3 (Final)</text>

    <text x="15" y="55" fill="#34d399" font-family="monospace" font-size="11" font-weight="bold">sum = 2 + 4 + 7 = 13</text>
    <text x="15" y="78" fill="#4ade80" font-family="monospace" font-size="12" font-weight="bold">n1 = n2 &#8594; 4 &#9733; (Ans!)</text>
    <text x="15" y="100" fill="#cbd5e1" font-family="monospace" font-size="11">n2 = n3 &#8594; 7</text>
    <text x="15" y="120" fill="#cbd5e1" font-family="monospace" font-size="11">n3 = sum &#8594; 13</text>

    <!-- Pointer badges -->
    <g transform="translate(15, 140)">
      <rect x="0" y="0" width="48" height="32" rx="4" fill="#14532d" stroke="#4ade80" stroke-width="2"/>
      <text x="24" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">4</text>
      <text x="24" y="47" text-anchor="middle" fill="#4ade80" font-family="monospace" font-size="10" font-weight="bold">n1 &#8594; T4</text>

      <rect x="58" y="0" width="48" height="32" rx="4" fill="#312e81"/>
      <text x="82" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">7</text>
      <text x="82" y="47" text-anchor="middle" fill="#c7d2fe" font-family="monospace" font-size="10">n2</text>

      <rect x="116" y="0" width="48" height="32" rx="4" fill="#581c87"/>
      <text x="140" y="21" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="13" font-weight="bold">13</text>
      <text x="140" y="47" text-anchor="middle" fill="#ddd6fe" font-family="monospace" font-size="10">n3</text>
    </g>
  </g>

  <!-- Bottom Insight Box -->
  <g transform="translate(60, 465)">
    <rect width="860" height="90" rx="8" fill="#1e293b" stroke="#334155"/>
    <text x="20" y="26" fill="#f59e0b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="bold">
      CRITICAL OBSERVATIONS &amp; SHIFT LOGIC:
    </text>
    <text x="20" y="50" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      1. <tspan font-weight="bold" fill="#f8fafc">Loop Range:</tspan> Running from <tspan font-family="monospace" fill="#38bdf8">0 to N</tspan> allows returning <tspan font-family="monospace" fill="#4ade80">n1</tspan> directly. This naturally handles <tspan font-family="monospace">N = 0, 1, 2</tspan> without out-of-bound errors.
    </text>
    <text x="20" y="72" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">
      2. <tspan font-weight="bold" fill="#f8fafc">Update Order:</tspan> <tspan font-family="monospace">n3 = sum</tspan> must be assigned <tspan font-weight="bold" fill="#fca5a5">last</tspan> so that the old value in <tspan font-family="monospace">n3</tspan> is safely copied to <tspan font-family="monospace">n2</tspan>, and old <tspan font-family="monospace">n2</tspan> to <tspan font-family="monospace">n1</tspan>.
    </text>
  </g>
</svg>
