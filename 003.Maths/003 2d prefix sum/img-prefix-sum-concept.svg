<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="620" height="260" fill="#1e1e1e"/>
  <!-- 3x3 grid of values -->
  <g stroke="#5b9bd5" stroke-width="1.5" fill="none">
    <rect x="40" y="20" width="80" height="60"/>
    <rect x="120" y="20" width="80" height="60"/>
    <rect x="200" y="20" width="80" height="60"/>
    <rect x="40" y="80" width="80" height="60"/>
    <rect x="120" y="80" width="80" height="60"/>
    <rect x="200" y="80" width="80" height="60"/>
    <rect x="40" y="140" width="80" height="60"/>
    <rect x="120" y="140" width="80" height="60"/>
    <rect x="200" y="140" width="80" height="60"/>
  </g>
  <!-- highlight the top-left 2x2 block used for prefix sum at (1,1) -->
  <rect x="40" y="20" width="160" height="120" fill="#f2c14e" fill-opacity="0.15" stroke="#f2c14e" stroke-width="3"/>
  <g fill="#d4d4d4" text-anchor="middle" font-size="22">
    <text x="80" y="58">1</text><text x="160" y="58">2</text><text x="240" y="58">3</text>
    <text x="80" y="118">5</text><text x="160" y="118">4</text><text x="240" y="118">2</text>
    <text x="80" y="178">2</text><text x="160" y="178">1</text><text x="240" y="178">4</text>
  </g>
  <text x="160" y="112" text-anchor="middle" font-size="12" fill="#f2c14e">a[1][1]</text>
  <text x="330" y="60" fill="#d4d4d4" font-size="15">Prefix sum of a[1][1]</text>
  <text x="330" y="85" fill="#d4d4d4" font-size="15">= sum of everything</text>
  <text x="330" y="110" fill="#d4d4d4" font-size="15">to the left &amp; up of it</text>
  <text x="330" y="145" fill="#f2c14e" font-size="16">= 5 + 2 + 4 + 1 = 12</text>
</svg>
