<svg viewBox="0 0 680 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="15">
  <rect x="0" y="0" width="680" height="440" fill="#1e1e1e"/>

  <!-- Target rectangle: spans rows 'a' to 'x' (y: 121..345) and cols 'b' to 'y' (x: 214..550) -->
  <rect x="214" y="121" width="336" height="224" fill="#f2c14e" fill-opacity="0.14" stroke="#f2c14e" stroke-width="3" rx="4"/>

  <!-- Grid lines: 5 columns x 5 rows -->
  <g stroke="#3a3a3a" stroke-width="1">
    <!-- Vertical lines (column boundaries) -->
    <line x1="130" y1="65" x2="130" y2="345"/>
    <line x1="214" y1="65" x2="214" y2="345"/>
    <line x1="298" y1="65" x2="298" y2="345"/>
    <line x1="382" y1="65" x2="382" y2="345"/>
    <line x1="466" y1="65" x2="466" y2="345"/>
    <line x1="550" y1="65" x2="550" y2="345"/>

    <!-- Horizontal lines (row boundaries) -->
    <line x1="130" y1="65"  x2="550" y2="65"/>
    <line x1="130" y1="121" x2="550" y2="121"/>
    <line x1="130" y1="177" x2="550" y2="177"/>
    <line x1="130" y1="233" x2="550" y2="233"/>
    <line x1="130" y1="289" x2="550" y2="289"/>
    <line x1="130" y1="345" x2="550" y2="345"/>
  </g>

  <!-- Column axis labels (top) - centered in each column -->
  <g fill="#9aa0a6" text-anchor="middle" font-size="14" font-weight="600">
    <text x="172" y="48">b-1</text>
    <text x="256" y="48">b</text>
    <text x="340" y="48" fill="#555" font-weight="normal">···</text>
    <text x="424" y="48">y-1</text>
    <text x="508" y="48">y</text>
  </g>

  <!-- Row axis labels (left) - centered vertically in each row -->
  <g fill="#9aa0a6" text-anchor="end" font-size="14" font-weight="600">
    <text x="115" y="98">a-1</text>
    <text x="115" y="154">a</text>
    <text x="115" y="210" fill="#555" font-weight="normal">···</text>
    <text x="115" y="266">x-1</text>
    <text x="115" y="322">x</text>
  </g>

  <!-- Intermediate ellipsis inside cells -->
  <g fill="#555" text-anchor="middle" font-size="16">
    <text x="340" y="98">···</text>
    <text x="172" y="210">···</text>
    <text x="256" y="210">···</text>
    <text x="340" y="210">···</text>
    <text x="424" y="210">···</text>
    <text x="508" y="210">···</text>
    <text x="340" y="322">···</text>
  </g>

  <!-- Reference cell (a-1, b-1): Row a-1, Col b-1 -->
  <rect x="136" y="73" width="72" height="40" rx="6" fill="#e06c75" fill-opacity="0.22" stroke="#e06c75" stroke-width="1.5"/>
  <text x="172" y="98" fill="#e06c75" font-weight="bold" font-size="12.5" text-anchor="middle">(a-1,b-1)</text>

  <!-- Reference cell (a-1, y): Row a-1, Col y -->
  <rect x="474" y="73" width="68" height="40" rx="6" fill="#5b9bd5" fill-opacity="0.22" stroke="#5b9bd5" stroke-width="1.5"/>
  <text x="508" y="98" fill="#5b9bd5" font-weight="bold" font-size="13" text-anchor="middle">(a-1,y)</text>

  <!-- Reference cell (x, b-1): Row x, Col b-1 -->
  <rect x="138" y="297" width="68" height="40" rx="6" fill="#56c98d" fill-opacity="0.22" stroke="#56c98d" stroke-width="1.5"/>
  <text x="172" y="322" fill="#56c98d" font-weight="bold" font-size="13" text-anchor="middle">(x,b-1)</text>

  <!-- Target rectangle upper-left cell (a, b): Row a, Col b -->
  <rect x="222" y="129" width="68" height="40" rx="6" fill="#f2c14e" fill-opacity="0.28" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="256" y="154" fill="#f2c14e" font-weight="bold" font-size="14" text-anchor="middle">(a,b)</text>

  <!-- Target rectangle lower-right cell (x, y): Row x, Col y -->
  <rect x="474" y="297" width="68" height="40" rx="6" fill="#f2c14e" fill-opacity="0.28" stroke="#f2c14e" stroke-width="1.5"/>
  <text x="508" y="322" fill="#f2c14e" font-weight="bold" font-size="14" text-anchor="middle">(x,y)</text>

  <!-- Target region label -->
  <text x="340" y="154" fill="#f2c14e" fill-opacity="0.75" font-size="12" text-anchor="middle" font-weight="600">Target Area</text>

  <!-- Formula at the bottom -->
  <text x="40" y="388" font-size="16" fill="#d4d4d4">
    <tspan fill="#f2c14e" font-weight="bold">Area(x, y, a, b)</tspan>
    <tspan fill="#d4d4d4"> = </tspan>
    <tspan fill="#f2c14e" font-weight="bold">pre(x, y)</tspan>
    <tspan fill="#d4d4d4"> − </tspan>
    <tspan fill="#5b9bd5" font-weight="bold">pre(a-1, y)</tspan>
    <tspan fill="#d4d4d4"> − </tspan>
    <tspan fill="#56c98d" font-weight="bold">pre(x, b-1)</tspan>
    <tspan fill="#d4d4d4"> + </tspan>
    <tspan fill="#e06c75" font-weight="bold">pre(a-1, b-1)</tspan>
  </text>
  <text x="40" y="414" font-size="12.5" fill="#888888">+ pre(a-1, b-1) restores the top-left overlap subtracted twice by pre(a-1, y) and pre(x, b-1)</text>
</svg>
