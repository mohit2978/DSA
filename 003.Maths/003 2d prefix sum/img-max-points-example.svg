<svg viewBox="0 0 460 460" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="460" height="460" fill="#1e1e1e"/>
  <!-- grid from 1..5 on both axes -->
  <g stroke="#56c98d" stroke-width="1.5">
    <line x1="40" y1="40" x2="40" y2="420"/><line x1="115" y1="40" x2="115" y2="420"/>
    <line x1="190" y1="40" x2="190" y2="420"/><line x1="265" y1="40" x2="265" y2="420"/>
    <line x1="340" y1="40" x2="340" y2="420"/><line x1="415" y1="40" x2="415" y2="420"/>
    <line x1="40" y1="40" x2="415" y2="40"/><line x1="40" y1="115" x2="415" y2="115"/>
    <line x1="40" y1="190" x2="415" y2="190"/><line x1="40" y1="265" x2="415" y2="265"/>
    <line x1="40" y1="340" x2="415" y2="340"/><line x1="40" y1="415" x2="415" y2="415"/>
  </g>
  <!-- points: y-axis increases downward in the original hand-drawn sketch, keep (1,1) top-left as drawn -->
  <circle cx="40" cy="40" r="5" fill="#d4d4d4"/><text x="20" y="30" fill="#d4d4d4">(1,1)</text>
  <circle cx="190" cy="190" r="5" fill="#f2c14e"/><text x="200" y="185" fill="#f2c14e">(2,3)</text>
  <circle cx="190" cy="265" r="5" fill="#f2c14e"/><text x="145" y="285" fill="#f2c14e">(2,4)</text>
  <circle cx="265" cy="265" r="5" fill="#f2c14e"/><text x="275" y="285" fill="#f2c14e">(3,4)</text>
  <circle cx="415" cy="415" r="5" fill="#d4d4d4"/><text x="420" y="415" fill="#d4d4d4">(5,5)</text>
  <!-- dashed rectangle covering the 3 highlighted points, x=2,y=2 -->
  <rect x="165" y="165" width="125" height="125" fill="none" stroke="#e06c75" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="230" y="150" text-anchor="middle" fill="#e06c75">covers 3 points</text>
</svg>
