<svg viewBox="0 0 620 220" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="14">
  <rect x="0" y="0" width="620" height="220" fill="#1e1e1e"/>
  <!-- N=3 grid -->
  <g stroke="#e06c75" stroke-width="2" fill="none">
    <rect x="20" y="20" width="150" height="150"/>
    <line x1="70" y1="20" x2="70" y2="170"/>
    <line x1="120" y1="20" x2="120" y2="170"/>
    <line x1="20" y1="70" x2="170" y2="70"/>
    <line x1="20" y1="120" x2="170" y2="120"/>
    <line x1="20" y1="170" x2="170" y2="20" stroke-dasharray="4 4"/>
  </g>
  <path d="M 20 170 L 170 170 L 170 20" stroke="#5b9bd5" stroke-width="3" fill="none"/>
  <text x="95" y="200" text-anchor="middle" fill="#333">N=3 (one of 5 valid paths shown)</text>

  <g stroke="#e06c75" stroke-width="2" fill="none">
    <rect x="240" y="20" width="100" height="100"/>
    <line x1="290" y1="20" x2="290" y2="120"/>
    <line x1="240" y1="70" x2="340" y2="70"/>
    <line x1="240" y1="120" x2="340" y2="20" stroke-dasharray="4 4"/>
  </g>
  <path d="M 240 120 L 290 120 L 290 20 L 340 20" stroke="#5b9bd5" stroke-width="3" fill="none"/>
  <text x="290" y="150" text-anchor="middle" fill="#333">N=2 (1 of 2 valid paths)</text>

  <g stroke="#e06c75" stroke-width="2" fill="none">
    <rect x="420" y="20" width="60" height="60"/>
    <line x1="420" y1="80" x2="480" y2="20" stroke-dasharray="4 4"/>
  </g>
  <path d="M 420 80 L 480 80 L 480 20" stroke="#5b9bd5" stroke-width="3" fill="none"/>
  <text x="450" y="110" text-anchor="middle" fill="#333">N=1 (only 1 way)</text>
</svg>
