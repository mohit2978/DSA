<svg viewBox="0 0 920 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif">
  <rect x="0" y="0" width="920" height="260" fill="#1e1e1e"/>
  <line x1="40" y1="180" x2="880" y2="180" stroke="#5b9bd5" stroke-width="3"/>
  <!-- tick positions -->
  <g stroke="#5b9bd5" stroke-width="3">
    <line x1="40"  y1="170" x2="40"  y2="190"/>
    <line x1="110" y1="170" x2="110" y2="190"/>
    <line x1="180" y1="170" x2="180" y2="190"/>
    <line x1="250" y1="170" x2="250" y2="190"/>
    <line x1="320" y1="150" x2="320" y2="210"/>
    <line x1="390" y1="170" x2="390" y2="190"/>
    <line x1="460" y1="170" x2="460" y2="190"/>
    <line x1="600" y1="170" x2="600" y2="190"/>
    <line x1="880" y1="150" x2="880" y2="210"/>
  </g>
  <line x1="320" y1="40" x2="320" y2="230" stroke="#f2c14e" stroke-width="3"/>
  <g font-size="22" fill="#cfe0f5" text-anchor="middle">
    <text x="40"  y="220">1</text>
    <text x="110" y="220">2</text>
    <text x="180" y="220">3</text>
    <text x="250" y="220">4</text>
    <text x="320" y="220">6</text>
    <text x="390" y="220">9</text>
    <text x="460" y="220">12</text>
    <text x="600" y="220">18</text>
    <text x="880" y="220">36</text>
  </g>
  <text x="320" y="248" font-size="16" fill="#f2c14e" text-anchor="middle">&#8730;36 = 6</text>
  <!-- arcs pairing factors: 1x36, 2x18, 3x12, 4x9, and 6 is the sqrt point (6x6) -->
  <path d="M 40 170 Q 460 20 880 170"  stroke="#e06c75" stroke-width="2" fill="none"/>
  <path d="M 110 170 Q 355 60 600 170" stroke="#e06c75" stroke-width="2" fill="none"/>
  <path d="M 180 170 Q 320 90 460 170" stroke="#56c98d" stroke-width="2" fill="none"/>
  <path d="M 250 165 Q 320 130 390 165" stroke="#e06c75" stroke-width="2" fill="none"/>
</svg>
