<svg viewBox="0 0 920 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="920" height="320" fill="#1e1e1e"/>
  <!-- n=0 -->
  <g stroke="#5b9bd5" stroke-width="2" fill="none">
    <circle cx="60" cy="60" r="16"/>
  </g>
  <text x="60" y="110" text-anchor="middle" fill="#d4d4d4">n=0 internal nodes: 1 shape</text>

  <!-- n=1 -->
  <g stroke="#5b9bd5" stroke-width="2" fill="none">
    <circle cx="260" cy="40" r="16"/>
    <circle cx="220" cy="90" r="16"/>
    <circle cx="300" cy="90" r="16"/>
    <line x1="248" y1="52" x2="230" y2="78"/>
    <line x1="272" y1="52" x2="290" y2="78"/>
  </g>
  <text x="260" y="130" text-anchor="middle" fill="#d4d4d4">n=1: 1 shape</text>

  <!-- n=2 (two shapes: left-heavy or right-heavy) -->
  <g stroke="#5b9bd5" stroke-width="2" fill="none">
    <circle cx="460" cy="30" r="14"/>
    <circle cx="430" cy="70" r="14"/>
    <circle cx="490" cy="70" r="14"/>
    <circle cx="410" cy="110" r="14"/>
    <circle cx="450" cy="110" r="14"/>
    <line x1="450" y1="40" x2="437" y2="60"/>
    <line x1="470" y1="40" x2="483" y2="60"/>
    <line x1="423" y1="80" x2="415" y2="100"/>
    <line x1="437" y1="80" x2="446" y2="100"/>
  </g>
  <g stroke="#e06c75" stroke-width="2" fill="none">
    <circle cx="620" cy="30" r="14"/>
    <circle cx="590" cy="70" r="14"/>
    <circle cx="650" cy="70" r="14"/>
    <circle cx="630" cy="110" r="14"/>
    <circle cx="670" cy="110" r="14"/>
    <line x1="610" y1="40" x2="597" y2="60"/>
    <line x1="630" y1="40" x2="643" y2="60"/>
    <line x1="643" y1="80" x2="635" y2="100"/>
    <line x1="657" y1="80" x2="666" y2="100"/>
  </g>
  <text x="540" y="150" text-anchor="middle" fill="#d4d4d4">n=2: 2 shapes (mirror images — left-chain / right-chain)</text>

  <text x="460" y="200" text-anchor="middle" fill="#d4d4d4" font-size="15">n=3: 5 shapes total (all the ways to arrange 3 internal nodes)</text>
  <g stroke="#56c98d" stroke-width="2" fill="none">
    <circle cx="460" cy="220" r="12"/>
    <circle cx="430" cy="255" r="12"/>
    <circle cx="490" cy="255" r="12"/>
    <circle cx="410" cy="290" r="12"/>
    <circle cx="450" cy="290" r="12"/>
    <circle cx="480" cy="290" r="12"/>
    <line x1="452" y1="228" x2="437" y2="247"/>
    <line x1="468" y1="228" x2="483" y2="247"/>
    <line x1="423" y1="263" x2="415" y2="280"/>
    <line x1="437" y1="263" x2="446" y2="280"/>
    <line x1="490" y1="267" x2="485" y2="280"/>
  </g>
  <text x="460" y="315" text-anchor="middle" fill="#d4d4d4" font-size="14">(one example of the 5; the rest are the other placements of the 2 extra internal nodes)</text>
</svg>
