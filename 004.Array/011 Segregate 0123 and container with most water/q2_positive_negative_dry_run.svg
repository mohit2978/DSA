<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
  <style>.bg{fill:#0f172a}.title{fill:#f8fafc;font:700 25px sans-serif}.t{fill:#cbd5e1;font:18px sans-serif}.h{fill:#38bdf8;font:700 18px sans-serif}.cell{fill:#1e293b;stroke:#64748b;stroke-width:2}.neg{fill:#7c3aed}.n{fill:#fff;font:700 19px monospace;text-anchor:middle;dominant-baseline:middle}</style>
  <rect class="bg" width="1100" height="390" rx="18"/><text class="title" x="35" y="42">Partition negative values to the left</text>
  <text class="t" x="35" y="86">Input: [4, -3, 7, -1, 0, -6, 2]    boundary = -1</text>
  <g transform="translate(55,115)"><rect class="cell" width="105" height="55"/><rect class="neg" x="105" width="105" height="55"/><rect class="cell" x="210" width="105" height="55"/><rect class="neg" x="315" width="105" height="55"/><rect class="cell" x="420" width="105" height="55"/><rect class="neg" x="525" width="105" height="55"/><rect class="cell" x="630" width="105" height="55"/><g class="n"><text x="52" y="28">4</text><text x="157" y="28">-3</text><text x="262" y="28">7</text><text x="367" y="28">-1</text><text x="472" y="28">0</text><text x="577" y="28">-6</text><text x="682" y="28">2</text></g></g>
  <text class="t" x="35" y="225">When a negative is found: increment boundary, then swap arr[boundary] with arr[scan].</text>
  <text class="h" x="35" y="270">Swaps: (-3,4) → (-1,4) → (-6,7)</text>
  <text class="t" x="35" y="315">Result: [-3, -1, -6 | 4, 0, 7, 2]  (order inside each region is not guaranteed)</text>
  <text class="t" x="35" y="355">Invariant: indices 0..boundary contain only negative values.</text>
</svg>
