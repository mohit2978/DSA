<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <style>.bg{fill:#0f172a}.title{fill:#f8fafc;font:700 25px sans-serif}.label{fill:#cbd5e1;font:18px sans-serif}.step{fill:#38bdf8;font:700 18px sans-serif}.cell{fill:#1e293b;stroke:#64748b;stroke-width:2}.moved{fill:#7c3aed}.num{fill:#fff;font:700 20px monospace;text-anchor:middle;dominant-baseline:middle}.arrow{stroke:#f59e0b;stroke-width:3;fill:none;marker-end:url(#a)}</style>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#f59e0b"/></marker></defs>
  <rect class="bg" width="1100" height="430" rx="18"/><text class="title" x="35" y="42">Rotate right by k = 3 using three reversals</text>
  <text class="step" x="35" y="105">Start</text><text class="label" x="155" y="105">[1, 2, 3, 4, 5, 6, 7]</text>
  <text class="step" x="35" y="170">1</text><text class="label" x="80" y="170">Reverse all</text><text class="label" x="260" y="170">[7, 6, 5, 4, 3, 2, 1]</text>
  <text class="step" x="35" y="235">2</text><text class="label" x="80" y="235">Reverse first k</text><text class="label" x="260" y="235">[5, 6, 7, 4, 3, 2, 1]</text>
  <text class="step" x="35" y="300">3</text><text class="label" x="80" y="300">Reverse remaining</text><text class="label" x="260" y="300">[5, 6, 7, 1, 2, 3, 4]</text>
  <path class="arrow" d="M710 95 C980 95 980 300 710 300"/><text class="label" x="790" y="205">last 3 move to front</text>
  <text class="label" x="35" y="382">Normalize first: k = ((k % n) + n) % n. Adding or subtracting n does not change a rotation.</text>
</svg>
