<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
  <style>.bg{fill:#0f172a}.title{fill:#f8fafc;font:700 25px sans-serif}.t{fill:#cbd5e1;font:18px sans-serif}.h{fill:#38bdf8;font:700 18px sans-serif}.r{fill:#f59e0b;font:700 18px sans-serif}</style>
  <rect class="bg" width="1100" height="430" rx="18"/><text class="title" x="35" y="42">Dutch National Flag: sort 0, 1 and 2</text>
  <text class="t" x="35" y="88">Regions: [0..low-1] = 0, [low..mid-1] = 1, [mid..high] = unknown, [high+1..n-1] = 2</text>
  <text class="h" x="35" y="140">Start</text><text class="t" x="160" y="140">[2, 0, 2, 1, 1, 0]   low=0 mid=0 high=5</text>
  <text class="r" x="35" y="190">2 → swap(mid,high), high--</text><text class="t" x="390" y="190">[0, 0, 2, 1, 1, 2]</text>
  <text class="r" x="35" y="240">0 → swap(low,mid), both++</text><text class="t" x="390" y="240">[0, 0, 2, 1, 1, 2]</text>
  <text class="r" x="35" y="290">0 → swap(low,mid), both++</text><text class="t" x="390" y="290">[0, 0, 2, 1, 1, 2]</text>
  <text class="r" x="35" y="340">2 → swap; then 1s advance mid</text><text class="t" x="390" y="340">[0, 0, 1, 1, 2, 2]</text>
  <text class="t" x="35" y="395">Do not advance mid after moving a 2: the value swapped in from high is still unknown.</text>
</svg>
