<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390">
  <style>.bg{fill:#0f172a}.title{fill:#f8fafc;font:700 25px sans-serif}.t{fill:#cbd5e1;font:18px sans-serif}.h{fill:#38bdf8;font:700 18px sans-serif}.z{fill:#7c3aed}.o{fill:#1e293b}.cell{stroke:#64748b;stroke-width:2}.n{fill:#fff;font:700 21px monospace;text-anchor:middle;dominant-baseline:middle}</style>
  <rect class="bg" width="1100" height="390" rx="18"/><text class="title" x="35" y="42">Segregate 0s and 1s with a placement boundary</text>
  <text class="t" x="35" y="90">Input: [1, 0, 1, 0, 1, 1, 0]    nextZero = 0</text>
  <text class="h" x="35" y="145">scan=1: swap indices 0,1</text><text class="t" x="390" y="145">[0, 1, 1, 0, 1, 1, 0]</text>
  <text class="h" x="35" y="200">scan=3: swap indices 1,3</text><text class="t" x="390" y="200">[0, 0, 1, 1, 1, 1, 0]</text>
  <text class="h" x="35" y="255">scan=6: swap indices 2,6</text><text class="t" x="390" y="255">[0, 0, 0, 1, 1, 1, 1]</text>
  <text class="t" x="35" y="320">Invariant: [0, nextZero) contains 0s; scanned elements after it contain 1s.</text>
  <text class="t" x="35" y="355">Each item is inspected once; swaps occur only when a 0 is encountered.</text>
</svg>
