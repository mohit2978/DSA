<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 640" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
  </defs>

  <rect width="950" height="640" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Boyer-Moore Voting Algorithm (Majority Element I &amp; II)</text>
  <rect x="740" y="35" width="160" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="820" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">O(N) Time, O(1) Space</text>

  <!-- Section 1: Majority Element I (> n/2) Cancellation Logic -->
  <g transform="translate(30, 95)">
    <rect width="890" height="230" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. Majority Element I (Frequency &gt; n / 2): Pairwise Cancellation</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Since the majority element occurs &gt; n/2 times, even if all distinct elements cancel it out, it still survives!</text>

    <!-- Visual Array Cancellation -->
    <g transform="translate(30, 65)">
      <!-- Array Elements -->
      <g transform="translate(0, 10)">
        <text x="0" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#cbd5e1">Array:</text>
        
        <rect x="70" y="0" width="34" height="32" rx="6" fill="url(#blueGrad)"/>
        <text x="87" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

        <rect x="110" y="0" width="34" height="32" rx="6" fill="url(#blueGrad)"/>
        <text x="127" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

        <rect x="150" y="0" width="34" height="32" rx="6" fill="url(#blueGrad)"/>
        <text x="167" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

        <rect x="190" y="0" width="34" height="32" rx="6" fill="url(#blueGrad)"/>
        <text x="207" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

        <rect x="230" y="0" width="34" height="32" rx="6" fill="url(#blueGrad)"/>
        <text x="247" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

        <rect x="270" y="0" width="34" height="32" rx="6" fill="url(#blueGrad)"/>
        <text x="287" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

        <rect x="310" y="0" width="34" height="32" rx="6" fill="url(#amberGrad)"/>
        <text x="327" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>

        <rect x="350" y="0" width="34" height="32" rx="6" fill="url(#amberGrad)"/>
        <text x="367" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

        <rect x="390" y="0" width="34" height="32" rx="6" fill="url(#amberGrad)"/>
        <text x="407" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">4</text>

        <rect x="430" y="0" width="34" height="32" rx="6" fill="url(#amberGrad)"/>
        <text x="447" y="21" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">6</text>
      </g>

      <!-- Cancellation Arcs -->
      <path d="M 287, 45 C 287, 85 327, 85 327, 45" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
      <path d="M 247, 45 C 247, 100 367, 100 367, 45" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
      <path d="M 207, 45 C 207, 115 407, 115 407, 45" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>
      <path d="M 167, 45 C 167, 130 447, 130 447, 45" fill="none" stroke="#f43f5e" stroke-width="2" stroke-dasharray="3"/>

      <!-- Survived Elements -->
      <g transform="translate(520, 15)">
        <rect width="320" height="95" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
        <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Surviving Candidate:</text>
        <text x="15" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Two '1's remain uncanceled (count = 2).</text>
        <text x="15" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Phase 2: Validation check count &gt; n/2 (6 &gt; 5)</text>
        <text x="15" y="86" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Result: Candidate = 1 is Majority Element!</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Majority Element II (> n/3) 2-Candidate Logic -->
  <g transform="translate(30, 340)">
    <rect width="890" height="275" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">2. Majority Element II (Frequency &gt; n / 3): Triplet Cancellation</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">At most 2 elements can have count &gt; n/3. Maintain 2 candidate values (v1, v2) and counts (c1, c2).</text>

    <!-- Dry run steps on [1, 2, 1, 3, 2, 2, 1] -->
    <g transform="translate(20, 65)">
      <rect width="850" height="190" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>

      <!-- Table Header -->
      <text x="20" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Index</text>
      <text x="70" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Num</text>
      <text x="130" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Action / Condition</text>
      <text x="430" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">v1, c1</text>
      <text x="540" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">v2, c2</text>
      <text x="650" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Explanation</text>
      <line x1="10" y1="33" x2="840" y2="33" stroke="#334155" stroke-width="1"/>

      <!-- Rows -->
      <text x="20" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">0</text>
      <text x="70" y="52" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1</text>
      <text x="130" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Initialize v1 = 1, c1 = 1</text>
      <text x="430" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">v1=1, c1=1</text>
      <text x="540" y="52" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">v2=1, c2=0</text>
      <text x="650" y="52" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Candidate 1 set</text>

      <text x="20" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">1</text>
      <text x="70" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">2</text>
      <text x="130" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">c2 == 0 -&gt; Set v2 = 2, c2 = 1</text>
      <text x="430" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">v1=1, c1=1</text>
      <text x="540" y="74" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">v2=2, c2=1</text>
      <text x="650" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Candidate 2 set</text>

      <text x="20" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">2</text>
      <text x="70" y="96" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">1</text>
      <text x="130" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Matches v1 -&gt; Increment c1++</text>
      <text x="430" y="96" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">v1=1, c1=2</text>
      <text x="540" y="96" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">v2=2, c2=1</text>
      <text x="650" y="96" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Reinforce candidate 1</text>

      <text x="20" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">3</text>
      <text x="70" y="118" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f43f5e">3</text>
      <text x="130" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">Distinct from both -&gt; c1--, c2--</text>
      <text x="430" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">v1=1, c1=1</text>
      <text x="540" y="118" font-family="system-ui, sans-serif" font-size="11" fill="#f43f5e">v2=2, c2=0</text>
      <text x="650" y="118" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Triplet (1, 2, 3) cancelled</text>

      <text x="20" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">4..6</text>
      <text x="70" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#cbd5e1">2, 2, 1</text>
      <text x="130" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">c2 resets to 2; c1 ends at 2, c2 at 2</text>
      <text x="430" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">v1=1, c1=2</text>
      <text x="540" y="140" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">v2=2, c2=2</text>
      <text x="650" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#34d399">Final candidates = {1, 2}</text>

      <!-- Final Validation line -->
      <line x1="10" y1="152" x2="840" y2="152" stroke="#334155" stroke-width="1"/>
      <text x="20" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Validation Pass:</text>
      <text x="140" y="172" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">count(1) = 3 &gt; 7/3 (2) [VALID]  |  count(2) = 3 &gt; 7/3 (2) [VALID]  =&gt;  Output = [1, 2]</text>
    </g>
  </g>
</svg>
