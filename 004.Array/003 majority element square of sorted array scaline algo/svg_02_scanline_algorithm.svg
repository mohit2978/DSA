<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="950" height="630" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Scanline Algorithm (Difference Array / Range Updates)</text>
  <rect x="740" y="35" width="160" height="30" rx="15" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-width="1"/>
  <text x="820" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle">O(Q + N) Optimal</text>

  <!-- Section 1: Core Intuition -->
  <g transform="translate(30, 95)">
    <rect width="890" height="135" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">1. Core Concept: Why diff[L] += val and diff[R+1] -= val works</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Instead of adding 'val' to every element from L to R (which takes O(N) per query), we record two boundary signals:</text>

    <!-- 2 Box signals -->
    <g transform="translate(20, 65)">
      <rect width="400" height="50" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Start Signal: diff[L] += val</text>
      <text x="15" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Activates '+val' to propagate through prefix sum from index L.</text>
    </g>

    <g transform="translate(450, 65)">
      <rect width="420" height="50" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">2. Cancellation Signal: diff[R+1] -= val</text>
      <text x="15" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Neutralizes '+val' so it does not propagate past index R.</text>
    </g>
  </g>

  <!-- Section 2: Step by Step Dry Run Trace -->
  <g transform="translate(30, 245)">
    <rect width="890" height="240" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">2. Step-by-Step Dry Run (Updates: [1,3, 2], [2,4, 3], [0,2, -2], Size = 6)</text>

    <g transform="translate(20, 45)">
      <!-- Update 1 -->
      <text x="0" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Update 1 [1, 3, +2]:</text>
      <text x="160" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">diff[1] += 2, diff[3+1=4] -= 2</text>
      <text x="450" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">diff = [ 0,  2,  0,  0, -2,  0 ]</text>

      <!-- Update 2 -->
      <text x="0" y="45" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Update 2 [2, 4, +3]:</text>
      <text x="160" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">diff[2] += 3, diff[4+1=5] -= 3</text>
      <text x="450" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">diff = [ 0,  2,  3,  0, -2, -3 ]</text>

      <!-- Update 3 -->
      <text x="0" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Update 3 [0, 2, -2]:</text>
      <text x="160" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">diff[0] += -2, diff[2+1=3] -= -2 (+2)</text>
      <text x="450" y="70" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">diff = [-2,  2,  3,  2, -2, -3 ]</text>

      <!-- Prefix Sum Visual Bar -->
      <g transform="translate(0, 95)">
        <rect width="850" height="85" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
        <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Prefix Sum Accumulation Pass (diff[i] = diff[i-1] + diff[i]):</text>

        <!-- Final Array Blocks -->
        <g transform="translate(15, 35)">
          <rect x="0" y="0" width="55" height="36" rx="6" fill="url(#blueGrad)"/>
          <text x="27" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">-2</text>
          <text x="27" y="-5" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">idx 0</text>

          <rect x="70" y="0" width="55" height="36" rx="6" fill="url(#blueGrad)"/>
          <text x="97" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text>
          <text x="97" y="-5" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">idx 1 (-2+2)</text>

          <rect x="140" y="0" width="55" height="36" rx="6" fill="url(#blueGrad)"/>
          <text x="167" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
          <text x="167" y="-5" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">idx 2 (0+3)</text>

          <rect x="210" y="0" width="55" height="36" rx="6" fill="url(#blueGrad)"/>
          <text x="237" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">5</text>
          <text x="237" y="-5" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">idx 3 (3+2)</text>

          <rect x="280" y="0" width="55" height="36" rx="6" fill="url(#blueGrad)"/>
          <text x="307" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">3</text>
          <text x="307" y="-5" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">idx 4 (5-2)</text>

          <rect x="350" y="0" width="55" height="36" rx="6" fill="url(#blueGrad)"/>
          <text x="377" y="23" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">0</text>
          <text x="377" y="-5" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">idx 5 (3-3)</text>

          <text x="440" y="24" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">Result Array = [-2, 0, 3, 5, 3, 0]</text>
        </g>
      </g>
    </g>
  </g>

  <!-- Section 3: Complexity Matrix -->
  <g transform="translate(30, 500)">
    <rect width="890" height="110" rx="12" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Scanline Complexity Matrix</text>

    <g transform="translate(20, 35)">
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Method</text>
      <text x="220" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Query Processing Time</text>
      <text x="440" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Final Array Build Time</text>
      <text x="680" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Total Complexity</text>

      <line x1="0" y1="26" x2="850" y2="26" stroke="#334155" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="10" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">Naive Brute Force</text>
      <text x="220" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">O(N) per query</text>
      <text x="440" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">O(0)</text>
      <text x="680" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">O(Q * N)</text>

      <!-- Row 2 -->
      <text x="10" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Scanline (Difference Array)</text>
      <text x="220" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(1) per query</text>
      <text x="440" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(N) prefix pass</text>
      <text x="680" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(Q + N)</text>
    </g>
  </g>
</svg>
