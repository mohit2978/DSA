<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="950" height="620" rx="16" fill="url(#bgGrad)"/>

  <!-- Header -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Faulty Keyboard &amp; Long-Pressed Name Dry Run</text>
  <rect x="740" y="35" width="160" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="820" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">LeetCode 2810 &amp; 925</text>

  <!-- Section 1: Faulty Keyboard (LeetCode 2810) Dry Run -->
  <g transform="translate(30, 95)">
    <rect width="890" height="200" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">1. Faulty Keyboard (LeetCode 2810) - Trace on s = "string"</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Whenever char 'i' is encountered, reverse string so far and do NOT append 'i'.</text>

    <!-- Visual steps -->
    <g transform="translate(20, 65)">
      <!-- Step 1 to 3: "str" -->
      <g transform="translate(0, 0)">
        <rect width="120" height="50" rx="8" fill="#0f172a" stroke="#475569"/>
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Type 's', 't', 'r'</text>
        <text x="10" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">"str"</text>
      </g>

      <!-- Arrow -->
      <line x1="130" y1="25" x2="160" y2="25" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 4: 'i' reverse -->
      <g transform="translate(170, 0)">
        <rect width="170" height="50" rx="8" fill="#0f172a" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">Encounter 'i' -&gt; Reverse</text>
        <text x="10" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">"rts"</text>
      </g>

      <!-- Arrow -->
      <line x1="350" y1="25" x2="380" y2="25" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrow)"/>

      <!-- Step 5 & 6: 'n', 'g' -->
      <g transform="translate(390, 0)">
        <rect width="180" height="50" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1.5"/>
        <text x="10" y="20" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Append 'n', then 'g'</text>
        <text x="10" y="40" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">"rtsng" (Final)</text>
      </g>

      <!-- Example 2: mohit -->
      <g transform="translate(0, 65)">
        <rect width="850" height="50" rx="8" fill="#0f172a" stroke="#334155"/>
        <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Example 2: s = "mohit"</text>
        <text x="15" y="40" font-family="system-ui, sans-serif" font-size="12" fill="#cbd5e1">'m' -&gt; "m" | 'o' -&gt; "mo" | 'h' -&gt; "moh" | 'i' (reverse) -&gt; "hom" | 't' -&gt; "homt"  =&gt;  Output: "homt"</text>
      </g>
    </g>
  </g>

  <!-- Section 2: Long-Pressed Name (LeetCode 925) Two-Pointer Trace -->
  <g transform="translate(30, 310)">
    <rect width="890" height="295" rx="12" fill="#1e293b" stroke="#059669" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">2. Long-Pressed Name (LeetCode 925) - Two Pointer Traversal</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">Two Pointers (i in s1, j in s2). Advance both on match; advance j if s2[j] == s1[i-1] (repeated press).</text>

    <!-- Case A: Valid Match -->
    <g transform="translate(20, 65)">
      <rect width="410" height="210" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Case 1: s1 = "sumeet", s2 = "ssummmeettt" [TRUE]</text>

      <text x="15" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">1. s1[0]='s' == s2[0]='s' -&gt; i++, j++ (i=1, j=1)</text>
      <text x="15" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">2. s2[1]='s' == s1[0]='s' (long press) -&gt; j++ (j=2)</text>
      <text x="15" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">3. s1[1]='u' == s2[2]='u' -&gt; i++, j++ (i=2, j=3)</text>
      <text x="15" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">4. s1[2]='m' == s2[3..5]='mmm' -&gt; 1 match + 2 repeats</text>
      <text x="15" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">5. s1[3,4]='ee' == s2[6,7]='ee' -&gt; matches properly</text>
      <text x="15" y="160" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">6. s1[5]='t' == s2[8..10]='ttt' -&gt; 1 match + 2 repeats</text>
      <line x1="15" y1="172" x2="395" y2="172" stroke="#334155" stroke-width="1"/>
      <text x="15" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">All of s1 consumed &amp; valid repeats -&gt; Return TRUE</text>
    </g>

    <!-- Case B: Invalid Match -->
    <g transform="translate(450, 65)">
      <rect width="420" height="210" rx="8" fill="#0f172a" stroke="#f43f5e" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">Case 2: s1 = "shree", s2 = "shrrre" [FALSE]</text>

      <text x="15" y="50" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">1. Match 's', 'h': i=2, j=2</text>
      <text x="15" y="72" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">2. Match 'r' and repeat 'r', 'r': i=3, j=5</text>
      <text x="15" y="94" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">3. Match 1st 'e': s1[3]='e' == s2[5]='e' -&gt; i=4, j=6</text>
      <text x="15" y="116" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">4. j reached end of s2 (j == 6), BUT i = 4 &lt; 5 (length of s1)!</text>
      <text x="15" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">5. 2nd 'e' from "shree" is MISSING in typed "shrrre".</text>
      <line x1="15" y1="172" x2="405" y2="172" stroke="#334155" stroke-width="1"/>
      <text x="15" y="194" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">i != s1.length() -&gt; Return FALSE</text>
    </g>
  </g>
</svg>
