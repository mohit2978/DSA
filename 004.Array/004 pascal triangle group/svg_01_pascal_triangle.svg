<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="960" height="660" rx="16" fill="url(#bgGrad)"/>

  <!-- Header Card -->
  <rect x="30" y="20" width="900" height="60" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Pascal's Triangle &amp; Combination (<tspan font-size="14" dy="-6">n</tspan><tspan font-size="18" dy="6">C</tspan><tspan font-size="14" dy="5">r</tspan><tspan font-size="20" dy="-5">) Mathematical Properties</tspan></text>
  <rect x="760" y="35" width="150" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="835" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">3 Core Variations</text>

  <!-- Left Column: Visual Pascal Triangle & Addition Property -->
  <g transform="translate(30, 95)">
    <rect width="460" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">1. Triangle Structure &amp; Addition Property</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Value at (r, c) = <tspan font-size="9" dy="-4">r-1</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">c-1</tspan><tspan font-size="11" dy="-4"> where n = r-1, r_col = c-1</tspan></text>

    <!-- Pyramid Nodes -->
    <g transform="translate(230, 70)">
      <!-- Row 1: 1 -->
      <g transform="translate(0, 0)">
        <circle cx="0" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <text x="-190" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Row 1 (n=0):</text>
      </g>

      <!-- Row 2: 1 1 -->
      <g transform="translate(0, 42)">
        <circle cx="-25" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="-25" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <circle cx="25" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="25" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <text x="-190" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Row 2 (n=1):</text>
      </g>

      <!-- Row 3: 1 2 1 -->
      <g transform="translate(0, 84)">
        <circle cx="-50" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="-50" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <circle cx="0" cy="0" r="16" fill="url(#emeraldGrad)"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
        <circle cx="50" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="50" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <text x="-190" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Row 3 (n=2):</text>
      </g>

      <!-- Row 4: 1 3 3 1 -->
      <g transform="translate(0, 126)">
        <circle cx="-75" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="-75" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <circle cx="-25" cy="0" r="16" fill="url(#purpleGrad)"/>
        <text x="-25" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
        <circle cx="25" cy="0" r="16" fill="url(#purpleGrad)"/>
        <text x="25" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
        <circle cx="75" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="75" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <text x="-190" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Row 4 (n=3):</text>
      </g>

      <!-- Row 5: 1 4 6 4 1 -->
      <g transform="translate(0, 168)">
        <circle cx="-100" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="-100" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <circle cx="-50" cy="0" r="16" fill="url(#amberGrad)"/>
        <text x="-50" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
        <circle cx="0" cy="0" r="18" fill="url(#amberGrad)" stroke="#fbbf24" stroke-width="2"/>
        <text x="0" y="5" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#fff" text-anchor="middle">6</text>
        <circle cx="50" cy="0" r="16" fill="url(#amberGrad)"/>
        <text x="50" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
        <circle cx="100" cy="0" r="16" fill="url(#blueGrad)"/>
        <text x="100" y="5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
        <text x="-190" y="4" font-family="system-ui, sans-serif" font-size="10" fill="#64748b">Row 5 (n=4):</text>
      </g>

      <!-- Connection Lines showing 3 + 3 = 6 -->
      <path d="M -20, 140 L -4, 153" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2"/>
      <path d="M 20, 140 L 4, 153" stroke="#fbbf24" stroke-width="2" stroke-dasharray="2"/>
    </g>

    <!-- Formula Box -->
    <rect x="20" y="275" width="420" height="95" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="35" y="298" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Addition Property (DP Transition):</text>
    <text x="35" y="320" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#34d399">P[r][c] = P[r-1][c-1] + P[r-1][c]</text>
    <text x="35" y="342" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Example: 3 + 3 = 6 (at row 5, col 3, representing <tspan font-size="9" dy="-4">4</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">2</tspan><tspan font-size="11" dy="-4">)</tspan></text>
  </g>

  <!-- Right Column: Combination Property, Symmetry & Row Generation Trick -->
  <g transform="translate(510, 95)">
    <rect width="420" height="385" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">2. Combination &amp; Symmetry Properties</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Compute terms in O(N) time with O(1) extra space!</text>

    <!-- Recurrence derivation card -->
    <g transform="translate(20, 60)">
      <rect width="380" height="155" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Combination Formulas &amp; Symmetry:</text>
      <text x="15" y="44" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1"><tspan font-size="9" dy="-4">n</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">r</tspan><tspan font-size="11" dy="-4"> = n! / ( r! * (n-r)! )</tspan></text>
      
      <!-- Symmetry Highlight Box -->
      <rect x="15" y="55" width="350" height="32" rx="5" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-width="1"/>
      <text x="25" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">Symmetry: <tspan font-size="9" dy="-4">n</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">r</tspan><tspan font-size="12" dy="-4"> = </tspan><tspan font-size="9" dy="-4">n</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">n-r</tspan><tspan font-size="11" dy="-4">  =&gt; r = min(r, n-r)</tspan></text>

      <line x1="15" y1="98" x2="365" y2="98" stroke="#334155" stroke-width="1"/>
      <text x="15" y="118" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24"><tspan font-size="9" dy="-4">n</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">r</tspan><tspan font-size="12" dy="-4"> = </tspan><tspan font-size="9" dy="-4">n</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">r-1</tspan><tspan font-size="12" dy="-4"> * (n - i + 1) / i</tspan></text>
      <text x="15" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Start with ans = 1, then loop i from 1 to n</text>
    </g>

    <!-- Example Row 5 dry run -->
    <g transform="translate(20, 230)">
      <rect width="380" height="135" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <text x="15" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#c084fc">Dry Run for Row 5 (n = 4):</text>
      <text x="15" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">i = 0 -&gt; ans = 1 (<tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">0</tspan><tspan font-size="11" dy="-3">)</tspan></text>
      <text x="15" y="66" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">i = 1 -&gt; 1 * (4 - 1 + 1)/1 = 4 (<tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">1</tspan><tspan font-size="11" dy="-3">)</tspan></text>
      <text x="15" y="86" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">i = 2 -&gt; 4 * (4 - 2 + 1)/2 = 6 (<tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">2</tspan><tspan font-size="11" dy="-3">)</tspan></text>
      <text x="15" y="106" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">i = 3 -&gt; 4 (<tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">3</tspan><tspan font-size="11" dy="-3"> = </tspan><tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">1</tspan><tspan font-size="11" dy="-3">)  |  i = 4 -&gt; 1 (</tspan><tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">4</tspan><tspan font-size="11" dy="-3"> = </tspan><tspan font-size="8" dy="-3">4</tspan><tspan font-size="11" dy="3">C</tspan><tspan font-size="8" dy="3">0</tspan><tspan font-size="11" dy="-3">)</tspan></text>
    </g>
  </g>

  <!-- Bottom: 3 Variations Complexity Matrix -->
  <g transform="translate(30, 495)">
    <rect width="900" height="145" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">The 3 Pascal's Triangle Variations Matrix</text>

    <g transform="translate(20, 35)">
      <text x="10" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Variation</text>
      <text x="280" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Goal</text>
      <text x="500" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Optimal Formula / Method</text>
      <text x="750" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Time Complexity</text>

      <line x1="0" y1="26" x2="860" y2="26" stroke="#334155" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="10" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Variation 1 (Element at r, c)</text>
      <text x="280" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Return single value</text>
      <text x="500" y="46" font-family="system-ui, sans-serif" font-size="11" fill="#34d399"><tspan font-size="9" dy="-4">r-1</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">c-1</tspan><tspan font-size="11" dy="-4"> via min(r, n-r)</tspan></text>
      <text x="750" y="46" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(c)</text>

      <!-- Row 2 -->
      <text x="10" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Variation 2 (Given Row r)</text>
      <text x="280" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Return full r-th row</text>
      <text x="500" y="68" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">Linear running product formula</text>
      <text x="750" y="68" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(r)</text>

      <!-- Row 3 -->
      <text x="10" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">Variation 3 (Full Triangle)</text>
      <text x="280" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Return all rows 1..n</text>
      <text x="500" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#34d399">DP OR <tspan font-size="9" dy="-4">n</tspan><tspan font-size="12" dy="4">C</tspan><tspan font-size="9" dy="4">r</tspan><tspan font-size="11" dy="-4"> row generator</tspan></text>
      <text x="750" y="90" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(n^2)</text>
    </g>
  </g>
</svg>
