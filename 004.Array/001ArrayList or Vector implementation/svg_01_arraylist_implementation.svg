<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#fbbf24"/>
    </marker>
  </defs>

  <rect width="950" height="620" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <rect x="30" y="20" width="890" height="60" rx="12" fill="url(#cardGrad)" filter="url(#shadow)" stroke="#475569" stroke-width="1"/>
  <text x="50" y="57" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc">Custom Dynamic Array (ArrayList / Vector) Architecture</text>
  <rect x="730" y="35" width="170" height="30" rx="15" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-width="1"/>
  <text x="815" y="55" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" text-anchor="middle">O(1) Amortized Append</text>

  <!-- Section 1: Memory Layout & Doubling Strategy -->
  <g transform="translate(30, 95)">
    <rect width="890" height="180" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">1. Dynamic Resizing (Doubling Strategy: Capacity 4 -&gt; 8)</text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8">When size reaches capacity (idx == capacity), allocate new buffer of 2 * capacity, copy elements, delete old array.</text>

    <!-- Old Array (Capacity = 4, Full) -->
    <g transform="translate(30, 65)">
      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">Old Buffer (cap = 4):</text>
      
      <rect x="130" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="150" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">10</text>
      <text x="150" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[0]</text>

      <rect x="175" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="195" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">20</text>
      <text x="195" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[1]</text>

      <rect x="220" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="240" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">30</text>
      <text x="240" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[2]</text>

      <rect x="265" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="285" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">40</text>
      <text x="285" y="48" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">[3]</text>

      <!-- Full badge -->
      <rect x="315" y="7" width="60" height="26" rx="6" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1"/>
      <text x="345" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171" text-anchor="middle">FULL</text>
    </g>

    <!-- Arrow down to new array -->
    <line x1="240" y1="120" x2="240" y2="135" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>

    <!-- New Array (Capacity = 8) -->
    <g transform="translate(30, 135)">
      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#34d399">New Buffer (cap = 8):</text>
      
      <!-- Copied elements -->
      <rect x="130" y="5" width="36" height="30" rx="5" fill="url(#emeraldGrad)"/>
      <text x="148" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">10</text>

      <rect x="170" y="5" width="36" height="30" rx="5" fill="url(#emeraldGrad)"/>
      <text x="188" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">20</text>

      <rect x="210" y="5" width="36" height="30" rx="5" fill="url(#emeraldGrad)"/>
      <text x="228" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">30</text>

      <rect x="250" y="5" width="36" height="30" rx="5" fill="url(#emeraldGrad)"/>
      <text x="268" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">40</text>

      <!-- Newly inserted element -->
      <rect x="290" y="5" width="36" height="30" rx="5" fill="url(#amberGrad)"/>
      <text x="308" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">50</text>

      <!-- Empty slots -->
      <rect x="330" y="5" width="36" height="30" rx="5" fill="#334155" stroke="#475569" stroke-dasharray="2"/>
      <text x="348" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">-</text>

      <rect x="370" y="5" width="36" height="30" rx="5" fill="#334155" stroke="#475569" stroke-dasharray="2"/>
      <text x="388" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">-</text>

      <rect x="410" y="5" width="36" height="30" rx="5" fill="#334155" stroke="#475569" stroke-dasharray="2"/>
      <text x="428" y="25" font-family="system-ui, sans-serif" font-size="11" fill="#64748b" text-anchor="middle">-</text>

      <text x="460" y="25" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">size = 5, cap = 8</text>
    </g>

    <!-- Side card for Amortized Math -->
    <rect x="580" y="45" width="285" height="120" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="595" y="70" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Amortized Analysis Proof:</text>
    <text x="595" y="90" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Copies: 1 + 2 + 4 + 8 + ... + N = 2N - 1</text>
    <text x="595" y="110" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Total Cost for N items = N + 2N = 3N</text>
    <text x="595" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Avg cost per item = 3N / N = 3 = O(1)</text>
    <text x="595" y="150" font-family="system-ui, sans-serif" font-size="10" fill="#f87171">Fixed +1 growth would cost O(N^2) total!</text>
  </g>

  <!-- Section 2: Removal with Left Shift & Shrinking (Sumeet Sir's Lecture) -->
  <g transform="translate(30, 290)">
    <rect width="890" height="165" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">2. Removal (O(N) Left Shift) &amp; Shrinking (Resize Down at size == capacity / 4)</text>

    <!-- Shift visualization -->
    <g transform="translate(30, 55)">
      <text x="0" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0">remove(index = 1):</text>

      <rect x="130" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="150" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">10</text>

      <!-- Removed item -->
      <rect x="175" y="5" width="40" height="32" rx="6" fill="#ef4444" fill-opacity="0.3" stroke="#ef4444" stroke-dasharray="3"/>
      <text x="195" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">20</text>
      <text x="195" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#f87171" text-anchor="middle">DEL</text>

      <!-- Shift arrows -->
      <line x1="240" y1="21" x2="200" y2="21" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>
      <line x1="285" y1="21" x2="245" y2="21" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)"/>

      <rect x="220" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="240" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">30</text>

      <rect x="265" y="5" width="40" height="32" rx="6" fill="url(#blueGrad)"/>
      <text x="285" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">40</text>

      <text x="325" y="26" font-family="system-ui, sans-serif" font-size="11" fill="#fbbf24">Shifts arr[j] = arr[j+1] for all j &gt;= i</text>
    </g>

    <!-- Shrink rule box -->
    <rect x="30" y="105" width="830" height="45" rx="8" fill="#0f172a" stroke="#059669" stroke-width="1"/>
    <text x="45" y="125" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">Why shrink at size == capacity / 4 (to capacity / 2)?</text>
    <text x="45" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Prevents thrashing (rapid resize up/down when alternating between add() and remove() at boundary).</text>
  </g>

  <!-- Section 3: Operations Complexity Summary Table -->
  <g transform="translate(30, 470)">
    <rect width="890" height="130" rx="12" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="26" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Operations Complexity Matrix</text>

    <!-- Table headers -->
    <g transform="translate(20, 40)">
      <text x="10" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Operation</text>
      <text x="180" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Time Complexity</text>
      <text x="350" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Space</text>
      <text x="480" y="15" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Reason / Mechanism</text>

      <line x1="0" y1="22" x2="850" y2="22" stroke="#334155" stroke-width="1"/>

      <!-- Row 1 -->
      <text x="10" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">get(index) / set(index, val)</text>
      <text x="180" y="40" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(1)</text>
      <text x="350" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">O(1)</text>
      <text x="480" y="40" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Direct pointer arithmetic (base + index * sizeof(T))</text>

      <!-- Row 2 -->
      <text x="10" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">add(val) (Append)</text>
      <text x="180" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#34d399">O(1) Amortized (O(N) worst)</text>
      <text x="350" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">O(1)</text>
      <text x="480" y="60" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Geometric doubling reduces resizing frequency</text>

      <!-- Row 3 -->
      <text x="10" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">remove(index)</text>
      <text x="180" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fbbf24">O(N)</text>
      <text x="350" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">O(1)</text>
      <text x="480" y="80" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Requires shifting all subsequent elements left by 1</text>
    </g>
  </g>
</svg>
