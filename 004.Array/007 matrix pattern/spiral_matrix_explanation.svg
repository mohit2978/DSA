<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 480" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .cell-text { font-family: 'Segoe UI', monospace, sans-serif; font-size: 16px; font-weight: bold; fill: #f1f5f9; text-anchor: middle; dominant-baseline: middle; }
      .step-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; font-weight: bold; }
      .step-desc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .box-label { font-family: 'Segoe UI', monospace, sans-serif; font-size: 11px; font-weight: bold; fill: #e2e8f0; }
      .note-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #fef08a; }
    </style>
    
    <!-- Markers for arrows -->
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#facc15" />
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#c084fc" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />
  <rect x="2" y="2" width="846" height="476" fill="none" stroke="#1e293b" stroke-width="2" rx="10" />

  <!-- Header -->
  <text x="30" y="40" class="title">Spiral Matrix Traversal Concept</text>
  <text x="30" y="62" class="subtitle">Traverse in 4 cyclic directions while continuously shrinking boundary pointers</text>

  <!-- Left: Matrix (3x6) Grid -->
  <!-- Bounds: str=0, enr=2, stc=0, enc=5 -->
  <g transform="translate(40, 95)">
    <!-- Boundary Labels -->
    <text x="145" y="-12" class="box-label" fill="#38bdf8" text-anchor="middle">stc ➔ enc (Top: str)</text>
    <text x="-25" y="75" class="box-label" fill="#f87171" text-anchor="middle" transform="rotate(-90, -25, 75)">enr ➔ str</text>
    <text x="315" y="75" class="box-label" fill="#4ade80" text-anchor="middle" transform="rotate(90, 315, 75)">str ➔ enr</text>
    <text x="145" y="165" class="box-label" fill="#facc15" text-anchor="middle">enc ➔ stc (Bottom: enr)</text>

    <!-- Matrix Cells: 6 cols x 3 rows, cell size 48x48, spacing 4 -->
    <!-- Row 0: a, b, c, d, e, f -->
    <rect x="0" y="0" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="24" y="24" class="cell-text">a</text>
    <rect x="52" y="0" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="76" y="24" class="cell-text">b</text>
    <rect x="104" y="0" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="128" y="24" class="cell-text">c</text>
    <rect x="156" y="0" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="180" y="24" class="cell-text">d</text>
    <rect x="208" y="0" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="232" y="24" class="cell-text">e</text>
    <rect x="260" y="0" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="284" y="24" class="cell-text">f</text>

    <!-- Row 1: g, h, i, j, k, l -->
    <rect x="0" y="52" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="24" y="76" class="cell-text">g</text>
    <rect x="52" y="52" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="76" y="76" class="cell-text">h</text>
    <rect x="104" y="52" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="128" y="76" class="cell-text">i</text>
    <rect x="156" y="52" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="180" y="76" class="cell-text">j</text>
    <rect x="208" y="52" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="232" y="76" class="cell-text">k</text>
    <rect x="260" y="52" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="284" y="76" class="cell-text">l</text>

    <!-- Row 2: m, n, o, p, q, r -->
    <rect x="0" y="104" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="24" y="128" class="cell-text">m</text>
    <rect x="52" y="104" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="76" y="128" class="cell-text">n</text>
    <rect x="104" y="104" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="128" y="128" class="cell-text">o</text>
    <rect x="156" y="104" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="180" y="128" class="cell-text">p</text>
    <rect x="208" y="104" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="232" y="128" class="cell-text">q</text>
    <rect x="260" y="104" width="48" height="48" rx="6" fill="#1e293b" stroke="#334155" />
    <text x="284" y="128" class="cell-text">r</text>

    <!-- Spiral Traversal Line -->
    <!-- 1: a -> f -->
    <path d="M 24 24 L 284 24" fill="none" stroke="#38bdf8" stroke-width="3.5" marker-end="url(#arrow-blue)" />
    <!-- 2: f -> r -->
    <path d="M 284 24 L 284 128" fill="none" stroke="#4ade80" stroke-width="3.5" marker-end="url(#arrow-green)" />
    <!-- 3: r -> m -->
    <path d="M 284 128 L 24 128" fill="none" stroke="#facc15" stroke-width="3.5" marker-end="url(#arrow-yellow)" />
    <!-- 4: m -> g -->
    <path d="M 24 128 L 24 76" fill="none" stroke="#f87171" stroke-width="3.5" marker-end="url(#arrow-red)" />
    <!-- 5: g -> k (inner) -->
    <path d="M 24 76 L 232 76" fill="none" stroke="#c084fc" stroke-width="3.5" stroke-dasharray="4,3" marker-end="url(#arrow-purple)" />
  </g>

  <!-- Right: 4 Directional Steps & Rules -->
  <g transform="translate(410, 85)">
    <!-- Container -->
    <rect width="400" height="350" rx="10" fill="#1e293b" stroke="#334155" />
    
    <text x="20" y="30" class="title" style="font-size: 16px;">4-Step Directional Loop</text>
    
    <!-- Step 1 -->
    <g transform="translate(20, 50)">
      <circle cx="10" cy="10" r="10" fill="#0284c7" />
      <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
      <text x="30" y="10" class="step-title" fill="#38bdf8">Top Row (Left ➔ Right)</text>
      <text x="30" y="26" class="step-desc">Traverse row `str` from `stc` to `enc`, then <tspan font-weight="bold" fill="#38bdf8">str++</tspan></text>
    </g>

    <!-- Step 2 -->
    <g transform="translate(20, 110)">
      <circle cx="10" cy="10" r="10" fill="#16a34a" />
      <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
      <text x="30" y="10" class="step-title" fill="#4ade80">Right Column (Top ➔ Bottom)</text>
      <text x="30" y="26" class="step-desc">Traverse col `enc` from `str` to `enr`, then <tspan font-weight="bold" fill="#4ade80">enc--</tspan></text>
    </g>

    <!-- Step 3 -->
    <g transform="translate(20, 170)">
      <circle cx="10" cy="10" r="10" fill="#ca8a04" />
      <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
      <text x="30" y="10" class="step-title" fill="#facc15">Bottom Row (Right ➔ Left)</text>
      <text x="30" y="26" class="step-desc">If `str &lt;= enr`: traverse row `enr` from `enc` to `stc`, then <tspan font-weight="bold" fill="#facc15">enr--</tspan></text>
    </g>

    <!-- Step 4 -->
    <g transform="translate(20, 230)">
      <circle cx="10" cy="10" r="10" fill="#dc2626" />
      <text x="10" y="14" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
      <text x="30" y="10" class="step-title" fill="#f87171">Left Column (Bottom ➔ Top)</text>
      <text x="30" y="26" class="step-desc">If `stc &lt;= enc`: traverse col `stc` from `enr` to `str`, then <tspan font-weight="bold" fill="#f87171">stc++</tspan></text>
    </g>

    <!-- Core Takeaway Note -->
    <g transform="translate(15, 290)">
      <rect width="370" height="44" rx="6" fill="#854d0e" fill-opacity="0.3" stroke="#eab308" stroke-width="1" />
      <text x="12" y="19" class="note-text" font-weight="bold">Key Invariant:</text>
      <text x="12" y="34" class="note-text" font-size="11.5">Each traversed row/column boundary shrinks and is never revisited.</text>
    </g>
  </g>

  <!-- Bottom Left: Output Order Trace -->
  <g transform="translate(40, 310)">
    <rect width="345" height="125" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="15" y="25" class="box-label" fill="#94a3b8">Traversed Spiral Output Sequence:</text>
    <rect x="15" y="35" width="315" height="35" rx="5" fill="#0f172a" stroke="#334155" />
    <text x="25" y="58" font-family="monospace" font-size="13" font-weight="bold" fill="#38bdf8">a ➔ b ➔ c ➔ d ➔ e ➔ f ➔ </text>
    <text x="25" y="92" font-family="monospace" font-size="13" font-weight="bold">
      <tspan fill="#4ade80">l ➔ r ➔ </tspan>
      <tspan fill="#facc15">q ➔ p ➔ o ➔ n ➔ m ➔ </tspan>
      <tspan fill="#f87171">g ➔ </tspan>
      <tspan fill="#c084fc">h ➔ i ➔ j ➔ k</tspan>
    </text>
  </g>
</svg>
