<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 520" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 20px; font-weight: bold; fill: #f8fafc; }
      .subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; fill: #94a3b8; }
      .grid-header { font-family: 'Segoe UI', monospace, sans-serif; font-size: 12px; fill: #64748b; font-weight: bold; text-anchor: middle; }
      .cell-text { font-family: 'Segoe UI', monospace, sans-serif; font-size: 13px; font-weight: bold; text-anchor: middle; dominant-baseline: middle; }
      .sec-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: bold; fill: #f8fafc; }
      .desc-text { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #cbd5e1; }
      .code-box { font-family: 'Consolas', monospace; font-size: 11.5px; fill: #38bdf8; }
    </style>
    
    <marker id="arrow-up" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrow-down" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a" rx="12" />
  <rect x="2" y="2" width="856" height="516" fill="none" stroke="#1e293b" stroke-width="2" rx="10" />

  <!-- Header -->
  <text x="30" y="38" class="title">Diagonal Matrix Traversal (Zig-Zag)</text>
  <text x="30" y="58" class="subtitle">Diagonals are grouped by constant sum (row + col = d), alternating between UP ↗ and DOWN ↙ directions</text>

  <!-- Left Side: Matrix (4x5 sample grid) with indices and arrows -->
  <g transform="translate(35, 80)">
    <rect width="360" height="310" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="15" y="25" class="sec-title" style="font-size: 13px; fill: #94a3b8;">Index Grid (Row, Col)</text>

    <!-- Column labels -->
    <text x="75" y="48" class="grid-header">c=0</text>
    <text x="135" y="48" class="grid-header">c=1</text>
    <text x="195" y="48" class="grid-header">c=2</text>
    <text x="255" y="48" class="grid-header">c=3</text>
    <text x="315" y="48" class="grid-header">c=4</text>

    <!-- Row labels -->
    <text x="30" y="85" class="grid-header">r=0</text>
    <text x="30" y="145" class="grid-header">r=1</text>
    <text x="30" y="205" class="grid-header">r=2</text>
    <text x="30" y="265" class="grid-header">r=3</text>

    <!-- Cells (4 rows x 5 cols) -->
    <!-- Row 0 -->
    <rect x="50" y="60" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="75" y="85" class="cell-text" fill="#f8fafc">0,0</text>

    <rect x="110" y="60" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="135" y="85" class="cell-text" fill="#f8fafc">0,1</text>

    <rect x="170" y="60" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="195" y="85" class="cell-text" fill="#f8fafc">0,2</text>

    <rect x="230" y="60" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="255" y="85" class="cell-text" fill="#f8fafc">0,3</text>

    <rect x="290" y="60" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="315" y="85" class="cell-text" fill="#f8fafc">0,4</text>

    <!-- Row 1 -->
    <rect x="50" y="120" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="75" y="145" class="cell-text" fill="#f8fafc">1,0</text>

    <rect x="110" y="120" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="135" y="145" class="cell-text" fill="#f8fafc">1,1</text>

    <rect x="170" y="120" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="195" y="145" class="cell-text" fill="#f8fafc">1,2</text>

    <rect x="230" y="120" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="255" y="145" class="cell-text" fill="#f8fafc">1,3</text>

    <rect x="290" y="120" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="315" y="145" class="cell-text" fill="#f8fafc">1,4</text>

    <!-- Row 2 -->
    <rect x="50" y="180" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="75" y="205" class="cell-text" fill="#f8fafc">2,0</text>

    <rect x="110" y="180" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="135" y="205" class="cell-text" fill="#f8fafc">2,1</text>

    <rect x="170" y="180" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="195" y="205" class="cell-text" fill="#f8fafc">2,2</text>

    <rect x="230" y="180" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="255" y="205" class="cell-text" fill="#f8fafc">2,3</text>

    <rect x="290" y="180" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="315" y="205" class="cell-text" fill="#f8fafc">2,4</text>

    <!-- Row 3 -->
    <rect x="50" y="240" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="75" y="265" class="cell-text" fill="#f8fafc">3,0</text>

    <rect x="110" y="240" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="135" y="265" class="cell-text" fill="#f8fafc">3,1</text>

    <rect x="170" y="240" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="195" y="265" class="cell-text" fill="#f8fafc">3,2</text>

    <rect x="230" y="240" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="255" y="265" class="cell-text" fill="#f8fafc">3,3</text>

    <rect x="290" y="240" width="50" height="50" rx="4" fill="#0f172a" stroke="#334155" />
    <text x="315" y="265" class="cell-text" fill="#f8fafc">3,4</text>

    <!-- Diagonal Traverse Arrows -->
    <!-- D0: [0,0] UP -->
    <line x1="60" y1="100" x2="90" y2="70" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-up)" />
    <!-- D1: [0,1] -> [1,0] DOWN -->
    <line x1="145" y1="75" x2="65" y2="155" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)" />
    <!-- D2: [2,0] -> [0,2] UP -->
    <line x1="65" y1="215" x2="205" y2="75" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-up)" />
    <!-- D3: [0,3] -> [3,0] DOWN -->
    <line x1="265" y1="75" x2="65" y2="275" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrow-down)" />
    <!-- D4: [3,1] -> [0,4] UP -->
    <line x1="125" y1="275" x2="325" y2="75" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrow-up)" />
  </g>

  <!-- Right Side: Algorithm Strategy & Transitions -->
  <g transform="translate(420, 80)">
    <!-- Container -->
    <rect width="410" height="420" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="20" y="30" class="sec-title">Traversal Logic &amp; Boundary Handling</text>

    <!-- Up Direction Block -->
    <g transform="translate(20, 50)">
      <rect width="370" height="110" rx="6" fill="#0f172a" stroke="#f87171" stroke-opacity="0.5" />
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f87171">Direction 1: UP ↗ (`up = true`)</text>
      <text x="15" y="42" class="desc-text">• Normal step: <tspan font-family="monospace" fill="#fca5a5">row--, col++</tspan> (while row &gt; 0 &amp;&amp; col &lt; n-1)</text>
      <text x="15" y="62" class="desc-text">• Boundary shift at top / right edge:</text>
      <text x="25" y="80" class="code-box" fill="#fca5a5">if (col == n - 1) row++;  // right wall reached</text>
      <text x="25" y="98" class="code-box" fill="#fca5a5">else col++;               // top wall reached</text>
    </g>

    <!-- Down Direction Block -->
    <g transform="translate(20, 175)">
      <rect width="370" height="110" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-opacity="0.5" />
      <text x="15" y="22" font-family="sans-serif" font-size="13" font-weight="bold" fill="#38bdf8">Direction 2: DOWN ↙ (`up = false`)</text>
      <text x="15" y="42" class="desc-text">• Normal step: <tspan font-family="monospace" fill="#7dd3fc">row++, col--</tspan> (while col &gt; 0 &amp;&amp; row &lt; m-1)</text>
      <text x="15" y="62" class="desc-text">• Boundary shift at bottom / left edge:</text>
      <text x="25" y="80" class="code-box" fill="#7dd3fc">if (row == m - 1) col++;  // bottom wall reached</text>
      <text x="25" y="98" class="code-box" fill="#7dd3fc">else row++;               // left wall reached</text>
    </g>

    <!-- Alternating groups display -->
    <g transform="translate(20, 300)">
      <rect width="370" height="100" rx="6" fill="#0f172a" stroke="#334155" />
      <text x="12" y="20" class="desc-text" font-weight="bold" fill="#facc15">Diagonal Groups Sequence:</text>
      <text x="12" y="40" font-family="monospace" font-size="12" fill="#f87171">D0 (↗): [00]</text>
      <text x="12" y="58" font-family="monospace" font-size="12" fill="#38bdf8">D1 (↙): [01, 10]</text>
      <text x="12" y="76" font-family="monospace" font-size="12" fill="#f87171">D2 (↗): [20, 11, 02]</text>
      <text x="170" y="40" font-family="monospace" font-size="12" fill="#38bdf8">D3 (↙): [03, 12, 21, 30]</text>
      <text x="170" y="58" font-family="monospace" font-size="12" fill="#f87171">D4 (↗): [40, 31, 22, 13, 04]</text>
      <text x="170" y="76" font-family="monospace" font-size="12" fill="#94a3b8">... and so on</text>
    </g>
  </g>

  <!-- Bottom Left: Output Sequence summary -->
  <g transform="translate(35, 410)">
    <rect width="360" height="90" rx="8" fill="#1e293b" stroke="#334155" />
    <text x="15" y="25" class="sec-title" style="font-size: 13px;">Key Observation</text>
    <text x="15" y="45" class="desc-text">• For all cells on the same diagonal: <tspan font-family="monospace" fill="#facc15">r + c = constant</tspan></text>
    <text x="15" y="65" class="desc-text">• Flip direction flag: <tspan font-family="monospace" fill="#4ade80">up = !up</tspan> after finishing each diagonal.</text>
  </g>
</svg>
