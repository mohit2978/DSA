<svg viewBox="0 0 780 360" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="780" height="360" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Detect Cycle using DSU <tspan fill="#9aa0a6" font-weight="normal">— GFG, undirected graph with V nodes and E edges</tspan></text>
  <line x1="25" y1="38" x2="755" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Example 1 -->
  <rect x="25" y="48" width="355" height="255" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="72" fill="#f2c14e" font-size="13.5" font-weight="bold">Example 1 &#8212; Output: 1</text>

  <g stroke="#9aa0a6" stroke-width="2">
    <line x1="95"  y1="120" x2="130" y2="185"/>   <!-- 1-3 -->
    <line x1="152" y1="185" x2="195" y2="130"/>   <!-- 3-0 -->
  </g>
  <g stroke="#e06c75" stroke-width="3">
    <line x1="205" y1="130" x2="205" y2="230"/>   <!-- 0-2 -->
    <line x1="225" y1="128" x2="285" y2="180"/>   <!-- 0-4 -->
    <line x1="285" y1="200" x2="228" y2="240"/>   <!-- 2-4 -->
  </g>

  <g>
    <circle cx="90"  cy="115" r="22" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="205" cy="115" r="22" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
    <circle cx="140" cy="190" r="22" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="300" cy="190" r="22" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
    <circle cx="205" cy="250" r="22" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="15">
    <text x="90"  y="121">1</text>
    <text x="205" y="121">0</text>
    <text x="140" y="196">3</text>
    <text x="300" y="196">4</text>
    <text x="205" y="256">2</text>
  </g>

  <text x="40" y="292" fill="#e06c75" font-size="13">There is a cycle: <tspan font-family="monospace">0 &#8594; 2 &#8594; 4 &#8594; 0</tspan></text>

  <!-- Example 2 -->
  <rect x="400" y="48" width="355" height="255" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="415" y="72" fill="#f2c14e" font-size="13.5" font-weight="bold">Example 2 &#8212; Output: 0</text>

  <g stroke="#56c98d" stroke-width="2">
    <line x1="470" y1="120" x2="505" y2="185"/>   <!-- 1-3 -->
    <line x1="527" y1="185" x2="570" y2="130"/>   <!-- 3-0 -->
    <line x1="580" y1="130" x2="580" y2="230"/>   <!-- 0-2 -->
    <line x1="600" y1="240" x2="655" y2="200"/>   <!-- 2-4 -->
  </g>

  <g>
    <circle cx="465" cy="115" r="22" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
    <circle cx="580" cy="115" r="22" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
    <circle cx="515" cy="190" r="22" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
    <circle cx="675" cy="190" r="22" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
    <circle cx="580" cy="250" r="22" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="15">
    <text x="465" y="121">1</text>
    <text x="580" y="121">0</text>
    <text x="515" y="196">3</text>
    <text x="675" y="196">4</text>
    <text x="580" y="256">2</text>
  </g>

  <text x="415" y="292" fill="#56c98d" font-size="13">4 edges, 5 nodes, all merges succeeded &#8594; no cycle</text>

  <text x="25" y="330" fill="#9aa0a6" font-size="12.5">The DSU rule: for every edge (u, v), if find(u) == find(v) BEFORE you union them, that edge closes a cycle.</text>
  <text x="25" y="350" fill="#9aa0a6" font-size="12.5">Expected TC: O(V + E) &#160;&#160;&#160; Expected SC: O(V) &#160;&#160;&#160; Constraints: 1 &#8804; V, E &#8804; 10<tspan baseline-shift="super" font-size="9">4</tspan></text>
</svg>
