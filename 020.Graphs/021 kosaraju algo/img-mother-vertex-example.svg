<svg viewBox="0 0 480 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="480" height="320" fill="#1e1e1e"/>
  <text x="20" y="28" fill="#d4d4d4" font-size="15">GfG Mother Vertex — Example 1 (Output: 0)</text>

  <!-- nodes -->
  <circle cx="230" cy="90" r="26" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="100" cy="180" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="230" cy="230" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="370" cy="180" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="370" cy="280" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="18">
    <text x="230" y="97">0</text>
    <text x="100" y="187">1</text>
    <text x="230" y="237">2</text>
    <text x="370" y="187">3</text>
    <text x="370" y="287">4</text>
  </g>

  <!-- edges: 0->2, 0->3, 2->1, 3->4, 1(implicit start)-> none; mother = 0 reaches all -->
  <g stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M 210 108 L 120 162"/>  <!-- 0 -> ... wait need 2->1 -->
    <path d="M 218 113 L 220 208"/>  <!-- 0 -> 2 -->
    <path d="M 253 110 L 355 165"/>  <!-- 0 -> 3 -->
    <path d="M 205 220 L 122 190"/>  <!-- 2 -> 1 -->
    <path d="M 370 206 L 370 254"/>  <!-- 3 -> 4 -->
  </g>

  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa0a6"/></marker>
  </defs>

  <text x="20" y="310" fill="#d4d4d4" font-size="14">0 &#8594; 2, 0 &#8594; 3, 2 &#8594; 1, 3 &#8594; 4 &#8212; node 0 can reach every other node, so 0 is the Mother Vertex.</text>
</svg>
