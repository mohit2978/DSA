<svg viewBox="0 0 620 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="620" height="260" fill="#1e1e1e"/>
  <text x="20" y="26" fill="#d4d4d4" font-size="15">3 SCCs in this graph: {0,1,2}, {3}, {4}</text>

  <!-- SCC {0,1,2} -->
  <ellipse cx="150" cy="140" rx="105" ry="90" fill="#5b9bd5" fill-opacity="0.12" stroke="#5b9bd5" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- SCC {3} -->
  <ellipse cx="420" cy="100" rx="45" ry="45" fill="#f2c14e" fill-opacity="0.12" stroke="#f2c14e" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- SCC {4} -->
  <ellipse cx="420" cy="210" rx="45" ry="45" fill="#56c98d" fill-opacity="0.12" stroke="#56c98d" stroke-width="2" stroke-dasharray="6 4"/>

  <circle cx="100" cy="100" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="220" cy="100" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="150" cy="210" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="420" cy="100" r="26" fill="#2b2b2b" stroke="#f2c14e" stroke-width="2"/>
  <circle cx="420" cy="210" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="17">
    <text x="100" y="107">1</text>
    <text x="220" y="107">0</text>
    <text x="150" y="217">2</text>
    <text x="420" y="107">3</text>
    <text x="420" y="217">4</text>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9aa0a6"/></marker>
  </defs>
  <g stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M 124 100 L 194 100"/>        <!-- 1 -> 0 -->
    <path d="M 205 122 L 168 190"/>        <!-- 0 -> 2 -->
    <path d="M 138 186 L 110 126"/>        <!-- 2 -> 1 -->
    <path d="M 246 100 L 394 100"/>        <!-- 0 -> 3 -->
    <path d="M 420 126 L 420 184"/>        <!-- 3 -> 4 -->
  </g>

  <text x="20" y="245" fill="#9aa0a6" font-size="13">TC of this is O(V+E)</text>
</svg>
