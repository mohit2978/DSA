<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 680" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f111a"/>
      <stop offset="50%" stop-color="#161824"/>
      <stop offset="100%" stop-color="#1a1c2e"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2030"/>
      <stop offset="100%" stop-color="#181a27"/>
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6e3a1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="nodeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fab387"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#89b4fa"/>
    </marker>
  </defs>

  <rect width="1100" height="680" rx="16" fill="url(#bgGrad)" stroke="#313244" stroke-width="1.5"/>

  <!-- Title Section -->
  <text x="550" y="45" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Graph Fundamentals: Graph vs Tree &amp; Types</text>
  <text x="550" y="70" fill="#9399b2" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" text-anchor="middle">Mathematical Definition: G = (V, E) | Vertices (Nodes) &amp; Edges (Connections)</text>

  <!-- Left Card: Tree vs Graph Comparison -->
  <g transform="translate(40, 95)">
    <rect width="480" height="260" rx="12" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.2"/>
    <rect x="0" y="0" width="480" height="38" rx="12" fill="#1e1e2e"/>
    <text x="20" y="25" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">1. Tree vs General Graph</text>

    <!-- Tree diagram -->
    <g transform="translate(30, 50)">
      <text x="80" y="20" fill="#a6e3a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Tree (Special Acyclic Graph)</text>
      <!-- Edges -->
      <line x1="80" y1="50" x2="40" y2="100" stroke="#585b70" stroke-width="2"/>
      <line x1="80" y1="50" x2="120" y2="100" stroke="#585b70" stroke-width="2"/>
      <line x1="40" y1="100" x2="20" y2="150" stroke="#585b70" stroke-width="2"/>
      <line x1="40" y1="100" x2="60" y2="150" stroke="#585b70" stroke-width="2"/>
      <!-- Nodes -->
      <circle cx="80" cy="50" r="14" fill="url(#nodeGreen)"/>
      <text x="80" y="55" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" text-anchor="middle">R</text>
      <circle cx="40" cy="100" r="13" fill="url(#nodeGreen)"/>
      <text x="40" y="105" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">A</text>
      <circle cx="120" cy="100" r="13" fill="url(#nodeGreen)"/>
      <text x="120" y="105" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">B</text>
      <circle cx="20" cy="150" r="12" fill="url(#nodeGreen)"/>
      <text x="20" y="154" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">C</text>
      <circle cx="60" cy="150" r="12" fill="url(#nodeGreen)"/>
      <text x="60" y="154" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" text-anchor="middle">D</text>

      <text x="80" y="185" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">• Exactly 1 Path between any 2 nodes</text>
      <text x="80" y="200" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">• E = V - 1 Edges | No Cycles</text>
    </g>

    <!-- Graph diagram -->
    <g transform="translate(260, 50)">
      <text x="100" y="20" fill="#cba6f7" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">General Graph</text>
      <!-- Edges -->
      <line x1="50" y1="60" x2="150" y2="60" stroke="#585b70" stroke-width="2"/>
      <line x1="50" y1="60" x2="50" y2="140" stroke="#585b70" stroke-width="2"/>
      <line x1="150" y1="60" x2="150" y2="140" stroke="#585b70" stroke-width="2"/>
      <line x1="50" y1="140" x2="150" y2="140" stroke="#585b70" stroke-width="2"/>
      <line x1="50" y1="60" x2="150" y2="140" stroke="#f38ba8" stroke-width="2" stroke-dasharray="4,4"/>
      <!-- Nodes -->
      <circle cx="50" cy="60" r="14" fill="url(#nodePurple)"/>
      <text x="50" y="65" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">0</text>
      <circle cx="150" cy="60" r="14" fill="url(#nodePurple)"/>
      <text x="150" y="65" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">1</text>
      <circle cx="50" cy="140" r="14" fill="url(#nodePurple)"/>
      <text x="50" y="145" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>
      <circle cx="150" cy="140" r="14" fill="url(#nodePurple)"/>
      <text x="150" y="145" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>

      <text x="100" y="185" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">• Can have Multiple Paths &amp; Cycles</text>
      <text x="100" y="200" fill="#f38ba8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">• E can range from 0 to V(V-1)/2</text>
    </g>
  </g>

  <!-- Right Card: Directed vs Undirected & Weighted -->
  <g transform="translate(560, 95)">
    <rect width="500" height="260" rx="12" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.2"/>
    <rect x="0" y="0" width="500" height="38" rx="12" fill="#1e1e2e"/>
    <text x="20" y="25" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">2. Graph Classifications</text>

    <!-- Directed Graph -->
    <g transform="translate(30, 55)">
      <text x="80" y="15" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Directed (Digraph)</text>
      <line x1="30" y1="60" x2="130" y2="60" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="130" y1="70" x2="80" y2="120" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
      <line x1="80" y1="120" x2="30" y2="70" stroke="#89b4fa" stroke-width="2" marker-end="url(#arrow)"/>
      <circle cx="30" cy="60" r="14" fill="url(#nodeBlue)"/>
      <text x="30" y="65" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">A</text>
      <circle cx="130" cy="60" r="14" fill="url(#nodeBlue)"/>
      <text x="130" y="65" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">B</text>
      <circle cx="80" cy="120" r="14" fill="url(#nodeBlue)"/>
      <text x="80" y="125" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">C</text>
      <text x="80" y="165" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Ordered pairs: (u → v)</text>
      <text x="80" y="180" fill="#9399b2" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">E.g., Web Links, Dependencies</text>
    </g>

    <!-- Weighted Graph -->
    <g transform="translate(260, 55)">
      <text x="100" y="15" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Weighted Graph</text>
      <line x1="40" y1="60" x2="160" y2="60" stroke="#fab387" stroke-width="2"/>
      <rect x="90" y="48" width="24" height="18" rx="4" fill="#313244"/>
      <text x="102" y="61" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10</text>

      <line x1="40" y1="60" x2="100" y2="120" stroke="#fab387" stroke-width="2"/>
      <rect x="58" y="88" width="20" height="18" rx="4" fill="#313244"/>
      <text x="68" y="101" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">5</text>

      <line x1="160" y1="60" x2="100" y2="120" stroke="#fab387" stroke-width="2"/>
      <rect x="125" y="88" width="20" height="18" rx="4" fill="#313244"/>
      <text x="135" y="101" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>

      <circle cx="40" cy="60" r="14" fill="url(#nodeOrange)"/>
      <text x="40" y="65" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">u</text>
      <circle cx="160" cy="60" r="14" fill="url(#nodeOrange)"/>
      <text x="160" y="65" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">v</text>
      <circle cx="100" cy="120" r="14" fill="url(#nodeOrange)"/>
      <text x="100" y="125" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">w</text>

      <text x="100" y="165" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">Edge carries cost/weight</text>
      <text x="100" y="180" fill="#9399b2" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" text-anchor="middle">E.g., Road Distances, Latency</text>
    </g>
  </g>

  <!-- Bottom Card: Standard 7-Node Lecture Graph Benchmark -->
  <g transform="translate(40, 375)">
    <rect width="1020" height="270" rx="12" fill="url(#cardGrad)" stroke="#313244" stroke-width="1.2"/>
    <rect x="0" y="0" width="1020" height="38" rx="12" fill="#1e1e2e"/>
    <text x="20" y="25" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="700">3. Standard 7-Vertex Weighted Graph (Used Throughout Course)</text>
    <rect x="580" y="8" width="420" height="24" rx="6" fill="#313244"/>
    <text x="790" y="24" fill="#a6e3a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" text-anchor="middle">V = 7 (0 to 6) | E = 8 Edges | Undirected &amp; Weighted</text>

    <!-- Graph Visual Layout -->
    <g transform="translate(80, 55)">
      <!-- Edges -->
      <!-- 0-1 (10) -->
      <line x1="50" y1="50" x2="160" y2="50" stroke="#89b4fa" stroke-width="3"/>
      <rect x="95" y="38" width="22" height="18" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="106" y="51" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10</text>

      <!-- 1-2 (10) -->
      <line x1="160" y1="50" x2="270" y2="50" stroke="#89b4fa" stroke-width="3"/>
      <rect x="205" y="38" width="22" height="18" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="216" y="51" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10</text>

      <!-- 2-3 (10) -->
      <line x1="270" y1="50" x2="270" y2="150" stroke="#89b4fa" stroke-width="3"/>
      <rect x="259" y="90" width="22" height="18" rx="4" fill="#1e1e2e" stroke="#89b4fa" stroke-width="1"/>
      <text x="270" y="103" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">10</text>

      <!-- 0-3 (40) -->
      <line x1="50" y1="50" x2="270" y2="150" stroke="#f38ba8" stroke-width="2.5" stroke-dasharray="5,5"/>
      <rect x="145" y="90" width="24" height="18" rx="4" fill="#1e1e2e" stroke="#f38ba8" stroke-width="1"/>
      <text x="157" y="103" fill="#f38ba8" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">40</text>

      <!-- 3-4 (2) -->
      <line x1="270" y1="150" x2="390" y2="150" stroke="#a6e3a1" stroke-width="3"/>
      <rect x="322" y="138" width="18" height="18" rx="4" fill="#1e1e2e" stroke="#a6e3a1" stroke-width="1"/>
      <text x="331" y="151" fill="#a6e3a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">2</text>

      <!-- 4-5 (3) -->
      <line x1="390" y1="150" x2="490" y2="70" stroke="#fab387" stroke-width="3"/>
      <rect x="432" y="98" width="18" height="18" rx="4" fill="#1e1e2e" stroke="#fab387" stroke-width="1"/>
      <text x="441" y="111" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>

      <!-- 5-6 (3) -->
      <line x1="490" y1="70" x2="490" y2="150" stroke="#fab387" stroke-width="3"/>
      <rect x="481" y="98" width="18" height="18" rx="4" fill="#1e1e2e" stroke="#fab387" stroke-width="1"/>
      <text x="490" y="111" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">3</text>

      <!-- 4-6 (8) -->
      <line x1="390" y1="150" x2="490" y2="150" stroke="#fab387" stroke-width="3"/>
      <rect x="432" y="138" width="18" height="18" rx="4" fill="#1e1e2e" stroke="#fab387" stroke-width="1"/>
      <text x="441" y="151" fill="#fab387" font-family="'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle">8</text>

      <!-- Vertices -->
      <circle cx="50" cy="50" r="18" fill="url(#nodeBlue)"/>
      <text x="50" y="56" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">0</text>

      <circle cx="160" cy="50" r="18" fill="url(#nodeBlue)"/>
      <text x="160" y="56" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">1</text>

      <circle cx="270" cy="50" r="18" fill="url(#nodeBlue)"/>
      <text x="270" y="56" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">2</text>

      <circle cx="270" cy="150" r="18" fill="url(#nodeBlue)"/>
      <text x="270" y="156" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">3</text>

      <circle cx="390" cy="150" r="18" fill="url(#nodeGreen)"/>
      <text x="390" y="156" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">4</text>

      <circle cx="490" cy="70" r="18" fill="url(#nodeOrange)"/>
      <text x="490" y="76" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">5</text>

      <circle cx="490" cy="150" r="18" fill="url(#nodeOrange)"/>
      <text x="490" y="156" fill="#11111b" font-family="'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="800" text-anchor="middle">6</text>
    </g>

    <!-- Side Analysis box -->
    <g transform="translate(640, 50)">
      <rect width="340" height="195" rx="8" fill="#11111b" stroke="#313244" stroke-width="1"/>
      <text x="15" y="25" fill="#f9e2af" font-family="'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700">Key Graph Benchmark Questions:</text>

      <text x="15" y="52" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">1. Has Path (0 → 6)?</text>
      <text x="25" y="70" fill="#a6e3a1" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">✓ Yes (e.g., 0-1-2-3-4-5-6 or 0-3-4-6)</text>

      <text x="15" y="95" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">2. Shortest Path by Weight (0 → 6):</text>
      <text x="25" y="113" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">0-1-2-3-4-5-6 = 10+10+10+2+3+3 = 38</text>

      <text x="15" y="138" fill="#89b4fa" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">3. Handshaking Theorem:</text>
      <text x="25" y="156" fill="#cdd6f4" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Sum of degrees = 2 × E = 2 × 8 = 16 entries</text>
      <text x="25" y="174" fill="#9399b2" font-family="'Segoe UI', Roboto, sans-serif" font-size="11">Every undirected edge stored twice in Adj List</text>
    </g>
  </g>
</svg>
