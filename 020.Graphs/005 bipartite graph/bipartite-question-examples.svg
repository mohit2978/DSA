<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="35" y="45" font-size="28">Is Graph Bipartite? The two problem examples</text><line x1="100" y1="150" x2="340" y2="150" stroke="#64748b" stroke-width="3"/><line x1="340" y1="150" x2="340" y2="350" stroke="#64748b" stroke-width="3"/><line x1="340" y1="350" x2="100" y2="350" stroke="#64748b" stroke-width="3"/><line x1="100" y1="350" x2="100" y2="150" stroke="#64748b" stroke-width="3"/><line x1="100" y1="150" x2="340" y2="350" stroke="#64748b" stroke-width="3"/><circle cx="100" cy="150" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="100" y="157" text-anchor="middle" font-size="21">0</text><circle cx="340" cy="150" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="340" y="157" text-anchor="middle" font-size="21">1</text><circle cx="340" cy="350" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="340" y="357" text-anchor="middle" font-size="21">2</text><circle cx="100" cy="350" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="100" y="357" text-anchor="middle" font-size="21">3</text><text x="35" y="410" font-size="22">Example 1: square plus diagonal 0–2</text><text x="35" y="455" font-size="19">[[1,2,3],[0,2],[0,1,3],[0,2]]</text><text x="35" y="490" font-size="19">0 forces 1,2,3 into the opposite set.</text><text x="35" y="525" font-size="19">Edges 1–2 and 2–3 conflict: false.</text><line x1="710" y1="150" x2="950" y2="150" stroke="#64748b" stroke-width="3"/><line x1="950" y1="150" x2="950" y2="350" stroke="#64748b" stroke-width="3"/><line x1="950" y1="350" x2="710" y2="350" stroke="#64748b" stroke-width="3"/><line x1="710" y1="350" x2="710" y2="150" stroke="#64748b" stroke-width="3"/><circle cx="710" cy="150" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="710" y="157" text-anchor="middle" font-size="21">0</text><circle cx="950" cy="150" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="950" y="157" text-anchor="middle" font-size="21">1</text><circle cx="950" cy="350" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="950" y="357" text-anchor="middle" font-size="21">2</text><circle cx="710" cy="350" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="710" y="357" text-anchor="middle" font-size="21">3</text><text x="620" y="410" font-size="22">Example 2: square without diagonal</text><text x="620" y="455" font-size="19">[[1,3],[0,2],[1,3],[0,2]]</text><text x="620" y="490" font-size="19">Sets {0,2} and {1,3}.</text><text x="620" y="525" font-size="19">Every edge crosses the sets: true.</text></g></svg>
