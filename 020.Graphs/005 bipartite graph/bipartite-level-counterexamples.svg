<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="35" y="45" font-size="28">The last level alone does not determine bipartiteness</text><line x1="180" y1="130" x2="75" y2="290" stroke="#64748b" stroke-width="3"/><line x1="75" y1="290" x2="285" y2="290" stroke="#64748b" stroke-width="3"/><line x1="285" y1="290" x2="180" y2="130" stroke="#64748b" stroke-width="3"/><circle cx="180" cy="130" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="180" y="137" text-anchor="middle" font-size="21">0</text><circle cx="75" cy="290" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="75" y="297" text-anchor="middle" font-size="21">1</text><circle cx="285" cy="290" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="285" y="297" text-anchor="middle" font-size="21">2</text><text x="35" y="350" font-size="23">Triangle: 0–1–2–0</text><text x="35" y="390" font-size="19">Queue: [(0,1)] → [(1,2),(2,2)]</text><text x="35" y="425" font-size="19">Then [(2,2),(2,3)] → [(2,3)]</text><text x="35" y="460" font-size="19">2 receives levels 2 and 3: false.</text><text x="35" y="500" font-size="19">Failure occurs at an ODD level.</text><line x1="790" y1="100" x2="650" y2="175" stroke="#64748b" stroke-width="3"/><line x1="790" y1="100" x2="930" y2="175" stroke="#64748b" stroke-width="3"/><line x1="650" y1="175" x2="650" y2="300" stroke="#64748b" stroke-width="3"/><line x1="930" y1="175" x2="930" y2="300" stroke="#64748b" stroke-width="3"/><line x1="650" y1="300" x2="790" y2="380" stroke="#64748b" stroke-width="3"/><line x1="930" y1="300" x2="790" y2="380" stroke="#64748b" stroke-width="3"/><circle cx="790" cy="100" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="790" y="107" text-anchor="middle" font-size="21">0</text><circle cx="650" cy="175" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="650" y="182" text-anchor="middle" font-size="21">1</text><circle cx="930" cy="175" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="930" y="182" text-anchor="middle" font-size="21">2</text><circle cx="930" cy="300" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="930" y="307" text-anchor="middle" font-size="21">3</text><circle cx="650" cy="300" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="650" y="307" text-anchor="middle" font-size="21">4</text><circle cx="790" cy="380" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="790" y="387" text-anchor="middle" font-size="21">5</text><text x="610" y="430" font-size="23">Six-cycle: 0–1–4–5–3–2–0</text><text x="610" y="465" font-size="19">Levels: {0}:1, {1,2}:2, {4,3}:3</text><text x="610" y="500" font-size="19">5 receives level 4 from both sides: true.</text><text x="610" y="535" font-size="19">Success occurs at an EVEN level.</text><text x="35" y="600" font-size="19">Compare repeated assignments to the same vertex, rather than the last level's parity.</text></g></svg>
