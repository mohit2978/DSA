<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f8fafc"/><g font-family="Arial, sans-serif" fill="#172033"><text x="35" y="45" font-size="28">Six-cycle A–B–C–D–E–F–A: levels and sets</text><line x1="230" y1="125" x2="90" y2="205" stroke="#64748b" stroke-width="3"/><line x1="90" y1="205" x2="90" y2="365" stroke="#64748b" stroke-width="3"/><line x1="90" y1="365" x2="230" y2="445" stroke="#64748b" stroke-width="3"/><line x1="230" y1="445" x2="370" y2="365" stroke="#64748b" stroke-width="3"/><line x1="370" y1="365" x2="370" y2="205" stroke="#64748b" stroke-width="3"/><line x1="370" y1="205" x2="230" y2="125" stroke="#64748b" stroke-width="3"/><circle cx="230" cy="125" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="230" y="132" text-anchor="middle" font-size="21">A</text><circle cx="90" cy="205" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="90" y="212" text-anchor="middle" font-size="21">B</text><circle cx="90" cy="365" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="90" y="372" text-anchor="middle" font-size="21">C</text><circle cx="230" cy="445" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="230" y="452" text-anchor="middle" font-size="21">D</text><circle cx="370" cy="365" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="370" y="372" text-anchor="middle" font-size="21">E</text><circle cx="370" cy="205" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="370" y="212" text-anchor="middle" font-size="21">F</text><text x="35" y="500" font-size="19">Level 1: A; level 2: B,F; level 3: C,E</text><text x="35" y="535" font-size="19">D receives level 4 from C and E.</text><line x1="690" y1="155" x2="1040" y2="155" stroke="#64748b" stroke-width="3"/><line x1="690" y1="155" x2="1040" y2="295" stroke="#64748b" stroke-width="3"/><line x1="690" y1="295" x2="1040" y2="155" stroke="#64748b" stroke-width="3"/><line x1="690" y1="295" x2="1040" y2="435" stroke="#64748b" stroke-width="3"/><line x1="690" y1="435" x2="1040" y2="295" stroke="#64748b" stroke-width="3"/><line x1="690" y1="435" x2="1040" y2="435" stroke="#64748b" stroke-width="3"/><circle cx="690" cy="155" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="690" y="162" text-anchor="middle" font-size="21">A</text><circle cx="690" cy="295" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="690" y="302" text-anchor="middle" font-size="21">C</text><circle cx="690" cy="435" r="24" fill="#bfdbfe" stroke="#334155" stroke-width="2"/><text x="690" y="442" text-anchor="middle" font-size="21">E</text><circle cx="1040" cy="155" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="1040" y="162" text-anchor="middle" font-size="21">B</text><circle cx="1040" cy="295" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="1040" y="302" text-anchor="middle" font-size="21">F</text><circle cx="1040" cy="435" r="24" fill="#fed7aa" stroke="#334155" stroke-width="2"/><text x="1040" y="442" text-anchor="middle" font-size="21">D</text><text x="640" y="95" font-size="19">Odd: {A,C,E}</text><text x="970" y="95" font-size="19">Even: {B,F,D}</text><text x="610" y="535" font-size="19">All six edges cross between the sets.</text><text x="35" y="610" font-size="19">The sets are disjoint and together contain every vertex. Result: true.</text></g></svg>
