<svg viewBox="0 0 760 430" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="760" height="430" fill="#1e1e1e"/>
  <text x="20" y="28" fill="#d4d4d4" font-size="15">Kahn's Algorithm dry run — edges: f&#8594;d, f&#8594;c, d&#8594;e, d&#8594;b, c&#8594;b, c&#8594;g, e&#8594;a, b&#8594;a, g&#8594;a</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9ecbf0"/></marker>
  </defs>

  <!-- nodes -->
  <circle cx="230" cy="75"  r="25" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="140" cy="160" r="25" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="320" cy="160" r="25" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="60"  cy="255" r="25" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="210" cy="255" r="25" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="370" cy="255" r="25" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="215" cy="360" r="25" fill="#233a2c" stroke="#56c98d" stroke-width="3"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="18">
    <text x="230" y="82">f</text>
    <text x="140" y="167">d</text>
    <text x="320" y="167">c</text>
    <text x="60"  y="262">e</text>
    <text x="210" y="262">b</text>
    <text x="370" y="262">g</text>
    <text x="215" y="367">a</text>
  </g>

  <g stroke="#9ecbf0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M 209 96  L 161 139"/>   <!-- f->d -->
    <path d="M 251 96  L 299 139"/>   <!-- f->c -->
    <path d="M 122 180 L 78  235"/>   <!-- d->e -->
    <path d="M 158 180 L 192 235"/>   <!-- d->b -->
    <path d="M 300 180 L 230 236"/>   <!-- c->b -->
    <path d="M 337 180 L 353 232"/>   <!-- c->g -->
    <path d="M 80  275 L 192 345"/>   <!-- e->a -->
    <path d="M 211 280 L 214 333"/>   <!-- b->a -->
    <path d="M 352 275 L 240 345"/>   <!-- g->a -->
  </g>

  <text x="20" y="405" fill="#f2c14e" font-size="13">yellow = the only indegree-0 start, green = the last node to be freed</text>

  <!-- step table -->
  <rect x="430" y="48" width="310" height="330" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="4"/>
  <text x="445" y="72" fill="#f2c14e" font-size="14" font-weight="bold">Start indegree</text>
  <text x="445" y="94" fill="#d4d4d4" font-family="monospace" font-size="13">a=3  b=2  c=1  d=1  e=1  f=0  g=1</text>

  <text x="445" y="126" fill="#f2c14e" font-size="14" font-weight="bold">Queue = [f]   (only 0-indegree node)</text>

  <g font-family="monospace" font-size="13" fill="#d4d4d4">
    <text x="445" y="154">pop f  &#8594; d:1&#8594;0, c:1&#8594;0   Q=[c,d]</text>
    <text x="445" y="178">pop c  &#8594; b:2&#8594;1, g:1&#8594;0   Q=[d,g]</text>
    <text x="445" y="202">pop d  &#8594; e:1&#8594;0, b:1&#8594;0   Q=[g,e,b]</text>
    <text x="445" y="226">pop g  &#8594; a:3&#8594;2          Q=[e,b]</text>
    <text x="445" y="250">pop e  &#8594; a:2&#8594;1          Q=[b]</text>
    <text x="445" y="274">pop b  &#8594; a:1&#8594;0          Q=[a]</text>
    <text x="445" y="298">pop a  &#8594; no neighbours   Q=[]</text>
  </g>

  <text x="445" y="332" fill="#56c98d" font-size="15" font-weight="bold">Topological order &#8594; f c d g e b a</text>
  <text x="445" y="358" fill="#9aa0a6" font-size="12">count = 7 = V  &#8594;  no cycle, order is valid</text>
</svg>
