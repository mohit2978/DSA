<svg viewBox="0 0 700 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="700" height="330" fill="#1e1e1e"/>
  <text x="20" y="28" fill="#d4d4d4" font-size="15">Course Schedule II — numCourses = 4, prerequisites = [[1,0],[2,0],[3,1],[3,2]]</text>
  <text x="20" y="50" fill="#9aa0a6" font-size="13">[a, b] means "take b BEFORE a", so the edge in the graph is b &#8594; a</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9ecbf0"/></marker>
  </defs>

  <circle cx="200" cy="95"  r="26" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="110" cy="180" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="290" cy="180" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="200" cy="265" r="26" fill="#233a2c" stroke="#56c98d" stroke-width="3"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="18">
    <text x="200" y="102">0</text>
    <text x="110" y="187">1</text>
    <text x="290" y="187">2</text>
    <text x="200" y="272">3</text>
  </g>

  <g stroke="#9ecbf0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M 181 114 L 129 161"/>   <!-- 0->1 -->
    <path d="M 219 114 L 271 161"/>   <!-- 0->2 -->
    <path d="M 129 199 L 181 246"/>   <!-- 1->3 -->
    <path d="M 271 199 L 219 246"/>   <!-- 2->3 -->
  </g>

  <rect x="400" y="70" width="280" height="185" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="4"/>
  <text x="415" y="95" fill="#f2c14e" font-size="14" font-weight="bold">Indegree: 0=0  1=1  2=1  3=2</text>

  <g font-family="monospace" font-size="13" fill="#d4d4d4">
    <text x="415" y="126">Q=[0]  pop 0 &#8594; 1:0, 2:0   Q=[1,2]</text>
    <text x="415" y="150">pop 1 &#8594; 3: 2&#8594;1          Q=[2]</text>
    <text x="415" y="174">pop 2 &#8594; 3: 1&#8594;0          Q=[3]</text>
    <text x="415" y="198">pop 3 &#8594; done             Q=[]</text>
  </g>
  <text x="415" y="232" fill="#56c98d" font-size="14" font-weight="bold">ans = [0,1,2,3]  (size 4 == N &#10004;)</text>

  <text x="20" y="305" fill="#9aa0a6" font-size="13">[0,2,1,3] is equally valid &#8212; any topological order is accepted. If ans.size() != N, return an empty array (cycle).</text>
</svg>
