<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520">
  <defs>
    <linearGradient id="bgGradBFS4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradBFS4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="rottenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="freshGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <filter id="shBFS4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="520" rx="16" fill="url(#bgGradBFS4)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Multi-Source BFS: Simultaneous Multi-Wavefront Propagation
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    LeetCode 994 (Rotting Oranges): All initial sources loaded into queue at time t = 0 to find global minimum time
  </text>

  <!-- Left: Rotting Oranges Grid Wavefronts -->
  <g transform="translate(35, 85)" filter="url(#shBFS4)">
    <rect width="430" height="400" rx="12" fill="url(#cardGradBFS4)" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">
      Rotting Oranges Grid Progression (t = 0 → 4)
    </text>

    <!-- Grid 3x3 cells -->
    <!-- Row 0 -->
    <rect x="70" y="60" width="80" height="65" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
    <text x="110" y="95" font-family="system-ui" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle">ROTTEN</text>
    <text x="110" y="112" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">t = 0</text>

    <rect x="160" y="60" width="80" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="95" font-family="system-ui" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Fresh</text>
    <text x="200" y="112" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">t = 1</text>

    <rect x="250" y="60" width="80" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="290" y="95" font-family="system-ui" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Fresh</text>
    <text x="290" y="112" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">t = 2</text>

    <!-- Row 1 -->
    <rect x="70" y="135" width="80" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="110" y="170" font-family="system-ui" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Fresh</text>
    <text x="110" y="187" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">t = 1</text>

    <rect x="160" y="135" width="80" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="170" font-family="system-ui" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Fresh</text>
    <text x="200" y="187" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">t = 2</text>

    <rect x="250" y="135" width="80" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="290" y="170" font-family="system-ui" font-size="13" fill="#64748b" text-anchor="middle">Empty</text>
    <text x="290" y="187" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0</text>

    <!-- Row 2 -->
    <rect x="70" y="210" width="80" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="110" y="245" font-family="system-ui" font-size="13" fill="#64748b" text-anchor="middle">Empty</text>
    <text x="110" y="262" font-family="monospace" font-size="11" fill="#64748b" text-anchor="middle">0</text>

    <rect x="160" y="210" width="80" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="200" y="245" font-family="system-ui" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Fresh</text>
    <text x="200" y="262" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">t = 3</text>

    <rect x="250" y="210" width="80" height="65" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="290" y="245" font-family="system-ui" font-size="13" font-weight="600" fill="#fde68a" text-anchor="middle">Fresh</text>
    <text x="290" y="262" font-family="monospace" font-size="11" fill="#38bdf8" text-anchor="middle">t = 4</text>

    <!-- Note -->
    <rect x="20" y="325" width="390" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="215" y="348" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1" text-anchor="middle">
      Total minutes to rot all fresh oranges = <tspan fill="#34d399" font-weight="700">4 minutes</tspan>.
    </text>
    <text x="215" y="368" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">
      If any fresh orange remains unreachable after BFS, return -1.
    </text>
  </g>

  <!-- Right: Single vs Multi Source Comparison Table -->
  <g transform="translate(495, 85)" filter="url(#shBFS4)">
    <rect width="450" height="400" rx="12" fill="url(#cardGradBFS4)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Single-Source vs. Multi-Source Comparison
    </text>

    <!-- Comparison Table -->
    <rect x="15" y="45" width="420" height="335" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <text x="30" y="75" font-family="system-ui" font-size="13" font-weight="700" fill="#38bdf8">1. Queue Initialization:</text>
    <text x="30" y="95" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan fill="#93c5fd" font-weight="600">Single-Source:</tspan> Push 1 start node: q.push(src, d=0)</text>
    <text x="30" y="115" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan fill="#f87171" font-weight="600">Multi-Source:</tspan> Push ALL start nodes at t=0 before loop</text>

    <text x="30" y="150" font-family="system-ui" font-size="13" font-weight="700" fill="#38bdf8">2. Wavefront Collision:</text>
    <text x="30" y="170" font-family="system-ui" font-size="11" fill="#cbd5e1">• Each cell is visited by the <tspan fill="#34d399" font-weight="700">closest</tspan> initial source first.</text>
    <text x="30" y="190" font-family="system-ui" font-size="11" fill="#cbd5e1">• Guarantees Voronoi-like partitioning of the grid.</text>

    <text x="30" y="225" font-family="system-ui" font-size="13" font-weight="700" fill="#38bdf8">3. Direction of Search:</text>
    <text x="30" y="245" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan fill="#93c5fd" font-weight="600">Maze:</tspan> Can search Src → Dest OR Dest → Src.</text>
    <text x="30" y="265" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan fill="#f87171" font-weight="600">Rotting Oranges:</tspan> MUST start from Rotten Oranges,</text>
    <text x="30" y="283" font-family="system-ui" font-size="11" fill="#cbd5e1">  because multiple unknown paths converge on fresh ones.</text>

    <rect x="30" y="305" width="390" height="55" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="45" y="325" font-family="system-ui" font-size="11" font-weight="700" fill="#34d399">Standard Complexity:</text>
    <text x="45" y="345" font-family="monospace" font-size="11" fill="#e2e8f0">Time: O(R * C)  |  Space: O(R * C)</text>
  </g>
</svg>
