<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <defs>
    <linearGradient id="bgGradBFS6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradBFS6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shBFS6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="500" rx="16" fill="url(#bgGradBFS6)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    LeetCode 127 (Word Ladder): BFS Shortest Transformation Sequence
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Transition from beginWord = "hit" to endWord = "cog" via 1-letter wildcards: hit → hot → dot → dog → cog (Length = 5)
  </text>

  <!-- Left: Transformation Tree Diagram -->
  <g transform="translate(35, 85)" filter="url(#shBFS6)">
    <rect width="430" height="380" rx="12" fill="url(#cardGradBFS6)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Level-Order Word Transitions
    </text>

    <!-- Tree Edges -->
    <line x1="215" y1="80" x2="215" y2="140" stroke="#64748b" stroke-width="2"/>
    <line x1="215" y1="140" x2="130" y2="200" stroke="#64748b" stroke-width="2"/>
    <line x1="215" y1="140" x2="300" y2="200" stroke="#64748b" stroke-width="2"/>
    <line x1="130" y1="200" x2="130" y2="260" stroke="#64748b" stroke-width="2"/>
    <line x1="300" y1="200" x2="300" y2="260" stroke="#64748b" stroke-width="2"/>
    <line x1="130" y1="260" x2="215" y2="320" stroke="#10b981" stroke-width="3"/>
    <line x1="300" y1="260" x2="215" y2="320" stroke="#10b981" stroke-width="3"/>

    <!-- Level 1 (hit) -->
    <rect x="175" y="60" width="80" height="35" rx="6" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <text x="215" y="82" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">"hit" (L1)</text>

    <!-- Level 2 (hot) -->
    <rect x="175" y="125" width="80" height="35" rx="6" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="215" y="147" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">"hot" (L2)</text>

    <!-- Level 3 (dot, lot) -->
    <rect x="90" y="185" width="80" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="207" font-family="monospace" font-size="13" fill="#fde68a" text-anchor="middle">"dot" (L3)</text>

    <rect x="260" y="185" width="80" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="207" font-family="monospace" font-size="13" fill="#fde68a" text-anchor="middle">"lot" (L3)</text>

    <!-- Level 4 (dog, log) -->
    <rect x="90" y="245" width="80" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="130" y="267" font-family="monospace" font-size="13" fill="#fde68a" text-anchor="middle">"dog" (L4)</text>

    <rect x="260" y="245" width="80" height="35" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="300" y="267" font-family="monospace" font-size="13" fill="#fde68a" text-anchor="middle">"log" (L4)</text>

    <!-- Level 5 (cog) Destination -->
    <rect x="175" y="305" width="80" height="35" rx="6" fill="#10b981" stroke="#6ee7b7" stroke-width="3"/>
    <text x="215" y="327" font-family="monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">"cog" (L5)</text>

    <!-- Result Text -->
    <text x="215" y="365" font-family="system-ui" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      Shortest Word Sequence Length = 5
    </text>
  </g>

  <!-- Right: 26-Letter Wildcard Optimization and Complexity -->
  <g transform="translate(495, 85)" filter="url(#shBFS6)">
    <rect width="450" height="380" rx="12" fill="url(#cardGradBFS6)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      26-Letter Substitution Algorithm
    </text>

    <!-- Concept Box -->
    <rect x="20" y="45" width="410" height="175" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="70" font-family="system-ui" font-size="12" font-weight="700" fill="#38bdf8">How Next Words are Generated:</text>
    <text x="35" y="92" font-family="system-ui" font-size="11" fill="#cbd5e1">For word of length L (e.g. "hit"):</text>
    <text x="35" y="112" font-family="monospace" font-size="11" fill="#fde68a">1. Replace pos 0: *it → [ait, bit, ..., <tspan fill="#34d399">hit</tspan>, ...]</text>
    <text x="35" y="132" font-family="monospace" font-size="11" fill="#fde68a">2. Replace pos 1: h*t → [hat, <tspan fill="#34d399">hot</tspan>, hut, ...]</text>
    <text x="35" y="152" font-family="monospace" font-size="11" fill="#fde68a">3. Replace pos 2: hi* → [hid, him, hip, ...]</text>
    <text x="35" y="175" font-family="system-ui" font-size="11" fill="#cbd5e1">Total combinations per word = <tspan font-weight="700" fill="#38bdf8">L × 26</tspan> variations.</text>
    <text x="35" y="195" font-family="system-ui" font-size="11" fill="#cbd5e1">Check membership against hash set in <tspan font-weight="700" fill="#34d399">O(1)</tspan> time!</text>

    <!-- Complexity Box -->
    <rect x="20" y="235" width="410" height="120" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="35" y="260" font-family="system-ui" font-size="12" font-weight="700" fill="#34d399">Complexity Breakdown:</text>
    <text x="35" y="285" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#38bdf8">Time Complexity: O(N × L × 26)</tspan></text>
    <text x="45" y="303" font-family="system-ui" font-size="10.5" fill="#94a3b8">Where N is number of words in wordList, L is word length.</text>
    <text x="35" y="325" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#38bdf8">Space Complexity: O(N × L)</tspan></text>
    <text x="45" y="343" font-family="system-ui" font-size="10.5" fill="#94a3b8">Queue and Hash Set storing words of length L.</text>
  </g>
</svg>
