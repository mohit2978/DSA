<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520">
  <defs>
    <linearGradient id="bgGradBFS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradBFS2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="srcNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="destNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <filter id="shBFS2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="520" rx="16" fill="url(#bgGradBFS2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    BFS Shortest Path &amp; Backtracking Path Reconstruction
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Finding shortest path from Source 1 to Destination 6: Path = 1 → 2 → 3 → 5 → 6 (Dist = 4) or 1 → 0 → 4 → 5 → 6
  </text>

  <!-- Left: Graph Diagram -->
  <g transform="translate(35, 85)" filter="url(#shBFS2)">
    <rect width="420" height="400" rx="12" fill="url(#cardGradBFS2)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Graph Layout &amp; Shortest Path Tree
    </text>

    <!-- Graph Edges -->
    <line x1="80" y1="160" x2="180" y2="100" stroke="#38bdf8" stroke-width="3"/>
    <line x1="180" y1="100" x2="280" y2="100" stroke="#38bdf8" stroke-width="3"/>
    <line x1="280" y1="100" x2="340" y2="180" stroke="#38bdf8" stroke-width="3"/>
    <line x1="340" y1="180" x2="280" y2="280" stroke="#38bdf8" stroke-width="3"/>
    <line x1="280" y1="280" x2="350" y2="340" stroke="#10b981" stroke-width="4"/>
    <line x1="80" y1="160" x2="180" y2="280" stroke="#64748b" stroke-width="2"/>
    <line x1="180" y1="280" x2="280" y2="280" stroke="#64748b" stroke-width="2"/>
    <line x1="340" y1="180" x2="180" y2="280" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,4"/>

    <!-- Nodes -->
    <!-- Node 0 -->
    <circle cx="80" cy="160" r="18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="80" y="165" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
    <text x="45" y="165" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">d=1</text>

    <!-- Node 1 (Source) -->
    <circle cx="180" cy="100" r="22" fill="url(#srcNode)" stroke="#93c5fd" stroke-width="3"/>
    <text x="180" y="105" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1 (SRC)</text>
    <text x="180" y="70" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">dist=0, p=1</text>

    <!-- Node 2 -->
    <circle cx="280" cy="100" r="18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="280" y="105" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="280" y="70" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">d=1, p=1</text>

    <!-- Node 3 -->
    <circle cx="340" cy="180" r="18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="340" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="380" y="185" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">d=2, p=2</text>

    <!-- Node 4 -->
    <circle cx="180" cy="280" r="18" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <text x="180" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="180" y="315" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">d=2, p=0</text>

    <!-- Node 5 -->
    <circle cx="280" cy="280" r="20" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="280" y="285" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
    <text x="280" y="315" font-family="system-ui, sans-serif" font-size="10" fill="#6ee7b7" text-anchor="middle">d=3, p=3</text>

    <!-- Node 6 (Dest) -->
    <circle cx="350" cy="340" r="22" fill="url(#destNode)" stroke="#6ee7b7" stroke-width="3"/>
    <text x="350" y="345" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">6 (DEST)</text>
    <text x="350" y="380" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#34d399" text-anchor="middle">d=4, p=5</text>
  </g>

  <!-- Right: Array State and Path Reconstruction Trace -->
  <g transform="translate(485, 85)" filter="url(#shBFS2)">
    <rect width="460" height="400" rx="12" fill="url(#cardGradBFS2)" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#c084fc">
      State Arrays &amp; Backtrack Loop Trace
    </text>

    <!-- Table of dist[] and parent[] -->
    <rect x="20" y="45" width="420" height="95" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    
    <text x="35" y="70" font-family="monospace" font-size="11" font-weight="700" fill="#94a3b8">Node Index (i) :</text>
    <text x="170" y="70" font-family="monospace" font-size="11" fill="#e2e8f0"> 0   1   2   3   4   5   6 </text>

    <text x="35" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#38bdf8">dist[i]        :</text>
    <text x="170" y="95" font-family="monospace" font-size="11" fill="#38bdf8"> 1   0   1   2   2   3   4 </text>

    <text x="35" y="120" font-family="monospace" font-size="11" font-weight="700" fill="#fbbf24">parent[i]      :</text>
    <text x="170" y="120" font-family="monospace" font-size="11" fill="#fbbf24"> 1   1   1   2   0   3   5 </text>

    <!-- Path Reconstruction Box -->
    <rect x="20" y="155" width="420" height="225" rx="6" fill="#1e293b" stroke="#64748b" stroke-width="1"/>
    <text x="35" y="180" font-family="system-ui" font-size="13" font-weight="700" fill="#f8fafc">
      Path Reconstruction: while (temp != src)
    </text>

    <text x="35" y="210" font-family="monospace" font-size="11" fill="#cbd5e1">1. Start at temp = 6    → print(6), temp = parent[6] = 5</text>
    <text x="35" y="235" font-family="monospace" font-size="11" fill="#cbd5e1">2. Now temp = 5         → print(5), temp = parent[5] = 3</text>
    <text x="35" y="260" font-family="monospace" font-size="11" fill="#cbd5e1">3. Now temp = 3         → print(3), temp = parent[3] = 2</text>
    <text x="35" y="285" font-family="monospace" font-size="11" fill="#cbd5e1">4. Now temp = 2         → print(2), temp = parent[2] = 1</text>
    <text x="35" y="310" font-family="monospace" font-size="11" fill="#cbd5e1">5. temp == src (1)      → print(1), STOP</text>

    <!-- Result Banner -->
    <rect x="35" y="330" width="390" height="36" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="230" y="353" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      Shortest Path: 6 → 5 → 3 → 2 → 1 (Reverse: 1 → 2 → 3 → 5 → 6)
    </text>
  </g>
</svg>
