<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" width="980" height="520">
  <defs>
    <linearGradient id="bgGradBFS5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradBFS5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shBFS5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="520" rx="16" fill="url(#bgGradBFS5)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Snakes and Ladders: Graph Formulation &amp; BFS Shortest Dice Throws
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Model each square u as a vertex. From square u, 6 directed edges correspond to dice rolls 1 to 6
  </text>

  <!-- Left: Board to Graph Conversion -->
  <g transform="translate(35, 85)" filter="url(#shBFS5)">
    <rect width="430" height="400" rx="12" fill="url(#cardGradBFS5)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">
      Board-to-Graph Jump Modeling
    </text>

    <!-- Dice roll fan-out diagram -->
    <!-- Current square u -->
    <circle cx="215" cy="85" r="24" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <text x="215" y="90" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Square u</text>

    <!-- 6 branches -->
    <line x1="215" y1="109" x2="60" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="215" y1="109" x2="120" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="215" y1="109" x2="180" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="215" y1="109" x2="250" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="215" y1="109" x2="310" y2="190" stroke="#64748b" stroke-width="1.5"/>
    <line x1="215" y1="109" x2="370" y2="190" stroke="#64748b" stroke-width="1.5"/>

    <!-- Dice labels -->
    <text x="50" y="160" font-family="monospace" font-size="10" fill="#94a3b8">+1</text>
    <text x="110" y="160" font-family="monospace" font-size="10" fill="#94a3b8">+2</text>
    <text x="165" y="160" font-family="monospace" font-size="10" fill="#94a3b8">+3</text>
    <text x="245" y="160" font-family="monospace" font-size="10" fill="#94a3b8">+4</text>
    <text x="315" y="160" font-family="monospace" font-size="10" fill="#94a3b8">+5</text>
    <text x="380" y="160" font-family="monospace" font-size="10" fill="#94a3b8">+6</text>

    <!-- Destination nodes -->
    <circle cx="60" cy="205" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <text x="60" y="209" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">u+1</text>

    <!-- Ladder Jump (e.g. u+2 jumps to top) -->
    <circle cx="120" cy="205" r="14" fill="#047857" stroke="#34d399" stroke-width="1"/>
    <text x="120" y="209" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">LADD</text>
    <path d="M 120 220 Q 120 280 180 290" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="115" y="260" font-family="system-ui" font-size="10" font-weight="700" fill="#34d399">Climb Up</text>

    <circle cx="180" cy="205" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <text x="180" y="209" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">u+3</text>

    <!-- Snake Slide (e.g. u+4 slides down) -->
    <circle cx="250" cy="205" r="14" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="250" y="209" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">SNAK</text>
    <path d="M 250 220 Q 250 280 290 290" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="275" y="260" font-family="system-ui" font-size="10" font-weight="700" fill="#f87171">Slide Down</text>

    <circle cx="310" cy="205" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <text x="310" y="209" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">u+5</text>

    <circle cx="370" cy="205" r="14" fill="#334155" stroke="#94a3b8" stroke-width="1"/>
    <text x="370" y="209" font-family="monospace" font-size="10" fill="#ffffff" text-anchor="middle">u+6</text>

    <!-- Board Array Formula -->
    <rect x="20" y="325" width="390" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="215" y="347" font-family="monospace" font-size="11.5" fill="#fde68a" text-anchor="middle">
      board[start] = end - start;
    </text>
    <text x="215" y="367" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      Landing on square v immediately teleports to v + board[v].
    </text>
  </g>

  <!-- Right: BFS Algorithm Logic and Complexity -->
  <g transform="translate(495, 85)" filter="url(#shBFS5)">
    <rect width="450" height="400" rx="12" fill="url(#cardGradBFS5)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      BFS Shortest Throws Execution Engine
    </text>

    <!-- Code outline box -->
    <rect x="20" y="45" width="410" height="235" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="35" y="70" font-family="monospace" font-size="11" fill="#38bdf8">queue&lt;int&gt; q; q.push(1); dist[1] = 0;</text>
    
    <text x="35" y="95" font-family="monospace" font-size="11" fill="#94a3b8">while (!q.empty()) {</text>
    <text x="50" y="115" font-family="monospace" font-size="11" fill="#cbd5e1">int u = q.front(); q.pop();</text>
    <text x="50" y="135" font-family="monospace" font-size="11" fill="#34d399">if (u == n) return dist[n]; // Destination reached!</text>

    <text x="50" y="160" font-family="monospace" font-size="11" fill="#94a3b8">for (int dice = 1; dice &lt;= 6; dice++) {</text>
    <text x="65" y="180" font-family="monospace" font-size="11" fill="#cbd5e1">int v = u + dice + board[u + dice];</text>
    <text x="65" y="200" font-family="monospace" font-size="11" fill="#cbd5e1">if (v &lt;= n &amp;&amp; !visited[v]) {</text>
    <text x="80" y="220" font-family="monospace" font-size="11" fill="#fbbf24">visited[v] = true; dist[v] = dist[u] + 1;</text>
    <text x="80" y="240" font-family="monospace" font-size="11" fill="#fbbf24">q.push(v);</text>
    <text x="65" y="260" font-family="monospace" font-size="11" fill="#cbd5e1">}</text>
    <text x="50" y="275" font-family="monospace" font-size="11" fill="#94a3b8">}</text>

    <!-- Complexity -->
    <rect x="20" y="295" width="410" height="90" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="35" y="320" font-family="system-ui" font-size="12" font-weight="700" fill="#38bdf8">Complexity Analysis:</text>
    <text x="35" y="342" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#34d399">Time Complexity: O(N)</tspan> — Every square visited at most once; 6 dice edges checked per square.</text>
    <text x="35" y="365" font-family="system-ui" font-size="11" fill="#cbd5e1">• <tspan font-weight="700" fill="#34d399">Space Complexity: O(N)</tspan> — Storage for board array, visited vector, and queue.</text>
  </g>
</svg>
