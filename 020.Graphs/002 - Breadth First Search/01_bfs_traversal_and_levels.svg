<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <defs>
    <linearGradient id="bgGradBFS1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradBFS1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="srcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>

    <filter id="shBFS1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="500" rx="16" fill="url(#bgGradBFS1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Breadth First Search (BFS): Level-Order Radial Wave Propagation
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    BFS explores nodes in increasing order of distance from source, guaranteeing shortest path in unweighted graphs
  </text>

  <!-- Left: Level-by-Level Graph Expansion -->
  <g transform="translate(35, 85)" filter="url(#shBFS1)">
    <rect width="440" height="380" rx="12" fill="url(#cardGradBFS1)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Radial Expansion by Levels (d = 0, 1, 2)
    </text>

    <!-- Concentric level circles (wavefronts) -->
    <circle cx="220" cy="180" r="45" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4,4" fill-opacity="0.05"/>
    <circle cx="220" cy="180" r="100" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="4,4" fill-opacity="0.05"/>
    <circle cx="220" cy="180" r="155" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4" fill-opacity="0.05"/>

    <!-- Edges Level 0 to Level 1 -->
    <line x1="220" y1="180" x2="150" y2="130" stroke="#64748b" stroke-width="2"/>
    <line x1="220" y1="180" x2="290" y2="130" stroke="#64748b" stroke-width="2"/>
    <line x1="220" y1="180" x2="220" y2="260" stroke="#64748b" stroke-width="2"/>

    <!-- Edges Level 1 to Level 2 -->
    <line x1="150" y1="130" x2="90" y2="90" stroke="#64748b" stroke-width="2"/>
    <line x1="290" y1="130" x2="350" y2="90" stroke="#64748b" stroke-width="2"/>
    <line x1="220" y1="260" x2="160" y2="310" stroke="#64748b" stroke-width="2"/>
    <line x1="220" y1="260" x2="280" y2="310" stroke="#64748b" stroke-width="2"/>

    <!-- Level 0 (Source) -->
    <circle cx="220" cy="180" r="22" fill="url(#srcGrad)" stroke="#93c5fd" stroke-width="2"/>
    <text x="220" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">SRC (0)</text>

    <!-- Level 1 Nodes -->
    <circle cx="150" cy="130" r="18" fill="url(#l1Grad)" stroke="#6ee7b7" stroke-width="2"/>
    <text x="150" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A (1)</text>

    <circle cx="290" cy="130" r="18" fill="url(#l1Grad)" stroke="#6ee7b7" stroke-width="2"/>
    <text x="290" y="135" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">B (1)</text>

    <circle cx="220" cy="260" r="18" fill="url(#l1Grad)" stroke="#6ee7b7" stroke-width="2"/>
    <text x="220" y="265" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">C (1)</text>

    <!-- Level 2 Nodes -->
    <circle cx="90" cy="90" r="16" fill="url(#l2Grad)" stroke="#fde68a" stroke-width="2"/>
    <text x="90" y="94" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">D (2)</text>

    <circle cx="350" cy="90" r="16" fill="url(#l2Grad)" stroke="#fde68a" stroke-width="2"/>
    <text x="350" y="94" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">E (2)</text>

    <circle cx="160" cy="310" r="16" fill="url(#l2Grad)" stroke="#fde68a" stroke-width="2"/>
    <text x="160" y="314" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">F (2)</text>

    <circle cx="280" cy="310" r="16" fill="url(#l2Grad)" stroke="#fde68a" stroke-width="2"/>
    <text x="280" y="314" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">G (2)</text>
  </g>

  <!-- Right: Queue Mechanism and Invariants -->
  <g transform="translate(505, 85)" filter="url(#shBFS1)">
    <rect width="440" height="380" rx="12" fill="url(#cardGradBFS1)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      FIFO Queue Operation &amp; State Invariants
    </text>

    <!-- Queue Box -->
    <rect x="25" y="50" width="390" height="55" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1.5"/>
    <text x="35" y="82" font-family="monospace" font-size="12" font-weight="700" fill="#94a3b8">FRONT</text>

    <!-- Queue Elements -->
    <rect x="95" y="58" width="55" height="38" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1"/>
    <text x="122" y="81" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">A [d=1]</text>

    <rect x="155" y="58" width="55" height="38" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1"/>
    <text x="182" y="81" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">B [d=1]</text>

    <rect x="215" y="58" width="55" height="38" rx="6" fill="#10b981" stroke="#34d399" stroke-width="1"/>
    <text x="242" y="81" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">C [d=1]</text>

    <rect x="275" y="58" width="55" height="38" rx="6" fill="#f59e0b" stroke="#fbbf24" stroke-width="1"/>
    <text x="302" y="81" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#000000" text-anchor="middle">D [d=2]</text>

    <text x="375" y="82" font-family="monospace" font-size="12" font-weight="700" fill="#94a3b8">REAR</text>

    <!-- Monotonicity Rule -->
    <rect x="25" y="120" width="390" height="40" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="220" y="145" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      Monotonicity Property: Queue distance values are always non-decreasing
    </text>

    <!-- Invariant points -->
    <g transform="translate(25, 175)">
      <rect width="390" height="180" rx="6" fill="#1e293b" fill-opacity="0.6" stroke="#334155" stroke-width="1"/>
      
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Mark Visited on ENQUEUE (Not Dequeue):</text>
      <text x="15" y="45" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Prevents duplicate insertions of the same node into the queue.</text>

      <text x="15" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">2. Shortest Path Property:</text>
      <text x="15" y="95" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">First time destination is dequeued = strictly minimum edge steps.</text>

      <text x="15" y="125" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">3. Path Reconstruction via parent[]:</text>
      <text x="15" y="145" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Backtrack from destination to source: dest → parent[dest] → ... → src.</text>
    </g>
  </g>
</svg>
