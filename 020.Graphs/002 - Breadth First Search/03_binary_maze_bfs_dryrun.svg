<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" width="980" height="500">
  <defs>
    <linearGradient id="bgGradBFS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradBFS3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="shBFS3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="500" rx="16" fill="url(#bgGradBFS3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Shortest Distance in a Binary Maze: 2D Grid BFS Wavefront
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Grid 5x4: Finding Shortest Path from Source (0, 1) to Destination (2, 2) = 3 Steps
  </text>

  <!-- Left: Grid Matrix Visual -->
  <g transform="translate(35, 85)" filter="url(#shBFS3)">
    <rect width="430" height="380" rx="12" fill="url(#cardGradBFS3)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Maze Grid (1 = Open Path, 0 = Obstacle)
    </text>

    <!-- Grid cells (5 rows, 4 cols) -->
    <!-- Row 0 -->
    <rect x="70" y="55" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="85" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=1]</text>

    <!-- Source Cell (0, 1) -->
    <rect x="135" y="55" width="60" height="50" fill="#1d4ed8" stroke="#60a5fa" stroke-width="2"/>
    <text x="165" y="85" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">SRC (0)</text>

    <rect x="200" y="55" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="230" y="85" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=1]</text>

    <rect x="265" y="55" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="295" y="85" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=2]</text>

    <!-- Row 1 -->
    <rect x="70" y="110" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="140" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=2]</text>

    <!-- Step 1 Cell (1, 1) -->
    <rect x="135" y="110" width="60" height="50" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="165" y="140" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1 [d=1]</text>

    <rect x="200" y="110" width="60" height="50" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="230" y="140" font-family="monospace" font-size="13" font-weight="700" fill="#f87171" text-anchor="middle">0 (WALL)</text>

    <rect x="265" y="110" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="295" y="140" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=3]</text>

    <!-- Row 2 -->
    <rect x="70" y="165" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="195" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=3]</text>

    <!-- Step 2 Cell (2, 1) -->
    <rect x="135" y="165" width="60" height="50" fill="#047857" stroke="#34d399" stroke-width="2"/>
    <text x="165" y="195" font-family="monospace" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1 [d=2]</text>

    <!-- Destination Cell (2, 2) -->
    <rect x="200" y="165" width="60" height="50" fill="#10b981" stroke="#6ee7b7" stroke-width="3"/>
    <text x="230" y="195" font-family="monospace" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">DEST (3)</text>

    <rect x="265" y="165" width="60" height="50" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="295" y="195" font-family="monospace" font-size="13" fill="#94a3b8" text-anchor="middle">1 [d=4]</text>

    <!-- Row 3 and 4 (compact) -->
    <rect x="70" y="220" width="60" height="40" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="100" y="245" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">1</text>
    <rect x="135" y="220" width="60" height="40" fill="#1e293b" stroke="#475569" stroke-width="1"/>
    <text x="165" y="245" font-family="monospace" font-size="11" fill="#94a3b8" text-anchor="middle">1</text>
    <rect x="200" y="220" width="60" height="40" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="230" y="245" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">0</text>
    <rect x="265" y="220" width="60" height="40" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="295" y="245" font-family="monospace" font-size="11" fill="#f87171" text-anchor="middle">0</text>

    <!-- Legend -->
    <rect x="20" y="325" width="390" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="215" y="350" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1" text-anchor="middle">
      <tspan fill="#60a5fa">■ Source (0,1)</tspan>   <tspan fill="#34d399">■ Optimal Path</tspan>   <tspan fill="#f87171">■ Wall (0)</tspan>
    </text>
  </g>

  <!-- Right: 4-Directional Vectors and Step Trace -->
  <g transform="translate(495, 85)" filter="url(#shBFS3)">
    <rect width="450" height="380" rx="12" fill="url(#cardGradBFS3)" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      Direction Offsets &amp; Queue Progression
    </text>

    <!-- Direction Vectors Box -->
    <rect x="20" y="45" width="410" height="85" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="35" y="70" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">
      int dr[] = {-1, 1, 0, 0}; // UP, DOWN
    </text>
    <text x="35" y="92" font-family="monospace" font-size="12" font-weight="700" fill="#6ee7b7">
      int dc[] = {0, 0, -1, 1}; // LEFT, RIGHT
    </text>
    <text x="35" y="114" font-family="monospace" font-size="11" fill="#a7f3d0">
      nextRow = r + dr[k], nextCol = c + dc[k]
    </text>

    <!-- Queue Steps -->
    <rect x="20" y="145" width="410" height="215" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    
    <text x="35" y="175" font-family="monospace" font-size="11" fill="#93c5fd">1. Init Queue:</text>
    <text x="140" y="175" font-family="monospace" font-size="11" fill="#cbd5e1">[(0,1, dist=0)]</text>

    <text x="35" y="205" font-family="monospace" font-size="11" fill="#93c5fd">2. Pop (0,1):</text>
    <text x="140" y="205" font-family="monospace" font-size="11" fill="#cbd5e1">Push neighbors: (0,0), (0,2), (1,1) [dist=1]</text>

    <text x="35" y="235" font-family="monospace" font-size="11" fill="#93c5fd">3. Pop (1,1):</text>
    <text x="140" y="235" font-family="monospace" font-size="11" fill="#cbd5e1">Push neighbor (2,1) [dist=2] ((1,2) is wall 0)</text>

    <text x="35" y="265" font-family="monospace" font-size="11" fill="#93c5fd">4. Pop (2,1):</text>
    <text x="140" y="265" font-family="monospace" font-size="11" fill="#cbd5e1">Push neighbor (2,2) [dist=3] (Destination!)</text>

    <text x="35" y="295" font-family="monospace" font-size="11" fill="#34d399">5. Pop (2,2):</text>
    <text x="140" y="295" font-family="monospace" font-size="11" font-weight="700" fill="#6ee7b7">Target reached! Return dist = 3.</text>

    <!-- Result Banner -->
    <rect x="35" y="315" width="380" height="32" rx="4" fill="#047857"/>
    <text x="225" y="336" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">
      Shortest Distance = 3 Steps (Optimal)
    </text>
  </g>
</svg>
