<svg viewBox="0 0 920 490" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <!-- Background -->
  <rect width="920" height="490" rx="14" fill="#111317"/>

  <!-- Title -->
  <text x="30" y="32" fill="#f8fafc" font-size="18" font-weight="700">Connected Components in an Undirected Graph</text>
  <text x="30" y="52" fill="#94a3b8" font-size="13">Examples comparing graph connectivity, component grouping, and algorithm output</text>

  <!-- ========================================================================= -->
  <!-- CASE 1: Square joined to Triangle (1 Component)                           -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 65)">
    <!-- Row Card Background -->
    <rect width="870" height="125" rx="10" fill="#181b22" stroke="#2a303c" stroke-width="1"/>

    <!-- Case Label -->
    <rect x="15" y="12" width="60" height="20" rx="4" fill="#1e293b"/>
    <text x="45" y="26" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">CASE 1</text>
    <text x="85" y="27" fill="#f1f5f9" font-size="13" font-weight="600">Square on 0,1,2,3 joined to Triangle on 4,5,6</text>

    <!-- Component 1 Boundary Envelope (Encloses all 7 nodes) -->
    <path d="M 60 48 L 260 48 Q 335 48 335 110 L 60 110 Z" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4" rx="8"/>

    <!-- Edges: Square (0-1-2-3-0) -->
    <line x1="80" y1="58" x2="80" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="80" y1="105" x2="150" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="150" y1="105" x2="150" y2="58" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="150" y1="58" x2="80" y2="58" stroke="#94a3b8" stroke-width="2.2"/>

    <!-- Bridge Edge: 3 - 4 -->
    <line x1="150" y1="58" x2="220" y2="58" stroke="#38bdf8" stroke-width="2.8"/>
    <text x="185" y="50" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">edge (3–4)</text>

    <!-- Edges: Triangle (4-5-6-4) -->
    <line x1="220" y1="58" x2="220" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="220" y1="105" x2="290" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="290" y1="105" x2="220" y2="58" stroke="#94a3b8" stroke-width="2.2"/>

    <!-- Nodes -->
    <circle cx="80" cy="58" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">0</text>

    <circle cx="80" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>

    <circle cx="150" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>

    <circle cx="150" cy="58" r="13" fill="#0f172a" stroke="#38bdf8" stroke-width="2.2"/>
    <text x="150" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>

    <circle cx="220" cy="58" r="13" fill="#0f172a" stroke="#38bdf8" stroke-width="2.2"/>
    <text x="220" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4</text>

    <circle cx="220" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="220" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>

    <circle cx="290" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="290" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6</text>

    <!-- Output Info Box -->
    <g transform="translate(370, 20)">
      <rect width="480" height="88" rx="8" fill="#13161c" stroke="#28303e" stroke-width="1"/>

      <rect x="16" y="14" width="165" height="24" rx="5" fill="#1e3a8a" fill-opacity="0.6" stroke="#3b82f6" stroke-width="1"/>
      <text x="98" y="30" fill="#93c5fd" font-size="12" font-weight="700" text-anchor="middle">No. of Components: 1</text>

      <text x="16" y="58" fill="#94a3b8" font-size="12">Returned output list:</text>
      <text x="142" y="59" fill="#4ade80" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="700">[[0, 1, 2, 3, 4, 5, 6]]</text>

      <text x="16" y="78" fill="#64748b" font-size="11.5">Single maximal component — every vertex is reachable from any other vertex.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CASE 2: Square and Triangle Disconnected (2 Components)                   -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 200)">
    <!-- Row Card Background -->
    <rect width="870" height="125" rx="10" fill="#181b22" stroke="#2a303c" stroke-width="1"/>

    <!-- Case Label -->
    <rect x="15" y="12" width="60" height="20" rx="4" fill="#1e293b"/>
    <text x="45" y="26" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">CASE 2</text>
    <text x="85" y="27" fill="#f1f5f9" font-size="13" font-weight="600">The square and triangle have NO connecting edge</text>

    <!-- Component 1 Envelope: Square {0,1,2,3} -->
    <rect x="62" y="44" width="106" height="74" rx="12" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Component 2 Envelope: Triangle {4,5,6} -->
    <path d="M 204 44 L 236 44 Q 306 44 306 112 L 204 112 Z" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Edges: Square (0-1-2-3-0) -->
    <line x1="80" y1="58" x2="80" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="80" y1="105" x2="150" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="150" y1="105" x2="150" y2="58" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="150" y1="58" x2="80" y2="58" stroke="#94a3b8" stroke-width="2.2"/>

    <!-- No Edge Indicator -->
    <line x1="168" y1="58" x2="202" y2="58" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3 3"/>
    <text x="185" y="52" fill="#f87171" font-size="9.5" font-weight="700" text-anchor="middle">no edge</text>

    <!-- Edges: Triangle (4-5-6-4) -->
    <line x1="220" y1="58" x2="220" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="220" y1="105" x2="290" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="290" y1="105" x2="220" y2="58" stroke="#94a3b8" stroke-width="2.2"/>

    <!-- Nodes: Square (Blue) -->
    <circle cx="80" cy="58" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">0</text>

    <circle cx="80" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>

    <circle cx="150" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>

    <circle cx="150" cy="58" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="150" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>

    <!-- Nodes: Triangle (Green) -->
    <circle cx="220" cy="58" r="13" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="220" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4</text>

    <circle cx="220" cy="105" r="13" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="220" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>

    <circle cx="290" cy="105" r="13" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="290" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6</text>

    <!-- Output Info Box -->
    <g transform="translate(370, 20)">
      <rect width="480" height="88" rx="8" fill="#13161c" stroke="#28303e" stroke-width="1"/>

      <rect x="16" y="14" width="165" height="24" rx="5" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="1"/>
      <text x="98" y="30" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">No. of Components: 2</text>

      <text x="16" y="58" fill="#94a3b8" font-size="12">Returned output list:</text>
      <text x="142" y="59" fill="#4ade80" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="700">[[0, 1, 2, 3], [4, 5, 6]]</text>

      <text x="16" y="78" fill="#64748b" font-size="11.5">No bridge connects square and triangle; graph partitions into 2 disjoint components.</text>
    </g>
  </g>

  <!-- ========================================================================= -->
  <!-- CASE 3: Separate edges 0-1, 2-3, and Triangle 4-5-6 (3 Components)         -->
  <!-- ========================================================================= -->
  <g transform="translate(25, 335)">
    <!-- Row Card Background -->
    <rect width="870" height="125" rx="10" fill="#181b22" stroke="#2a303c" stroke-width="1"/>

    <!-- Case Label -->
    <rect x="15" y="12" width="60" height="20" rx="4" fill="#1e293b"/>
    <text x="45" y="26" fill="#94a3b8" font-size="11" font-weight="700" text-anchor="middle">CASE 3</text>
    <text x="85" y="27" fill="#f1f5f9" font-size="13" font-weight="600">Separate edges 0–1, 2–3, and triangle 4–5–6</text>

    <!-- Component 1 Envelope: Edge {0, 1} -->
    <rect x="64" y="42" width="32" height="78" rx="16" fill="#3b82f6" fill-opacity="0.08" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Component 2 Envelope: Edge {2, 3} -->
    <rect x="134" y="42" width="32" height="78" rx="16" fill="#f59e0b" fill-opacity="0.08" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- Component 3 Envelope: Triangle {4, 5, 6} -->
    <path d="M 204 44 L 236 44 Q 306 44 306 112 L 204 112 Z" fill="#10b981" fill-opacity="0.08" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5 4"/>

    <!-- Edges: Only 0-1 and 2-3 (Square top & bottom missing) -->
    <line x1="80" y1="58" x2="80" y2="105" stroke="#60a5fa" stroke-width="2.5"/>
    <line x1="150" y1="58" x2="150" y2="105" stroke="#fbbf24" stroke-width="2.5"/>

    <!-- Edges: Triangle (4-5-6-4) -->
    <line x1="220" y1="58" x2="220" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="220" y1="105" x2="290" y2="105" stroke="#94a3b8" stroke-width="2.2"/>
    <line x1="290" y1="105" x2="220" y2="58" stroke="#94a3b8" stroke-width="2.2"/>

    <!-- Nodes: {0, 1} (Blue) -->
    <circle cx="80" cy="58" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">0</text>

    <circle cx="80" cy="105" r="13" fill="#0f172a" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">1</text>

    <!-- Nodes: {2, 3} (Amber) -->
    <circle cx="150" cy="105" r="13" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="150" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">2</text>

    <circle cx="150" cy="58" r="13" fill="#0f172a" stroke="#fbbf24" stroke-width="2"/>
    <text x="150" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">3</text>

    <!-- Nodes: Triangle (Green) -->
    <circle cx="220" cy="58" r="13" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="220" y="62" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">4</text>

    <circle cx="220" cy="105" r="13" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="220" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">5</text>

    <circle cx="290" cy="105" r="13" fill="#0f172a" stroke="#34d399" stroke-width="2"/>
    <text x="290" y="109" fill="#ffffff" font-size="12" font-weight="700" text-anchor="middle">6</text>

    <!-- Output Info Box -->
    <g transform="translate(370, 20)">
      <rect width="480" height="88" rx="8" fill="#13161c" stroke="#28303e" stroke-width="1"/>

      <rect x="16" y="14" width="165" height="24" rx="5" fill="#78350f" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1"/>
      <text x="98" y="30" fill="#fde68a" font-size="12" font-weight="700" text-anchor="middle">No. of Components: 3</text>

      <text x="16" y="58" fill="#94a3b8" font-size="12">Returned output list:</text>
      <text x="142" y="59" fill="#4ade80" font-family="'Consolas', 'Courier New', monospace" font-size="14" font-weight="700">[[0, 1], [2, 3], [4, 5, 6]]</text>

      <text x="16" y="78" fill="#64748b" font-size="11.5">Square edges 0–3 and 1–2 are absent; vertices split into 3 disconnected components.</text>
    </g>
  </g>
</svg>
