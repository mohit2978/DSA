<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradQ8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGradQ8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeCenterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="nodeLeafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="shQ8" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGradQ8)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="36" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    LeetCode 1791: Find Center of Star Graph (O(1) Evaluation)
  </text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    The central hub node must appear in every single edge of the star graph
  </text>

  <!-- Left Card: Star Graph Topology -->
  <g transform="translate(35, 80)" filter="url(#shQ8)">
    <rect width="430" height="300" rx="12" fill="url(#cardGradQ8)" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#fbbf24">
      Star Graph Structure (edges = [[1,2],[2,3],[4,2]])
    </text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      Hub node 2 connects to all n-1 = 3 satellites
    </text>

    <!-- Visual Star Topology -->
    <g transform="translate(195, 155)">
      <!-- Edges connecting center to satellites -->
      <line x1="0" y1="0" x2="0" y2="-65" stroke="#94a3b8" stroke-width="3"/>
      <line x1="0" y1="0" x2="-80" y2="45" stroke="#94a3b8" stroke-width="3"/>
      <line x1="0" y1="0" x2="80" y2="45" stroke="#94a3b8" stroke-width="3"/>

      <!-- Center Node (Node 2) -->
      <circle cx="0" cy="0" r="22" fill="url(#nodeCenterGrad)" stroke="#fef08a" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">2</text>
      <text x="42" y="4" font-family="sans-serif" font-size="11" font-weight="700" fill="#f59e0b">Center (Degree = 3)</text>

      <!-- Leaf Nodes -->
      <circle cx="0" cy="-65" r="16" fill="url(#nodeLeafGrad)"/>
      <text x="0" y="-60" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>

      <circle cx="-80" cy="45" r="16" fill="url(#nodeLeafGrad)"/>
      <text x="-80" y="50" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>

      <circle cx="80" cy="45" r="16" fill="url(#nodeLeafGrad)"/>
      <text x="80" y="50" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
    </g>

    <!-- Bottom Status -->
    <rect x="20" y="248" width="390" height="38" rx="6" fill="#78350f"/>
    <text x="215" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fef08a" text-anchor="middle">
      ★ Node 2 is the Common Center Hub
    </text>
  </g>

  <!-- Right Card: O(1) Two-Edge Comparison Logic -->
  <g transform="translate(495, 80)" filter="url(#shQ8)">
    <rect width="430" height="300" rx="12" fill="url(#cardGradQ8)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Why Comparing Only 2 Edges Works in O(1)
    </text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      No need to traverse all N-1 edges!
    </text>

    <!-- Edge Comparison Table -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="390" height="100" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="15" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8">Edge 0:</text>
      <rect x="75" y="8" width="85" height="24" rx="4" fill="#1e293b" stroke="#64748b"/>
      <text x="117" y="24" font-family="Consolas" font-size="11" fill="#f8fafc" text-anchor="middle">[u0=1, v0=2]</text>

      <text x="15" y="54" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#94a3b8">Edge 1:</text>
      <rect x="75" y="40" width="85" height="24" rx="4" fill="#1e293b" stroke="#64748b"/>
      <text x="117" y="56" font-family="Consolas" font-size="11" fill="#f8fafc" text-anchor="middle">[u1=2, v1=3]</text>

      <text x="15" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Check:</text>
      <text x="65" y="84" font-family="Consolas" font-size="11" fill="#cbd5e1">Does <tspan fill="#f59e0b" font-weight="700">edges[0][0] (1)</tspan> equal <tspan fill="#f59e0b" font-weight="700">edges[1][0] or edges[1][1]</tspan>?</text>
    </g>

    <!-- Code Decision Block -->
    <rect x="20" y="180" width="390" height="60" rx="8" fill="#064e3b" stroke="#10b981"/>
    <text x="35" y="202" font-family="Consolas" font-size="11.5" font-weight="700" fill="#a7f3d0">
      if (edges[0][0] == edges[1][0] || edges[0][0] == edges[1][1])
    </text>
    <text x="60" y="222" font-family="Consolas" font-size="11.5" font-weight="700" fill="#34d399">
      return edges[0][0]; // else return edges[0][1];
    </text>

    <!-- Bottom Status -->
    <rect x="20" y="248" width="390" height="38" rx="6" fill="#0f172a" stroke="#38bdf8"/>
    <text x="215" y="272" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">
      Common node found: 2 (Computed in 1 Step)
    </text>
  </g>

  <!-- Bottom Summary Banner -->
  <g transform="translate(35, 400)">
    <rect width="890" height="95" rx="10" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="25" y="28" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Key Insight:</text>
    <text x="25" y="48" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">1. Every star graph with N vertices has exactly N - 1 edges all incident to one central node.</text>
    <text x="25" y="66" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">2. Therefore, the center MUST appear in both `edges[0]` and `edges[1]`.</text>
    <text x="25" y="84" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">3. Finding the intersection of the two endpoints takes at most 2 integer comparisons.</text>
    <text x="730" y="58" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Time: O(1)</text>
    <text x="730" y="76" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Space: O(1)</text>
  </g>
</svg>
