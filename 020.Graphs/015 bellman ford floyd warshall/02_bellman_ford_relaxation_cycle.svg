<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nodePurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="nodeGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <marker id="arr" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>

    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Bellman-Ford Algorithm: Relaxation &amp; (V - 1) Iterations Logic
  </text>
  <text x="475" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    A simple shortest path contains at most (V - 1) edges. In each round, at least one more level of edges is relaxed.
  </text>

  <!-- Top Card: Worst Case Linear Chain -->
  <rect x="40" y="85" width="870" height="180" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.2" filter="url(#sh)"/>
  <rect x="40" y="85" width="870" height="32" rx="12" fill="#38bdf8" fill-opacity="0.1"/>
  <text x="60" y="106" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
    Worst Case Ordering: Reverse Edge List Relaxation
  </text>

  <!-- Linear Graph: 0 -> 1 -> 2 -> 3 -> 4 -->
  <!-- Edges -->
  <line x1="120" y1="165" x2="270" y2="165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="290" y1="165" x2="440" y2="165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="460" y1="165" x2="610" y2="165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="630" y1="165" x2="780" y2="165" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Edge Weights -->
  <rect x="180" y="145" width="30" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="195" y="159" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">w1</text>

  <rect x="350" y="145" width="30" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="365" y="159" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">w2</text>

  <rect x="520" y="145" width="30" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="535" y="159" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">w3</text>

  <rect x="690" y="145" width="30" height="20" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="705" y="159" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">w4</text>

  <!-- Nodes -->
  <circle cx="100" cy="165" r="18" fill="url(#nodeGreen)" filter="url(#sh)"/>
  <text x="100" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
  <text x="100" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">Src (dist=0)</text>

  <circle cx="270" cy="165" r="18" fill="url(#nodeBlue)" filter="url(#sh)"/>
  <text x="270" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="270" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Pass 1</text>

  <circle cx="440" cy="165" r="18" fill="url(#nodeBlue)" filter="url(#sh)"/>
  <text x="440" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="440" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Pass 2</text>

  <circle cx="610" cy="165" r="18" fill="url(#nodeBlue)" filter="url(#sh)"/>
  <text x="610" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="610" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#94a3b8" text-anchor="middle">Pass 3</text>

  <circle cx="780" cy="165" r="18" fill="url(#nodePurple)" filter="url(#sh)"/>
  <text x="780" y="170" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="780" y="200" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#c084fc" text-anchor="middle">Pass 4 (V-1)</text>

  <text x="60" y="235" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
    • If edge order is [ (3,4), (2,3), (1,2), (0,1) ]: In Iteration 1, only node 1 gets relaxed. In Iteration 2, node 2 gets relaxed, etc.
  </text>
  <text x="60" y="252" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
    • Hence, exactly <tspan font-weight="700" fill="#38bdf8">V - 1</tspan> passes guarantee that the true shortest path of at most V-1 edges is fully propagated to all reachable nodes!
  </text>


  <!-- Bottom Left Card: Relaxation Formula -->
  <rect x="40" y="280" width="415" height="215" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.2" filter="url(#sh)"/>
  <text x="60" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#a78bfa">
    Edge Relaxation Formula (1D Array DP)
  </text>

  <rect x="60" y="325" width="375" height="42" rx="6" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="75" y="351" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">
    if (dist[u] != INF &amp;&amp; dist[u] + wt &lt; dist[v])
  </text>
  <text x="80" y="390" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#4ade80">
      dist[v] = dist[u] + wt;
  </text>

  <text x="60" y="425" font-family="system-ui, sans-serif" font-size="11.5" font-weight="400" fill="#94a3b8">
    Space Optimization:
  </text>
  <text x="60" y="445" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
    Instead of 2D DP matrix <tspan font-family="Consolas" fill="#38bdf8">dp[iter][node]</tspan> of size <tspan font-family="Consolas">O(V²)</tspan>, we update in-place in a 1D <tspan font-family="Consolas" fill="#38bdf8">dist[node]</tspan> array of size <tspan font-family="Consolas" fill="#4ade80">O(V)</tspan>.
  </text>
  <text x="60" y="475" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#f8fafc">
    Time: <tspan fill="#f59e0b">O(V × E)</tspan> | Space: <tspan fill="#4ade80">O(V)</tspan>
  </text>

  <!-- Bottom Right Card: Negative Cycle Detection -->
  <rect x="475" y="280" width="435" height="215" rx="12" fill="url(#cardGrad2)" stroke="#334155" stroke-width="1.2" filter="url(#sh)"/>
  <text x="495" y="310" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">
    N-th Pass: Negative Cycle Detection
  </text>

  <rect x="495" y="325" width="395" height="75" rx="6" fill="#450a0a" fill-opacity="0.3" stroke="#dc2626" stroke-width="1"/>
  <text x="510" y="348" font-family="Consolas, monospace" font-size="11.5" font-weight="600" fill="#fca5a5">
    // After V-1 passes, run 1 more time:
  </text>
  <text x="510" y="368" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#f87171">
    if (dist[u] != INF &amp;&amp; dist[u] + wt &lt; dist[v]) {
  </text>
  <text x="530" y="388" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#ef4444">
      return {-1}; // Negative cycle detected!
  </text>

  <text x="495" y="425" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#cbd5e1">
    Why? If all reachable shortest paths contain ≤ V-1 edges, no further distance relaxation is possible unless there exists a <tspan fill="#f87171" font-weight="700">negative weight cycle</tspan>.
  </text>
  <text x="495" y="465" font-family="system-ui, sans-serif" font-size="11.5" font-weight="500" fill="#94a3b8">
    Note: Distances in negative cycles can reduce to -∞.
  </text>
</svg>
