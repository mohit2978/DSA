<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardS2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeSrcS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>

    <linearGradient id="nodeNormalS2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <marker id="arrS2" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRedS2" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>

    <filter id="shS2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="550" rx="16" fill="url(#bgS2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="480" y="36" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Bellman-Ford Dry Run 2: Negative Edge Weights (No Cycle)
  </text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="12.5" fill="#94a3b8" text-anchor="middle">
    V = 4, Source = 0 | Shows how negative edge (-3) correctly relaxes node 1 from 5 to 1 across passes
  </text>

  <!-- Left: Graph & Edges -->
  <rect x="35" y="78" width="370" height="445" rx="12" fill="url(#cardS2)" stroke="#334155" stroke-width="1.2" filter="url(#shS2)"/>
  <text x="55" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">
    Graph with Negative Edge
  </text>

  <g transform="translate(45, 125)">
    <!-- Edge 0->1 wt: 5 -->
    <line x1="50" y1="50" x2="170" y2="50" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS2)"/>
    <rect x="100" y="35" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="112" y="48" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">5</text>

    <!-- Edge 0->2 wt: 4 -->
    <line x1="50" y1="50" x2="50" y2="170" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS2)"/>
    <rect x="35" y="100" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="47" y="113" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">4</text>

    <!-- Negative Edge 2->1 wt: -3 -->
    <line x1="60" y1="160" x2="160" y2="60" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrRedS2)"/>
    <rect x="105" y="100" width="30" height="20" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="120" y="114" font-family="Consolas" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">-3</text>

    <!-- Edge 1->3 wt: 3 -->
    <line x1="170" y1="50" x2="270" y2="110" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS2)"/>
    <rect x="220" y="65" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="232" y="78" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">3</text>

    <!-- Edge 2->3 wt: 6 -->
    <line x1="50" y1="170" x2="270" y2="110" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS2)"/>
    <rect x="155" y="148" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="167" y="161" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">6</text>

    <!-- Nodes -->
    <circle cx="50" cy="50" r="18" fill="url(#nodeSrcS2)" filter="url(#shS2)"/>
    <text x="50" y="55" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text>
    <text x="50" y="24" font-family="sans-serif" font-size="10" font-weight="600" fill="#4ade80" text-anchor="middle">Src (0)</text>

    <circle cx="170" cy="50" r="18" fill="url(#nodeNormalS2)" filter="url(#shS2)"/>
    <text x="170" y="55" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>

    <circle cx="50" cy="170" r="18" fill="url(#nodeNormalS2)" filter="url(#shS2)"/>
    <text x="50" y="175" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

    <circle cx="270" cy="110" r="18" fill="url(#nodeNormalS2)" filter="url(#shS2)"/>
    <text x="270" y="115" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
  </g>

  <!-- Edge order list box -->
  <rect x="50" y="335" width="340" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="358" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f87171">Array Edge List Order:</text>
  <text x="65" y="380" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">e0: [0, 1, 5]  | e1: [1, 3, 3]</text>
  <text x="65" y="400" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">e2: [0, 2, 4]  | e3: [2, 1, -3]</text>
  <text x="65" y="420" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">e4: [2, 3, 6]</text>
  <text x="65" y="450" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Why Bellman-Ford Wins vs Dijkstra:</text>
  <text x="65" y="470" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Path 0→2→1 (4 + -3 = 1) &lt; 0→1 (5).</text>
  <text x="65" y="490" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Path 0→2→1→3 (1 + 3 = 4) &lt; 0→1→3 (8).</text>


  <!-- Right: Iteration Steps Table -->
  <rect x="420" y="78" width="505" height="445" rx="12" fill="url(#cardS2)" stroke="#334155" stroke-width="1.2" filter="url(#shS2)"/>
  <text x="440" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
    Pass-by-Pass dist[] Array Relaxation
  </text>

  <!-- Table Layout -->
  <g transform="translate(435, 120)">
    <!-- Header -->
    <rect x="0" y="0" width="475" height="28" fill="#1e293b" rx="4"/>
    <text x="12" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Iteration</text>
    <text x="90" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Edge Relaxations</text>
    <text x="210" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">dist[0]</text>
    <text x="270" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">dist[1]</text>
    <text x="330" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">dist[2]</text>
    <text x="390" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">dist[3]</text>

    <!-- Init -->
    <rect x="0" y="32" width="475" height="24" fill="#0f172a"/>
    <text x="12" y="48" font-family="Consolas" font-size="11" fill="#f8fafc">Init</text>
    <text x="90" y="48" font-family="Consolas" font-size="11" fill="#94a3b8">dist[0] = 0, rest = INF</text>
    <text x="215" y="48" font-family="Consolas" font-size="11" font-weight="700" fill="#4ade80">0</text>
    <text x="275" y="48" font-family="Consolas" font-size="11" fill="#64748b">∞</text>
    <text x="335" y="48" font-family="Consolas" font-size="11" fill="#64748b">∞</text>
    <text x="395" y="48" font-family="Consolas" font-size="11" fill="#64748b">∞</text>

    <!-- Pass 1 -->
    <rect x="0" y="60" width="475" height="110" rx="4" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1"/>
    <text x="12" y="80" font-family="Consolas" font-size="11.5" font-weight="700" fill="#38bdf8">Pass 1 (i=0)</text>
    <text x="90" y="80" font-family="Consolas" font-size="10.5" fill="#cbd5e1">• e0 (0→1): dist[1] = 0+5 = 5</text>
    <text x="90" y="100" font-family="Consolas" font-size="10.5" fill="#cbd5e1">• e1 (1→3): dist[3] = 5+3 = 8</text>
    <text x="90" y="120" font-family="Consolas" font-size="10.5" fill="#cbd5e1">• e2 (0→2): dist[2] = 0+4 = 4</text>
    <text x="90" y="140" font-family="Consolas" font-size="10.5" fill="#fca5a5">• e3 (2→1): dist[1] = min(5, 4+-3) = 1 (Reduced!)</text>
    <text x="90" y="160" font-family="Consolas" font-size="10.5" fill="#cbd5e1">• e4 (2→3): dist[3] = min(8, 4+6) = 8</text>
    <text x="12" y="160" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">End of Pass 1 → [0, 1, 4, 8]</text>

    <!-- Pass 2 -->
    <rect x="0" y="176" width="475" height="75" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="196" font-family="Consolas" font-size="11.5" font-weight="700" fill="#38bdf8">Pass 2 (i=1)</text>
    <text x="90" y="196" font-family="Consolas" font-size="10.5" fill="#cbd5e1">• e0 (0→1): 0+5 &gt; 1 (no change)</text>
    <text x="90" y="216" font-family="Consolas" font-size="10.5" fill="#4ade80">• e1 (1→3): dist[3] = min(8, dist[1]+3 = 1+3) = 4</text>
    <text x="90" y="236" font-family="Consolas" font-size="10.5" fill="#cbd5e1">• e2, e3, e4: no further improvements</text>
    <text x="12" y="236" font-family="Consolas" font-size="11" font-weight="700" fill="#4ade80">End of Pass 2 → [0, 1, 4, 4]</text>

    <!-- Pass 3 -->
    <rect x="0" y="256" width="475" height="42" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="278" font-family="Consolas" font-size="11.5" font-weight="700" fill="#38bdf8">Pass 3 (i=2)</text>
    <text x="90" y="278" font-family="Consolas" font-size="10.5" fill="#cbd5e1">(V - 1)-th pass. No distance changes: [0, 1, 4, 4]</text>

    <!-- V-th Pass -->
    <rect x="0" y="304" width="475" height="85" rx="4" fill="#052e16" fill-opacity="0.4" stroke="#16a34a" stroke-width="1"/>
    <text x="12" y="326" font-family="Consolas" font-size="11.5" font-weight="700" fill="#4ade80">V-th Pass (Check)</text>
    <text x="90" y="326" font-family="Consolas" font-size="10.5" fill="#86efac">for (int[] edge : edges) { if (dist[u] + wt &lt; dist[v]) ... }</text>
    <text x="90" y="348" font-family="Consolas" font-size="10.5" fill="#86efac">All conditions return FALSE → Graph is free of negative cycles!</text>
    <text x="90" y="370" font-family="Consolas" font-size="11" font-weight="700" fill="#4ade80">Return final dist = [0, 1, 4, 4]</text>
  </g>
</svg>
