<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardS3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeSrcS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nodeCycleS3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <marker id="arrS3" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRedS3" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>

    <filter id="shS3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="560" rx="16" fill="url(#bgS3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Header -->
  <text x="480" y="36" font-family="system-ui, sans-serif" font-size="19" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Bellman-Ford Dry Run 3: Negative Weight Cycle Detection
  </text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="12.5" fill="#f87171" text-anchor="middle">
    Cycle 1 → 2 → 3 → 1 weight = 2 + 1 + (-5) = -2 &lt; 0 | V-th pass detects continuous relaxation and returns [-1]
  </text>

  <!-- Left: Graph with Negative Cycle -->
  <rect x="35" y="78" width="370" height="455" rx="12" fill="url(#cardS3)" stroke="#334155" stroke-width="1.2" filter="url(#shS3)"/>
  <text x="55" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">
    Graph with Negative Cycle
  </text>

  <g transform="translate(45, 125)">
    <!-- Edge 0->1 wt: 4 -->
    <line x1="40" y1="90" x2="140" y2="40" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS3)"/>
    <rect x="80" y="50" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="92" y="63" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">4</text>

    <!-- Edge 1->2 wt: 2 -->
    <line x1="140" y1="40" x2="260" y2="40" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS3)"/>
    <rect x="190" y="25" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="202" y="38" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">2</text>

    <!-- Edge 2->3 wt: 1 -->
    <line x1="260" y1="40" x2="200" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrS3)"/>
    <rect x="235" y="90" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="247" y="103" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>

    <!-- Edge 3->1 wt: -5 (Negative Cycle closing edge) -->
    <line x1="200" y1="150" x2="140" y2="40" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,3" marker-end="url(#arrRedS3)"/>
    <rect x="150" y="90" width="30" height="20" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="165" y="104" font-family="Consolas" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">-5</text>

    <!-- Nodes -->
    <circle cx="40" cy="90" r="18" fill="url(#nodeSrcS3)" filter="url(#shS3)"/>
    <text x="40" y="95" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text>
    <text x="40" y="125" font-family="sans-serif" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">Src (0)</text>

    <circle cx="140" cy="40" r="18" fill="url(#nodeCycleS3)" filter="url(#shS3)"/>
    <text x="140" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>

    <circle cx="260" cy="40" r="18" fill="url(#nodeCycleS3)" filter="url(#shS3)"/>
    <text x="260" y="45" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

    <circle cx="200" cy="150" r="18" fill="url(#nodeCycleS3)" filter="url(#shS3)"/>
    <text x="200" y="155" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>

    <!-- Cycle indicator -->
    <circle cx="200" cy="75" r="22" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4"/>
    <text x="200" y="78" font-family="sans-serif" font-size="9.5" font-weight="800" fill="#ef4444" text-anchor="middle">-2 / loop</text>
  </g>

  <!-- Cycle explanation box -->
  <rect x="50" y="325" width="340" height="190" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="65" y="348" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f87171">Negative Cycle Traversal:</text>
  <text x="65" y="370" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Cycle: 1 → 2 → 3 → 1</text>
  <text x="65" y="390" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Cycle sum: 2 + 1 + (-5) = <tspan font-weight="700" fill="#f87171">-2 &lt; 0</tspan></text>
  <text x="65" y="410" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Each loop around 1→2→3→1 reduces distance by 2.</text>
  <text x="65" y="435" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8">Result:</text>
  <text x="65" y="455" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Distances never converge; they go to -∞</text>
  <text x="65" y="475" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">Shortest path is mathematically undefined.</text>
  <text x="65" y="500" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f87171">Output: [-1]</text>


  <!-- Right: Iterations Breakdown Table -->
  <rect x="420" y="78" width="505" height="455" rx="12" fill="url(#cardS3)" stroke="#334155" stroke-width="1.2" filter="url(#shS3)"/>
  <text x="440" y="105" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">
    Array Evolution &amp; Negative Cycle Trigger
  </text>

  <!-- Table Layout -->
  <g transform="translate(435, 120)">
    <!-- Header -->
    <rect x="0" y="0" width="475" height="28" fill="#1e293b" rx="4"/>
    <text x="12" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Pass</text>
    <text x="90" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Relaxation Events</text>
    <text x="250" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">dist[0..3]</text>
    <text x="390" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#94a3b8">Status</text>

    <!-- Init -->
    <rect x="0" y="32" width="475" height="24" fill="#0f172a"/>
    <text x="12" y="48" font-family="Consolas" font-size="11" fill="#f8fafc">Init</text>
    <text x="90" y="48" font-family="Consolas" font-size="10.5" fill="#94a3b8">dist[0]=0, others INF</text>
    <text x="250" y="48" font-family="Consolas" font-size="11" fill="#cbd5e1">[0, ∞, ∞, ∞]</text>
    <text x="390" y="48" font-family="system-ui" font-size="10.5" fill="#94a3b8">Start</text>

    <!-- Pass 1 -->
    <rect x="0" y="60" width="475" height="65" rx="4" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
    <text x="12" y="80" font-family="Consolas" font-size="11.5" font-weight="700" fill="#38bdf8">Pass 1</text>
    <text x="90" y="80" font-family="Consolas" font-size="10" fill="#cbd5e1">0→1: d[1]=4; 1→2: d[2]=6;</text>
    <text x="90" y="98" font-family="Consolas" font-size="10" fill="#cbd5e1">2→3: d[3]=7; 3→1: d[1]=min(4, 7-5)=2</text>
    <text x="250" y="90" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">[0, 2, 6, 7]</text>
    <text x="390" y="90" font-family="system-ui" font-size="10.5" fill="#38bdf8">d[1] ↓ to 2</text>

    <!-- Pass 2 -->
    <rect x="0" y="130" width="475" height="65" rx="4" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
    <text x="12" y="150" font-family="Consolas" font-size="11.5" font-weight="700" fill="#38bdf8">Pass 2</text>
    <text x="90" y="150" font-family="Consolas" font-size="10" fill="#cbd5e1">1→2: d[2]=2+2=4; 2→3: d[3]=4+1=5;</text>
    <text x="90" y="168" font-family="Consolas" font-size="10" fill="#cbd5e1">3→1: d[1]=min(2, 5-5)=0</text>
    <text x="250" y="160" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">[0, 0, 4, 5]</text>
    <text x="390" y="160" font-family="system-ui" font-size="10.5" fill="#f59e0b">d[1] ↓ to 0</text>

    <!-- Pass 3 -->
    <rect x="0" y="200" width="475" height="65" rx="4" fill="#1e293b" fill-opacity="0.4" stroke="#334155" stroke-width="1"/>
    <text x="12" y="220" font-family="Consolas" font-size="11.5" font-weight="700" fill="#38bdf8">Pass 3</text>
    <text x="90" y="220" font-family="Consolas" font-size="10" fill="#cbd5e1">(V - 1)-th pass:</text>
    <text x="90" y="238" font-family="Consolas" font-size="10" fill="#cbd5e1">1→2: d[2]=2; 2→3: d[3]=3; 3→1: d[1]=-2</text>
    <text x="250" y="230" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">[0, -2, 2, 3]</text>
    <text x="390" y="230" font-family="system-ui" font-size="10.5" fill="#f87171">d[1] ↓ to -2</text>

    <!-- V-th Pass (Negative Cycle Check) -->
    <rect x="0" y="272" width="475" height="110" rx="4" fill="#450a0a" fill-opacity="0.4" stroke="#dc2626" stroke-width="1.2"/>
    <text x="12" y="295" font-family="Consolas" font-size="11.5" font-weight="700" fill="#f87171">V-th Pass</text>
    <text x="90" y="295" font-family="Consolas" font-size="10.5" font-weight="700" fill="#fca5a5">// Check 4th iteration:</text>
    <text x="90" y="315" font-family="Consolas" font-size="10.5" fill="#fca5a5">Edge (1→2): dist[1] + 2 = -2 + 2 = 0 &lt; dist[2] (2)</text>
    <text x="90" y="335" font-family="Consolas" font-size="10.5" font-weight="700" fill="#ef4444">Condition (dist[u] + wt &lt; dist[v]) is TRUE!</text>
    <text x="90" y="360" font-family="Consolas" font-size="11.5" font-weight="800" fill="#f87171">→ return new int[]{-1}; // Negative Cycle Detected</text>
  </g>
</svg>
