<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="nodeGradMult" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <marker id="arrCyan" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>

    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    LeetCode 1627: Graph Connectivity With Threshold (DSU Optimization)
  </text>
  <text x="475" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Condition: Edge exists between x and y if gcd(x, y) &gt; threshold. Solve using Sieve-like DSU Unioning.
  </text>

  <!-- Left Card: Naive vs Sieve approach -->
  <rect x="40" y="85" width="410" height="360" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1.2" filter="url(#sh3)"/>
  <text x="60" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f87171">
    Naive Approach (TLE)
  </text>

  <rect x="60" y="130" width="370" height="65" rx="6" fill="#450a0a" fill-opacity="0.25" stroke="#dc2626" stroke-width="1"/>
  <text x="75" y="152" font-family="Consolas, monospace" font-size="11.5" fill="#fca5a5">
    for (int i = 1; i &lt;= n; i++)
  </text>
  <text x="90" y="170" font-family="Consolas, monospace" font-size="11.5" fill="#fca5a5">
    for (int j = i + 1; j &lt;= n; j++)
  </text>
  <text x="105" y="188" font-family="Consolas, monospace" font-size="11.5" fill="#fca5a5">
    if (gcd(i, j) &gt; threshold) union(i, j);
  </text>

  <text x="60" y="220" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#f87171">
    Time Complexity: O(n² · log(n)) → (10⁴)² = 10⁸ ops (TLE!)
  </text>

  <text x="60" y="260" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4ade80">
    Optimized Multiples Sieve Approach
  </text>

  <rect x="60" y="275" width="370" height="95" rx="6" fill="#052e16" fill-opacity="0.3" stroke="#16a34a" stroke-width="1"/>
  <text x="75" y="298" font-family="Consolas, monospace" font-size="11.5" fill="#86efac">
    // Iterate base divisor i from threshold + 1
  </text>
  <text x="75" y="318" font-family="Consolas, monospace" font-size="11.5" fill="#86efac">
    for (int i = threshold + 1; i &lt;= n; i++) {
  </text>
  <text x="90" y="338" font-family="Consolas, monospace" font-size="11.5" fill="#86efac">
      for (int m = 2 * i; m &lt;= n; m += i) {
  </text>
  <text x="105" y="358" font-family="Consolas, monospace" font-size="11.5" fill="#86efac">
          dsu.union(i, m); // all share factor 'i'
  </text>

  <text x="60" y="395" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#4ade80">
    Harmonic Series: n/1 + n/2 + ... = O(n log n)
  </text>
  <text x="60" y="420" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1">
    Query: <tspan font-family="Consolas" fill="#38bdf8">dsu.find(u) == dsu.find(v)</tspan> in <tspan fill="#38bdf8" font-weight="700">O(α(N))</tspan>
  </text>


  <!-- Right Card: Visual Sieve Multiples Connection -->
  <rect x="475" y="85" width="435" height="360" rx="12" fill="url(#cardGrad3)" stroke="#334155" stroke-width="1.2" filter="url(#sh3)"/>
  <text x="495" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    Visual Sieve Unioning (e.g., n = 12, threshold = 2)
  </text>

  <!-- Divisor i = 3 -->
  <g transform="translate(495, 135)">
    <rect x="0" y="0" width="395" height="85" rx="8" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Base i = 3 (since 3 &gt; 2):</text>

    <!-- Node 3 -->
    <circle cx="50" cy="55" r="16" fill="url(#nodeGrad3)"/>
    <text x="50" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>

    <!-- Edge 3 -> 6 -->
    <line x1="66" y1="55" x2="135" y2="55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
    <!-- Node 6 -->
    <circle cx="150" cy="55" r="16" fill="url(#nodeGradMult)"/>
    <text x="150" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">6</text>

    <!-- Edge 3 -> 9 -->
    <line x1="166" y1="55" x2="235" y2="55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
    <!-- Node 9 -->
    <circle cx="250" cy="55" r="16" fill="url(#nodeGradMult)"/>
    <text x="250" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">9</text>

    <!-- Edge 3 -> 12 -->
    <line x1="266" y1="55" x2="335" y2="55" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrCyan)"/>
    <!-- Node 12 -->
    <circle cx="350" cy="55" r="16" fill="url(#nodeGradMult)"/>
    <text x="350" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">12</text>
  </g>

  <!-- Divisor i = 4 -->
  <g transform="translate(495, 235)">
    <rect x="0" y="0" width="395" height="85" rx="8" fill="#0f172a" stroke="#a78bfa" stroke-width="1"/>
    <text x="15" y="24" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">Base i = 4 (since 4 &gt; 2):</text>

    <!-- Node 4 -->
    <circle cx="70" cy="55" r="16" fill="url(#nodeGrad3)"/>
    <text x="70" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>

    <!-- Edge 4 -> 8 -->
    <line x1="86" y1="55" x2="185" y2="55" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrCyan)"/>
    <!-- Node 8 -->
    <circle cx="200" cy="55" r="16" fill="url(#nodeGradMult)"/>
    <text x="200" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">8</text>

    <!-- Edge 4 -> 12 -->
    <line x1="216" y1="55" x2="315" y2="55" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrCyan)"/>
    <!-- Node 12 -->
    <circle cx="330" cy="55" r="16" fill="url(#nodeGradMult)"/>
    <text x="330" y="60" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">12</text>
  </g>

  <rect x="495" y="335" width="395" height="95" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="360" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">
    Transitive Connectivity in DSU:
  </text>
  <text x="510" y="382" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">
    Because 12 is connected to 3 (via factor 3) and 12 is connected to 4 (via factor 4), {3, 6, 9, 12} and {4, 8, 12} merge into the <tspan font-weight="700" fill="#4ade80">same component</tspan>!
  </text>
  <text x="510" y="405" font-family="system-ui, sans-serif" font-size="11.5" fill="#fca5a5">
    Now 3 and 8 are automatically connected (via 12)!
  </text>
</svg>
