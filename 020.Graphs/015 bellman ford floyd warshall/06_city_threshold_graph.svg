<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cardGrad6" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="node6Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="node6Winner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <filter id="sh6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad6)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    LeetCode 1334: Find the City With the Smallest Number of Neighbors at a Threshold Distance
  </text>
  <text x="475" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Algorithm: 1. Run Floyd-Warshall APSP (O(N³)) → 2. Count cities with dist ≤ threshold → 3. Return city with min count (tie-break largest id)
  </text>

  <!-- Left Card: Example 1 (n=4, threshold=4) -->
  <rect x="40" y="85" width="425" height="365" rx="12" fill="url(#cardGrad6)" stroke="#334155" stroke-width="1.2" filter="url(#sh6)"/>
  <text x="60" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    Example 1: n = 4, threshold = 4
  </text>

  <!-- Graph 1 Layout -->
  <!-- Edges -->
  <line x1="120" y1="170" x2="260" y2="170" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="180" y="152" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="192" y="165" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">3</text>

  <line x1="260" y1="170" x2="260" y2="280" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="268" y="215" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="280" y="228" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>

  <line x1="260" y1="280" x2="120" y2="280" stroke="#94a3b8" stroke-width="2.5"/>
  <rect x="180" y="285" width="24" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="192" y="298" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>

  <line x1="120" y1="280" x2="260" y2="170" stroke="#94a3b8" stroke-width="2"/>
  <rect x="195" y="215" width="24" height="18" rx="3" fill="#0f172a" stroke="#94a3b8" stroke-width="1"/>
  <text x="207" y="228" font-family="Consolas" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">4</text>

  <!-- Nodes -->
  <circle cx="120" cy="170" r="18" fill="url(#node6Grad)" filter="url(#sh6)"/>
  <text x="120" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">0</text>

  <circle cx="260" cy="170" r="18" fill="url(#node6Grad)" filter="url(#sh6)"/>
  <text x="260" y="175" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">1</text>

  <circle cx="260" cy="280" r="18" fill="url(#node6Grad)" filter="url(#sh6)"/>
  <text x="260" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">2</text>

  <circle cx="120" cy="280" r="18" fill="url(#node6Winner)" filter="url(#sh6)"/>
  <text x="120" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">3</text>

  <!-- Right inside left card: distance analysis -->
  <rect x="60" y="325" width="385" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="348" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">City 0: reachable ≤ 4 → [City 1 (3), City 2 (4)] = <tspan font-weight="700" fill="#38bdf8">2 cities</tspan></text>
  <text x="75" y="368" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">City 1: reachable ≤ 4 → [City 0 (3), City 2 (1), City 3 (2)] = 3 cities</text>
  <text x="75" y="388" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">City 2: reachable ≤ 4 → [City 0 (4), City 1 (1), City 3 (1)] = 3 cities</text>
  <text x="75" y="408" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4ade80">City 3: reachable ≤ 4 → [City 1 (2), City 2 (1)] = 2 cities → Winner (ID: 3 &gt; 0)!</text>


  <!-- Right Card: Example 2 (n=5, threshold=2) -->
  <rect x="485" y="85" width="425" height="365" rx="12" fill="url(#cardGrad6)" stroke="#334155" stroke-width="1.2" filter="url(#sh6)"/>
  <text x="505" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4ade80">
    Example 2: n = 5, threshold = 2
  </text>

  <!-- Graph 2 Layout -->
  <g transform="translate(500, 130)">
    <!-- Edges -->
    <line x1="70" y1="50" x2="160" y2="20" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="110" y="30" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">2</text>

    <line x1="160" y1="20" x2="250" y2="70" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="210" y="40" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">3</text>

    <line x1="250" y1="70" x2="200" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="235" y="115" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">1</text>

    <line x1="200" y1="150" x2="70" y2="150" stroke="#94a3b8" stroke-width="2.5"/>
    <text x="135" y="165" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">1</text>

    <line x1="70" y1="150" x2="70" y2="50" stroke="#94a3b8" stroke-width="2"/>
    <text x="50" y="105" font-family="Consolas" font-size="11" font-weight="700" fill="#94a3b8">8</text>

    <line x1="70" y1="150" x2="160" y2="20" stroke="#94a3b8" stroke-width="2"/>
    <text x="120" y="85" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">2</text>

    <!-- Nodes -->
    <circle cx="70" cy="50" r="16" fill="url(#node6Winner)" filter="url(#sh6)"/>
    <text x="70" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text>

    <circle cx="160" cy="20" r="16" fill="url(#node6Grad)" filter="url(#sh6)"/>
    <text x="160" y="25" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>

    <circle cx="250" cy="70" r="16" fill="url(#node6Grad)" filter="url(#sh6)"/>
    <text x="250" y="75" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

    <circle cx="200" cy="150" r="16" fill="url(#node6Grad)" filter="url(#sh6)"/>
    <text x="200" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>

    <circle cx="70" cy="150" r="16" fill="url(#node6Grad)" filter="url(#sh6)"/>
    <text x="70" y="155" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  </g>

  <!-- Distance Analysis Box 2 -->
  <rect x="505" y="325" width="385" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="520" y="348" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#4ade80">City 0: reachable ≤ 2 → [City 1 (2)] = 1 city → MINIMUM!</text>
  <text x="520" y="368" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">City 1: reachable ≤ 2 → [City 0, City 4] = 2 cities</text>
  <text x="520" y="388" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">City 2: reachable ≤ 2 → [City 3, City 4] = 2 cities</text>
  <text x="520" y="408" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1">City 3: reachable ≤ 2 → [City 2, City 4] = 2 cities | Output: 0</text>
</svg>
