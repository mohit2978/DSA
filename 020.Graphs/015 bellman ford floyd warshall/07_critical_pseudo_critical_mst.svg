<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad7" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeCrit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="nodePseudo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <filter id="sh7" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="560" rx="16" fill="url(#bgGrad7)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    LeetCode 1489: Critical &amp; Pseudo-Critical Edges in Minimum Spanning Tree
  </text>
  <text x="475" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Kruskal's + DSU Check: 1. Base MST wt → 2. Exclude edge (if wt &gt; base or disconnected → Critical) → 3. Force include edge (if wt == base → Pseudo-Critical)
  </text>

  <!-- Left: Original Graph with Edge Indices & Weights -->
  <rect x="40" y="85" width="360" height="445" rx="12" fill="url(#cardGrad7)" stroke="#334155" stroke-width="1.2" filter="url(#sh7)"/>
  <text x="60" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    Original Graph (n = 5, 7 Edges)
  </text>

  <!-- Graph drawing: nodes 0, 1, 2, 3, 4 -->
  <g transform="translate(60, 130)">
    <!-- Edges -->
    <!-- Edge 0: 0-1 (wt: 1) [CRITICAL] -->
    <line x1="80" y1="100" x2="160" y2="100" stroke="#f43f5e" stroke-width="3.5"/>
    <text x="120" y="92" font-family="Consolas" font-size="11" font-weight="700" fill="#f43f5e" text-anchor="middle">&lt;0, wt:1&gt;</text>

    <!-- Edge 1: 1-2 (wt: 1) [CRITICAL] -->
    <line x1="80" y1="100" x2="160" y2="20" stroke="#f43f5e" stroke-width="3.5"/>
    <text x="105" y="50" font-family="Consolas" font-size="11" font-weight="700" fill="#f43f5e">&lt;1, wt:1&gt;</text>

    <!-- Edge 2: 2-3 (wt: 2) [PSEUDO] -->
    <line x1="160" y1="20" x2="240" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="210" y="50" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">&lt;2, wt:2&gt;</text>

    <!-- Edge 3: 0-3 (wt: 2) [PSEUDO] -->
    <line x1="160" y1="100" x2="240" y2="100" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="200" y="115" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">&lt;3, wt:2&gt;</text>

    <!-- Edge 4: 0-4 (wt: 3) [PSEUDO] -->
    <line x1="160" y1="100" x2="160" y2="190" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="135" y="150" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">&lt;4, wt:3&gt;</text>

    <!-- Edge 5: 3-4 (wt: 3) [PSEUDO] -->
    <line x1="240" y1="100" x2="160" y2="190" stroke="#38bdf8" stroke-width="2.5" stroke-dasharray="4,2"/>
    <text x="215" y="155" font-family="Consolas" font-size="11" font-weight="700" fill="#38bdf8">&lt;5, wt:3&gt;</text>

    <!-- Edge 6: 1-4 (wt: 6) [REDUNDANT] -->
    <line x1="80" y1="100" x2="160" y2="190" stroke="#64748b" stroke-width="2" stroke-dasharray="2,3"/>
    <text x="95" y="160" font-family="Consolas" font-size="11" font-weight="600" fill="#64748b">&lt;6, wt:6&gt;</text>

    <!-- Nodes -->
    <circle cx="160" cy="20" r="16" fill="url(#nodePseudo)"/>
    <text x="160" y="25" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>

    <circle cx="80" cy="100" r="16" fill="url(#nodePseudo)"/>
    <text x="80" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>

    <circle cx="160" cy="100" r="16" fill="url(#nodePseudo)"/>
    <text x="160" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text>

    <circle cx="240" cy="100" r="16" fill="url(#nodePseudo)"/>
    <text x="240" y="105" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>

    <circle cx="160" cy="190" r="16" fill="url(#nodePseudo)"/>
    <text x="160" y="195" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
  </g>

  <!-- Legend / Info in left card -->
  <rect x="55" y="360" width="330" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="70" y="385" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Classification Definitions:</text>
  <text x="70" y="408" font-family="system-ui, sans-serif" font-size="11.5" fill="#f87171">
    • <tspan font-weight="700">Critical:</tspan> Present in EVERY MST. [0, 1]
  </text>
  <text x="70" y="428" font-family="system-ui, sans-serif" font-size="11.5" fill="#38bdf8">
    • <tspan font-weight="700">Pseudo-Critical:</tspan> Present in SOME MSTs. [2, 3, 4, 5]
  </text>
  <text x="70" y="448" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
    • <tspan font-weight="700">Redundant:</tspan> Never in any MST. [6]
  </text>
  <text x="70" y="475" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">
    Output: [[0, 1], [2, 3, 4, 5]]
  </text>
  <text x="70" y="495" font-family="system-ui, sans-serif" font-size="10.5" fill="#cbd5e1">
    Base MST Weight = 1 + 1 + 2 + 3 = 7
  </text>


  <!-- Right: All 4 Possible MSTs (2x2 Grid) -->
  <rect x="420" y="85" width="490" height="445" rx="12" fill="url(#cardGrad7)" stroke="#334155" stroke-width="1.2" filter="url(#sh7)"/>
  <text x="440" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4ade80">
    All 4 Possible MSTs (Each Weight = 7)
  </text>

  <!-- MST 1: Edges {0, 1, 2, 5} -->
  <g transform="translate(440, 135)">
    <rect width="225" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">MST 1: Edges {0, 1, 2, 5}</text>
    <!-- mini graph -->
    <line x1="50" y1="80" x2="110" y2="80" stroke="#f43f5e" stroke-width="2.5"/> <!-- e0 -->
    <line x1="50" y1="80" x2="110" y2="40" stroke="#f43f5e" stroke-width="2.5"/> <!-- e1 -->
    <line x1="110" y1="40" x2="170" y2="80" stroke="#38bdf8" stroke-width="2.5"/> <!-- e2 -->
    <line x1="170" y1="80" x2="110" y2="130" stroke="#38bdf8" stroke-width="2.5"/> <!-- e5 -->

    <circle cx="110" cy="40" r="10" fill="#6366f1"/><text x="110" y="44" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <circle cx="50" cy="80" r="10" fill="#6366f1"/><text x="50" y="84" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <circle cx="110" cy="80" r="10" fill="#6366f1"/><text x="110" y="84" font-size="9" fill="#fff" text-anchor="middle">0</text>
    <circle cx="170" cy="80" r="10" fill="#6366f1"/><text x="170" y="84" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <circle cx="110" cy="130" r="10" fill="#6366f1"/><text x="110" y="134" font-size="9" fill="#fff" text-anchor="middle">4</text>
    <text x="12" y="155" font-family="Consolas" font-size="10.5" fill="#4ade80">Wt: 1+1+2+3 = 7</text>
  </g>

  <!-- MST 2: Edges {0, 1, 2, 4} -->
  <g transform="translate(675, 135)">
    <rect width="220" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">MST 2: Edges {0, 1, 2, 4}</text>
    <!-- mini graph -->
    <line x1="50" y1="80" x2="110" y2="80" stroke="#f43f5e" stroke-width="2.5"/> <!-- e0 -->
    <line x1="50" y1="80" x2="110" y2="40" stroke="#f43f5e" stroke-width="2.5"/> <!-- e1 -->
    <line x1="110" y1="40" x2="170" y2="80" stroke="#38bdf8" stroke-width="2.5"/> <!-- e2 -->
    <line x1="110" y1="80" x2="110" y2="130" stroke="#38bdf8" stroke-width="2.5"/> <!-- e4 -->

    <circle cx="110" cy="40" r="10" fill="#6366f1"/><text x="110" y="44" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <circle cx="50" cy="80" r="10" fill="#6366f1"/><text x="50" y="84" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <circle cx="110" cy="80" r="10" fill="#6366f1"/><text x="110" y="84" font-size="9" fill="#fff" text-anchor="middle">0</text>
    <circle cx="170" cy="80" r="10" fill="#6366f1"/><text x="170" y="84" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <circle cx="110" cy="130" r="10" fill="#6366f1"/><text x="110" y="134" font-size="9" fill="#fff" text-anchor="middle">4</text>
    <text x="12" y="155" font-family="Consolas" font-size="10.5" fill="#4ade80">Wt: 1+1+2+3 = 7</text>
  </g>

  <!-- MST 3: Edges {0, 1, 3, 5} -->
  <g transform="translate(440, 320)">
    <rect width="225" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">MST 3: Edges {0, 1, 3, 5}</text>
    <!-- mini graph -->
    <line x1="50" y1="80" x2="110" y2="80" stroke="#f43f5e" stroke-width="2.5"/> <!-- e0 -->
    <line x1="50" y1="80" x2="110" y2="40" stroke="#f43f5e" stroke-width="2.5"/> <!-- e1 -->
    <line x1="110" y1="80" x2="170" y2="80" stroke="#38bdf8" stroke-width="2.5"/> <!-- e3 -->
    <line x1="170" y1="80" x2="110" y2="130" stroke="#38bdf8" stroke-width="2.5"/> <!-- e5 -->

    <circle cx="110" cy="40" r="10" fill="#6366f1"/><text x="110" y="44" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <circle cx="50" cy="80" r="10" fill="#6366f1"/><text x="50" y="84" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <circle cx="110" cy="80" r="10" fill="#6366f1"/><text x="110" y="84" font-size="9" fill="#fff" text-anchor="middle">0</text>
    <circle cx="170" cy="80" r="10" fill="#6366f1"/><text x="170" y="84" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <circle cx="110" cy="130" r="10" fill="#6366f1"/><text x="110" y="134" font-size="9" fill="#fff" text-anchor="middle">4</text>
    <text x="12" y="155" font-family="Consolas" font-size="10.5" fill="#4ade80">Wt: 1+1+2+3 = 7</text>
  </g>

  <!-- MST 4: Edges {0, 1, 3, 4} -->
  <g transform="translate(675, 320)">
    <rect width="220" height="170" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="12" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f8fafc">MST 4: Edges {0, 1, 3, 4}</text>
    <!-- mini graph -->
    <line x1="50" y1="80" x2="110" y2="80" stroke="#f43f5e" stroke-width="2.5"/> <!-- e0 -->
    <line x1="50" y1="80" x2="110" y2="40" stroke="#f43f5e" stroke-width="2.5"/> <!-- e1 -->
    <line x1="110" y1="80" x2="170" y2="80" stroke="#38bdf8" stroke-width="2.5"/> <!-- e3 -->
    <line x1="110" y1="80" x2="110" y2="130" stroke="#38bdf8" stroke-width="2.5"/> <!-- e4 -->

    <circle cx="110" cy="40" r="10" fill="#6366f1"/><text x="110" y="44" font-size="9" fill="#fff" text-anchor="middle">2</text>
    <circle cx="50" cy="80" r="10" fill="#6366f1"/><text x="50" y="84" font-size="9" fill="#fff" text-anchor="middle">1</text>
    <circle cx="110" cy="80" r="10" fill="#6366f1"/><text x="110" y="84" font-size="9" fill="#fff" text-anchor="middle">0</text>
    <circle cx="170" cy="80" r="10" fill="#6366f1"/><text x="170" y="84" font-size="9" fill="#fff" text-anchor="middle">3</text>
    <circle cx="110" cy="130" r="10" fill="#6366f1"/><text x="110" y="134" font-size="9" fill="#fff" text-anchor="middle">4</text>
    <text x="12" y="155" font-family="Consolas" font-size="10.5" fill="#4ade80">Wt: 1+1+2+3 = 7</text>
  </g>
</svg>
