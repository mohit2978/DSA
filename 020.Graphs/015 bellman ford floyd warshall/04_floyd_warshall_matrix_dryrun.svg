<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="kNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="srcNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="destNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <marker id="arrCyan4" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmber" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="500" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Floyd-Warshall Algorithm: All-Pairs Shortest Path (APSP) Dynamic Programming
  </text>
  <text x="475" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    State Transition: dist[i][j] = min(dist[i][j], dist[i][k] + dist[k][j]) where k is the intermediate helper node
  </text>

  <!-- Left Card: The Intermediate Node Triangle Concept -->
  <rect x="40" y="85" width="410" height="385" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.2" filter="url(#sh4)"/>
  <text x="60" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    DP Intermediate Node (k) Transition
  </text>

  <!-- Triangle Diagram -->
  <!-- Direct Edge i -> j -->
  <line x1="120" y1="240" x2="330" y2="240" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrCyan4)"/>
  <rect x="205" y="248" width="80" height="22" rx="4" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="245" y="263" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8" text-anchor="middle">direct: dist[i][j]</text>

  <!-- Edge i -> k -->
  <line x1="120" y1="240" x2="225" y2="160" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <rect x="140" y="175" width="55" height="20" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="167" y="189" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">dist[i][k]</text>

  <!-- Edge k -> j -->
  <line x1="225" y1="160" x2="330" y2="240" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrAmber)"/>
  <rect x="265" y="175" width="55" height="20" rx="4" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="292" y="189" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#f59e0b" text-anchor="middle">dist[k][j]</text>

  <!-- Nodes i, j, k -->
  <circle cx="110" cy="240" r="18" fill="url(#srcNodeGrad)" filter="url(#sh4)"/>
  <text x="110" y="245" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">i</text>
  <text x="110" y="275" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Source</text>

  <circle cx="225" cy="150" r="18" fill="url(#kNodeGrad)" filter="url(#sh4)"/>
  <text x="225" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">k</text>
  <text x="225" y="125" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#f59e0b" text-anchor="middle">Intermediate</text>

  <circle cx="340" cy="240" r="18" fill="url(#destNodeGrad)" filter="url(#sh4)"/>
  <text x="340" y="245" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">j</text>
  <text x="340" y="275" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#4ade80" text-anchor="middle">Destination</text>

  <!-- Explanation box -->
  <rect x="60" y="300" width="370" height="155" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="322" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">3 Nested Loops Structure:</text>
  <text x="75" y="342" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">for (int k = 0; k &lt; V; k++) // INTERMEDIATE</text>
  <text x="90" y="360" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">for (int i = 0; i &lt; V; i++) // SRC</text>
  <text x="105" y="378" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1">for (int j = 0; j &lt; V; j++) // DEST</text>

  <text x="75" y="405" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f59e0b">Optimization Skips:</text>
  <text x="75" y="423" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">• Skip if i == j (dist=0) or i == k or j == k</text>
  <text x="75" y="440" font-family="system-ui, sans-serif" font-size="10.5" fill="#94a3b8">• Skip if dist[i][k] == INF or dist[k][j] == INF</text>


  <!-- Right Card: Matrix Simulation & Negative Cycle Check -->
  <rect x="475" y="85" width="435" height="385" rx="12" fill="url(#cardGrad4)" stroke="#334155" stroke-width="1.2" filter="url(#sh4)"/>
  <text x="495" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4ade80">
    4×4 Distance Matrix Simulation
  </text>

  <!-- Matrix Grid -->
  <g transform="translate(510, 135)">
    <!-- Column Headers -->
    <text x="70" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">A (0)</text>
    <text x="130" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">B (1)</text>
    <text x="190" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">C (2)</text>
    <text x="250" y="18" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">D (3)</text>

    <!-- Row A -->
    <text x="25" y="48" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">A</text>
    <rect x="45" y="30" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="48" font-family="Consolas, monospace" font-size="11" fill="#4ade80" text-anchor="middle">0</text>
    <rect x="105" y="30" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="48" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">3</text>
    <rect x="165" y="30" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="190" y="48" font-family="Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">∞</text>
    <rect x="225" y="30" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="250" y="48" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">7</text>

    <!-- Row B -->
    <text x="25" y="82" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">B</text>
    <rect x="45" y="64" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="82" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">8</text>
    <rect x="105" y="64" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="82" font-family="Consolas, monospace" font-size="11" fill="#4ade80" text-anchor="middle">0</text>
    <rect x="165" y="64" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="190" y="82" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">2</text>
    <rect x="225" y="64" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="250" y="82" font-family="Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">∞</text>

    <!-- Row C -->
    <text x="25" y="116" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">C</text>
    <rect x="45" y="98" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="116" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">5</text>
    <rect x="105" y="98" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="116" font-family="Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">∞</text>
    <rect x="165" y="98" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="190" y="116" font-family="Consolas, monospace" font-size="11" fill="#4ade80" text-anchor="middle">0</text>
    <rect x="225" y="98" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="250" y="116" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">1</text>

    <!-- Row D -->
    <text x="25" y="150" font-family="Consolas, monospace" font-size="12" font-weight="700" fill="#38bdf8">D</text>
    <rect x="45" y="132" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="70" y="150" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">2</text>
    <rect x="105" y="132" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="130" y="150" font-family="Consolas, monospace" font-size="11" fill="#94a3b8" text-anchor="middle">∞</text>
    <rect x="165" y="132" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="190" y="150" font-family="Consolas, monospace" font-size="11" fill="#cbd5e1" text-anchor="middle">6</text>
    <rect x="225" y="132" width="50" height="28" fill="#1e293b" stroke="#334155"/>
    <text x="250" y="150" font-family="Consolas, monospace" font-size="11" fill="#4ade80" text-anchor="middle">0</text>
  </g>

  <!-- Bottom properties -->
  <rect x="495" y="315" width="395" height="140" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="510" y="338" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">Negative Cycle Check:</text>
  <text x="510" y="358" font-family="Consolas, monospace" font-size="11" fill="#fca5a5">if (dist[i][i] &lt; 0) -&gt; Negative cycle reachable from node i!</text>

  <text x="510" y="388" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Complexity &amp; Constraints:</text>
  <text x="510" y="408" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">Time: <tspan font-weight="700" fill="#f59e0b">O(V³)</tspan> | Space: <tspan font-weight="700" fill="#4ade80">O(1)</tspan> auxiliary (in-place matrix)</text>
  <text x="510" y="428" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Constraint Rule: Useful when V ≤ 400 (400³ ≈ 6.4 × 10⁷ ops ≤ 10⁸)</text>
</svg>
