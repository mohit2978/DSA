<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <!-- Node Gradients -->
    <linearGradient id="nodeSource" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="nodeNormal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="nodeFail" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="nodeSuccess" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f87171" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="950" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title Section -->
  <text x="475" y="42" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Why Dijkstra's Algorithm Fails with Negative Edge Weights
  </text>
  <text x="475" y="68" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Greedy assumption: Once a node is marked visited (popped from PriorityQueue), its shortest distance is finalized.
  </text>

  <!-- Left Card: Graph & Negative Edge Counterexample -->
  <rect x="40" y="95" width="410" height="350" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="95" width="410" height="38" rx="12" fill="#ef4444" fill-opacity="0.15"/>
  <text x="60" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f87171">
    Case 1: Negative Edge Weight (No Cycle)
  </text>

  <!-- Graph 1 Nodes & Edges -->
  <!-- Edge A -> B (wt: 4) -->
  <line x1="110" y1="210" x2="230" y2="160" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="155" y="165" width="30" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="170" y="179" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">4</text>

  <!-- Edge A -> C (wt: 5) -->
  <line x1="110" y1="210" x2="230" y2="280" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="155" y="245" width="30" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="170" y="259" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" text-anchor="middle">5</text>

  <!-- Edge B -> C (wt: -3) -->
  <line x1="240" y1="170" x2="240" y2="270" stroke="#f87171" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowRed)"/>
  <rect x="250" y="210" width="36" height="20" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="268" y="224" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fca5a5" text-anchor="middle">-3</text>

  <!-- Node A -->
  <circle cx="110" cy="210" r="22" fill="url(#nodeSource)" filter="url(#shadow)"/>
  <text x="110" y="216" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">A</text>
  <text x="110" y="246" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">src (0)</text>

  <!-- Node B -->
  <circle cx="240" cy="160" r="22" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="240" y="166" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>
  <text x="240" y="130" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">dist: 4</text>

  <!-- Node C -->
  <circle cx="240" cy="280" r="22" fill="url(#nodeFail)" filter="url(#shadow)"/>
  <text x="240" y="286" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>

  <!-- Breakdown Box 1 -->
  <rect x="60" y="325" width="370" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">1. Dijkstra picks B (dist 4), then C (dist 5).</text>
  <text x="75" y="370" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">2. C is marked VISITED with dist = 5 (Greedy mistake!).</text>
  <text x="75" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">3. True shortest path: A → B → C = 4 + (-3) = 1 &lt; 5.</text>
  <text x="75" y="414" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#94a3b8">Dijkstra will NOT re-update C once marked visited.</text>


  <!-- Right Card: Negative Weight Cycle -->
  <rect x="490" y="95" width="420" height="350" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="490" y="95" width="420" height="38" rx="12" fill="#ef4444" fill-opacity="0.15"/>
  <text x="510" y="120" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="700" fill="#f87171">
    Case 2: Negative Weight Cycle (Path Undefined)
  </text>

  <!-- Graph 2: Negative Cycle -->
  <!-- A -> B (wt: 2) -->
  <line x1="560" y1="210" x2="650" y2="160" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="590" y="170" width="24" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="602" y="183" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">2</text>

  <!-- B -> C (wt: 1) -->
  <line x1="665" y1="165" x2="760" y2="185" stroke="#94a3b8" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="710" y="160" width="24" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="722" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" text-anchor="middle">1</text>

  <!-- C -> D (wt: -6) -->
  <line x1="765" y1="210" x2="690" y2="270" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="735" y="238" width="30" height="18" rx="3" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
  <text x="750" y="251" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">-6</text>

  <!-- D -> B (wt: 2) -->
  <line x1="680" y1="265" x2="660" y2="175" stroke="#f87171" stroke-width="2.5" marker-end="url(#arrowRed)"/>
  <rect x="655" y="225" width="24" height="18" rx="3" fill="#1e293b" stroke="#475569" stroke-width="1"/>
  <text x="667" y="238" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">2</text>

  <!-- Nodes for Graph 2 -->
  <circle cx="550" cy="210" r="20" fill="url(#nodeSource)" filter="url(#shadow)"/>
  <text x="550" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">S</text>

  <circle cx="660" cy="160" r="20" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="660" y="165" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">B</text>

  <circle cx="770" cy="195" r="20" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="770" y="200" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">C</text>

  <circle cx="680" cy="280" r="20" fill="url(#nodeNormal)" filter="url(#shadow)"/>
  <text x="680" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">D</text>

  <circle cx="705" cy="215" r="28" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="4,4" opacity="0.8"/>
  <text x="705" y="218" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ef4444" text-anchor="middle">CYCLE: -3</text>

  <!-- Breakdown Box 2 -->
  <rect x="510" y="325" width="380" height="105" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="525" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">• Cycle B → C → D → B weight = 1 + (-6) + 2 = -3 &lt; 0.</text>
  <text x="525" y="370" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fca5a5">• Each rotation decreases total distance by 3 infinitely (→ -∞</text>
  <text x="525" y="392" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">• Bellman-Ford can DETECT this cycle in the V-th pass!</text>
  <text x="525" y="414" font-family="system-ui, sans-serif" font-size="11" font-style="italic" fill="#94a3b8">Shortest path is mathematically undefined in presence of neg cycles.</text>
</svg>
