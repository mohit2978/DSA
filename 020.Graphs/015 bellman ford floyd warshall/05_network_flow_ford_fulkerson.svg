<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>

    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="sourceNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <linearGradient id="sinkNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>

    <linearGradient id="midNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <marker id="arrCyan5" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrRed5" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrGreen5" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#4ade80" />
    </marker>

    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="950" height="520" rx="16" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="475" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Network Flow: Ford-Fulkerson &amp; Edmonds-Karp Residual Graph Concept
  </text>
  <text x="475" y="62" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Residual Graph allows pushing flow forward (c - f) and undoing flow backward (+f) along augmenting paths
  </text>

  <!-- Left Card: Flow Network & Augmenting Path -->
  <rect x="40" y="85" width="425" height="400" rx="12" fill="url(#cardGrad5)" stroke="#334155" stroke-width="1.2" filter="url(#sh5)"/>
  <text x="60" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#38bdf8">
    1. Augmenting Path &amp; Bottleneck Capacity
  </text>

  <!-- Flow Network Diagram -->
  <!-- S -> U -->
  <line x1="100" y1="210" x2="210" y2="150" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan5)"/>
  <rect x="135" y="155" width="42" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="156" y="168" font-family="Consolas" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">cap: 10</text>

  <!-- S -> V -->
  <line x1="100" y1="210" x2="210" y2="270" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrCyan5)"/>
  <rect x="135" y="245" width="42" height="18" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="156" y="258" font-family="Consolas" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">cap: 10</text>

  <!-- U -> V (cross edge) -->
  <line x1="220" y1="160" x2="220" y2="260" stroke="#f59e0b" stroke-width="2.5" marker-end="url(#arrCyan5)"/>
  <rect x="230" y="200" width="38" height="18" rx="3" fill="#0f172a" stroke="#f59e0b" stroke-width="1"/>
  <text x="249" y="213" font-family="Consolas" font-size="10.5" font-weight="700" fill="#f59e0b" text-anchor="middle">cap: 1</text>

  <!-- U -> T -->
  <line x1="230" y1="150" x2="340" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrCyan5)"/>
  <rect x="270" y="155" width="42" height="18" rx="3" fill="#0f172a" stroke="#475569" stroke-width="1"/>
  <text x="291" y="168" font-family="Consolas" font-size="10.5" font-weight="600" fill="#cbd5e1" text-anchor="middle">cap: 10</text>

  <!-- V -> T -->
  <line x1="230" y1="270" x2="340" y2="210" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrCyan5)"/>
  <rect x="270" y="245" width="42" height="18" rx="3" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
  <text x="291" y="258" font-family="Consolas" font-size="10.5" font-weight="700" fill="#38bdf8" text-anchor="middle">cap: 10</text>

  <!-- Nodes -->
  <circle cx="90" cy="210" r="18" fill="url(#sourceNodeGrad)" filter="url(#sh5)"/>
  <text x="90" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">S</text>
  <text x="90" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#38bdf8" text-anchor="middle">Source</text>

  <circle cx="220" cy="140" r="18" fill="url(#midNodeGrad)" filter="url(#sh5)"/>
  <text x="220" y="145" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">U</text>

  <circle cx="220" cy="280" r="18" fill="url(#midNodeGrad)" filter="url(#sh5)"/>
  <text x="220" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">V</text>

  <circle cx="350" cy="210" r="18" fill="url(#sinkNodeGrad)" filter="url(#sh5)"/>
  <text x="350" y="215" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">T</text>
  <text x="350" y="245" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#f43f5e" text-anchor="middle">Sink</text>

  <!-- Path step note -->
  <rect x="60" y="325" width="385" height="145" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="75" y="348" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">Path 1: S → U → V → T (Sub-optimal choice)</text>
  <text x="75" y="368" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Bottleneck Capacity Δ = min(10, 1, 10) = <tspan fill="#f59e0b" font-weight="700">1</tspan></text>
  <text x="75" y="388" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Forward edges reduced: rGraph[S][U] -= 1, rGraph[U][V] -= 1</text>
  <text x="75" y="408" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Reverse edges created: rGraph[U][S] += 1, <tspan fill="#4ade80" font-weight="700">rGraph[V][U] += 1</tspan></text>
  <text x="75" y="428" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#4ade80">Without reverse edge V→U, we would be stuck with Flow = 1!</text>


  <!-- Right Card: Why Reverse Edges Are Crucial -->
  <rect x="485" y="85" width="425" height="400" rx="12" fill="url(#cardGrad5)" stroke="#334155" stroke-width="1.2" filter="url(#sh5)"/>
  <text x="505" y="115" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#4ade80">
    2. Residual Graph &amp; Reverse Flow Redirection
  </text>

  <!-- Residual Graph 2 -->
  <g transform="translate(485, 130)">
    <!-- Node S to V path -->
    <path d="M 40 80 Q 90 140 150 140" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrGreen5)"/>
    <rect x="70" y="125" width="45" height="18" rx="3" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
    <text x="92" y="138" font-family="Consolas" font-size="10.5" font-weight="700" fill="#4ade80" text-anchor="middle">cap: 10</text>

    <!-- Reverse Edge V -> U (Residual: 1) -->
    <line x1="160" y1="130" x2="160" y2="30" stroke="#f43f5e" stroke-width="2.5" stroke-dasharray="4,4" marker-end="url(#arrRed5)"/>
    <rect x="170" y="70" width="70" height="20" rx="4" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="205" y="84" font-family="Consolas" font-size="10.5" font-weight="700" fill="#fca5a5" text-anchor="middle">rev cap: 1</text>

    <!-- U to T path -->
    <path d="M 170 20 Q 230 20 280 80" fill="none" stroke="#4ade80" stroke-width="2.5" marker-end="url(#arrGreen5)"/>
    <rect x="210" y="15" width="45" height="18" rx="3" fill="#0f172a" stroke="#4ade80" stroke-width="1"/>
    <text x="232" y="28" font-family="Consolas" font-size="10.5" font-weight="700" fill="#4ade80" text-anchor="middle">cap: 10</text>

    <!-- Nodes -->
    <circle cx="30" cy="80" r="16" fill="url(#sourceNodeGrad)"/>
    <text x="30" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">S</text>

    <circle cx="160" cy="20" r="16" fill="url(#midNodeGrad)"/>
    <text x="160" y="24" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">U</text>

    <circle cx="160" cy="140" r="16" fill="url(#midNodeGrad)"/>
    <text x="160" y="144" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">V</text>

    <circle cx="290" cy="80" r="16" fill="url(#sinkNodeGrad)"/>
    <text x="290" y="84" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">T</text>
  </g>

  <!-- Explanation box -->
  <rect x="505" y="310" width="385" height="160" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="520" y="332" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#4ade80">Path 2 Uses Reverse Edge: S → V → U → T</text>
  <text x="520" y="352" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Bottleneck Δ = min(10, 1, 10) = 1 additional unit.</text>
  <text x="520" y="372" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Flow cancels along U → V (net flow on U → V becomes 0).</text>
  <text x="520" y="392" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8">• Total Max Flow achieved = 1 + 1 = 2 (Optimal!)</text>

  <text x="520" y="420" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#f59e0b">Algorithm Complexity:</text>
  <text x="520" y="440" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Ford-Fulkerson (DFS): <tspan font-family="Consolas" fill="#f59e0b">O(E × MaxFlow)</tspan></text>
  <text x="520" y="458" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">• Edmonds-Karp (BFS): <tspan font-family="Consolas" fill="#4ade80">O(V × E²)</tspan> (independent of flow value!)</text>
</svg>
