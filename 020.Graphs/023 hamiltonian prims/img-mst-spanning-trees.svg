<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="780" height="380" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">MST (Minimum Spanning Tree) <tspan fill="#9aa0a6" font-weight="normal">— a graph can have many spanning trees, only the cheapest is the MST</tspan></text>
  <line x1="25" y1="38" x2="755" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- definition -->
  <rect x="25" y="48" width="730" height="78" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="72" fill="#d4d4d4" font-size="13"><tspan fill="#f2c14e" font-weight="bold">1.</tspan> A subset of the graph which has <tspan fill="#56c98d">all the vertices</tspan> but <tspan fill="#e06c75">not all the edges</tspan>.</text>
  <text x="40" y="94" fill="#d4d4d4" font-size="13"><tspan fill="#f2c14e" font-weight="bold">2.</tspan> It must be <tspan fill="#56c98d">connected</tspan> and <tspan fill="#56c98d">acyclic</tspan>.</text>
  <text x="40" y="116" fill="#9aa0a6" font-size="12.5">"Spanning" = connects all vertices &#160;&#183;&#160; "Tree" = acyclic &#160;&#183;&#160; so it always has exactly V &#8722; 1 edges.</text>

  <!-- Graph -->
  <rect x="25" y="140" width="235" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="162" fill="#f2c14e" font-size="13" font-weight="bold">The Graph</text>
  <g stroke="#9ecbf0" stroke-width="2">
    <line x1="65"  y1="192" x2="130" y2="192"/>
    <line x1="65"  y1="192" x2="65"  y2="268"/>
    <line x1="65"  y1="268" x2="130" y2="268"/>
    <line x1="130" y1="192" x2="130" y2="268"/>
    <line x1="130" y1="192" x2="185" y2="185"/>
    <line x1="185" y1="185" x2="185" y2="268"/>
    <line x1="185" y1="185" x2="238" y2="268"/>
    <line x1="185" y1="268" x2="238" y2="268"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="12">
    <circle cx="65"  cy="192" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="65"  y="196">0</text>
    <circle cx="130" cy="192" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="130" y="196">3</text>
    <circle cx="185" cy="185" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="185" y="189">4</text>
    <circle cx="65"  cy="268" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="65"  y="272">1</text>
    <circle cx="130" cy="268" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="130" y="272">2</text>
    <circle cx="185" cy="268" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="185" y="272">5</text>
    <circle cx="238" cy="268" r="13" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/><text x="238" y="272">6</text>
  </g>
  <text x="40" y="308" fill="#9aa0a6" font-size="11.5">7 vertices, 8 edges &#8212; there is a cycle</text>

  <!-- Spanning tree 1 -->
  <rect x="275" y="140" width="235" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="290" y="162" fill="#56c98d" font-size="13" font-weight="bold">Spanning tree #1</text>
  <g stroke="#56c98d" stroke-width="2">
    <line x1="315" y1="192" x2="315" y2="268"/>
    <line x1="315" y1="268" x2="380" y2="268"/>
    <line x1="380" y1="192" x2="380" y2="268"/>
    <line x1="380" y1="192" x2="435" y2="185"/>
    <line x1="435" y1="185" x2="435" y2="268"/>
    <line x1="435" y1="268" x2="488" y2="268"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="12">
    <circle cx="315" cy="192" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="315" y="196">0</text>
    <circle cx="380" cy="192" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="380" y="196">3</text>
    <circle cx="435" cy="185" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="435" y="189">4</text>
    <circle cx="315" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="315" y="272">1</text>
    <circle cx="380" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="380" y="272">2</text>
    <circle cx="435" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="435" y="272">5</text>
    <circle cx="488" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="488" y="272">6</text>
  </g>
  <text x="290" y="308" fill="#9aa0a6" font-size="11.5">7 vertices, 6 edges, no cycle &#10004;</text>

  <!-- Spanning tree 2 -->
  <rect x="525" y="140" width="230" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="540" y="162" fill="#56c98d" font-size="13" font-weight="bold">Spanning tree #2</text>
  <g stroke="#56c98d" stroke-width="2">
    <line x1="565" y1="192" x2="630" y2="192"/>
    <line x1="565" y1="268" x2="630" y2="268"/>
    <line x1="630" y1="192" x2="630" y2="268"/>
    <line x1="630" y1="192" x2="685" y2="185"/>
    <line x1="685" y1="185" x2="685" y2="268"/>
    <line x1="685" y1="268" x2="738" y2="268"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="12">
    <circle cx="565" cy="192" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="565" y="196">0</text>
    <circle cx="630" cy="192" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="630" y="196">3</text>
    <circle cx="685" cy="185" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="685" y="189">4</text>
    <circle cx="565" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="565" y="272">1</text>
    <circle cx="630" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="630" y="272">2</text>
    <circle cx="685" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="685" y="272">5</text>
    <circle cx="738" cy="268" r="13" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/><text x="738" y="272">6</text>
  </g>
  <text x="540" y="308" fill="#9aa0a6" font-size="11.5">Also 7 vertices, 6 edges, no cycle &#10004;</text>

  <rect x="25" y="332" width="730" height="36" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="356" fill="#d4d4d4" font-size="13">Both are spanning trees of the graph. The one whose <tspan fill="#f2c14e" font-weight="bold">sum of edge weights is the least</tspan> among all spanning trees is the <tspan fill="#56c98d" font-weight="bold">Minimum Spanning Tree</tspan>.</text>
</svg>
