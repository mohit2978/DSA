<svg viewBox="0 0 800 470" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="470" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Iterative DFS dry run <tspan fill="#9aa0a6" font-weight="normal">— BFS with a Stack instead of a Queue; src = 0</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Graph -->
  <rect x="25" y="48" width="250" height="215" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">The graph (7 vertices)</text>

  <g stroke="#9ecbf0" stroke-width="2">
    <line x1="70"  y1="110" x2="145" y2="110"/>   <!-- 0-3 -->
    <line x1="70"  y1="110" x2="70"  y2="195"/>   <!-- 0-1 -->
    <line x1="70"  y1="195" x2="145" y2="195"/>   <!-- 1-2 -->
    <line x1="145" y1="110" x2="145" y2="195"/>   <!-- 3-2 -->
    <line x1="145" y1="110" x2="205" y2="102"/>   <!-- 3-4 -->
    <line x1="205" y1="102" x2="205" y2="195"/>   <!-- 4-5 -->
    <line x1="205" y1="102" x2="252" y2="195"/>   <!-- 4-6 -->
    <line x1="205" y1="195" x2="252" y2="195"/>   <!-- 5-6 -->
  </g>
  <g>
    <circle cx="70"  cy="110" r="15" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
    <circle cx="145" cy="110" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="205" cy="102" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="70"  cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="145" cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="205" cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="252" cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="13">
    <text x="70"  y="115">0</text>
    <text x="145" y="115">3</text>
    <text x="205" y="107">4</text>
    <text x="70"  y="200">1</text>
    <text x="145" y="200">2</text>
    <text x="205" y="200">5</text>
    <text x="252" y="200">6</text>
  </g>
  <text x="40" y="232" fill="#9aa0a6" font-size="11">0&#8211;1, 0&#8211;3, 1&#8211;2, 2&#8211;3, 3&#8211;4, 4&#8211;5, 4&#8211;6, 5&#8211;6</text>
  <text x="40" y="252" fill="#9aa0a6" font-size="11">Pair holds (v, path)</text>

  <!-- Trace -->
  <rect x="290" y="48" width="485" height="215" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="305" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Stack trace &#8212; addFirst / removeFirst</text>
  <line x1="305" y1="80" x2="760" y2="80" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" font-size="12">
    <text x="305" y="100" fill="#d4d4d4">push (0,"0")             stack: [ (0,0) ]</text>
    <text x="305" y="122" fill="#56c98d">pop (0,"0")   print 0@0  push (1,01) (3,03)</text>
    <text x="305" y="144" fill="#56c98d">pop (3,"03")  print 3@03 push (2,032) (4,034)</text>
    <text x="305" y="166" fill="#56c98d">pop (4,"034") print 4@034 push (5,0345)(6,0346)</text>
    <text x="305" y="188" fill="#56c98d">pop (6,"0346")print 6@0346 push (5,03465)</text>
    <text x="305" y="210" fill="#56c98d">pop (5,"03465")print 5@03465</text>
    <text x="305" y="232" fill="#e06c75">pop (5,"0345") 5 already visited &#8594; continue</text>
    <text x="305" y="254" fill="#56c98d">pop (2,"032") print 2@032 &#8594; then 1@0321</text>
  </g>

  <!-- Output -->
  <rect x="25" y="277" width="360" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="301" fill="#f2c14e" font-size="13.5" font-weight="bold">Printed output (in order)</text>
  <g font-family="monospace" font-size="14" fill="#56c98d">
    <text x="45" y="327">0@0</text>
    <text x="45" y="349">3@03</text>
    <text x="45" y="371">4@034</text>
    <text x="45" y="393">6@0346</text>
    <text x="45" y="415">5@03465</text>
    <text x="200" y="327">2@032</text>
    <text x="200" y="349">1@0321</text>
  </g>
  <text x="40" y="443" fill="#9aa0a6" font-size="12">1@01 is never printed &#8212; 1 was already visited via 0&#8594;3&#8594;2&#8594;1.</text>

  <!-- Why iterative -->
  <rect x="400" y="277" width="375" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="415" y="301" fill="#f2c14e" font-size="13.5" font-weight="bold">Why iterative at all?</text>
  <text x="415" y="325" fill="#d4d4d4" font-size="12.5">Java's call stack holds roughly 10,000 frames.</text>
  <text x="415" y="345" fill="#d4d4d4" font-size="12.5">If the recursion depth crosses that, you get a</text>
  <text x="415" y="365" fill="#e06c75" font-size="12.5" font-weight="bold">StackOverflowError.</text>
  <text x="415" y="391" fill="#d4d4d4" font-size="12.5">An explicit Stack lives on the <tspan fill="#56c98d" font-weight="bold">heap</tspan>, which has</text>
  <text x="415" y="411" fill="#d4d4d4" font-size="12.5">no such limit &#8212; so iterative is safer.</text>
  <text x="415" y="437" fill="#9aa0a6" font-size="12">Same applies in DP: if a memoised solution overflows,</text>
  <text x="415" y="453" fill="#9aa0a6" font-size="12">rewrite it iteratively (tabulation).</text>
</svg>
