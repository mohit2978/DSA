<svg viewBox="0 0 800 520" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="520" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Hamiltonian dry run <tspan fill="#9aa0a6" font-weight="normal">— src = 0, each node is (vertex, path so far)</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Graph -->
  <rect x="25" y="48" width="250" height="215" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">The graph (7 vertices)</text>

  <g stroke="#9ecbf0" stroke-width="2">
    <line x1="70"  y1="110" x2="140" y2="110"/>   <!-- 0-6 -->
    <line x1="70"  y1="110" x2="70"  y2="195"/>   <!-- 0-1 -->
    <line x1="70"  y1="195" x2="140" y2="195"/>   <!-- 1-2 -->
    <line x1="140" y1="110" x2="140" y2="195"/>   <!-- 6-2 -->
    <line x1="140" y1="110" x2="205" y2="102"/>   <!-- 6-5 -->
    <line x1="205" y1="102" x2="205" y2="195"/>   <!-- 5-3 -->
    <line x1="140" y1="195" x2="205" y2="195"/>   <!-- 2-3 -->
    <line x1="205" y1="102" x2="252" y2="195"/>   <!-- 5-4 -->
    <line x1="205" y1="195" x2="252" y2="195"/>   <!-- 3-4 -->
  </g>
  <g>
    <circle cx="70"  cy="110" r="15" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
    <circle cx="140" cy="110" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="205" cy="102" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="70"  cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="140" cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="205" cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="252" cy="195" r="15" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="13">
    <text x="70"  y="115">0</text>
    <text x="140" y="115">6</text>
    <text x="205" y="107">5</text>
    <text x="70"  y="200">1</text>
    <text x="140" y="200">2</text>
    <text x="205" y="200">3</text>
    <text x="252" y="200">4</text>
  </g>
  <text x="40" y="232" fill="#9aa0a6" font-size="11">0&#8211;1, 0&#8211;6, 1&#8211;2, 2&#8211;6, 2&#8211;3, 3&#8211;5, 3&#8211;4, 5&#8211;6, 4&#8211;5</text>
  <text x="40" y="252" fill="#9aa0a6" font-size="11">graph.length = 7, so csf must reach 7</text>

  <!-- Recursion tree -->
  <rect x="290" y="48" width="485" height="330" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="305" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Recursion tree (only src + path shown)</text>

  <g stroke="#5b7a8c" stroke-width="1.5" fill="none">
    <path d="M 380 92 L 350 122"/>
    <path d="M 420 92 L 640 122"/>
    <path d="M 350 144 L 350 172"/>
    <path d="M 350 194 L 350 222"/>
    <path d="M 380 194 L 560 222"/>
    <path d="M 350 244 L 350 272"/>
    <path d="M 385 244 L 500 272"/>
    <path d="M 350 294 L 350 322"/>
    <path d="M 500 294 L 470 322"/>
    <path d="M 530 294 L 620 322"/>
  </g>

  <g font-family="monospace" font-size="12.5">
    <rect x="355" y="78" width="90" height="22" rx="11" fill="#3a331f" stroke="#f2c14e" stroke-width="1.5"/>
    <text x="400" y="94" fill="#f0f0f0" text-anchor="middle">0, "0"</text>

    <rect x="305" y="128" width="95" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="352" y="144" fill="#d4d4d4" text-anchor="middle">1, "01"</text>

    <rect x="600" y="128" width="95" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="647" y="144" fill="#d4d4d4" text-anchor="middle">6, "06"</text>

    <rect x="300" y="178" width="105" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="352" y="194" fill="#d4d4d4" text-anchor="middle">2, "012"</text>

    <rect x="530" y="228" width="115" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="587" y="244" fill="#d4d4d4" text-anchor="middle">6, "0126"</text>

    <rect x="295" y="228" width="115" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="352" y="244" fill="#d4d4d4" text-anchor="middle">3, "0123"</text>

    <rect x="290" y="278" width="125" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="352" y="294" fill="#d4d4d4" text-anchor="middle">4, "01234"</text>

    <rect x="450" y="278" width="125" height="22" rx="11" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="1.5"/>
    <text x="512" y="294" fill="#d4d4d4" text-anchor="middle">5, "01235"</text>

    <rect x="285" y="328" width="140" height="22" rx="11" fill="#1f3a2a" stroke="#56c98d" stroke-width="2"/>
    <text x="355" y="344" fill="#d4d4d4" text-anchor="middle">5, "012345"</text>

    <rect x="405" y="328" width="140" height="22" rx="11" fill="#3a2323" stroke="#e06c75" stroke-width="1.5"/>
    <text x="475" y="344" fill="#d4d4d4" text-anchor="middle">4, "012354"</text>

    <rect x="560" y="328" width="140" height="22" rx="11" fill="#3a2323" stroke="#e06c75" stroke-width="1.5"/>
    <text x="630" y="344" fill="#d4d4d4" text-anchor="middle">6, "012356"</text>
  </g>

  <text x="305" y="368" fill="#9aa0a6" font-size="11.5"><tspan fill="#56c98d">green</tspan> = continues to csf 7 &#160;&#160; <tspan fill="#e06c75">red</tspan> = dead end, all neighbours already visited (csf = 6 &#8800; 7)</text>

  <!-- Bottom results -->
  <rect x="25" y="392" width="750" height="112" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="416" fill="#f2c14e" font-size="13.5" font-weight="bold">What happens at csf == 7</text>
  <text x="40" y="440" fill="#d4d4d4" font-size="13">From <tspan font-family="monospace">5, "012345"</tspan> we go to 6 &#8594; path is <tspan font-family="monospace" fill="#56c98d">"0123456"</tspan>, csf = 7.</text>
  <text x="40" y="462" fill="#d4d4d4" font-size="13">6 is connected back to the origin 0, so it prints <tspan font-family="monospace" fill="#56c98d">0123456*</tspan> &#8212; a Hamiltonian <tspan font-weight="bold">cycle</tspan>.</text>
  <text x="40" y="488" fill="#9aa0a6" font-size="12.5">If the last vertex had NO edge back to the origin, it would print <tspan font-family="monospace">path + "."</tspan> instead &#8212; only a Hamiltonian path.</text>
</svg>
