<svg viewBox="0 0 560 320" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="560" height="320" fill="#1e1e1e"/>
  <text x="20" y="26" fill="#d4d4d4" font-size="15">DFS-based Topo Sort dry run — 0-&gt;1, 0-&gt;2, 1-&gt;3, 2-&gt;4, 3-&gt;5, 4-&gt;6, 5-&gt;6</text>

  <circle cx="280" cy="70" r="26" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="150" cy="150" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="410" cy="150" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="150" cy="230" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="410" cy="230" r="26" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
  <circle cx="280" cy="290" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="3"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="17">
    <text x="280" y="77">0</text>
    <text x="150" y="157">1</text>
    <text x="410" y="157">2</text>
    <text x="150" y="237">3</text>
    <text x="410" y="237">4</text>
    <text x="280" y="297">6</text>
  </g>
  <text x="150" y="200" fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="17">5</text>
  <circle cx="150" cy="193" r="0" fill="none"/>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9ecbf0"/></marker>
  </defs>
  <g stroke="#9ecbf0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M 262 90 L 168 130"/>   <!-- 0->1 -->
    <path d="M 298 90 L 392 130"/>   <!-- 0->2 -->
    <path d="M 150 176 L 150 204"/>  <!-- 1->3 -->
    <path d="M 410 176 L 410 204"/>  <!-- 2->4 -->
    <path d="M 165 250 L 262 282"/>  <!-- 3->5(->6, simplified straight to 6) -->
    <path d="M 395 250 L 298 282"/>  <!-- 4->6 -->
  </g>
  <text x="150" y="230" fill="#9aa0a6" font-size="12" text-anchor="middle"></text>

  <text x="20" y="230" fill="#9aa0a6" font-size="12">(node 5 sits between 3 and 6 on that path: 3&#8594;5&#8594;6)</text>

  <text x="20" y="315" fill="#56c98d" font-size="13">Post-order push: 5,6,3,4,2,1,0 &#8594; stack (top&#8594;bottom) &#8594; popped order (final topo sort): 0,2,4,1,3,5,6</text>
</svg>
