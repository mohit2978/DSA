<svg viewBox="0 0 460 380" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="460" height="380" fill="#1e1e1e"/>
  <text x="20" y="26" fill="#d4d4d4" font-size="15">Topological Sort intro example — multiple valid orderings exist</text>

  <circle cx="230" cy="60" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
  <circle cx="120" cy="150" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
  <circle cx="340" cy="150" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
  <circle cx="120" cy="250" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
  <circle cx="340" cy="250" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>
  <circle cx="230" cy="330" r="26" fill="#2b2b2b" stroke="#56c98d" stroke-width="2"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="17">
    <text x="230" y="67">1</text>
    <text x="120" y="157">2</text>
    <text x="340" y="157">3</text>
    <text x="120" y="257">4</text>
    <text x="340" y="257">5</text>
    <text x="230" y="337">6</text>
  </g>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#9ecbf0"/></marker>
  </defs>
  <g stroke="#9ecbf0" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M 213 82 L 137 129"/>   <!-- 1->2 -->
    <path d="M 247 82 L 323 129"/>   <!-- 1->3 -->
    <path d="M 120 176 L 120 224"/>  <!-- 2->4 -->
    <path d="M 320 168 L 145 228"/>  <!-- 3->4 (cross) -->
    <path d="M 340 176 L 340 224"/>  <!-- 3->5 -->
    <path d="M 145 268 L 208 320"/>  <!-- 4->6 -->
    <path d="M 320 268 L 252 320"/>  <!-- 5->6 -->
  </g>

  <text x="20" y="365" fill="#9aa0a6" font-size="13">Valid orders: 1,2,3,4,5,6  or  1,3,5,2,4,6  or  1,2,3,5,4,6 &#8212; more than 1 topo sort is possible.</text>
</svg>
