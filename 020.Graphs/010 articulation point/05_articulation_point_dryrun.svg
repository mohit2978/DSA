<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeBlue5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="nodeAP5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="sh5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="540" rx="16" fill="url(#bgGrad5)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Dry Run: Articulation Points (Bowtie Graph with Cut Vertex)
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Graph with 5 vertices (0-1-2-0 and 2-3-4-2). Node 2 is the Articulation Point (AP).
  </text>

  <!-- Left: Visual Graph Diagram -->
  <g transform="translate(35, 85)" filter="url(#sh5)">
    <rect width="400" height="420" rx="12" fill="url(#cardGrad5)" stroke="#ef4444" stroke-width="1.5"/>
    
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f87171">
      Bowtie Graph &amp; Traversal Structure
    </text>

    <!-- Triangle 1 (0, 1, 2) -->
    <!-- Tree 0 -> 1 -->
    <line x1="80" y1="150" x2="80" y2="280" stroke="#38bdf8" stroke-width="3"/>
    <!-- Tree 1 -> 2 -->
    <line x1="80" y1="280" x2="200" y2="215" stroke="#38bdf8" stroke-width="3"/>
    <!-- Back-edge 2 -> 0 -->
    <line x1="200" y1="215" x2="80" y2="150" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>

    <!-- Triangle 2 (2, 3, 4) -->
    <!-- Tree 2 -> 3 -->
    <line x1="200" y1="215" x2="320" y2="150" stroke="#38bdf8" stroke-width="3"/>
    <!-- Tree 3 -> 4 -->
    <line x1="320" y1="150" x2="320" y2="280" stroke="#38bdf8" stroke-width="3"/>
    <!-- Back-edge 4 -> 2 -->
    <line x1="320" y1="280" x2="200" y2="215" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>

    <!-- Nodes -->
    <!-- Node 0 -->
    <circle cx="80" cy="150" r="20" fill="url(#nodeBlue5)" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
    <text x="35" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">d=1, l=1</text>

    <!-- Node 1 -->
    <circle cx="80" cy="280" r="20" fill="url(#nodeBlue5)" stroke="#60a5fa" stroke-width="2"/>
    <text x="80" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="35" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">d=2, l=1</text>

    <!-- Cut Vertex Node 2 -->
    <circle cx="200" cy="215" r="24" fill="url(#nodeAP5)" stroke="#fca5a5" stroke-width="3"/>
    <text x="200" y="221" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="160" y="165" width="80" height="20" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="200" y="179" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#fca5a5" text-anchor="middle">AP (d=3, l=1)</text>

    <!-- Node 3 -->
    <circle cx="320" cy="150" r="20" fill="url(#nodeBlue5)" stroke="#60a5fa" stroke-width="2"/>
    <text x="320" y="155" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="365" y="140" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">d=4, l=3</text>

    <!-- Node 4 -->
    <circle cx="320" cy="280" r="20" fill="url(#nodeBlue5)" stroke="#60a5fa" stroke-width="2"/>
    <text x="320" y="285" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
    <text x="365" y="295" font-family="system-ui, sans-serif" font-size="10" fill="#93c5fd">d=5, l=3</text>

    <!-- Explanatory note -->
    <rect x="20" y="340" width="360" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="200" y="360" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      When DFS returns from child <tspan fill="#38bdf8" font-weight="700">3</tspan> to <tspan fill="#f87171" font-weight="700">2</tspan>:
    </text>
    <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#fca5a5" text-anchor="middle">
      low[3] (3) &gt;= disc[2] (3)  ===>  NODE 2 IS AN AP!
    </text>
  </g>

  <!-- Right: Step-by-Step Table -->
  <g transform="translate(460, 85)" filter="url(#sh5)">
    <rect width="485" height="420" rx="12" fill="url(#cardGrad5)" stroke="#38bdf8" stroke-width="1.5"/>
    
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      State Matrix &amp; Evaluation Log
    </text>

    <!-- Header -->
    <rect x="15" y="45" width="455" height="26" rx="4" fill="#0c4a6e"/>
    <text x="25" y="62" font-family="monospace" font-size="10" font-weight="700" fill="#e0f2fe">Step</text>
    <text x="60" y="62" font-family="monospace" font-size="10" font-weight="700" fill="#e0f2fe">Action</text>
    <text x="160" y="62" font-family="monospace" font-size="10" font-weight="700" fill="#e0f2fe">disc[]</text>
    <text x="235" y="62" font-family="monospace" font-size="10" font-weight="700" fill="#e0f2fe">low[]</text>
    <text x="310" y="62" font-family="monospace" font-size="10" font-weight="700" fill="#e0f2fe">Evaluation</text>

    <!-- Rows -->
    <rect x="15" y="75" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="94" font-family="monospace" font-size="10" fill="#94a3b8">1</text>
    <text x="60" y="94" font-family="monospace" font-size="10" fill="#38bdf8">DFS(0, -1)</text>
    <text x="160" y="94" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,-,-,-,-]</text>
    <text x="235" y="94" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,-,-,-,-]</text>
    <text x="310" y="94" font-family="monospace" font-size="9.5" fill="#94a3b8">t=1, child_0=1</text>

    <rect x="15" y="108" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="127" font-family="monospace" font-size="10" fill="#94a3b8">2</text>
    <text x="60" y="127" font-family="monospace" font-size="10" fill="#38bdf8">DFS(1, 0)</text>
    <text x="160" y="127" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,-,-,-]</text>
    <text x="235" y="127" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,-,-,-]</text>
    <text x="310" y="127" font-family="monospace" font-size="9.5" fill="#94a3b8">t=2, child_1=1</text>

    <rect x="15" y="141" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="160" font-family="monospace" font-size="10" fill="#94a3b8">3</text>
    <text x="60" y="160" font-family="monospace" font-size="10" fill="#38bdf8">DFS(2, 1)</text>
    <text x="160" y="160" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,-,-]</text>
    <text x="235" y="160" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,-,-]</text>
    <text x="310" y="160" font-family="monospace" font-size="9.5" fill="#94a3b8">t=3, child_2=1</text>

    <rect x="15" y="174" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="193" font-family="monospace" font-size="10" fill="#94a3b8">4</text>
    <text x="60" y="193" font-family="monospace" font-size="10" fill="#fbbf24">Back (2,0)</text>
    <text x="160" y="193" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,-,-]</text>
    <text x="235" y="193" font-family="monospace" font-size="9.5" fill="#fbbf24">[1,2,1,-,-]</text>
    <text x="310" y="193" font-family="monospace" font-size="9.5" fill="#fbbf24">low[2]=min(3,disc[0])=1</text>

    <rect x="15" y="207" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="226" font-family="monospace" font-size="10" fill="#94a3b8">5</text>
    <text x="60" y="226" font-family="monospace" font-size="10" fill="#38bdf8">DFS(3, 2)</text>
    <text x="160" y="226" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,4,-]</text>
    <text x="235" y="226" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,1,4,-]</text>
    <text x="310" y="226" font-family="monospace" font-size="9.5" fill="#94a3b8">t=4, child_3=1</text>

    <rect x="15" y="240" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="259" font-family="monospace" font-size="10" fill="#94a3b8">6</text>
    <text x="60" y="259" font-family="monospace" font-size="10" fill="#38bdf8">DFS(4, 3)</text>
    <text x="160" y="259" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,4,5]</text>
    <text x="235" y="259" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,1,4,5]</text>
    <text x="310" y="259" font-family="monospace" font-size="9.5" fill="#94a3b8">t=5, Back (4,2)</text>

    <rect x="15" y="273" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="292" font-family="monospace" font-size="10" fill="#94a3b8">7</text>
    <text x="60" y="292" font-family="monospace" font-size="10" fill="#fbbf24">Back (4,2)</text>
    <text x="160" y="292" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,4,5]</text>
    <text x="235" y="292" font-family="monospace" font-size="9.5" fill="#fbbf24">[1,2,1,4,3]</text>
    <text x="310" y="292" font-family="monospace" font-size="9.5" fill="#fbbf24">low[4]=min(5,disc[2])=3</text>

    <rect x="15" y="306" width="455" height="30" rx="3" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="325" font-family="monospace" font-size="10" fill="#94a3b8">8</text>
    <text x="60" y="325" font-family="monospace" font-size="10" fill="#a78bfa">Ret to 3</text>
    <text x="160" y="325" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,4,5]</text>
    <text x="235" y="325" font-family="monospace" font-size="9.5" fill="#a78bfa">[1,2,1,3,3]</text>
    <text x="310" y="325" font-family="monospace" font-size="9.5" fill="#94a3b8">low[3]=min(4,low[4])=3</text>

    <!-- Highlight AP found -->
    <rect x="15" y="339" width="455" height="32" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="360" font-family="monospace" font-size="10" font-weight="700" fill="#fca5a5">9</text>
    <text x="60" y="360" font-family="monospace" font-size="10" font-weight="700" fill="#f87171">Ret to 2</text>
    <text x="160" y="360" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,3,4,5]</text>
    <text x="235" y="360" font-family="monospace" font-size="9.5" fill="#cbd5e1">[1,2,1,3,3]</text>
    <text x="310" y="360" font-family="monospace" font-size="9.5" font-weight="700" fill="#ef4444">low[3](3) &gt;= disc[2](3) -> AP=2</text>

    <rect x="15" y="375" width="455" height="30" rx="4" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="242" y="394" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      Final Articulation Points: [2]
    </text>
  </g>
</svg>
