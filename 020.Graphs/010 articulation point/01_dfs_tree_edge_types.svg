<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>

    <linearGradient id="rootGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <marker id="arrCyan1" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrAmber1" viewBox="0 0 10 10" refX="22" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>

    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad1)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="36" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    DFS Tree Structure: Tree Edges vs. Back Edges
  </text>
  <text x="480" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    In an Undirected Graph, DFS traversal decomposes edges into Tree Edges (spanning) and Back Edges (cycles)
  </text>

  <!-- Left Card: Graph Decomposition Diagram -->
  <g transform="translate(35, 80)" filter="url(#sh1)">
    <rect width="430" height="360" rx="12" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      DFS Tree Layout
    </text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      Solid blue: Tree Edges | Dashed orange: Back Edges (Cycles)
    </text>

    <!-- Visual DFS Tree -->
    <g transform="translate(215, 80)">
      <!-- Tree Edges (Solid) -->
      <!-- 0 -> 1 -->
      <line x1="0" y1="0" x2="-80" y2="70" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrCyan1)"/>
      <text x="-55" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Tree</text>

      <!-- 1 -> 2 -->
      <line x1="-80" y1="70" x2="-80" y2="150" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrCyan1)"/>
      <text x="-95" y="115" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Tree</text>

      <!-- 0 -> 3 -->
      <line x1="0" y1="0" x2="80" y2="70" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrCyan1)"/>
      <text x="55" y="30" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Tree</text>

      <!-- 3 -> 4 -->
      <line x1="80" y1="70" x2="80" y2="150" stroke="#38bdf8" stroke-width="3" marker-end="url(#arrCyan1)"/>
      <text x="95" y="115" font-family="sans-serif" font-size="10" font-weight="700" fill="#38bdf8">Tree</text>

      <!-- Back Edge (Dashed): 2 -> 0 -->
      <path d="M -80 150 C -150 120, -130 20, 0 0" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrAmber1)"/>
      <text x="-140" y="75" font-family="sans-serif" font-size="10" font-weight="700" fill="#f59e0b">Back Edge (2→0)</text>

      <!-- Nodes -->
      <circle cx="0" cy="0" r="18" fill="url(#rootGrad1)" stroke="#60a5fa" stroke-width="2"/>
      <text x="0" y="5" font-family="sans-serif" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">0</text>
      <text x="0" y="-24" font-family="sans-serif" font-size="10" font-weight="700" fill="#60a5fa" text-anchor="middle">Root</text>

      <circle cx="-80" cy="70" r="16" fill="url(#nodeGrad1)"/>
      <text x="-80" y="74" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">1</text>

      <circle cx="-80" cy="150" r="16" fill="url(#nodeGrad1)"/>
      <text x="-80" y="154" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">2</text>

      <circle cx="80" cy="70" r="16" fill="url(#nodeGrad1)"/>
      <text x="80" y="74" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">3</text>

      <circle cx="80" cy="150" r="16" fill="url(#nodeGrad1)"/>
      <text x="80" y="154" font-family="sans-serif" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">4</text>
    </g>

    <!-- Bottom Status -->
    <rect x="20" y="295" width="390" height="45" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="215" y="315" font-family="system-ui" font-size="11" fill="#cbd5e1" text-anchor="middle">
      Tree edge introduces new node (descendant)
    </text>
    <text x="215" y="330" font-family="system-ui" font-size="11" fill="#f59e0b" font-weight="700" text-anchor="middle">
      Back edge connects descendant back to ancestor (Cycle)
    </text>
  </g>

  <!-- Right Card: The 3 Edge Types & Handling Rules -->
  <g transform="translate(495, 80)" filter="url(#sh1)">
    <rect width="430" height="360" rx="12" fill="url(#cardGrad1)" stroke="#334155" stroke-width="1.5"/>
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#34d399">
      The 3 Edge Types in Undirected DFS
    </text>
    <text x="20" y="48" font-family="system-ui, sans-serif" font-size="11.5" fill="#94a3b8">
      Exact handling logic inside the neighbor iteration loop
    </text>

    <!-- Type 1: Parent Edge -->
    <g transform="translate(20, 65)">
      <rect width="390" height="75" rx="8" fill="#0f172a" stroke="#475569"/>
      <text x="15" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#94a3b8">1. Parent Edge (`v == p`)</text>
      <text x="15" y="42" font-family="system-ui" font-size="11" fill="#cbd5e1">• The edge you just crossed to enter node u.</text>
      <text x="15" y="60" font-family="Consolas" font-size="11" font-weight="700" fill="#f87171">Action: continue; (Strictly IGNORE)</text>
    </g>

    <!-- Type 2: Tree Edge -->
    <g transform="translate(20, 150)">
      <rect width="390" height="85" rx="8" fill="#0f172a" stroke="#0284c7"/>
      <text x="15" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#38bdf8">2. Tree Edge (`!visited[v]` / `disc[v] == -1`)</text>
      <text x="15" y="42" font-family="system-ui" font-size="11" fill="#cbd5e1">• Unvisited neighbor. We discover v from u.</text>
      <text x="15" y="58" font-family="Consolas" font-size="10.5" fill="#a5f3fc">dfs(v, u); low[u] = min(low[u], low[v]);</text>
      <text x="15" y="74" font-family="system-ui" font-size="10" fill="#94a3b8">Inherits child's best reachability (`low[v]`)</text>
    </g>

    <!-- Type 3: Back Edge -->
    <g transform="translate(20, 245)">
      <rect width="390" height="85" rx="8" fill="#0f172a" stroke="#d97706"/>
      <text x="15" y="22" font-family="system-ui" font-size="12" font-weight="700" fill="#f59e0b">3. Back Edge (`visited[v] == true` &amp;&amp; `v != p`)</text>
      <text x="15" y="42" font-family="system-ui" font-size="11" fill="#cbd5e1">• Already visited ancestor. Creates a cycle.</text>
      <text x="15" y="58" font-family="Consolas" font-size="10.5" fill="#fef08a">low[u] = min(low[u], disc[v]);</text>
      <text x="15" y="74" font-family="system-ui" font-size="10" fill="#94a3b8">Strictly uses discovery time of ancestor (`disc[v]`)</text>
    </g>
  </g>
</svg>
