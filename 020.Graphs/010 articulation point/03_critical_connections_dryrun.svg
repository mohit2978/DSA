<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" width="980" height="540">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="nodeBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <linearGradient id="nodeAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="nodeRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <filter id="sh3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="980" height="540" rx="16" fill="url(#bgGrad3)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="490" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Dry Run: LeetCode 1192 - Critical Connections in a Network
  </text>
  <text x="490" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Graph with 4 servers: Cycle (0-1-2) with bridge edge (1, 3). Output: [[1, 3]]
  </text>

  <!-- Left: Visual Graph Diagram -->
  <g transform="translate(35, 85)" filter="url(#sh3)">
    <rect width="400" height="420" rx="12" fill="url(#cardGrad3)" stroke="#38bdf8" stroke-width="1.5"/>
    
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#38bdf8">
      Graph Topology &amp; DFS Traversal Flow
    </text>

    <!-- Edges -->
    <!-- Tree edge 0 -> 1 -->
    <line x1="120" y1="130" x2="260" y2="130" stroke="#38bdf8" stroke-width="3"/>
    <text x="190" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Tree (1)</text>

    <!-- Tree edge 1 -> 2 -->
    <line x1="260" y1="130" x2="190" y2="240" stroke="#38bdf8" stroke-width="3"/>
    <text x="245" y="195" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">Tree (2)</text>

    <!-- Back edge 2 -> 0 -->
    <line x1="190" y1="240" x2="120" y2="130" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="135" y="200" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fbbf24" text-anchor="middle">Back (3)</text>

    <!-- Bridge Tree Edge 1 -> 3 -->
    <line x1="260" y1="130" x2="260" y2="330" stroke="#ef4444" stroke-width="3.5" stroke-dasharray="6,4"/>
    <text x="310" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444" text-anchor="middle">BRIDGE (4)</text>

    <!-- Nodes -->
    <!-- Node 0 -->
    <circle cx="120" cy="130" r="22" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="120" y="136" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">0</text>
    <rect x="50" y="80" width="85" height="22" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="92" y="95" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle">d=1, low=1</text>

    <!-- Node 1 -->
    <circle cx="260" cy="130" r="22" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="260" y="136" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <rect x="275" y="80" width="85" height="22" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="317" y="95" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle">d=2, low=1</text>

    <!-- Node 2 -->
    <circle cx="190" cy="240" r="22" fill="url(#nodeBlue)" stroke="#60a5fa" stroke-width="2"/>
    <text x="190" y="246" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <rect x="105" y="265" width="85" height="22" rx="4" fill="#1e293b" stroke="#60a5fa" stroke-width="1"/>
    <text x="147" y="280" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#93c5fd" text-anchor="middle">d=3, low=1</text>

    <!-- Node 3 -->
    <circle cx="260" cy="330" r="22" fill="url(#nodeRed)" stroke="#f87171" stroke-width="2"/>
    <text x="260" y="336" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <rect x="275" y="340" width="85" height="22" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="317" y="355" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#fca5a5" text-anchor="middle">d=4, low=4</text>

    <!-- Legend -->
    <rect x="20" y="375" width="360" height="30" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="200" y="395" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1" text-anchor="middle">
      <tspan fill="#38bdf8">■ Tree Edge</tspan>   <tspan fill="#f59e0b">■ Back-Edge</tspan>   <tspan fill="#ef4444">■ Critical Bridge</tspan>
    </text>
  </g>

  <!-- Right: Step-by-Step Execution Table -->
  <g transform="translate(460, 85)" filter="url(#sh3)">
    <rect width="485" height="420" rx="12" fill="url(#cardGrad3)" stroke="#a855f7" stroke-width="1.5"/>
    
    <text x="20" y="28" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#c084fc">
      Step-by-Step Execution Trace
    </text>

    <!-- Table Header -->
    <rect x="15" y="45" width="455" height="28" rx="4" fill="#3b0764"/>
    <text x="25" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#e9d5ff">Step</text>
    <text x="65" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#e9d5ff">Action / Edge</text>
    <text x="175" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#e9d5ff">disc[]</text>
    <text x="250" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#e9d5ff">low[]</text>
    <text x="325" y="64" font-family="monospace" font-size="11" font-weight="700" fill="#e9d5ff">Condition Check</text>

    <!-- Rows -->
    <!-- Row 1 -->
    <rect x="15" y="78" width="455" height="34" rx="4" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="99" font-family="monospace" font-size="11" fill="#94a3b8">1</text>
    <text x="65" y="99" font-family="monospace" font-size="11" fill="#38bdf8">DFS(0, p=-1)</text>
    <text x="175" y="99" font-family="monospace" font-size="10" fill="#cbd5e1">[1,-,-,-]</text>
    <text x="250" y="99" font-family="monospace" font-size="10" fill="#cbd5e1">[1,-,-,-]</text>
    <text x="325" y="99" font-family="monospace" font-size="10" fill="#94a3b8">timer = 1</text>

    <!-- Row 2 -->
    <rect x="15" y="117" width="455" height="34" rx="4" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="138" font-family="monospace" font-size="11" fill="#94a3b8">2</text>
    <text x="65" y="138" font-family="monospace" font-size="11" fill="#38bdf8">DFS(1, p=0)</text>
    <text x="175" y="138" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,-,-]</text>
    <text x="250" y="138" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,-,-]</text>
    <text x="325" y="138" font-family="monospace" font-size="10" fill="#94a3b8">timer = 2</text>

    <!-- Row 3 -->
    <rect x="15" y="156" width="455" height="34" rx="4" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="177" font-family="monospace" font-size="11" fill="#94a3b8">3</text>
    <text x="65" y="177" font-family="monospace" font-size="11" fill="#38bdf8">DFS(2, p=1)</text>
    <text x="175" y="177" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,3,-]</text>
    <text x="250" y="177" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,3,-]</text>
    <text x="325" y="177" font-family="monospace" font-size="10" fill="#94a3b8">timer = 3</text>

    <!-- Row 4 -->
    <rect x="15" y="195" width="455" height="34" rx="4" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="216" font-family="monospace" font-size="11" fill="#94a3b8">4</text>
    <text x="65" y="216" font-family="monospace" font-size="11" fill="#fbbf24">Back-edge (2,0)</text>
    <text x="175" y="216" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,3,-]</text>
    <text x="250" y="216" font-family="monospace" font-size="10" fill="#fbbf24">[1,2,1,-]</text>
    <text x="325" y="216" font-family="monospace" font-size="10" fill="#fbbf24">low[2]=min(3,disc[0])=1</text>

    <!-- Row 5 -->
    <rect x="15" y="234" width="455" height="34" rx="4" fill="#1e293b" fill-opacity="0.6"/>
    <text x="25" y="255" font-family="monospace" font-size="11" fill="#94a3b8">5</text>
    <text x="65" y="255" font-family="monospace" font-size="11" fill="#a78bfa">Return to 1</text>
    <text x="175" y="255" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,3,-]</text>
    <text x="250" y="255" font-family="monospace" font-size="10" fill="#a78bfa">[1,1,1,-]</text>
    <text x="325" y="255" font-family="monospace" font-size="10" fill="#34d399">low[2](1) &lt;= disc[1](2) NO</text>

    <!-- Row 6 -->
    <rect x="15" y="273" width="455" height="34" rx="4" fill="#1e293b" fill-opacity="0.3"/>
    <text x="25" y="294" font-family="monospace" font-size="11" fill="#94a3b8">6</text>
    <text x="65" y="294" font-family="monospace" font-size="11" fill="#38bdf8">DFS(3, p=1)</text>
    <text x="175" y="294" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,3,4]</text>
    <text x="250" y="294" font-family="monospace" font-size="10" fill="#cbd5e1">[1,1,1,4]</text>
    <text x="325" y="294" font-family="monospace" font-size="10" fill="#94a3b8">timer = 4 (leaf)</text>

    <!-- Row 7 (Bridge) -->
    <rect x="15" y="312" width="455" height="36" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="25" y="335" font-family="monospace" font-size="11" font-weight="700" fill="#fca5a5">7</text>
    <text x="65" y="335" font-family="monospace" font-size="11" font-weight="700" fill="#f87171">Return to 1</text>
    <text x="175" y="335" font-family="monospace" font-size="10" fill="#cbd5e1">[1,2,3,4]</text>
    <text x="250" y="335" font-family="monospace" font-size="10" fill="#cbd5e1">[1,1,1,4]</text>
    <text x="325" y="335" font-family="monospace" font-size="10" font-weight="700" fill="#ef4444">low[3](4) &gt; disc[1](2) → [1,3]</text>

    <!-- Result Box -->
    <rect x="15" y="360" width="455" height="42" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1.5"/>
    <text x="242" y="386" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      Result Found: Critical Connection = [[1, 3]]
    </text>
  </g>
</svg>
