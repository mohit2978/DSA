<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="amberNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <linearGradient id="redNode4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>

    <linearGradient id="blueNode4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <filter id="sh4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad4)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Tarjan's Articulation Point (Cut Vertex) Conditions
  </text>
  <text x="480" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    A vertex u is an Articulation Point if removing it strictly increases the number of connected components
  </text>

  <!-- Left: Condition A (Root Node) -->
  <g transform="translate(40, 85)" filter="url(#sh4)">
    <rect width="420" height="400" rx="12" fill="url(#cardGrad4)" stroke="#f59e0b" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="420" height="42" rx="12" fill="#f59e0b" fill-opacity="0.15"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#fbbf24">
      CONDITION A: ROOT NODE (p == -1)
    </text>

    <!-- Formula badge -->
    <rect x="20" y="55" width="380" height="32" rx="6" fill="#451a03" stroke="#b45309" stroke-width="1"/>
    <text x="210" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fde68a" text-anchor="middle">
      children &gt; 1  in DFS Tree  ===>  ROOT IS AP
    </text>

    <!-- Diagram -->
    <!-- Root Node -->
    <line x1="210" y1="135" x2="130" y2="230" stroke="#38bdf8" stroke-width="3"/>
    <line x1="210" y1="135" x2="290" y2="230" stroke="#38bdf8" stroke-width="3"/>

    <!-- Subtree blobs -->
    <ellipse cx="130" cy="260" rx="55" ry="38" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="130" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Subtree 1</text>

    <ellipse cx="290" cy="260" rx="55" ry="38" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="290" y="275" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Subtree 2</text>

    <!-- Root Node circle -->
    <circle cx="210" cy="135" r="24" fill="url(#amberNode)" stroke="#fde68a" stroke-width="2"/>
    <text x="210" y="141" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#000000" text-anchor="middle">ROOT</text>

    <circle cx="130" cy="230" r="16" fill="url(#blueNode4)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="130" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">c1</text>

    <circle cx="290" cy="230" r="16" fill="url(#blueNode4)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="290" y="235" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">c2</text>

    <!-- Explanation Box -->
    <rect x="20" y="325" width="380" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="210" y="347" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1" text-anchor="middle">
      Since Subtree 1 and Subtree 2 were spawned as
    </text>
    <text x="210" y="367" font-family="system-ui, sans-serif" font-size="11.5" fill="#fde68a" text-anchor="middle">
      independent DFS branches, no cross-edge links them.
    </text>
  </g>

  <!-- Right: Condition B (Non-Root Node) -->
  <g transform="translate(500, 85)" filter="url(#sh4)">
    <rect width="420" height="400" rx="12" fill="url(#cardGrad4)" stroke="#ef4444" stroke-width="1.5"/>
    
    <rect x="0" y="0" width="420" height="42" rx="12" fill="#ef4444" fill-opacity="0.15"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f87171">
      CONDITION B: NON-ROOT NODE (p != -1)
    </text>

    <!-- Formula badge -->
    <rect x="20" y="55" width="380" height="32" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="210" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle">
      low[v] &gt;= disc[u]  ===>  NODE u IS AP
    </text>

    <!-- Diagram -->
    <!-- Ancestor node -->
    <circle cx="210" cy="115" r="16" fill="#475569" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="210" y="119" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">anc</text>
    <text x="270" y="119" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">disc = 1</text>

    <line x1="210" y1="131" x2="210" y2="185" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Cut vertex u -->
    <circle cx="210" cy="205" r="22" fill="url(#redNode4)" stroke="#fca5a5" stroke-width="2"/>
    <text x="210" y="210" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">u (AP)</text>
    <text x="280" y="210" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#f87171">disc[u] = 2</text>

    <line x1="210" y1="227" x2="210" y2="275" stroke="#38bdf8" stroke-width="2.5"/>

    <!-- Child v -->
    <circle cx="210" cy="290" r="18" fill="url(#blueNode4)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="210" y="295" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">v</text>
    <text x="280" y="295" font-family="system-ui, sans-serif" font-size="11" fill="#93c5fd">low[v] = 2 &gt;= 2</text>

    <!-- Optional back-edge reaching only u (low=2) -->
    <path d="M 195 285 Q 160 250 192 210" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,3"/>
    <text x="125" y="250" font-family="system-ui, sans-serif" font-size="10" fill="#fbbf24">max reach = u</text>

    <!-- Explanation Box -->
    <rect x="20" y="325" width="380" height="60" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="210" y="347" font-family="system-ui, sans-serif" font-size="11.5" fill="#cbd5e1" text-anchor="middle">
      Subtree of v cannot jump over u to reach ancestors.
    </text>
    <text x="210" y="367" font-family="system-ui, sans-serif" font-size="11.5" fill="#fca5a5" text-anchor="middle">
      Removing u completely traps v away from ancestor tree!
    </text>
  </g>
</svg>
