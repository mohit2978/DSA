<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="greenNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="redNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <linearGradient id="blueNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <filter id="sh2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="960" height="520" rx="16" fill="url(#bgGrad2)" stroke="#334155" stroke-width="1.5"/>

  <!-- Title -->
  <text x="480" y="38" font-family="system-ui, sans-serif" font-size="20" font-weight="700" fill="#f8fafc" text-anchor="middle">
    Bridge (Critical Connection) Condition: low[v] > disc[u]
  </text>
  <text x="480" y="60" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8" text-anchor="middle">
    An edge (u, v) is a bridge iff the subtree rooted at v has NO back-edge reaching u or any ancestor of u
  </text>

  <!-- Left Card: Case 1 - Cycle Exists (NOT a Bridge) -->
  <g transform="translate(40, 85)" filter="url(#sh2)">
    <rect width="420" height="400" rx="12" fill="url(#cardGrad2)" stroke="#10b981" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="420" height="42" rx="12" fill="#10b981" fill-opacity="0.15"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#34d399">
      CASE 1: Cycle / Back-Door Exists (NOT A BRIDGE)
    </text>

    <!-- Formula badge -->
    <rect x="20" y="55" width="380" height="32" rx="6" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="210" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#6ee7b7" text-anchor="middle">
      low[v] &lt;= disc[u]  ===>  Edge (u, v) is SAFE (Redundant)
    </text>

    <!-- Graph Visualization -->
    <!-- Edge u to v -->
    <line x1="210" y1="130" x2="130" y2="210" stroke="#94a3b8" stroke-width="3"/>
    <!-- Edge v to w -->
    <line x1="130" y1="210" x2="210" y2="290" stroke="#94a3b8" stroke-width="3"/>
    <!-- Back edge w to u -->
    <path d="M 225 280 Q 280 210 225 140" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="6,4"/>
    <text x="310" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#fbbf24">Back-Edge</text>

    <!-- Nodes -->
    <!-- Node u -->
    <circle cx="210" cy="130" r="22" fill="url(#blueNode)" stroke="#60a5fa" stroke-width="2"/>
    <text x="210" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">u</text>
    <rect x="235" y="112" width="105" height="24" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="287" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">disc[u]=1, low=1</text>

    <!-- Node v -->
    <circle cx="130" cy="210" r="22" fill="url(#greenNode)" stroke="#34d399" stroke-width="2"/>
    <text x="130" y="215" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">v</text>
    <rect x="20" y="200" width="85" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="62" y="216" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">disc=2, low=1</text>

    <!-- Node w -->
    <circle cx="210" cy="290" r="22" fill="url(#greenNode)" stroke="#34d399" stroke-width="2"/>
    <text x="210" y="295" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">w</text>
    <rect x="165" y="320" width="90" height="24" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="1"/>
    <text x="210" y="336" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#6ee7b7" text-anchor="middle">disc=3, low=1</text>

    <!-- Explanation Box -->
    <rect x="20" y="352" width="380" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="210" y="374" font-family="system-ui, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">
      If (u, v) is cut, v can still reach u via path <tspan fill="#34d399" font-weight="700">v → w ⇢ u</tspan>
    </text>
  </g>

  <!-- Right Card: Case 2 - No Cycle (IS A BRIDGE) -->
  <g transform="translate(500, 85)" filter="url(#sh2)">
    <rect width="420" height="400" rx="12" fill="url(#cardGrad2)" stroke="#ef4444" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect x="0" y="0" width="420" height="42" rx="12" fill="#ef4444" fill-opacity="0.15"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="15" font-weight="700" fill="#f87171">
      CASE 2: No Back-Door / Bottleneck (IS A BRIDGE)
    </text>

    <!-- Formula badge -->
    <rect x="20" y="55" width="380" height="32" rx="6" fill="#450a0a" stroke="#dc2626" stroke-width="1"/>
    <text x="210" y="76" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#fca5a5" text-anchor="middle">
      low[v] &gt; disc[u]  ===>  Edge (u, v) is a CRITICAL BRIDGE!
    </text>

    <!-- Graph Visualization -->
    <!-- Bridge Edge u to v -->
    <line x1="210" y1="130" x2="210" y2="230" stroke="#ef4444" stroke-width="4" stroke-dasharray="8,4"/>
    <text x="255" y="185" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ef4444">BRIDGE</text>

    <!-- Edge v to w -->
    <line x1="210" y1="230" x2="210" y2="305" stroke="#94a3b8" stroke-width="3"/>

    <!-- Nodes -->
    <!-- Node u -->
    <circle cx="210" cy="130" r="22" fill="url(#blueNode)" stroke="#60a5fa" stroke-width="2"/>
    <text x="210" y="135" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">u</text>
    <rect x="235" y="112" width="105" height="24" rx="4" fill="#1e1b4b" stroke="#6366f1" stroke-width="1"/>
    <text x="287" y="128" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc" text-anchor="middle">disc[u]=1, low=1</text>

    <!-- Node v -->
    <circle cx="210" cy="230" r="22" fill="url(#redNode)" stroke="#f87171" stroke-width="2"/>
    <text x="210" y="235" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">v</text>
    <rect x="235" y="218" width="115" height="24" rx="4" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="292" y="234" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fca5a5" text-anchor="middle">disc[v]=2, low[v]=2</text>

    <!-- Node w -->
    <circle cx="210" cy="305" r="18" fill="#475569" stroke="#94a3b8" stroke-width="2"/>
    <text x="210" y="310" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">w</text>
    <text x="240" y="310" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">disc=3, low=2</text>

    <!-- Explanation Box -->
    <rect x="20" y="352" width="380" height="36" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="210" y="374" font-family="system-ui, sans-serif" font-size="12" fill="#fca5a5" text-anchor="middle">
      Removing (u, v) isolates subtree {v, w} from u permanently!
    </text>
  </g>
</svg>
