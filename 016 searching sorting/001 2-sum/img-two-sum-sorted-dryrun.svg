<svg viewBox="0 0 800 580" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="580" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Two Sum on a SORTED array &#8212; the two-pointer dry run <tspan fill="#9aa0a6" font-weight="normal">target = 4</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- step 1 -->
  <rect x="25" y="48" width="750" height="118" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="45"  y="70" width="60" height="34"/><rect x="106" y="70" width="60" height="34"/>
    <rect x="167" y="70" width="60" height="34"/><rect x="228" y="70" width="60" height="34"/>
    <rect x="289" y="70" width="60" height="34"/><rect x="350" y="70" width="60" height="34"/>
    <rect x="411" y="70" width="60" height="34"/><rect x="472" y="70" width="60" height="34"/>
    <rect x="533" y="70" width="60" height="34"/><rect x="594" y="70" width="60" height="34"/>
    <rect x="655" y="70" width="60" height="34"/>
  </g>
  <g font-family="monospace" font-size="16" fill="#d4d4d4" text-anchor="middle" font-weight="bold">
    <text x="75"  y="93">0</text><text x="136" y="93">0</text><text x="197" y="93">0</text>
    <text x="258" y="93">2</text><text x="319" y="93">3</text><text x="380" y="93">3</text>
    <text x="441" y="93">4</text><text x="502" y="93">4</text><text x="563" y="93">4</text>
    <text x="624" y="93">5</text><text x="685" y="93">6</text>
  </g>
  <text x="75"  y="124" fill="#56c98d" text-anchor="middle" font-size="14" font-weight="bold">&#8593; i</text>
  <text x="685" y="124" fill="#e06c75" text-anchor="middle" font-size="14" font-weight="bold">&#8593; j</text>
  <text x="45" y="150" fill="#e06c75" font-family="monospace" font-size="13.5">0 + 6 &gt; 4   the sum is too big, so  j--</text>

  <!-- step 2 -->
  <rect x="25" y="178" width="750" height="118" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="45"  y="200" width="60" height="34"/><rect x="106" y="200" width="60" height="34"/>
    <rect x="167" y="200" width="60" height="34"/><rect x="228" y="200" width="60" height="34"/>
    <rect x="289" y="200" width="60" height="34"/><rect x="350" y="200" width="60" height="34"/>
    <rect x="411" y="200" width="60" height="34"/><rect x="472" y="200" width="60" height="34"/>
    <rect x="533" y="200" width="60" height="34"/><rect x="594" y="200" width="60" height="34"/>
    <rect x="655" y="200" width="60" height="34"/>
  </g>
  <g font-family="monospace" font-size="16" fill="#d4d4d4" text-anchor="middle" font-weight="bold">
    <text x="75"  y="223">0</text><text x="136" y="223">0</text><text x="197" y="223">0</text>
    <text x="258" y="223">2</text><text x="319" y="223">3</text><text x="380" y="223">3</text>
    <text x="441" y="223">4</text><text x="502" y="223">4</text><text x="563" y="223">4</text>
    <text x="624" y="223">5</text><text x="685" y="223">6</text>
  </g>
  <text x="75"  y="254" fill="#56c98d" text-anchor="middle" font-size="14" font-weight="bold">&#8593; i</text>
  <text x="624" y="254" fill="#e06c75" text-anchor="middle" font-size="14" font-weight="bold">&#8593; j</text>
  <text x="45" y="280" fill="#e06c75" font-family="monospace" font-size="13.5">0 + 5 &gt; 4   again  j--</text>

  <!-- step 3 -->
  <rect x="25" y="308" width="750" height="118" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="45"  y="330" width="60" height="34"/><rect x="106" y="330" width="60" height="34"/>
    <rect x="167" y="330" width="60" height="34"/><rect x="228" y="330" width="60" height="34"/>
    <rect x="289" y="330" width="60" height="34"/><rect x="350" y="330" width="60" height="34"/>
    <rect x="411" y="330" width="60" height="34"/><rect x="472" y="330" width="60" height="34"/>
  </g>
  <rect x="533" y="330" width="60" height="34" fill="#1f3a2a" stroke="#56c98d" stroke-width="2.5"/>
  <rect x="45"  y="330" width="60" height="34" fill="#1f3a2a" stroke="#56c98d" stroke-width="2.5"/>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="594" y="330" width="60" height="34"/><rect x="655" y="330" width="60" height="34"/>
  </g>
  <g font-family="monospace" font-size="16" fill="#d4d4d4" text-anchor="middle" font-weight="bold">
    <text x="75"  y="353">0</text><text x="136" y="353">0</text><text x="197" y="353">0</text>
    <text x="258" y="353">2</text><text x="319" y="353">3</text><text x="380" y="353">3</text>
    <text x="441" y="353">4</text><text x="502" y="353">4</text><text x="563" y="353">4</text>
    <text x="624" y="353">5</text><text x="685" y="353">6</text>
  </g>
  <text x="75"  y="384" fill="#56c98d" text-anchor="middle" font-size="14" font-weight="bold">&#8593; i</text>
  <text x="563" y="384" fill="#56c98d" text-anchor="middle" font-size="14" font-weight="bold">&#8593; j</text>
  <text x="45" y="410" fill="#56c98d" font-family="monospace" font-size="13.5" font-weight="bold">(0 + 4 == 4)   so stop, break</text>

  <!-- why -->
  <rect x="25" y="438" width="750" height="130" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="460" fill="#f2c14e" font-size="13.5" font-weight="bold">Why moving a pointer is the right move</text>
  <text x="42" y="486" fill="#d4d4d4" font-family="monospace" font-size="14" font-weight="bold">a + b = target</text>
  <text x="200" y="486" fill="#9aa0a6" font-size="12.5">a is the small value, b is the big value</text>
  <text x="40" y="512" fill="#d4d4d4" font-size="13">If <tspan font-family="monospace">a + b &gt; target</tspan>, we need something smaller. <tspan font-weight="bold">b is the bigger one, so decrease b</tspan> &#8212; there is no point making the small one smaller.</text>
  <text x="40" y="534" fill="#d4d4d4" font-size="13">Similarly, if <tspan font-family="monospace">a + b &lt; target</tspan>, we need something bigger, so <tspan font-weight="bold">increase a</tspan> rather than touching b.</text>
  <text x="40" y="558" fill="#9aa0a6" font-size="12">This is only valid because the array is <tspan fill="#56c98d">sorted</tspan> &#8212; that is what makes moving one pointer a monotone change to the sum.</text>
</svg>
