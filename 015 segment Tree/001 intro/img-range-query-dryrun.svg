<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="560" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Range Sum dry run <tspan fill="#9aa0a6" font-weight="normal">— arr = [1, 3, 2, 4, 6, 5], query = getSum(2, 3)</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Tree -->
  <rect x="25" y="48" width="470" height="300" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Green = returned a value &#160;&#183;&#160; Red = returned 0 &#160;&#183;&#160; Yellow = partial, went deeper</text>

  <g stroke="#5b7a8c" stroke-width="1.5">
    <line x1="240" y1="118" x2="145" y2="158"/>
    <line x1="280" y1="118" x2="380" y2="158"/>
    <line x1="122" y1="178" x2="80"  y2="218"/>
    <line x1="148" y1="178" x2="195" y2="218"/>
    <line x1="380" y1="178" x2="330" y2="218"/>
    <line x1="405" y1="178" x2="440" y2="218"/>
    <line x1="315" y1="238" x2="290" y2="272"/>
    <line x1="345" y1="238" x2="378" y2="272"/>
  </g>

  <circle cx="260" cy="108" r="22" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="135" cy="168" r="20" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="392" cy="168" r="20" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="70"  cy="228" r="19" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
  <circle cx="205" cy="228" r="19" fill="#1f3a2a" stroke="#56c98d" stroke-width="3"/>
  <circle cx="325" cy="228" r="19" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="450" cy="228" r="19" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
  <circle cx="280" cy="288" r="17" fill="#1f3a2a" stroke="#56c98d" stroke-width="3"/>
  <circle cx="385" cy="288" r="17" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="260" y="114">21</text>
    <text x="135" y="174">6</text>
    <text x="392" y="174">15</text>
    <text x="70"  y="234">4</text>
    <text x="205" y="234">2</text>
    <text x="325" y="234">10</text>
    <text x="450" y="234">5</text>
    <text x="280" y="294">4</text>
    <text x="385" y="294">6</text>
  </g>
  <g fill="#9aa0a6" text-anchor="middle" font-size="11" font-family="monospace">
    <text x="310" y="108">[0-5]</text>
    <text x="135" y="200">[0-2]</text>
    <text x="392" y="146">[3-5]</text>
    <text x="70"  y="260">[0-1]</text>
    <text x="205" y="260">[2-2]</text>
    <text x="325" y="200">[3-4]</text>
    <text x="450" y="260">[5-5]</text>
    <text x="280" y="318">[3-3]</text>
    <text x="385" y="318">[4-4]</text>
  </g>

  <text x="40" y="340" fill="#56c98d" font-size="13.5" font-weight="bold">Answer = 2 + 4 = 6 &#160;&#160;(arr[2] + arr[3])</text>

  <!-- Trace -->
  <rect x="510" y="48" width="265" height="300" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="525" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Step by step</text>
  <line x1="525" y1="80" x2="760" y2="80" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" font-size="11.5">
    <text x="525" y="102" fill="#f2c14e">[0-5] vs (2,3)  partial</text>
    <text x="537" y="118" fill="#9aa0a6">&#8594; explore both</text>

    <text x="525" y="142" fill="#f2c14e">[0-2] vs (2,3)  partial</text>
    <text x="537" y="158" fill="#9aa0a6">&#8594; explore both</text>

    <text x="525" y="182" fill="#e06c75">[0-1] vs (2,3)  no overlap</text>
    <text x="537" y="198" fill="#e06c75">&#8594; return 0</text>

    <text x="525" y="222" fill="#56c98d">[2-2] vs (2,3)  full</text>
    <text x="537" y="238" fill="#56c98d">&#8594; return 2</text>

    <text x="525" y="262" fill="#f2c14e">[3-5] vs (2,3)  partial</text>
    <text x="537" y="278" fill="#9aa0a6">&#8594; explore both</text>

    <text x="525" y="302" fill="#e06c75">[5-5] no overlap &#8594; 0</text>
    <text x="525" y="322" fill="#f2c14e">[3-4] partial &#8594; deeper</text>
    <text x="525" y="342" fill="#56c98d">[3-3] full &#8594; 4 ; [4-4] &#8594; 0</text>
  </g>

  <!-- Roll up -->
  <rect x="25" y="362" width="750" height="80" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="386" fill="#f2c14e" font-size="13.5" font-weight="bold">Rolling the answers back up</text>
  <g font-family="monospace" font-size="13" fill="#d4d4d4">
    <text x="42" y="410">[0-2] = 0 + 2 = 2</text>
    <text x="260" y="410">[3-4] = 4 + 0 = 4</text>
    <text x="470" y="410">[3-5] = 4 + 0 = 4</text>
  </g>
  <text x="42" y="432" fill="#56c98d" font-family="monospace" font-size="13.5" font-weight="bold">[0-5] = 2 + 4 = 6</text>

  <!-- Why zero -->
  <rect x="25" y="456" width="750" height="86" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="480" fill="#f2c14e" font-size="13.5" font-weight="bold">Why "return 0" for no overlap?</text>
  <text x="40" y="504" fill="#d4d4d4" font-size="13">0 is the <tspan fill="#56c98d" font-weight="bold">identity element for addition</tspan> &#8212; adding it changes nothing, so a non-overlapping branch contributes nothing.</text>
  <text x="40" y="526" fill="#9aa0a6" font-size="12.5">For a Min query the identity is <tspan font-family="monospace">INT_MAX</tspan>, for Max it is <tspan font-family="monospace">INT_MIN</tspan>, for XOR it is <tspan font-family="monospace">0</tspan>, for GCD it is <tspan font-family="monospace">0</tspan>. Only this one line changes.</text>
</svg>
