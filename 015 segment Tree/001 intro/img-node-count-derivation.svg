<svg viewBox="0 0 800 440" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="440" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">How many nodes does a Segment Tree need? <tspan fill="#9aa0a6" font-weight="normal">— why we allocate 4N</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Tree with level counts -->
  <rect x="25" y="48" width="400" height="250" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Each level has half the nodes of the level below</text>

  <g stroke="#5b7a8c" stroke-width="1.5">
    <line x1="245" y1="98"  x2="160" y2="128"/>
    <line x1="265" y1="98"  x2="345" y2="128"/>
    <line x1="145" y1="148" x2="105" y2="178"/>
    <line x1="170" y1="148" x2="212" y2="178"/>
    <line x1="335" y1="148" x2="295" y2="178"/>
    <line x1="360" y1="148" x2="400" y2="178"/>
    <line x1="95"  y1="196" x2="72"  y2="222"/>
    <line x1="113" y1="196" x2="135" y2="222"/>
    <line x1="202" y1="196" x2="180" y2="222"/>
    <line x1="220" y1="196" x2="243" y2="222"/>
    <line x1="285" y1="196" x2="263" y2="222"/>
    <line x1="303" y1="196" x2="325" y2="222"/>
    <line x1="392" y1="196" x2="370" y2="222"/>
    <line x1="410" y1="196" x2="392" y2="222"/>
  </g>

  <g fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2">
    <circle cx="255" cy="90"  r="14"/>
    <circle cx="152" cy="138" r="13"/><circle cx="352" cy="138" r="13"/>
    <circle cx="104" cy="186" r="12"/><circle cx="211" cy="186" r="12"/>
    <circle cx="294" cy="186" r="12"/><circle cx="401" cy="186" r="12"/>
  </g>
  <g fill="#233a2c" stroke="#56c98d" stroke-width="2">
    <circle cx="70"  cy="232" r="11"/><circle cx="137" cy="232" r="11"/>
    <circle cx="178" cy="232" r="11"/><circle cx="245" cy="232" r="11"/>
    <circle cx="261" cy="232" r="11"/><circle cx="327" cy="232" r="11"/>
    <circle cx="368" cy="232" r="11"/><circle cx="394" cy="232" r="11"/>
  </g>

  <g fill="#f2c14e" font-size="12" font-family="monospace" text-anchor="end">
    <text x="295" y="72">1</text>
    <text x="60"  y="120">N/2&#178;</text>
    <text x="60"  y="168">N/2 nodes</text>
    <text x="60"  y="238">N nodes</text>
  </g>
  <text x="150" y="272" fill="#9aa0a6" font-size="12">green = the N leaves (the array elements themselves)</text>
  <text x="150" y="290" fill="#9aa0a6" font-size="12">blue = internal nodes holding merged ranges</text>

  <!-- Derivation -->
  <rect x="440" y="48" width="335" height="250" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="455" y="70" fill="#f2c14e" font-size="13" font-weight="bold">The geometric series</text>
  <line x1="455" y1="80" x2="760" y2="80" stroke="#333333" stroke-width="1"/>

  <g font-family="monospace" font-size="13" fill="#d4d4d4">
    <text x="455" y="106">Total = N + N/2 + N/2&#178; + ... + 1</text>
    <text x="455" y="136">      = N (1 + 1/2 + 1/2&#178; + ...)</text>
    <text x="455" y="172">Let it run to infinity:</text>
    <text x="455" y="200">1 + 1/2 + 1/4 + ... = 1/(1 - 1/2)</text>
    <text x="530" y="224">= 2</text>
    <text x="455" y="258" fill="#56c98d" font-weight="bold">Total = N &#215; 2 = 2N</text>
  </g>
  <text x="455" y="286" fill="#9aa0a6" font-size="12">Taking the sum to infinity only over-counts, so 2N is a safe upper bound.</text>

  <!-- Why 4N -->
  <rect x="25" y="312" width="750" height="112" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="336" fill="#f2c14e" font-size="13.5" font-weight="bold">So why 4N and not 2N?</text>
  <text x="40" y="360" fill="#d4d4d4" font-size="13">Because when N is not a power of 2 the leaf layer is padded up to the next power of 2, call it <tspan font-family="monospace" fill="#56c98d">P</tspan>. The tree then needs <tspan font-family="monospace" fill="#56c98d">2P &#8722; 1</tspan> nodes.</text>
  <text x="40" y="382" fill="#d4d4d4" font-size="13">Since the previous power of 2 is <tspan font-family="monospace">&lt; N</tspan> and <tspan font-family="monospace">P = 2 &#215; P_prev</tspan>, we get <tspan font-family="monospace" fill="#f2c14e">P &lt; 2N</tspan>, hence total nodes <tspan font-family="monospace" fill="#f2c14e">&#8776; 2P &lt; 4N</tspan>.</text>
  <text x="40" y="406" fill="#e06c75" font-size="12.5">Worst case N = 33: P = 64, nodes needed = 127. 3N = 99 &#8594; crash. 4N = 132 &#8594; safe. Also note the indices are heap-style, so the array must be big enough for the largest INDEX, not just the node count.</text>
</svg>
