<svg viewBox="0 0 800 420" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="420" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">The 3 cases of a Range Query <tspan fill="#9aa0a6" font-weight="normal">— [qs, qe] = what we WANT, [s, e] = what the NODE has</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Case 1 -->
  <rect x="25" y="48" width="240" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#e06c75" font-size="13.5" font-weight="bold">1. No Overlap</text>
  <text x="40" y="90" fill="#9aa0a6" font-size="12">The two ranges do not touch at all.</text>

  <rect x="45" y="110" width="90" height="22" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
  <text x="90" y="126" fill="#f0f0f0" text-anchor="middle" font-size="11" font-family="monospace">node [s,e]</text>
  <rect x="155" y="145" width="90" height="22" fill="#1c3040" stroke="#5b9bd5" stroke-width="2"/>
  <text x="200" y="161" fill="#f0f0f0" text-anchor="middle" font-size="11" font-family="monospace">query</text>

  <text x="40" y="192" fill="#e06c75" font-family="monospace" font-size="12">qe &lt; s  ||  e &lt; qs</text>
  <text x="40" y="216" fill="#56c98d" font-size="13" font-weight="bold">&#8594; return 0</text>

  <!-- Case 2 -->
  <rect x="280" y="48" width="240" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="295" y="70" fill="#56c98d" font-size="13.5" font-weight="bold">2. Full Overlap</text>
  <text x="295" y="90" fill="#9aa0a6" font-size="12">The node sits entirely inside the query.</text>

  <rect x="300" y="110" width="200" height="22" fill="#1c3040" stroke="#5b9bd5" stroke-width="2"/>
  <text x="400" y="126" fill="#f0f0f0" text-anchor="middle" font-size="11" font-family="monospace">query [qs, qe]</text>
  <rect x="330" y="145" width="120" height="22" fill="#1f3a2a" stroke="#56c98d" stroke-width="2"/>
  <text x="390" y="161" fill="#f0f0f0" text-anchor="middle" font-size="11" font-family="monospace">node [s,e]</text>

  <text x="295" y="192" fill="#56c98d" font-family="monospace" font-size="12">qs &lt;= s  &amp;&amp;  e &lt;= qe</text>
  <text x="295" y="216" fill="#56c98d" font-size="13" font-weight="bold">&#8594; return segtree[i]</text>

  <!-- Case 3 -->
  <rect x="535" y="48" width="240" height="180" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="550" y="70" fill="#f2c14e" font-size="13.5" font-weight="bold">3. Partial Overlap</text>
  <text x="550" y="90" fill="#9aa0a6" font-size="12">The node has extra elements we don't want.</text>

  <rect x="555" y="110" width="150" height="22" fill="#3a331f" stroke="#f2c14e" stroke-width="2"/>
  <text x="630" y="126" fill="#f0f0f0" text-anchor="middle" font-size="11" font-family="monospace">node [s,e]</text>
  <rect x="640" y="145" width="120" height="22" fill="#1c3040" stroke="#5b9bd5" stroke-width="2"/>
  <text x="700" y="161" fill="#f0f0f0" text-anchor="middle" font-size="11" font-family="monospace">query</text>

  <text x="550" y="192" fill="#f2c14e" font-size="12">everything else</text>
  <text x="550" y="216" fill="#56c98d" font-size="13" font-weight="bold">&#8594; explore left + right</text>

  <!-- Rule box -->
  <rect x="25" y="242" width="750" height="76" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="266" fill="#f2c14e" font-size="13.5" font-weight="bold">The one sentence that settles which case you are in</text>
  <text x="40" y="290" fill="#d4d4d4" font-size="13">If the node's range is <tspan fill="#56c98d" font-weight="bold">smaller than or equal to</tspan> what we need &#8594; full overlap, return its value.</text>
  <text x="40" y="310" fill="#d4d4d4" font-size="13">If the node's range has <tspan fill="#f2c14e" font-weight="bold">extra elements</tspan> beyond what we need &#8594; we cannot tell where the wanted part sits, so explore further.</text>

  <!-- why log n -->
  <rect x="25" y="332" width="750" height="76" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="356" fill="#f2c14e" font-size="13.5" font-weight="bold">Why this stays O(log N)</text>
  <text x="40" y="380" fill="#d4d4d4" font-size="13">A query range is a line, and a line has only <tspan fill="#e06c75" font-weight="bold">2 ends</tspan> &#8212; so at any level there can be <tspan fill="#e06c75" font-weight="bold">at most 2 partially overlapping</tspan> nodes.</text>
  <text x="40" y="400" fill="#d4d4d4" font-size="13">Each of those two chains descends at most the height of the tree: <tspan font-family="monospace" fill="#56c98d">2 &#215; O(log N) = O(log N)</tspan>.</text>
</svg>
