<svg viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="560" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Building a Segment Tree <tspan fill="#9aa0a6" font-weight="normal">— arr = [1, 3, 2, 4, 6, 5], N = 6</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <!-- Partition card -->
  <rect x="25" y="48" width="360" height="120" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Top-down: split like Merge Sort partition</text>
  <g font-family="monospace" font-size="13.5" fill="#d4d4d4">
    <text x="42" y="94">1, 3, 2  |  4, 6, 5</text>
    <text x="42" y="116">1, 3, 2       4, 6, 5</text>
    <text x="42" y="138">1,3   2       4,6   5</text>
    <text x="42" y="160">1  3          4  6</text>
  </g>

  <!-- Ranges card -->
  <rect x="400" y="48" width="375" height="120" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="415" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Every node [index] represents a RANGE</text>
  <g font-family="monospace" font-size="13.5" fill="#d4d4d4">
    <text x="417" y="94">[0-5]</text>
    <text x="417" y="116">[0-2]         [3-5]</text>
    <text x="417" y="138">[0-1] [2-2]   [3-4] [5-5]</text>
    <text x="417" y="160">[0-0] [1-1]   [3-3] [4-4]</text>
  </g>

  <!-- Tree -->
  <rect x="25" y="182" width="750" height="240" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="204" fill="#56c98d" font-size="13" font-weight="bold">Bottom-up: each parent = left child + right child &#8212; the root is filled LAST (post call)</text>

  <g stroke="#5b7a8c" stroke-width="1.5">
    <line x1="380" y1="248" x2="255" y2="288"/>
    <line x1="420" y1="248" x2="565" y2="288"/>
    <line x1="230" y1="308" x2="175" y2="348"/>
    <line x1="262" y1="308" x2="315" y2="348"/>
    <line x1="565" y1="308" x2="500" y2="348"/>
    <line x1="595" y1="308" x2="648" y2="348"/>
    <line x1="160" y1="368" x2="120" y2="398"/>
    <line x1="190" y1="368" x2="222" y2="398"/>
    <line x1="485" y1="368" x2="450" y2="398"/>
    <line x1="515" y1="368" x2="548" y2="398"/>
  </g>

  <!-- nodes: cx cy value range idx -->
  <g>
    <circle cx="400" cy="238" r="22" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
    <circle cx="240" cy="298" r="20" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="580" cy="298" r="20" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="175" cy="358" r="20" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="325" cy="358" r="20" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="500" cy="358" r="20" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="655" cy="358" r="20" fill="#2b2b2b" stroke="#5b9bd5" stroke-width="2"/>
    <circle cx="115" cy="408" r="18" fill="#233a2c" stroke="#56c98d" stroke-width="2"/>
    <circle cx="228" cy="408" r="18" fill="#233a2c" stroke="#56c98d" stroke-width="2"/>
    <circle cx="445" cy="408" r="18" fill="#233a2c" stroke="#56c98d" stroke-width="2"/>
    <circle cx="555" cy="408" r="18" fill="#233a2c" stroke="#56c98d" stroke-width="2"/>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="15">
    <text x="400" y="244">21</text>
    <text x="240" y="304">6</text>
    <text x="580" y="304">15</text>
    <text x="175" y="364">4</text>
    <text x="325" y="364">2</text>
    <text x="500" y="364">10</text>
    <text x="655" y="364">5</text>
    <text x="115" y="414">1</text>
    <text x="228" y="414">3</text>
    <text x="445" y="414">4</text>
    <text x="555" y="414">6</text>
  </g>
  <!-- ranges in red -->
  <g fill="#e06c75" text-anchor="middle" font-size="11.5" font-family="monospace">
    <text x="452" y="238">[0-5]</text>
    <text x="292" y="298">[0-2]</text>
    <text x="632" y="298">[3-5]</text>
    <text x="175" y="392">[0-1]</text>
    <text x="325" y="392">[2-2]</text>
    <text x="500" y="392">[3-4]</text>
    <text x="655" y="392">[5-5]</text>
    <text x="115" y="440">[0-0]</text>
    <text x="228" y="440">[1-1]</text>
    <text x="445" y="440">[3-3]</text>
    <text x="555" y="440">[4-4]</text>
  </g>
  <!-- tree array indices in green -->
  <g fill="#56c98d" text-anchor="middle" font-size="11" font-weight="bold">
    <text x="372" y="222">0</text>
    <text x="214" y="284">1</text>
    <text x="554" y="284">2</text>
    <text x="149" y="344">3</text>
    <text x="299" y="344">4</text>
    <text x="474" y="344">5</text>
    <text x="629" y="344">6</text>
    <text x="93"  y="396">7</text>
    <text x="250" y="396">8</text>
    <text x="423" y="396">11</text>
    <text x="577" y="396">12</text>
  </g>

  <!-- flat array -->
  <rect x="25" y="436" width="750" height="105" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="458" fill="#f2c14e" font-size="13" font-weight="bold">The tree stored flat in an array (heap-style: left = 2i+1, right = 2i+2)</text>

  <g font-family="monospace" font-size="12" fill="#9aa0a6" text-anchor="middle">
    <text x="65"  y="480">0</text><text x="112" y="480">1</text><text x="159" y="480">2</text>
    <text x="206" y="480">3</text><text x="253" y="480">4</text><text x="300" y="480">5</text>
    <text x="347" y="480">6</text><text x="394" y="480">7</text><text x="441" y="480">8</text>
    <text x="488" y="480">9</text><text x="535" y="480">10</text><text x="582" y="480">11</text>
    <text x="629" y="480">12</text><text x="676" y="480">13</text><text x="723" y="480">14</text>
  </g>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="42"  y="488" width="46" height="30"/><rect x="89"  y="488" width="46" height="30"/>
    <rect x="136" y="488" width="46" height="30"/><rect x="183" y="488" width="46" height="30"/>
    <rect x="230" y="488" width="46" height="30"/><rect x="277" y="488" width="46" height="30"/>
    <rect x="324" y="488" width="46" height="30"/><rect x="371" y="488" width="46" height="30"/>
    <rect x="418" y="488" width="46" height="30"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1.5" fill="#2b2b2b" stroke-dasharray="4 3">
    <rect x="465" y="488" width="46" height="30"/><rect x="512" y="488" width="46" height="30"/>
  </g>
  <g stroke="#5b9bd5" stroke-width="1.5" fill="#2b2b2b">
    <rect x="559" y="488" width="46" height="30"/><rect x="606" y="488" width="46" height="30"/>
  </g>
  <g stroke="#4a4a4a" stroke-width="1.5" fill="#2b2b2b" stroke-dasharray="4 3">
    <rect x="653" y="488" width="46" height="30"/><rect x="700" y="488" width="46" height="30"/>
  </g>
  <g font-family="monospace" font-size="13" fill="#d4d4d4" text-anchor="middle" font-weight="bold">
    <text x="65"  y="509">21</text><text x="112" y="509">6</text><text x="159" y="509">15</text>
    <text x="206" y="509">4</text><text x="253" y="509">2</text><text x="300" y="509">10</text>
    <text x="347" y="509">5</text><text x="394" y="509">1</text><text x="441" y="509">3</text>
    <text x="582" y="509">4</text><text x="629" y="509">6</text>
  </g>
  <g font-family="monospace" font-size="13" fill="#6a6a6a" text-anchor="middle">
    <text x="488" y="509">-</text><text x="535" y="509">-</text>
    <text x="676" y="509">-</text><text x="723" y="509">-</text>
  </g>
  <text x="40" y="535" fill="#9aa0a6" font-size="11.5">Wherever we don't have anything, just put &#8212; (unused). The tree is never sparse as a shape; it is a balanced, heap-like tree.</text>
</svg>
