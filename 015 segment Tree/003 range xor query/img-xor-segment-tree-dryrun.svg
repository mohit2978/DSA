<svg viewBox="0 0 800 540" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="16">
  <rect x="0" y="0" width="800" height="540" fill="#1e1e1e"/>
  <text x="25" y="28" fill="#e0e0e0" font-size="15" font-weight="bold">Range XOR Query dry run <tspan fill="#9aa0a6" font-weight="normal">— a = [3, 2, 4, 5, 1, 1, 5, 3], query [2, 4] (1-based) = [1, 3] (0-based)</tspan></text>
  <line x1="25" y1="38" x2="775" y2="38" stroke="#333333" stroke-width="1"/>

  <rect x="25" y="48" width="750" height="300" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="70" fill="#f2c14e" font-size="13" font-weight="bold">Same tree as a sum tree &#8212; only the merge changes: parent = left ^ right</text>

  <g stroke="#5b7a8c" stroke-width="1.5">
    <line x1="382" y1="108" x2="215" y2="148"/>
    <line x1="418" y1="108" x2="585" y2="148"/>
    <line x1="188" y1="168" x2="115" y2="208"/>
    <line x1="222" y1="168" x2="295" y2="208"/>
    <line x1="558" y1="168" x2="485" y2="208"/>
    <line x1="612" y1="168" x2="685" y2="208"/>
    <line x1="95"  y1="226" x2="65"  y2="262"/>
    <line x1="115" y1="226" x2="150" y2="262"/>
    <line x1="285" y1="226" x2="250" y2="262"/>
    <line x1="305" y1="226" x2="340" y2="262"/>
    <line x1="475" y1="226" x2="440" y2="262"/>
    <line x1="495" y1="226" x2="530" y2="262"/>
    <line x1="675" y1="226" x2="640" y2="262"/>
    <line x1="695" y1="226" x2="730" y2="262"/>
  </g>

  <circle cx="400" cy="98"  r="22" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="205" cy="158" r="20" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="595" cy="158" r="20" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
  <circle cx="105" cy="218" r="19" fill="#3a331f" stroke="#f2c14e" stroke-width="3"/>
  <circle cx="295" cy="218" r="19" fill="#1f3a2a" stroke="#56c98d" stroke-width="3"/>
  <circle cx="485" cy="218" r="19" fill="#2b2b2b" stroke="#4a4a4a" stroke-width="1.5"/>
  <circle cx="685" cy="218" r="19" fill="#2b2b2b" stroke="#4a4a4a" stroke-width="1.5"/>

  <circle cx="55"  cy="272" r="16" fill="#3a2323" stroke="#e06c75" stroke-width="2"/>
  <circle cx="158" cy="272" r="16" fill="#1f3a2a" stroke="#56c98d" stroke-width="3"/>
  <g fill="#2b2b2b" stroke="#4a4a4a" stroke-width="1.5">
    <circle cx="242" cy="272" r="16"/><circle cx="348" cy="272" r="16"/>
    <circle cx="432" cy="272" r="16"/><circle cx="538" cy="272" r="16"/>
    <circle cx="632" cy="272" r="16"/><circle cx="738" cy="272" r="16"/>
  </g>

  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="14">
    <text x="400" y="104">6</text>
    <text x="205" y="164">0</text>
    <text x="595" y="164">6</text>
    <text x="105" y="224">1</text>
    <text x="295" y="224">1</text>
  </g>
  <g fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-size="13">
    <text x="485" y="224">0</text>
    <text x="685" y="224">6</text>
  </g>
  <g fill="#f0f0f0" text-anchor="middle" font-weight="bold" font-size="13">
    <text x="55"  y="277">3</text>
    <text x="158" y="277">2</text>
  </g>
  <g fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-size="12">
    <text x="242" y="277">4</text><text x="348" y="277">5</text>
    <text x="432" y="277">1</text><text x="538" y="277">1</text>
    <text x="632" y="277">5</text><text x="738" y="277">3</text>
  </g>

  <g fill="#9aa0a6" text-anchor="middle" font-size="11" font-family="monospace">
    <text x="452" y="98">(0,7)</text>
    <text x="205" y="136">(0,3)</text>
    <text x="647" y="158">(4,7)</text>
    <text x="105" y="196">(0,1)</text>
    <text x="295" y="250">(2,3)</text>
    <text x="485" y="250">(4,5)</text>
    <text x="685" y="250">(6,7)</text>
    <text x="55"  y="302">(0,0)</text>
    <text x="158" y="302">(1,1)</text>
  </g>

  <text x="40" y="322" fill="#9aa0a6" font-size="12"><tspan fill="#f2c14e">Yellow</tspan> = partial overlap, go deeper &#160;&#183;&#160; <tspan fill="#56c98d">Green</tspan> = full overlap, return stored value &#160;&#183;&#160; <tspan fill="#e06c75">Red</tspan> = no overlap, return 0 &#160;&#183;&#160; grey = never visited</text>
  <text x="40" y="340" fill="#9aa0a6" font-size="12">Tree values are XORs: (0,1) = 3^2 = 1, (2,3) = 4^5 = 1, (4,5) = 1^1 = 0, (6,7) = 5^3 = 6, (0,3) = 1^1 = 0, (4,7) = 0^6 = 6, root = 0^6 = 6</text>

  <!-- Trace -->
  <rect x="25" y="362" width="440" height="152" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="40" y="386" fill="#f2c14e" font-size="13.5" font-weight="bold">Walking the query (1, 3)</text>
  <g font-family="monospace" font-size="12" fill="#d4d4d4">
    <text x="42" y="410" fill="#f2c14e">(0,7) partial &#8594; explore both</text>
    <text x="42" y="430" fill="#f2c14e">  (0,3) partial &#8594; explore both</text>
    <text x="42" y="450" fill="#f2c14e">    (0,1) partial &#8594; explore both</text>
    <text x="42" y="470" fill="#e06c75">      (0,0) no overlap  &#8594; 0</text>
    <text x="42" y="490" fill="#56c98d">      (1,1) full overlap &#8594; 2</text>
    <text x="42" y="510" fill="#56c98d">    (2,3) full overlap  &#8594; 1</text>
  </g>

  <rect x="480" y="362" width="295" height="152" fill="#252525" stroke="#3a3a3a" stroke-width="1" rx="6"/>
  <text x="495" y="386" fill="#f2c14e" font-size="13.5" font-weight="bold">Combining on the way up</text>
  <g font-family="monospace" font-size="12.5" fill="#d4d4d4">
    <text x="497" y="412">(0,1) = 0 ^ 2 = 2</text>
    <text x="497" y="434">(0,3) = 2 ^ 1 = 3</text>
    <text x="497" y="456" fill="#e06c75">(4,7) no overlap  &#8594; 0</text>
    <text x="497" y="482" fill="#56c98d">root  = 3 ^ 0 = 3</text>
  </g>
  <text x="495" y="506" fill="#9aa0a6" font-size="12">Check: 2 ^ 4 ^ 5 = 3 &#10004;</text>

  <text x="25" y="532" fill="#9aa0a6" font-size="12">The identity for XOR is <tspan font-family="monospace" fill="#56c98d">0</tspan> (since x ^ 0 = x), which is exactly what the "no overlap" branch returns &#8212; same as for sum, by coincidence.</text>
</svg>
